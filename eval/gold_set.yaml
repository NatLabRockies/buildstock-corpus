# Gold question set for evaluating the ComStock 2025-3 index against bare Claude.
#
# The baseline this is measured against is deliberately "someone typing the question
# into any Claude chat" — same model, no retrieved context. So the questions are chosen
# where retrieval should win: exact measure parameters, release-specific facts, dense
# tables, and content that postdates or is too granular for a training corpus.
#
# Schema (per question):
#   id                     stable slug, used as the results.json key
#   category               grouping for the summary table
#   question               asked verbatim to both the index and bare Claude
#   expected_sources       list of source paths; a retrieval hit = any one in the top-k.
#                          Matched as a substring of "<source_id>/<source_path>".
#   expected_answer_points what a correct answer must contain. Each entry is either a
#                          string, or a list of accepted variants (any one counts) so
#                          "-1°C" also credits "-1 C" and "1.8°F".
#   known_gap              optional. true = the corpus/index is known NOT to cover this.
#                          Excluded from recall@k and reported separately, so the eval
#                          stays honest about what the pipeline currently misses.
#   note                   free text; why the question is here / where truth was verified
#
# Every fact below was read out of processed/comstock/2025-3/ before being written here.

product: comstock
release: "2025-3"

questions:
  - id: df_load_shift_defaults
    category: measure_parameters
    question: >-
      In ComStock, what is the default setpoint adjustment and the default duration of
      pre-conditioning for the thermostat control for load shifting measure, and which
      setpoints does the study actually adjust?
    expected_sources:
      - measure_pdfs/89341.pdf
    expected_answer_points:
      - ["-1°C", "-1 °C", "1°C", "1 °C", "1.8°F"]
      - ["1 hour", "one hour"]
      - ["pre-cooling only", "precooling only", "cooling setpoints only", "only cooling setpoints"]
    note: >-
      89341.md §3.2.1 — "The default adjustment for cooling setpoints is set to -1°C, and
      the default duration of pre-cooling is 1 hour." Heating is deliberately left alone to
      avoid a reverse-deadband error. Bare Claude has no way to produce these numbers.

  - id: df_load_shift_applicability
    category: measure_parameters
    question: >-
      Which ComStock building type is the thermostat control for load shifting measure
      applied to, what HVAC requirement must a building meet, and what share of ComStock
      floor area is that?
    expected_sources:
      - measure_pdfs/89341.pdf
    expected_answer_points:
      - ["large office", "large offices"]
      - ["electric HVAC", "electric heating", "electric cooling"]
      - ["9.72%", "9.72"]
    note: >-
      89341.md — "applicable to large offices equipped with an electric HVAC system, which
      accounts for approximately 9.72% of the ComStock floor area."

  - id: df_shed_vs_shift_reports
    category: provenance
    question: >-
      ComStock documents thermostat control for load shedding and thermostat control for
      load shifting as two separate measures. Which NREL report number documents each one?
    expected_sources:
      - measure_pdfs/89340.pdf
      - measure_pdfs/89341.pdf
    expected_answer_points:
      - "89340"
      - "89341"
    note: >-
      crosswalk.json — dr_0001 (Load Shed) -> fy24osti/89340.pdf, dr_0002 (Load Shift) ->
      fy24osti/89341.pdf. Tests whether retrieval keeps two near-identical documents apart;
      this is exactly the pair bare Claude conflates.

  - id: ca_swh_known_issue_2025r3
    category: release_specific
    question: >-
      Is there a known issue with service water heating in California in ComStock 2025
      Release 3, and if so what does the ComStock team recommend?
    expected_sources:
      - docs/resources/explanations/2025_release_3_ca_swh_known_issue.md
    expected_answer_points:
      - ["service water heating was not modeled", "SWH was not modeled", "not modeled in any California", "zero energy"]
      - ["California"]
      - ["2025 Release 2", "previous release"]
    note: >-
      A workflow error meant SWH was not modeled in any California building in 2025 R3; the
      team recommends falling back to 2025 Release 2 for CA-focused analyses. Release-scoped
      erratum — the single clearest case where an un-retrieved answer is actively harmful.

  - id: roof_insulation_savings
    category: numeric
    question: >-
      What aggregate site energy savings does ComStock's roof insulation measure show
      across the modeled U.S. commercial building stock, and to what share of buildings
      was it applicable?
    expected_sources:
      - docs/upgrade_measures/env_roof_insulation.md
    expected_answer_points:
      - ["112 TBtu", "112 tbtu"]
      - ["3%"]
      - [">99%", "99%", "greater than 99"]
    note: >-
      env_roof_insulation.md exec summary — 3% (112 TBtu) aggregate site energy savings,
      applicable to >99% of buildings.

  - id: hvac_heating_fuel_category_table
    category: dense_table
    question: >-
      In the ComStock reference documentation, what heating fuel category is assigned to
      the "PSZ-AC with gas coil" HVAC system type, and what category is used for DOAS with
      fan coil district chilled water with district hot water?
    expected_sources:
      - documentation/reference_doc/4_9_hvac.tex
    expected_answer_points:
      - ["Fuel"]
      - ["District_Heating", "District Heating"]
    note: >-
      4_9_hvac Table 1 (HVAC system type -> heating fuel category). Verifies the LaTeX table
      body survived pandoc extraction and is retrievable row-by-row, which is the whole
      argument for LaTeX->markdown over PDF scraping.

  - id: hvac_type_probability_source
    category: methodology
    question: >-
      What data does ComStock use to derive its HVAC system type probability distributions,
      and what variables do those distributions depend on?
    expected_sources:
      - documentation/reference_doc/4_9_hvac.tex
    expected_answer_points:
      - ["CBECS 2012"]
      - ["CBECS 2018"]
      - ["building type"]
      - ["census division"]
      - ["heating fuel"]
    note: >-
      4_9_hvac — "Historically, this analysis was based solely on the CBECS 2012 data set;
      however, our updated methodology now integrates data from both the CBECS 2012 and
      CBECS 2018 data sets," combined by a sample-count-weighted average. Bare Claude is
      expected to say CBECS 2012 only, which makes this a clean discriminator.

  - id: new_sampling_first_release
    category: release_specific
    question: >-
      Starting with which ComStock standard dataset release did the new sampling
      methodology take effect, and what does it let a single energy model represent?
    expected_sources:
      - docs/resources/explanations/new_sampling_method.md
    expected_answer_points:
      - ["2024 Release 2", "SDR 2024 Release 2"]
      - ["census tract", "census tracts"]
    note: >-
      new_sampling_method.md — "Beginning with Standard Dataset Release (SDR) 2024 Release
      2"; one model may represent similar buildings across distinct comparable geographies
      such as census tracts.

  # --- Known gaps: kept in the set on purpose. -------------------------------------
  # A gold set that only asks answerable questions overstates the index. These two are
  # excluded from recall@k and reported separately.

  - id: roof_aedg_r_values_by_climate_zone
    category: dense_table
    known_gap: true
    question: >-
      What are the target roof assembly R-values by climate zone that ComStock's roof
      insulation measure brings roofs up to?
    expected_sources:
      - docs/upgrade_measures/env_roof_insulation.md
    expected_answer_points:
      # Not asserting which value is right — only that *some* AEDG-magnitude roof R-value
      # appears at all. None do, so this scores 0.00, which is the true state of the corpus.
      - ["R-20", "R-25", "R-30", "R-35", "R-38", "R-40", "R-45", "R-49"]
      - ["climate zone 8", "climate zone 7"]
    note: >-
      KNOWN GAP. Tables 5 and 6 of env_roof_insulation.md are images in the Jekyll source, so
      only the surrounding narrative ("XPS at R-5/inch", "AEDG for Small to Medium Office
      Buildings") survived extraction — no per-climate-zone R-value exists anywhere in the
      processed corpus. Retrieval returns the right document with the numbers missing, which
      is the failure mode most likely to produce a confident wrong answer. Fixing it needs
      OCR or the upstream table data; that is why this entry stays in the set.

  - id: measures_missing_documentation
    category: coverage
    known_gap: true
    question: >-
      Which ComStock 2025-3 upgrade measures do not yet have published documentation?
    expected_sources:
      - crosswalk.json
    expected_answer_points:
      - ["hvac_0021"]
      - ["pkg_0012"]
      - ["dr_0004"]
    note: >-
      KNOWN GAP. The answer exists in the pipeline (manifest gaps.measures =
      dr_0004, dr_0007-dr_0011, hvac_0021, pkg_0012; crosswalk counts 65 measures /
      57 covered / 8 gaps) but crosswalk.json and manifest.json are not chunked into the
      index, so retrieval cannot reach it. Either index the structured artifacts as
      synthesized text or answer coverage questions from the manifest directly.
