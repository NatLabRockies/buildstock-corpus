# Source registry for ComStock dataset release 2025-3.
#
# Note the ref naming differs per repo: the ComStock code repo tags releases with a
# dash (2025-3); the github.io site branches them with an underscore (2025_3). Each
# source pins its own git_ref so artifacts stay aligned to this dataset release.
product: comstock
release: "2025-3"

sources:
  # ComStock technical reference — LaTeX source, converted with pandoc.
  - id: technical_reference
    type: latex
    repo: https://github.com/NatLabRockies/ComStock.git
    git_ref: "2025-3"
    sparse: ["documentation"]
    root_hint: documentation        # LaTeX project root within the repo
    doc_glob: "documentation/**/*.tex"
    latex_main: "documentation/reference_doc/main.tex"  # \include list drives chapter conversion

  # Public how-to / methodology site — Jekyll markdown, read directly.
  # Upgrade-measure pages are excluded here and handled by the measures source.
  - id: github_site
    type: markdown
    repo: https://github.com/NatLabRockies/ComStock.github.io.git
    git_ref: "2025_3"
    # assets/images is checked out for the figures the docs pages reference
    # (../assets/images/...), not for doc_glob — it holds no markdown.
    sparse: ["docs", "assets/images"]
    doc_glob: "docs/**/*.md"
    exclude_globs:
      - "docs/upgrade_measures/**"

  # Upgrade measures — mixed internal markdown pages + external PDFs, plus the
  # crosswalk CSV that maps each measure to its initial dataset release.
  - id: upgrade_measures
    type: measures
    repo: https://github.com/NatLabRockies/ComStock.github.io.git
    git_ref: "2025_3"
    sparse: ["docs/upgrade_measures", "assets/files"]
    index_page: "docs/upgrade_measures/upgrade_measures.md"
    internal_dir: "docs/upgrade_measures"
    crosswalk_csv: "assets/files/measure_name_crosswalk_2025_3.csv"
