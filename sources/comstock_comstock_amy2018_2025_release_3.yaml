# Source registry for ComStock dataset release comstock_amy2018_2025_release_3.
#
# The release id follows the OEDI data lake convention,
# <dataset type>_<weather data>_<year of publication>_release_<release number>, so a
# corpus artifact names the same release the published data does.
#
# Upstream refs do not use that convention and are pinned verbatim below: the ComStock
# code repo tags this release with a dash (2025-3), the github.io site branches it with
# an underscore (2025_3), and the crosswalk CSV filename uses its own form again. Each
# source pins its own git_ref so artifacts stay aligned to this dataset release.
product: comstock
release: "comstock_amy2018_2025_release_3"

# Publication status (see src/buildstock_corpus/status.py): osti_pdf for reports with an
# OSTI number, site_page for anything the ComStock site publishes without one, whether as a
# rendered page or a PDF file. latex/markdown sources declare one status for all their
# documents here; the measures source derives it per document from the index page's links.

sources:
  # ComStock technical reference — LaTeX source, converted with pandoc. Published as a PDF
  # on the ComStock site, without an OSTI number (owner decision 2026-10-06).
  - id: technical_reference
    type: latex
    repo: https://github.com/NatLabRockies/ComStock.git
    git_ref: "2025-3"
    sparse: ["documentation"]
    root_hint: documentation        # LaTeX project root within the repo
    doc_glob: "documentation/**/*.tex"
    latex_main: "documentation/reference_doc/main.tex"  # \include list drives chapter conversion
    status: site_page
    # The human-readable form of all 19 chapters: the release's reference-documentation PDF,
    # listed in the References table of the ComStock site's Resources page.
    publication_url: https://natlabrockies.github.io/ComStock.github.io/assets/files/comstock_reference_documentation_2025_3.pdf

  # Public how-to / methodology site — Jekyll markdown, read directly.
  # Upgrade-measure pages are excluded here and handled by the measures source.
  - id: github_site
    type: markdown
    repo: https://github.com/NatLabRockies/ComStock.github.io.git
    git_ref: "2025_3"
    status: site_page
    # Live site that renders these pages: docs/a/b.md is served at <site_url>/docs/a/b.html.
    site_url: https://natlabrockies.github.io/ComStock.github.io
    # assets/images is checked out for the figures the docs pages reference
    # (../assets/images/...), not for doc_glob — it holds no markdown.
    sparse: ["docs", "assets/images"]
    doc_glob: "docs/**/*.md"
    exclude_globs:
      - "docs/upgrade_measures/**"

  # Upgrade measures — mixed internal markdown pages + external PDFs, plus the
  # crosswalk CSV that maps each measure to its initial dataset release.
  - id: upgrade_measures
    type: measures
    repo: https://github.com/NatLabRockies/ComStock.github.io.git
    git_ref: "2025_3"
    sparse: ["docs/upgrade_measures", "assets/files"]
    # Same live site: measure pages render at <site_url>/docs/upgrade_measures/<page>.html and
    # the site-served measure PDFs are at <site_url>/assets/files/<file>.pdf.
    site_url: https://natlabrockies.github.io/ComStock.github.io
    index_page: "docs/upgrade_measures/upgrade_measures.md"
    internal_dir: "docs/upgrade_measures"
    # Output-side directory renames. Source paths above are untouched: these only change
    # where artifacts land under processed/.
    #
    # Measure documents the ComStock site serves itself, without an OSTI number, are one
    # class (status site_page) whether the site renders them as pages or links a PDF file
    # committed in the repo. Both land in unpublished_docs/, side by side: "unpublished"
    # here means "no OSTI publication yet", not "absent from the site". When one gains an
    # OSTI publication it is fetched from there instead and lands in measure_pdfs/.
    output_remap:
      "docs/upgrade_measures": "unpublished_docs/upgrade_measures"
      "assets/files": "unpublished_docs/upgrade_measures"
    crosswalk_csv: "assets/files/measure_name_crosswalk_2025_3.csv"
