  alt: Two stacked area charts of Colorado electricity demand by end use over three days, with peak periods
    shaded
  description: 'Figure 10: two stacked area charts of electricity usage in GW in Colorado by end use,
    January 15 to 17 and July 15 to 17, with the baseline total as a dashed line, EV charging as the top
    layer and each day''s peak period shaded. EV charging is absent during the shaded periods and spikes
    just after each ends, rebounding to about 2.2 GW on one winter evening, against a baseline peak of
    about 1.45 GW.'
- source_image: 94463_images/image_000012_9b4523fb37b5c4e255abae593a7059e8331d5f727e90814b964ad1c09cea5908.png
