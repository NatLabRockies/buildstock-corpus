  alt: Three step charts showing EV charging interrupted by a peak period and resumed after it
  description: 'Figure 5: three step charts from 08:00 to 23:45 with a shaded peak period from about 17:30
    to 21:30: EV charging power in kW without DF, the same with DF, and the occupancy schedule. Without
    DF the car charges at about 5.7 kW from about 14:00 to 15:30 and from 17:15 to 18:45. With DF the
    second session stops when the peak begins and resumes after it, from about 21:30 to 22:45.'
