tables:
- label: Table 2
  caption: Mapping of ResStock Input Files to ResStock and OpenStudio-HPXML Arguments 4
  source_pdf: measure_pdfs/94463.pdf
  source_pdf_sha256: 28587a09aa7006fce4450d57f9db85cb0874c19d3da323d2cf4b2d592c203f8f
  page: 15
  method: extracted grid, with the cells named in `why` corrected from the PDF text layer
  transcribed_utc: '2026-11-11'
  replaces:
    table_sha256: 1f3c231e839f197f43940efda0b98cf0f57d0b210d6aa3561faefb27cdea1c56
    why: Every cell is right, but the home-charging bin '40-59%' carries a space where the PDF breaks
      the line ('40- 59%'), so a search for the bin misses it; 'kilowatt-hours' was broken the same way.
      The cell text is the extractor's own with those two joined. Several arguments share one cell in
      the PDF and are run together, as extracted.
  markdown: '| ResStock Input File | ResStock Arguments | OpenStudio-HPXML Arguments | Description |

    |---|---|---|---|

    | Electric Vehicle Ownership | Yes, No | ev_present [bool] | Turns on/off the battery EV model. |

    | Electric Vehicle Charger | L1, L2, None | ev_charger_present [bool] ev_charger_power (watts, or
    W) [float] | Describes presence and charging power of the EV charger. |

    | Electric Vehicle Battery | Compact, Midsize, Pickup, and SUV with 200- and 300-mile ranges | ev_battery_usable_capacity
    (kilowatt-hours, or kWh) [float] ev_energy_efficiency (kWh/mile) [float] ev_average_mph (miles per
    hour, or mph) [float] | Physical description of the battery that ultimately informs charging demand;
    average speed used to calculate hours driven. |

    | Annual Miles Driven | 14 values ranging from 1,000 to 22,500 miles | ev_miles_per_year [integer]
    ev_hours_per_week [float] (calculated internally from ev_miles_per_year using an assumed default average
    speed) | Total miles driven per year; an assumed default average speed is used to calculate ev_hours_per_week
    , which informs the hourly driving schedules. |

    | Home Charging Fraction | 6 bins, 0-19%, 20-39%, 40-59%, 60-79%, 80-99%, 100% | ev_fraction_charged_home
    [float] | Describes what fraction of energy is provided by an at-home charger; informs the effective
    annual miles traveled for the generation of schedules. |'
- label: Table 3
  caption: Mapping of ResStock Options to ResStockArgumentsPostHPXML Measure Arguments
  source_pdf: measure_pdfs/94463.pdf
  source_pdf_sha256: 28587a09aa7006fce4450d57f9db85cb0874c19d3da323d2cf4b2d592c203f8f
  page: 23
  method: extracted grid, with the cells named in `why` corrected from the PDF text layer
  transcribed_utc: '2026-11-11'
  replaces:
    table_sha256: 8cffe8bf15e3c4c2ca9d145993c02f2cec4a2a4ebb8e4490cac0ba3a2888ed67
    why: Every cell is right, but the argument value -15 carries a space where the PDF breaks the line
      ('- 15'), which reads as a separate dash and a positive 15. The cell text is the extractor's own
      with that value joined. The Parameter cell is merged over both rows in the PDF and is repeated on
      each; the two arguments in a cell are run together, as extracted.
  markdown: '| Parameter | Option | ResStockArgumentsPostHPXML Measure Arguments | Description |

    |---|---|---|---|

    | Demand Flexibility Electric Vehicle | Enabled | ev_flex_enabled = True flex_random_shift_minutes
    = {30, 15, 0, -15, or -30} | All EV chargers provide load flexibility by turning charging off during
    the peak period |

    | Demand Flexibility Electric Vehicle | Disabled | ev_flex_enabled = False flex_random_shift_minutes
    = 0 | EV chargers do not provide load flexibility; charging schedules are entirely driven by occupancy
    status |'
