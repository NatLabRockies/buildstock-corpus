# Hand-authored overlay for measure_pdfs/94463.pdf
#
# 94463 is the ResStock measure documentation for electric vehicle adoption with Level 2 charging and demand flexibility (measure 22).
# Every table and figure in the report was compared with the PDF on 2026-11-11, following
# "Checking every table and figure: the ResStock method" in overlays/README.md.
#
# Tables (page numbers are PDF pages, 1-based):
#   * Table 4 (pp.24-25) is superseded: it came out as one grid per page, each with two
#     header rows. See its `why`.
#   * Table 2 (p.15) and Table 3 (p.23) are superseded: every cell was right, but a value in each
#     carried a line-wrap space (the bin 40-59%; the argument value -15). They are the
#     extractor's own grids with those values joined.
#   * Tables 1 and 5, the Measure Summary table (p.8, no caption) and the List of Acronyms
#     (p.5) are recorded under `checked:` as correct.
#   * The Table of Contents and List of Figures / List of Tables grids are contents pages and
#     have no entry.
#   * The report's numbered page footnotes are all present. No number grid is shown as a
#     picture.
#
# Figures: Figures 1-12 are described (vision-description), one bitmap per figure. Figure
# 1's caption was swallowed into its bitmap (image_000002), so the document has no "Figure
# 1." caption line; the description quotes the caption. The cover art and wordmark
# (image_000000, image_000001) are decorative and omitted by the build. Values read off an
# axis, not a data label, are worded "about".
#
# Flattening notes: Table 4's two header rows are joined ('Summer: Peak Start'). Tables 2
# and 4 are split into bold-labelled parts to stay under the chunk limit, each repeating the
# header row; the labels are not in the PDF.

