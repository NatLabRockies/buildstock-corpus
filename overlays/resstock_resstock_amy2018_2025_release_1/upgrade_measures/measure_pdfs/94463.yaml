  alt: Two bar charts of average unmet driving hours by annual miles and by share charged at home
  description: 'Figure 9: two bar charts of average unmet driving hours, by annual vehicle miles traveled
    (1,000 to 22,500) and by percent charged at home (0-19% to 100%). Series are EV + L2 and EV + L2 +
    DF (this measure). Demand flexibility adds a little: about 4.75 hours against 4.1 at 22,500 miles
    a year, about 3.5 against 3.0 at 19,000 miles, and about 0.7 against 0.6 for vehicles charged entirely
    at home.'
