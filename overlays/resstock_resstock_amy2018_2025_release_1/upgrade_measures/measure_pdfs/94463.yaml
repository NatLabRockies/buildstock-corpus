  description: 'Figure 8: horizontal stacked bar chart. Rows are eight climate zones from Hot-Dry to Subarctic;
    the bars in each are labelled Baseline, EV with L2 charging, and DF + EV with L2 charging. X-axis
    is all-fuels end uses in kWh, 0 to 1.6T, segmented by end use and fuel. The EV bars add an electric
    vehicle charging segment: Cold, the largest zone, grows from about 1.45T to about 1.55T kWh.'
