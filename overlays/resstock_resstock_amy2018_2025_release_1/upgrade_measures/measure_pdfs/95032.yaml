  alt: Colour-scaled grid of full load heating capacity by return air and ground exit water temperature
  description: 'Figure 4: colour-scaled grid of full load heating capacity. Rows are return air temperature
    (Tair), 10 to 27.5°C, and columns ground exit water temperature (Twater), 0 to 30°C, in 2.5°C steps;
    no unit is printed. Capacity rises with water temperature and falls slightly with air temperature:
    5650 at 10°C air and 0°C water, 10073 at 10°C air and 30°C water, and 4918 at 27.5°C air and 0°C water.'
