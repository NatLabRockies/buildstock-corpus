  alt: Manufacturer performance data sheet for a geothermal heat pump at 1,200 cfm nominal airflow
  description: 'Figure 2: scanned manufacturer performance table, headed ''1,200 CFM Nominal (Rated) Airflow
    Cooling, 1,200 CFM Nominal (Rated) Airflow Heating''. Rows are entering water temperature from 20
    to 120°F; column groups are cooling at 80/67°F entering air (capacities, kW, EER) and heating at 70°F
    (capacity, kW, COP). Cooling at 20°F and heating at 100°F and above are marked ''Operation not recommended''.
    Cell values are too small to read here.'
