  method: vision-description
  described_utc: '2026-11-11'
  alt: Scatter plot of normalized EIR against fraction of airflow, with quadratic fits
  description: 'Figure 9: scatter plot titled ''Normalized EIR''. X-axis is fraction of airflow, 0 to
    1.4; y-axis is EIR multiplier, 0 to 1.6. Two series with quadratic fits: cooling normalized EIR (y
    = 0.5789x^2 - 1.6182x + 2.0184) and heating normalized EIR (y = 1.3858x^2 - 3.0886x + 2.796). Cooling
    EIR falls from about 1.15 at 0.72 airflow to about 0.96 above full airflow; heating points scatter
    from 0.96 to 1.33.'
