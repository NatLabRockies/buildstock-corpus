# Hand-authored overlay for measure_pdfs/95032.pdf
#
# 95032 is the ResStock measure documentation for the residential single-stage geothermal
# heat pump upgrade (measure 6). Every table and figure in the report was compared with the
# PDF on 2026-11-11, following "Checking every table and figure: the ResStock method" in
# overlays/README.md.
#
# Tables (page numbers are PDF pages, 1-based):
#   * Tables 1-10, Table 11 (two grids, pp.48-49) and Table A-1 are recorded under
#     `checked:` as correct. Table 1 is this report's upgrade summary table.
#   * Table A-2 (p.77) and Table B-1 (p.84) are superseded: see each entry's `why`.
#       - Table A-2: numbers right, grouping wrong. The first Closed-Loop row (Water-to-air,
#         criteria 3.6 / 17.1) had an empty group cell and read as Open-Loop or ungrouped;
#         the "Product Type" header was dropped; the COP/EER spanner was a header row plus
#         a data row.
#       - Table B-1: values right, but the bold that the caption relies on ("The Current
#         Configuration Used is Shown in Bold") was dropped, so the table did not say which
#         configuration is used (Rectangle for 4 boreholes, "U" for 5, Line or Single
#         otherwise).
#   * The List of Acronyms (p.5) was extracted as a run-on paragraph, not a grid, so there
#     is no table to fingerprint and no entry. Its ten acronyms and expansions are all
#     present in that paragraph.
#   * The Table of Contents, List of Figures and List of Tables grids are contents pages,
#     not tables of the report, and have no entry.
#
# Figures: 44 bitmaps are described (40-70 words each, vision-description). The cover art
# and wordmark (image_000000, image_000001) are decorative and omitted by the build.
#   * Bitmaps that are one panel of a two-panel figure: image_000013 and image_000014
#     (Figure 15, left and right), image_000016 and image_000017 (Figure 17, table panel
#     and chart; the caption sits between the two refs), image_000042 (Figure A-9; the
#     caption follows the ref; the line of axis years the extractor left between them is
#     removed by a `text_repairs` entry, added in R4.6).
#   * Number grids captioned as figures (R4.2b): Figures 3, 4, 5, 6 (p.24) and C-1, C-2,
#     C-3, C-4 (pp.86-89) are colour-scaled grids of numbers pasted in as pictures (EIR
#     and capacity lookups by air and water temperature; the Appendix C ones are
#     manufacturer / curve-fit / difference grids). They have no text layer, and the
#     converter kept only Figure 4's bitmap (image_000004). Each is now transcribed as a
#     table under its caption (`tables:` entries labelled "Figure N").
#   How they were read: each figure's bitmap was taken from the PDF at its own resolution
#   and read cell by cell with OCR (RapidOCR), every cell recognised twice. The readings
#   were then checked without reference to the OCR: in the appendix figures,
#   Manufacturer minus Curvefit equals Difference in every cell; in the others, every value
#   lies on a second-order surface fitted to its grid, to within rounding of the last digit.
#   Row and column labels were checked too (even steps; °F against °C). Cells the two
#   recognitions disagreed on were settled by eye.
#     Not transcribed: Figure 2 (p.20), a scanned manufacturer performance sheet, which is
#     described as a figure only.
#
# Flattening notes: Table A-2's merged group cells (Open-Loop over two rows, Closed-Loop
# over three) are repeated on each row; its "Product Type" header spans the first two
# columns and is repeated on both; the COP / EER spanners are joined to the sub-headers
# ("COP: Min."). Row shading in the PDF is alternating bands and carries no meaning.
# Table B-1's bold is load-bearing (the caption says so) and is carried as markdown bold.
# Tables 9 and 10 set the Median column in bold; that restates the column and is dropped.

product: resstock
release: resstock_amy2018_2025_release_1
source_id: upgrade_measures
source_path: measure_pdfs/95032.pdf
source_url: https://docs.nlr.gov/docs/fy26osti/95032.pdf
