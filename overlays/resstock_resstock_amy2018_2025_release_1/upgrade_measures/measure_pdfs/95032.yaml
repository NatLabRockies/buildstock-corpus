  method: vision-description
  described_utc: '2026-11-11'
  alt: Scatter plot of normalized heat pump capacity against fraction of airflow, with quadratic fits
  description: 'Figure 8: scatter plot titled ''Normalized Capacity''. X-axis is fraction of airflow,
    0 to 1.4; y-axis is capacity multiplier, 0.92 to 1.04. Two series with dotted quadratic fits: total
    capacity (y = -0.3165x^2 + 0.8099x + 0.5068) and heating capacity (y = -0.1234x^2 + 0.3642x + 0.7594).
    Both pass through 1.0 at full airflow; at about 0.72 airflow total capacity falls to about 0.925 and
    heating capacity to about 0.957.'
- source_image: 95032_images/image_000007_8e91835e9eedff3807fb19af0a4acdfddb59ca8d776842e86343f49d15c6a5b0.png
