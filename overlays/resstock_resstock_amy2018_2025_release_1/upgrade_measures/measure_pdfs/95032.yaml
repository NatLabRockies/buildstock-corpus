  described_utc: '2026-11-11'
  alt: Scatter plot of part load factor against part load ratio with a cubic fit, Cc = 0.9
  description: 'Figure 7: scatter plot titled ''Part Load Factor, Cc = 0.9''. X-axis is part load ratio
    (PLR), 0 to 1; y-axis is part load factor (PLF), -0.2 to 1.2. Points rise steeply from 0 at PLR 0,
    then flatten toward 1.0. A dotted fitted curve, y = 3.0626x^3 - 6.0299x^2 + 3.8941x + 0.1186 (R^2
    = 0.9701), is held at a floor of 0.7 below PLR 0.2.'
- source_image: 95032_images/image_000006_9fd4a9d9d0d51492d2d3a745371f30847dba7f41211210885e29b9dc4d37cfd2.png
