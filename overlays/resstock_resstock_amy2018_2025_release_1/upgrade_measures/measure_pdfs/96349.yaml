    why: The table is right cell for cell except the project configuration URL, which carries a space
      where the PDF wraps the line ('project_nationa l'). A search for the real path, or a click on the
      link, misses it. The cell text is the extractor's own with that space removed; the joined URL is
      the one in the PDF text layer.
  markdown: '**Measure Summary, part 1 of 2**


    | Measure Title | Advanced Air Sealing, Attic Floor Insulation, Duct Sealing, and Drill-and-Fill Wall
    Insulation |

    |---|---|

    | Measure Definition | This upgrade measure package applies advanced air sealing, attic floor insulation,
    duct sealing and insulation, and drill-and-fill wall insulation for applicable dwelling units. A dwelling
    unit may receive none, some, or all four measures, depending on its housing characteristics. |

    | Applicability | This measure applies to all dwellings with at least one of the following housing
    characteristics: • Infiltration rate of 6 ACH50 or higher • Unfinished attic & less than R-49 attic
    floor insulation & in climate zone 1 • Unfinished attic & less than R-60 attic floor insulation &
    in climate zones 2 through 8 • Duct leakage to outside greater than 6% • Duct insulation less than
    R-6 • Uninsulated above-grade exterior wood stud walls. With these applicability constraints, 98%
    of existing dwelling units receive at least one of the measures. |


    **Measure Summary, part 2 of 2**


    | Measure Title | Advanced Air Sealing, Attic Floor Insulation, Duct Sealing, and Drill-and-Fill Wall
    Insulation |

    |---|---|

    | Not Applicable | This measure does not apply to dwelling units that have none of the following housing
    characteristics: • Equal or more than 6 ACH50 infiltration rate • Unfinished attic & less than R-49
    attic floor insulation & in climate zone 1 • Unfinished attic & less than R-60 attic floor insulation
    & in climate zones 2 through 8 • More than 6% duct leakage to outside • Less than R-6 duct insulation
    • Uninsulated above-grade exterior wood stud walls. These constraints exclude 2% of dwelling units
    from receiving this measure upgrade. |

    | Original Release | 2025 Release 1: 2025/resstock_amy2018_release_1 |

    | Project Configuration File(s) | https://github.com/NatLabRockies/resstock/blob/sdr_2025_Release_1/project_national/sdr_upgrades_amy2018.yml
    |'
