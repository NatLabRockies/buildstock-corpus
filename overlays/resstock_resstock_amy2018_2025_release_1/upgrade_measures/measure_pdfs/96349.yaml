# Hand-authored overlay for measure_pdfs/96349.pdf
#
# 96349 is the ResStock measure documentation for the envelope package of advanced air
# sealing, drill-and-fill wall insulation, attic floor insulation, and duct sealing and
# insulation (measure 16). Every table and figure in the report was compared with the PDF on
# 2026-11-11, following "Checking every table and figure: the ResStock method" in
# overlays/README.md.
#
# Tables (page numbers are PDF pages, 1-based):
#   * The Measure Summary table (p.9, no caption) is superseded: it was right except for a
#     line-wrap space inside the project configuration URL. It is the extractor's own grid
#     with that space removed.
#   * Tables 1 to 5 are recorded under `checked:` as correct.
#   * The List of Acronyms (p.5) was extracted as one run-on paragraph, not a grid, so there
#     is no table to check; its seven entries are all present and in order.
#   * The Table of Contents and List of Figures / List of Tables grids are contents pages and
#     have no entry. The References list was extracted as a one-column grid; it is not a
#     table of the report and has no entry.
#   * No table in this report has a footnote, and no number grid is shown as a picture.
#
# Figures: Figures 1-11 are described (40-70 words each, vision-description), one bitmap per
# figure; every figure caption has its image. The cover art and wordmark (image_000000,
# image_000001) are decorative and omitted by the build. Values read off an axis, not a data
# label, are worded "about". Figure 3 is captioned as heating energy, but the plot's own axis
# title reads "Cooling Energy Consumption" and its date label "July 2nd"; the description
# reports the labels as printed.
#
# Flattening notes: the Measure Summary is split into bold-labelled parts to stay under the
# chunk limit, each repeating its first row (Measure Title); the labels are not in the PDF.
# Bulleted lists inside its cells are run into the cell text, as extracted. Row shading in
# the PDF is alternating bands and carries no meaning.

