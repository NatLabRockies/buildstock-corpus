# Hand-authored overlay for measure_pdfs/96405.pdf
#
# 96405 is the ResStock measure documentation for the ENERGY STAR windows upgrade (measure
# 17). Every table and figure in the report was compared with the PDF on 2026-11-11,
# following "Checking every table and figure: the ResStock method" in overlays/README.md.
#
# Tables (page numbers are PDF pages, 1-based):
#   * Table 3 (p.14) is superseded: its last row was dropped, twelve merged U-factor cells and
#     one climate zone were blank. See its `why`.
#   * Table 1 (p.11) is superseded: the merged Northern* cell was blank on four of its five
#     rows.
#   * Table 11 (p.21) is superseded: one cell had lost its first word and a window option
#     carried a line-wrap space.
#   * The Measure Summary table (p.9, no caption) is superseded: it was right except for a
#     line-wrap space inside the project configuration URL and one row label.
#   * Tables 2, 4, 5, 6, 7, 8, 9, 10 and 12 and the List of Acronyms (p.5) are recorded under
#     `checked:` as correct.
#   * The Table of Contents and List of Figures / List of Tables grids are contents pages and
#     have no entry. The References list was extracted as a one-column grid; it is not a table
#     of the report and has no entry.
#   * Table 1's footnote (the Northern compliance pathways) is present as the paragraph below
#     the table. No number grid is shown as a picture.
#
# Figures: Figures 1-13 are described (40-70 words each, vision-description), one bitmap per
# figure; every figure caption has its image. The cover art and wordmark (image_000000,
# image_000001) are decorative and omitted by the build. Values read off an axis, not a data
# label, are worded "about".
#
# Flattening notes: in Tables 1 and 3 merged cells (climate zone, U-factor) are repeated on
# each row they cover. Table 3 and the Measure Summary are split into bold-labelled parts to
# stay under the chunk limit, each repeating the header row; the labels are not in the PDF.
# Row shading in the PDF is alternating bands and carries no meaning.

