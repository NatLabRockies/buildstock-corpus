  source_pdf: measure_pdfs/96405.pdf
  source_pdf_sha256: b1cf02f7e140f9a47a12ac2d163a6db237273ea5966a9bd93dc1ddab999f7cd7
  page: 9
  method: extracted grid, with the cells named in `why` corrected from the PDF text layer
  transcribed_utc: '2026-11-11'
  replaces:
    table_sha256: ca0027c86499954f6646927f2c770918dca37d5f2045fcd184e7fb70cc2a6300
    why: The table is right cell for cell except the project configuration URL, which carries a space
      where the PDF wraps the line ('project_national/sdr_u pgrades_tmy3.yml'). A search for the real
      path, or a click on the link, misses it. The row label 'Project Configuration File(s)' was broken
      the same way and is joined too. The cell text is otherwise the extractor's own.
  markdown: '| Measure Title | ENERGY STAR Version 7.0 Window Upgrade |

    |---|---|

    | Measure Definition | This upgrade measure replaces any existing windows with less than the performance
    level specified by ENERGY STAR Version 7.0 (V7) with windows meeting this performance level. The technology
    applied in this measure upgrade package is denoted in the ResStock options_lookup.tsv as the following,
    depending on the climate zone: • Windows ''EnergyStar, Northern'' • Windows ''EnergyStar, North-Central''
    • Windows ''EnergyStar, South-Central'' • Windows ''EnergyStar, Southern''. |

    | Applicability | This measure applies to all dwellings with: • Windows less than the performance
    level specified by ENERGY STAR V7. This performance level varies by climate zone. With these applicability
    constraints, the measure upgrade applies to 100% of the existing dwelling units. |

    | Not Applicable | This measure does not apply to dwelling units with the following: • Windows that
    already meet or exceed the performance level specified by ENERGY STAR V7. These constraints exclude
    0% of the dwelling units from receiving this measure upgrade. |

    | Original Release | 2025 Release 1: 2025/resstock_amy2018_release_1; 2025/resstock_amy2012_release_1
    |

    | Project Configuration File(s) | https://github.com/NatLabRockies/resstock/blob/2025_Release_1/project_national/sdr_upgrades_tmy3.yml
    |'
