    why: 'The table''s last two rows were merged into one: the label read ''Original Release Project Configuration
      File(s)'' and the value ''2025 Release 1: 2025/resstock_amy2018_release_1 ResStock''s 2025 Standard
      Data Release 1 (SDR) project file.'', so neither field could be read on its own. They are two rows
