  markdown: '**Table 1, part 1 of 2**


    | Measure Title | Residential Two-Stage Geothermal Heat Pump (4.0 COP, 20.5 EER) with Envelope Improvements
    and Advanced Air Sealing |

    |---|---|

    | Measure Definition | This upgrade measure replaces the HVAC system in any existing dwelling unit
    in a building less than 8 stories with ducted heating or cooling with a two-stage compressor, water-to-air
    vertical ground heat exchanger geothermal heat pump (GHP) with a variable speed fan. The measure also
    adds some improvements to the envelope, including increasing attic insulation, general air sealing
    of the living space, and duct sealing plus insulation. |

    | Applicability | This measure applies to all dwellings with: - Non-shared (in-unit) HVAC and any
    of the following heating fuels: electricity, natural gas, fuel oil, or propane - Shared (across multiple
    units) HVAC and a building height of < 8 stories and any of the following heating fuels: electricity,
    natural gas, fuel oil, or propane - Dwelling units with air ducts - Dwelling units with soil thermal
    conductivity greater than 0.8 Btu/h-ft-°F With these applicability constraints, the measure upgrade
    applies to 71% of the existing residential building stock. 6.4% of the residential units that receive
    the GHP upgrade lack existing space cooling systems in the baseline. |


    **Table 1, part 2 of 2**


    | Measure Title | Residential Two-Stage Geothermal Heat Pump (4.0 COP, 20.5 EER) with Envelope Improvements
    and Advanced Air Sealing |

    |---|---|

    | Not Applicable | This measure does not apply to dwelling units: - Shared HVAC (across multiple units)
    in high-rise (≥8 floors) buildings. - Dwelling units without air ducts These constraints exclude 25%
    of the building stock from receiving this measure upgrade. An additional 4% of the dwelling units
    do not receive this upgrade because of their heating fuel type. |

    | Original Release | 2025 Release 1: 2025/resstock_amy2018_release_1 |

    | Project Configuration File(s) | ResStock''s 2025 Standard Data Release 1 (SDR) project file. |'
