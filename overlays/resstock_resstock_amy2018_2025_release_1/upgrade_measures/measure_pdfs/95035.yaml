# Hand-authored overlay for measure_pdfs/95035.pdf
#
# 95035 is the ResStock measure documentation for the two-stage geothermal heat pump with
# envelope improvements and advanced air sealing (measure 18). Every table and figure in the
# report was compared with the PDF on 2026-11-11, following "Checking every table and figure:
# the ResStock method" in overlays/README.md.
#
# Tables (page numbers are PDF pages, 1-based):
#   * Table 1 (p.10), the report's upgrade summary table and its only captioned table, is
#     superseded: its last two rows were merged into one. See its `why`.
#   * The List of Acronyms on p.6 is recorded under `checked:` as correct. The report prints
#     two acronym lists (pp.4 and 6); the first was extracted as a run-on paragraph with its
#     seven entries present.
#   * The Table of Contents and List of Figures / List of Tables grids are contents pages and
#     have no entry.
#   * No table has a footnote. Unlike the other geothermal reports this one shows no number
#     grid as a picture.
#
# Figures: Figures 1-15 are described (40-70 words each, vision-description); every figure
# caption has its image. Figure 1 is two bitmaps (image_000002, image_000003): two stacked
# bar charts with the same axes and legend and different totals; the bitmaps do not say how
# their populations differ, and the descriptions report the totals as printed. The cover art
# and wordmark (image_000000, image_000001) are decorative and omitted by the build. Values
# read off an axis, not a data label, are worded "about"; state percentages on the three
# maps are too small to read reliably in the bitmaps and are not quoted beyond the legend
# ranges.
#
# Flattening notes: bulleted lists inside Table 1's cells are run into the cell text with
# their hyphen marks, as extracted. Table 1 is split into bold-labelled parts to stay under
# the chunk limit, each repeating the first row (Measure Title); the labels are not in the
# PDF.

