  described_utc: '2026-11-11'
  alt: Two line charts of the daily Colorado load shape adding a 25% demand flexibility penetration case
  description: 'Figure 12: the two load-shape charts of Figure 11, winter and summer, with a fourth line
    for 25% DF penetration (this measure in 25% of homes, the L2 reference case in the rest). Y-axis is
    net electricity usage in kWh; the peak period is shaded. In winter the 25% line peaks at about 1.2M
    kWh inside the peak period, against about 1.27M without DF, and its rebound after the period is small
    where full DF spikes to about 1.42M.'
