  alt: Workflow diagram of the order in which ResStock measures run, with and without an upgrade
  description: 'Figure 4: workflow diagram in two columns of boxes. The left column runs BuildExistingModel,
    ResStockArguments, BuildResidentialHPXML, BuildResidentialScheduleFile and ResStockArgumentsPostHPXML,
    then reaches a decision, ''Upgrade?''. ''Yes'' leads to the right column, ApplyUpgrade followed by
    the same four measures again; ''No'', and the end of the right column, lead to HPXMLToOpenStudio.
    It carries no data.'
