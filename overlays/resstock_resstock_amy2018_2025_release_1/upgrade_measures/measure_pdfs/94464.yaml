  described_utc: '2026-11-11'
  alt: Two bar charts of average unmet driving hours by annual miles and by share charged at home
  description: 'Figure 9: two bar charts of average unmet driving hours, by annual vehicle miles traveled
    (1,000 to 22,500) and by percent charged at home (0-19% to 100%). Series are EV + L2, Eff. EV + L2,
    and Eff. EV + L2 + DF (this measure). The efficient vehicle roughly halves unmet hours and DF adds
    a little back: about 4.1, 1.85 and 2.15 hours at 22,500 miles a year, and about 0.6, 0.25 and 0.3
    for vehicles charged entirely at home.'
