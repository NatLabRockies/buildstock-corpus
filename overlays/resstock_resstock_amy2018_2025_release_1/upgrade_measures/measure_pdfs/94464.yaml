  method: vision-description
  described_utc: '2026-11-11'
  alt: Three step charts showing EV charging interrupted by a peak period with no makeup charging that
    evening
  description: 'Figure 6: three step charts from 12:00 to about 11:00 the next day with a shaded peak
    period from about 17:30 to 21:00: EV charging power in kW without DF, the same with DF, and the occupancy
    schedule. Without DF the car charges from about 15:00 to 20:30. With DF it stops when the peak begins,
    and because the occupant leaves before the peak ends, charging resumes only at about 00:00.'
