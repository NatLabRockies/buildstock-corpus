  transcribed_utc: '2026-11-11'
  replaces:
    table_sha256: f1b4f65a84cae8e052ef88bdbd45fb1f613258a80b8c9abe3fb76aeecdd4c4e0
    also_removes:
    - e49a82211d26e46ee6df177e57ebd5ac5fac6df5c1c1c2e9531417e57b4a7c55
    why: The table runs over two pages and was extracted as two grids, each with the header row. Its units
      are printed as stacked fractions with superscripts (W over m-K, m³ over s, W over K, cm²), and the
      argument names carry the same superscripts ({cm²}, {m³/s}). The extractor flattened them to 'W m-K',
      'm 3 s', 'W K', 'cm 2', '{cm 2 }' and '{m 3 /s}', which do not read as units. They are written 'W/m-K',
      'm³/s', 'W/K', 'cm²', '{cm²}' and '{m³/s}'. Every other cell is the extractor's own, the 13 rows
      joined under the one header.
  markdown: '| IDF File Argument | Units | Description |

    |---|---|---|

    | c | - | Converts the flow coefficient based on ASHRAE principles |

    | Conductivity | W/m-K | Conductivity of the wall stud and cavity |

    | Effective Air Leakage Area {cm²} | cm² | Area where air can escape |

    | Maximum Air Flow Rate {m³/s} | m³/s | Maximum air flow rate through a duct |

    | Design Supply Air Flow Rate {m³/s} | m³/s | Design condition for the air flow rate for the air-source
    heat pump |

    | Cooling Supply Air Flow Rate {m³/s} | m³/s | Cooling design condition for the air flow rate for
    the air-source heat pump |

    | Design Maximum Air Flow Rate {m³/s} | m³/s | Maximum air flow rate for the air-source heat pump
    fan |

    | Speed Flow Fraction 1 | - | Flow fraction for the fan speed (Big Ladder Software n.d.) |

    | Speed Electric Power Fraction 1 | - | Electric power fraction for the fan speed (Big Ladder Software
    n.d.) |

    | Heating Design Capacity {W} | W | The heating design capacity of the baseboard heating system if
    present |

    | U-Factor Times Area Value {W/K} | W/K | Heat transfer through the baseboard heating wall if present
    |

    | Maximum Water Flow Rate {m³/s} | m³/s | The maximum water flow rate of the baseboard heating system
    if present |

    | Nominal Capacity {W} | W | Capacity of the hot water boiler if present |'
