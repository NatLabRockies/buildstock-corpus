- label: Table 5
  caption: Idf File Argument Changes as a Result of Advanced Air Sealing with Drill-and-Fill Wall Insulation
  source_pdf: measure_pdfs/96281.pdf
  source_pdf_sha256: 6fcf72b697dbdadcbeedf1960b78c499cb09adb34bc40603d32259c709004b6e
  page: 18
  method: extracted grids joined under one header, with units rewritten as fractions (compared with the
