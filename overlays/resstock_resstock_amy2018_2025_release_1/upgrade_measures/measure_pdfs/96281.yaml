- label: Measure Summary
  uncaptioned: true
  source_pdf: measure_pdfs/96281.pdf
  source_pdf_sha256: 6fcf72b697dbdadcbeedf1960b78c499cb09adb34bc40603d32259c709004b6e
  page: 9
  method: extracted grid, with the cells named in `why` corrected from the PDF text layer
  transcribed_utc: '2026-11-11'
  replaces:
    table_sha256: 8d404cfd42215e0749e2d0facd1d8f61f985436db57c865ba81e4a8e9571e459
    why: The table is right cell for cell except the project configuration URL, which carries a space
      where the PDF wraps the line ('project_national/sdr _upgrades_tmy3.yml'). A search for the real
      path, or a click on the link, misses it. The cell text is the extractor's own with that space removed;
      the joined URL is the one in the PDF text layer.
  markdown: '**Measure Summary, part 1 of 2**


    | Measure Title | Advanced Air Sealing with Drill-and-Fill Wall Insulation |

    |---|---|

    | Measure Definition | This upgrade measure applies R-13 drill-and-fill insulation to exterior wood-stud
    walls and is modeled with advanced air sealing. Advanced air sealing details are available in the
    measure documentation (Phoung, Lou and White 2025). |

    | Applicability | The insulation portion of this measure applies to all dwellings with: • Uninsulated
    above-grade wood stud walls separating conditioned from unconditioned space. With these applicability
    constraints, this portion of the measure upgrade applies to about 30% of existing dwelling units.
    The advanced air sealing portion of the measure applies to dwelling units with infiltration rates
    of ≥6 ACH50. With these applicability constraints, this portion of the measure applies to about 92%
    of existing dwelling units. In total, portions or the full package apply to 92% of dwelling units.
    |


    **Measure Summary, part 2 of 2**


    | Measure Title | Advanced Air Sealing with Drill-and-Fill Wall Insulation |

    |---|---|

    | Not Applicable | The insulation portion of this measure does not apply to dwelling units with: •
    Wood stud walls with existing insulation (any amount) • Non-wood stud walls. These constraints exclude
    about 70% of dwelling units from receiving wall insulation upgrades. The advanced air sealing portion
    of this measure does not apply to dwelling units with infiltration rates below 6 ACH50. This excludes
    about 8% of all dwelling units. |

    | Original Release | ResStock 2025 Release 1 |

    | Project Configuration File(s) | https://github.com/NatLabRockies/resstock/blob/2025_Release_1/project_national/sdr_upgrades_tmy3.yml
    |'
