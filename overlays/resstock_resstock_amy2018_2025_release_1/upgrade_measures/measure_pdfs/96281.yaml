# Hand-authored overlay for measure_pdfs/96281.pdf
#
# 96281 is the ResStock measure documentation for advanced air sealing with drill-and-fill
# wall insulation (measure 14). Every table and figure in the report was compared with the
# PDF on 2026-11-11, following "Checking every table and figure: the ResStock method" in
# overlays/README.md.
#
# Tables (page numbers are PDF pages, 1-based):
#   * Table 4 (p.18) and Table 5 (pp.18-19) are superseded: their units are printed as stacked
#     fractions with superscripts and were flattened into strings that do not read as units;
#     Table 5 also came out as one grid per page. See each entry's `why`.
#   * Table 7 (p.23) is superseded: five of its seven row-group labels were lost. See its
#     `why`.
#   * The Measure Summary table (p.9, no caption) is superseded: it was right except for a
#     line-wrap space inside the project configuration URL.
#   * Tables 1, 2, 3 and 6 and the List of Acronyms (p.5) are recorded under `checked:` as
#     correct.
#   * The Table of Contents and List of Figures / List of Tables grids are contents pages and
#     have no entry.
#   * The report's seven numbered page footnotes are all present in the document. No table
#     has a footnote of its own, and no number grid is shown as a picture.
#
# Figures: Figures 1-13 and A-1 to A-5 are described (vision-description). Figures A-2 and
# A-3 were extracted as ONE bitmap (image_000016) that also swallowed Figure A-2's caption,
# so the document has no "Figure A-2." caption line; the description of that bitmap covers
# both figures and quotes the A-2 caption, which is otherwise nowhere in the document. The
# cover art and wordmark (image_000000, image_000001) are decorative and omitted by the
# build. Values read off an axis, not a data label, are worded "about". In Figures 4, 10 and
# 12 the upgrade series is labelled "Drill Fill Air Sealing" in the plot itself.
#
# Flattening notes: Table 7's seven merged group labels are repeated on each of their three
# rows, and its two blank header cells are blank in the PDF. Units printed as stacked
# fractions are written with a slash (W/m-K, m³/s, W/K, h-ft²-R/Btu). Tables 5 and 7 and the
# Measure Summary are split into bold-labelled parts to stay under the chunk limit, each
# repeating the header row; the labels are not in the PDF. Row shading in the PDF is
# alternating bands and carries no meaning.

