- label: Measure Summary
  uncaptioned: true
  source_pdf: measure_pdfs/96738.pdf
  source_pdf_sha256: f89df99f5694bc497162871fbdbc697bd2dec13f1ad64d1e8f7e76086d074d02
  page: 10
  method: extracted grid, with the cells named in `why` corrected from the PDF text layer
  transcribed_utc: '2026-11-11'
  replaces:
    table_sha256: 286bb533cc6497c9c48e867d6f1db0753c06ba088b548955181d53d08f207f6b
    why: The table is right cell for cell except the project configuration URL, which carries a space
      where the PDF wraps the line ('project_national/s dr_upgrades_amy2018.yml'). A search for the real
      path, or a click on the link, misses it. Two row labels were broken the same way ('Applicabili ty',
      'Project Configurat ion File(s)') and are joined too. The cell text is otherwise the extractor's
      own.
  markdown: '| Measure Title | Advanced Air Sealing |

    |---|---|

    | Measure Definition | This measure reduces infiltration rates in existing buildings with baseline
    infiltration levels of 6 ACH50 (air changes per hour at 50 pascals) or higher. |

    | Applicability | Buildings with infiltration rates ≥6 ACH50 are eligible for an upgrade to 5 ACH50.
    While some regions require tighter envelopes for new constructions, 5 ACH50 reflects the average infiltration
    rate achieved in empirical studies across representative climate zones and ensures that selected homes
    do not already comply with 2024 IECC requirements. Table 4 provides additional details. With these
    applicability constraints, the measure upgrade applies to 92.2% of the existing dwelling units. |

    | Not Applicable | This measure does not apply to new construction nor to existing units with infiltration
    rates below 6 ACH50. These constraints exclude 7.8% of the dwelling units from receiving this measure
    upgrade. |

    | Original Release | 2025 Release 1: 2025/resstock_amy2018_release_1; 2025/resstock_amy2012_release_1;
    2025/resstock_tmy3_release_1 |

    | Project Configuration File(s) | https://github.com/NatLabRockies/resstock/blob/sdr_2025_Release_1/project_national/sdr_upgrades_amy2018.yml
    |'
- label: Table 1
  caption: Common Air Sealing Techniques
  source_pdf: measure_pdfs/96738.pdf
  source_pdf_sha256: f89df99f5694bc497162871fbdbc697bd2dec13f1ad64d1e8f7e76086d074d02
  page: 11
  method: extracted grids joined under one header (compared with the page renders and text layer)
  transcribed_utc: '2026-11-11'
  replaces:
    table_sha256: 644382e68500b42b6801e9d1b9c2fd94627e70eb93f2a507908352f1e1963ba3
    also_removes:
    - 018e809ca4323f5c1b290bef08d28647fc0b0a5b1f029c2732e784ffcfa78f1a
    why: The table runs over two pages and was extracted as two grids, the second with its first row (House
      wrap) standing as a header. Every cell of both grids matches the pages. The eight rows are the extractor's
      own, joined under the one header; a line-break space in '(closed-cell)' and a space before the subscript
      in ACH₅₀ are removed.
  markdown: '| Technique | Typical Application | Notes/Performance Considerations |

    |---|---|---|

    | Aerosol sealing | Whole-home air sealing (walls, ceilings, etc.); more common in new construction
    | Delivers sealant as fine mist to seal leaks; shown to achieve high reductions in ACH₅₀ [7] |

    | Weatherstripping | Around doors and operable windows | Reduces drafts; easy to install and cost-effective
    |

    | Caulking (includes mastic, and high temperature rated sealants) | Cracks around window frames, rim
    joists, baseboards, small attic penetrations, gaps around heat sources, etc. | Best for small gaps
    <¼ inch; silicone or acrylic latex types commonly used |

    | Foam sealants (cans) | Large gaps around pipes, vents, attic hatches, attic penetrations, and rim
    joists | Expands to fill irregular gaps; provides insulation value as well |

    | Spray foam (closed-cell) | Rim joists, attic penetrations | Offers both air sealing and insulation
    |

    | Airtight electrical boxes | Behind outlets and switches on exterior walls | Prevents air leakage
    through walls; used with gaskets |

    | House wrap | New construction beneath siding; retrofit when combined with insulated siding or exterior
    rigid foam | Blocks air while allowing moisture escape |

    | Vapor retarders | Inside wall assemblies in most U.S. climates | Controls moisture diffusion; not
    for air sealing per se |'
- label: Table 3
  caption: Summary of Air Sealing Empirical Studies Across Climate Zones, Showing Pre- and PostRetrofit
    ACH50 Values and Percent Reductions Used to Inform Measure Assumptions
  source_pdf: measure_pdfs/96738.pdf
  source_pdf_sha256: f89df99f5694bc497162871fbdbc697bd2dec13f1ad64d1e8f7e76086d074d02
  page: 13
  method: extracted grid, with merged cells repeated on the rows they cover (compared with the page render)
  transcribed_utc: '2026-11-11'
  replaces:
    table_sha256: e9699c57c264f42385dc6fe6c113d9e7d6b0c19070b82c0cb25f49c9ddd953d5
    why: 'The first study (CA and MN) fills four rows, and its Climate Zone, Methods and Cite cells are
      merged over them: ''CA: 3C'' covers the two California rows, ''MN: 6A'' the two Minnesota rows,
      and the Methods text and the citation [7] all four. The extractor repeated some of these and left
      others blank, so the CA multifamily and MN multifamily rows had no climate zone, the MN multifamily
      row no method, and three of the four rows no citation. Every value was right. The merged cells are
      repeated on each row they cover; line-break spaces in ''single-family'', ''Post-Retrofits'', ''Somerville''
      and ''St. Petersburg'' are removed.'
  markdown: '**Table 3, part 1 of 3**


    | Area (s) | Climate Zone | Methods | Pre-Retrofits | Post-Retrofits | Findings | Cite |

    |---|---|---|---|---|---|---|

    | CA and MN | CA: 3C | Existing 5 CA and 12 MN single-family houses and 6 CA and 9 MN multifamily
    units were air sealed using aerosol sealing in existing, unoccupied single-family houses and multifamily
    units. | CA single-family: 12 ACH50 | CA single-family:5.5 ACH50 | CA single-family: 53% reduction
    | [7] |

    | CA and MN | CA: 3C | Existing 5 CA and 12 MN single-family houses and 6 CA and 9 MN multifamily
    units were air sealed using aerosol sealing in existing, unoccupied single-family houses and multifamily
    units. | CA multifamily: 8.9 ACH50 | CA multifamily: 3.3 ACH50 | CA multifamily: 63% reduction | [7]
    |

    | CA and MN | MN: 6A | Existing 5 CA and 12 MN single-family houses and 6 CA and 9 MN multifamily
    units were air sealed using aerosol sealing in existing, unoccupied single-family houses and multifamily
    units. | MN single-family: 7.5 ACH50 | MN single-family: 4.3 ACH50 | MN single-family: 42% reduction
    | [7] |


    **Table 3, part 2 of 3**


    | Area (s) | Climate Zone | Methods | Pre-Retrofits | Post-Retrofits | Findings | Cite |

    |---|---|---|---|---|---|---|

    | CA and MN | MN: 6A | Existing 5 CA and 12 MN single-family houses and 6 CA and 9 MN multifamily
    units were air sealed using aerosol sealing in existing, unoccupied single-family houses and multifamily
    units. | MN multifamily: 9.7 ACH50 | MN multifamily: 5.8 ACH50 | MN multifamily: 40% reduction | [7]
    |

    | IL | Zone 4 & 5 | 27 single-family homes, split into 16 control and 11 treatment homes | 12.14 ACH50
    | 8.27 ACH50 | 31.9% | [4] |

    | NC | 4A | 236 apartments in 30 two-story brick and siding clad buildings constructed between 1968
    and 1970. | 19.8 ACH50 | 10.4 ACH50 | 50% | [8] |

    | Somerville and Millbury, MA | 5A | 2 tests homes: 1 single family detached, 1 triple decker multifamily
    wood-framed building | 10.4 ACH50; 16.5 ACH50 | 1.5 ACH50; 3.5 ACH50 | 86%; 79% | [11] |

    | MN | 6 & 7 | Aerosol envelope air sealing on 9 existing multifamily units | 14.5 ACH50 | 4.76 ACH50
    | 68% | [12] |

    | Central FL | 2A | 1 test home in Florida | 6 ACH50 | 4.8 ACH50 | 20% | [13] |

    | Las Vegas, NV | 3B | Tested/retrofitted 2 single family attached homes | 9.8 ACH50; 6.1 ACH50 |
    3.2 ACH50; 3.2 ACH50 | 58% | [14] |


    **Table 3, part 3 of 3**


    | Area (s) | Climate Zone | Methods | Pre-Retrofits | Post-Retrofits | Findings | Cite |

    |---|---|---|---|---|---|---|

    | St. Petersburg, FL | 3C | 1 multi-use facility/ transitional housing | 22 ACH50 Not blower tested,
    based on estimate from previous work for building with similar characteristics. | 8.8 ACH50 | 60%
    | [15] |'
