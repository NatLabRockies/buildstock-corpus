# Hand-authored overlay for measure_pdfs/96738.pdf
#
# 96738 is the ResStock measure documentation for the advanced air sealing upgrade (measure
# 11). Every table and figure in the report was compared with the PDF on 2026-11-11,
# following "Checking every table and figure: the ResStock method" in overlays/README.md.
#
# Tables (page numbers are PDF pages, 1-based):
#   * Table 1 (pp.11-12) is superseded: it came out as one grid per page. See its `why`.
#   * Table 3 (p.13) is superseded: merged cells were left blank on some of the rows they
#     cover. See its `why`.
#   * The Measure Summary table (p.10, no caption) is superseded: it was right except for a
#     line-wrap space inside the project configuration URL and inside two row labels.
#   * Tables 2, 4, 5, 6 and 7 and the List of Acronyms (p.5) are recorded under `checked:`
#     as correct.
#   * The Table of Contents, List of Figures and List of Tables grids are contents pages and
#     have no entry.
#   * No table in this report has a footnote, and no number grid is shown as a picture.
#
# Figures: Figures 1-22 are described (40-70 words each, vision-description); every figure
# caption has its image. Figure 7 is two bitmaps, its cooling panel (image_000008) and its
# heating panel (image_000009). The cover art and wordmark (image_000000, image_000001) are
# decorative and omitted by the build. Values read off an axis, not a data label, are worded
# "about". In Figure 3 the bar label "Basline" is the source's spelling; the description
# says Baseline.
#
# Flattening notes: Table 3's merged cells (Climate Zone, Methods and Cite of the first
# study) are repeated on each row they cover. Tables 1 and 3 and the Measure Summary are
# split into bold-labelled parts to stay under the chunk limit, each repeating the header
# row; the labels are not in the PDF. Row shading in the PDF is alternating bands and
# carries no meaning.

