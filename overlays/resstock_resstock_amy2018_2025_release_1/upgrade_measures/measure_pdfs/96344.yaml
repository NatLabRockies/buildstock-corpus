# Hand-authored overlay for measure_pdfs/96344.pdf
#
# 96344 is the ResStock measure documentation for the duct sealing and insulation upgrade
# (measure 13). Every table and figure in the report was compared with the PDF on 2026-11-11,
# following "Checking every table and figure: the ResStock method" in overlays/README.md.
#
# Tables (page numbers are PDF pages, 1-based):
#   * Table 3 (p.14) is superseded: its two merged Notes cells were cut in mid-sentence and
#     spread over the rows they cover. See its `why`.
#   * The Measure Summary table (p.9, no caption) is superseded: it was right except for a
#     line-wrap space inside the project configuration URL. It is the extractor's own grid
#     with that space removed.
#   * Tables 1, 2, 4 and 5 and the List of Acronyms (p.5) are recorded under `checked:` as
#     correct.
#   * The Table of Contents, List of Figures and List of Tables grids are contents pages, not
#     tables of the report, and have no entry. The References list (p.25) was extracted as a
#     one-column grid with some entries run together; it is not a table of the report and
#     has no entry.
#   * No table in this report has a footnote, and no number grid is shown as a picture.
#
# Figures: Figures 1-10 are described (40-70 words each, vision-description), one bitmap per
# figure; every figure caption has its image. The cover art and wordmark (image_000000,
# image_000001) are decorative and omitted by the build. Values in the descriptions that are
# read off an axis, not a data label, are worded "about".
#
# Flattening notes: Table 3's two merged Notes cells are repeated on each row they cover, and
# the table is split into two bold-labelled parts to stay under the chunk limit (the labels
# are not in the PDF). The Measure Summary is split the same way, each part repeating the
# first row (Measure Title). Bulleted lists inside its cells are run into the cell text, as
# extracted. Row shading in the PDF is alternating bands and carries no meaning.

