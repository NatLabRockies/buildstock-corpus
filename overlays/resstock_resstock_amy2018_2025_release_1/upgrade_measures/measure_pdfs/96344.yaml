tables:
- label: Measure Summary
  uncaptioned: true
  source_pdf: measure_pdfs/96344.pdf
  source_pdf_sha256: 73927d7ffd584cd0a93c1b50d048962fded9d4ebe57240caa48eab67aecc01f9
  page: 9
  method: extracted grid, with the cells named in `why` corrected from the PDF text layer
  transcribed_utc: '2026-11-11'
  replaces:
    table_sha256: 83f6a1fb7160edcc451750ace80d72ebde40ac8efe4d2c4e8fbb6435477462ac
    why: The table is right cell for cell except the project configuration URL, which carries a space
      where the PDF wraps the line ('project_nationa l'). A search for the real path, or a click on the
      link, misses it. The cell text is the extractor's own with that space removed; the joined URL is
      the one in the PDF text layer. The full stop after '.yml' is printed in the PDF.
  markdown: '| Measure Title | Duct Sealing and Insulation |

    |---|---|

    | Measure Definition | This upgrade measure involves sealing HVAC ducts and adding insulation in applicable
    dwelling units. After the upgrade, the units will achieve 5% duct leakage to the outside and an R-8
    duct insulation level. |

    | Applicability | This measure applies to all dwellings with ductwork located in unconditioned space
    that have one or both of the following characteristics: • More than 6% duct leakage to the outside
    • Less than R-6 duct insulation. With these applicability constraints, the measure upgrade applies
    to about 46% of the existing dwelling units. |

    | Not Applicable | This measure does not apply to dwelling units with any of the following characteristics:
    • 6% (or less) duct leakage to the outside and R-6 (or greater) duct insulation • 0% leakage to the
    outside. These constraints exclude 54% of the dwelling units from receiving this measure upgrade.
    |

    | Original Release | 2025/resstock_amy2018_release_1 |

    | Project Configuration File(s) | https://github.com/NatLabRockies/resstock/blob/sdr_2025_Release_1/project_national/sdr_upgrades_amy2018.yml.
    |'
- label: Table 3
  caption: HPXML Default Values for the Duct Sealing and Insulation Upgrades
  source_pdf: measure_pdfs/96344.pdf
  source_pdf_sha256: 73927d7ffd584cd0a93c1b50d048962fded9d4ebe57240caa48eab67aecc01f9
  page: 14
  method: extracted grid, with the split Notes cells rejoined (compared with the page render and text
    layer)
  transcribed_utc: '2026-11-11'
  replaces:
    table_sha256: 5cd58c8c258b2e4eb30f428cc7f3cd4a8665e1086ec2da437a38cec0d69467e1
    why: 'The Notes column has two merged cells, each covering two rows: one note for the two buried-insulation-level
      rows and one for the two fraction-rectangular rows. The extractor cut each note in the middle of
      a sentence and put the first half on one row and the second half on the next, so neither row carried
      a readable note (''...Fully buried ducts'' / ''have insulation that just covers...''). Every other
      cell was right. Each note is rejoined from the extractor''s own two halves and repeated on both
      rows it covers.'
  markdown: '**Table 3, part 1 of 2**


    | HPXML Default Variable | Value | Units | Notes |

    |---|---|---|---|

    | ducts_supply_buried_insulation_level | Not buried | - | An option to indicate whether the supply
    and return ducts are buried in, e.g., attic loose-fill insulation. Partially buried ducts have insulation
    that does not cover the top of the ducts. Fully buried ducts have insulation that just covers the
    top of the ducts. Deeply buried ducts have insulation that extends above the top of the ducts. See
    the Building America Solution Center for more information. |

    | ducts_return_buried_insulation_level | Not buried | - | An option to indicate whether the supply
    and return ducts are buried in, e.g., attic loose-fill insulation. Partially buried ducts have insulation
    that does not cover the top of the ducts. Fully buried ducts have insulation that just covers the
    top of the ducts. Deeply buried ducts have insulation that extends above the top of the ducts. See
    the Building America Solution Center for more information. |

    | ducts_supply_fraction_rectangular | 0.25 | - | The fraction of supply and return ducts that are
    rectangular (as opposed to round); this affects the duct effective R-value used for modeling. A value
    of 1.0 means DuctShape is ''rectangular'' and 0.0 means DuctShape is ''round'' or ''oval.'' |


    **Table 3, part 2 of 2**


    | HPXML Default Variable | Value | Units | Notes |

    |---|---|---|---|

    | ducts_return_fraction_rectangular | 1.0 | - | The fraction of supply and return ducts that are rectangular
    (as opposed to round); this affects the duct effective R-value used for modeling. A value of 1.0 means
    DuctShape is ''rectangular'' and 0.0 means DuctShape is ''round'' or ''oval.'' |'
