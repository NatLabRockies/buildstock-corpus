  page: 10
  method: extracted grid, with the cells named in `why` corrected from the PDF text layer
  transcribed_utc: '2026-11-11'
  replaces:
    table_sha256: 0ae0cfef7c07f99e51992aee19cd43adee5478470e1b209d0bf87de2ed77450f
    why: Second grid of the Measure Summary. It is right except for the project configuration URL, a link
      to a commit, whose commit hash carries a space where the PDF wraps the line ('...c3f8656 20612250f84').
      The broken hash does not resolve. The cell text is the extractor's own with that space removed;
      the joined hash is the one in the PDF text layer. The Measure Title row that opens this grid repeats
      the first grid's, as extracted.
  markdown: '| Measure Title | Residential Variable-Speed Geothermal Heat Pump (4.4 COP, 30.9 EER) With
    Light Envelope Improvements |

    |---|---|

    | Not Applicable | This GHP measure in this package does not apply to dwelling units with: • Shared
    HVAC (across multiple units) in high-rise (≥8 floors) buildings. • Dwelling units without air ducts.
    The light envelope measures in this package do not apply according to the following criteria: • Light
    air sealing measure does not apply to dwellings with: o Infiltration rate of less than 10 ACH50 •
    Attic insulation measure does not apply to dwellings with: o Finished attic & R-49 attic floor insulation
    or more & in climate zone 1 o Finished attic & R-60 attic floor insulation or more & in climate zones
    2 through 8 • Duct sealing and insulation measure does not apply to dwellings with: o Less than 6%
    duct leakage to outside o More than R-6 duct insulation These constraints exclude 25% of the building
    stock from receiving this measure package. An additional 4% of the dwelling units do not receive this
    upgrade because |

    | Original Release | 2025 Release 1: 2025/resstock_amy2018_release_1 |

    | Project Configuration File(s) | https://github.com/NatLabRockies/resstock/commit/5fe1b613db5d8b237b65f9c3f865620612250f84
    |'
