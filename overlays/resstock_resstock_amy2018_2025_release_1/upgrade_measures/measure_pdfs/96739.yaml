- label: Measure Summary
  uncaptioned: true
  source_pdf: measure_pdfs/96739.pdf
  source_pdf_sha256: a77485f90ebb3506ea12f2c7871e112fd96d80246110112291ba96cd22434e42
  page: 9
  method: extracted grid, with the cells named in `why` corrected from the PDF text layer
  transcribed_utc: '2026-11-11'
  replaces:
    table_sha256: 8cb50fa035c53e707fb08ae32349630be1d38b0521a90fad8529575180bb2a9c
    why: The table is right cell for cell except the project configuration URL, which carries a space
      where the PDF wraps the line ('project_national/s dr_upgrades_amy2018.yml'). A search for the real
      path, or a click on the link, misses it. Two row labels ('Applica- bility', 'Project Configurat
      ion File(s)') and the term 'R-value' were broken the same way and are joined too. The cell text
      is otherwise the extractor's own; the bullet before 'This measure package will not apply to:' is
      where the PDF prints it.
  markdown: '**Measure Summary, part 1 of 2**


    | Measure Title | Attic Floor Insulation |

    |---|---|

    | Measure Definition | This measure upgrades attic floor insulation in unfinished attics where the
    existing R-value falls at least R-10 value below the maximum level recommended by the IECC for each
    unit''s climate zone. The post-retrofit R-value is set to reflect the maximum value recommended by
    code, while still aligning with outcomes observed in empirical studies. For example, while the IECC
    recommends an R-value range of R-49 to R-60 for climate zone 2, dwelling units in this zone are upgraded
    to R-60 to represent the upper bound of achievable performance. This approach ensures that the modeled
    retrofit captures both the energy savings potential of code-compliant upgrades and the levels typically
    achieved in field implementations. |

    | Applicability | This measure applied to all units that meet the following conditions: • The unit
    has an existing unconditioned and accessible attic • The existing attic floor insulation R-value is
    below the IECC-recommended level for the corresponding climate zone. With these applicability constraints,
    the measure upgrade applies to 42.9% of existing dwelling units. |


    **Measure Summary, part 2 of 2**


    | Measure Title | Attic Floor Insulation |

    |---|---|

    | Not Applicable | • This measure package will not apply to: Dwellings without existing attics • Dwellings
    with floor insulation R-value at the code requirement. These constraints exclude 57.1% of dwelling
    units from receiving this measure upgrade. |

    | Original Release | 2025 Release 1: 2025/resstock_amy2018_release_1; 2025/resstock_amy2012_release_1;
    2025/resstock_tmy3_release_1 |

    | Project Configuration File(s) | https://github.com/NatLabRockies/resstock/blob/sdr_2025_Release_1/project_national/sdr_upgrades_amy2018.yml
    |'
