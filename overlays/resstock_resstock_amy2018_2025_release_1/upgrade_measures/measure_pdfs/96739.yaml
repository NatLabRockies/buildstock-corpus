# Hand-authored overlay for measure_pdfs/96739.pdf
#
# 96739 is the ResStock measure documentation for the attic floor insulation upgrade (measure
# 12). Every table and figure in the report was compared with the PDF on 2026-11-11,
# following "Checking every table and figure: the ResStock method" in overlays/README.md.
#
# Tables (page numbers are PDF pages, 1-based):
#   * Table 3 (p.12) is superseded: part of one study's Methods text was attached to the row
#     of the study above. See its `why`.
#   * Table 4 (p.13) is superseded: every cell was right, but the option value R-13 carried
#     a line-wrap space. It is the extractor's own grid with that value joined.
#   * The Measure Summary table (p.9, no caption) is superseded: it was right except for a
#     line-wrap space inside the project configuration URL, two row labels and one term.
#   * Tables 1, 2, 5 and 6 and the List of Acronyms (p.5) are recorded under `checked:` as
#     correct.
#   * The Table of Contents and List of Figures / List of Tables grids are contents pages and
#     have no entry. The References list was extracted as a two-column grid; it is not a table
#     of the report and has no entry.
#   * No table in this report has a footnote, and no number grid is shown as a picture.
#
# Figures: Figures 1-21 are described (40-70 words each, vision-description); every figure
# caption has its image. The legends of Figures 15 and 16 were extracted as separate small
# bitmaps (image_000016, image_000018) and have a one-sentence description each. The cover
# art and wordmark (image_000000, image_000001) are decorative and omitted by the build.
# Values read off an axis, not a data label, are worded "about".
#
# Flattening notes: Table 3 and the Measure Summary are split into bold-labelled parts to
# stay under the chunk limit, each repeating the header row; the labels are not in the PDF.
# Bulleted lists inside cells are run into the cell text, as extracted. Row shading in the
# PDF is alternating bands and carries no meaning.

