    why: 'The Methods cell of the Meriden, CT study was split: its first sentences (''A gut renovation
      of 126 residential units ... comprises 36'') were attached to the end of the St. Petersburg, FL
      row above, and only the rest (''buildings in duplex and quad configurations ...'') stayed on the
      Meriden row. A reader would attribute the Chamberlain Heights renovation to the Florida study. Every
      other cell was right. The text is the extractor''s own, moved back to its row; line-break spaces
      in the ''Pre-Retrofits'' and ''Post-Retrofits'' headers are removed.'
  markdown: '| Location (s) | Climate Zone | Methods | Pre-Retrofits | Post-Retrofits | References |

    |---|---|---|---|---|---|

    | St. Petersburg, FL | 3C | 1 multi-use facility / transitional housing. Insulated at ceiling. | R-7
    | R-34 | [9] |

    | Meriden, CT | 5 | A gut renovation of 126 residential units in the Chamberlain Heights retrofit
    project. The affordable housing community comprises 36 buildings in duplex and quad configurations
    located on 22 acres within two miles of downtown Meriden, CT. Blown-in fiberglass (R-44) was achieved
    in mudroom addition attics. | R-19 | R-44 | [10] |

    | MA | 5 | 350 homes |  | Up to R-50. Majority are R-40. | [11] |'
