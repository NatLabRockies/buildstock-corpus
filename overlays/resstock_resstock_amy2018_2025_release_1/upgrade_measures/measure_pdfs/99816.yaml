  page: 9
  method: extracted grid, with the cells named in `why` corrected from the PDF text layer
  transcribed_utc: '2026-11-11'
  replaces:
    table_sha256: 069fd6f41041df8a67e5b805b13c4ae3c0e7eb7d5ddd74d26c29c66c02f9f584
    why: The table is right cell for cell except the project configuration URL, a link to a commit, whose
      commit hash carries a space where the PDF wraps the line ('...c3f8656 20612250f84'). The broken
      hash does not resolve. The cell text is the extractor's own with that space removed; the joined
      hash is the one in the PDF text layer.
  markdown: '| Measure Title | Light Air Sealing |

    |---|---|

    | Measure Definition | This measure reduces infiltration rates by 25% in existing dwelling units with
    baseline infiltration levels of 10 air changes per hour at 50 pascals (ACH50) or higher. |

    | Applicability | Dwelling units with infiltration rates of ≥10 ACH50 are eligible for an upgrade.
    With these applicability constraints, the measure upgrade applies to 77.66% of the existing dwelling
    units. |

    | Not Applicable | This measure does not apply to existing dwelling units with infiltration rates
    below 10 ACH50. These constraints exclude 22.34% of dwelling units from receiving this measure upgrade.
    |

    | Original Release | 2025 Release 1: 2025/resstock_amy2018_release_1; 2025/resstock_amy2012_release_1;
    2025/resstock_tmy3_release_1 |

    | Project Configuration File(s) | https://github.com/NatLabRockies/resstock/commit/5fe1b613db5d8b237b65f9c3f865620612250f84
    |'
