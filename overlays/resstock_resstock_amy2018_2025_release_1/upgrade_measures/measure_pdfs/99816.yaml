# Hand-authored overlay for measure_pdfs/99816.pdf
#
# 99816 is the ResStock measure documentation for the light air sealing upgrade (measure 29).
# Every table and figure in the report was compared with the PDF on 2026-11-11, following
# "Checking every table and figure: the ResStock method" in overlays/README.md.
#
# Tables (page numbers are PDF pages, 1-based):
#   * Table 5 (p.17) is superseded: its merged row-group labels were blank or split word by
#     word over their rows. See its `why`.
#   * The Measure Summary table (p.9, no caption) is superseded: it was right except for a
#     line-wrap space inside the commit hash of the project configuration URL.
#   * Tables 1, 2, 3 and 4 and the List of Acronyms (p.5) are recorded under `checked:` as
#     correct.
#   * The Table of Contents and List of Figures / List of Tables grids are contents pages and
#     have no entry. The References list was extracted partly as a one-column grid; it is not
#     a table of the report and has no entry.
#   * The report's numbered page footnote is present. No number grid is shown as a picture.
#
# Figures: Figures 1-14 are described (40-70 words each, vision-description), one bitmap per
# figure; every figure caption has its image. The cover art and wordmark (image_000000,
# image_000001) are decorative and omitted by the build. Values read off an axis, not a data
# label, are worded "about".
#
# Flattening notes: Table 5's five merged group labels are repeated on each of their three
# rows, and its two blank header cells are blank in the PDF. The Measure Summary is split
# into bold-labelled parts to stay under the chunk limit, each repeating the first row; the
# labels are not in the PDF. Row shading in the PDF is alternating bands and carries no
# meaning.

