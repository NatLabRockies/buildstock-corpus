  description: 'Figure 9: horizontal stacked bar chart of stock-wide fuel totals savings (kWh, 0 to about
    5.5B) by U.S. census division for the Propane/Oil Furnace upgrade, with segments for electricity,
    natural gas, propane and fuel oil. East North Central and Middle Atlantic save the most, about 5.3B
    kWh each, the first almost all propane and the second mostly fuel oil. New England, about 4.4B kWh,
    is also mostly fuel oil.'
