  described_utc: '2026-11-11'
  alt: Line chart of aggregated average power on the Colorado peak day, baseline vs upgrade
  description: 'Figure 4: line chart of aggregated average power (kW, about 7 to 13) over the 24 hours
    of February 20, 2018, the peak day in Colorado, with one line each for Baseline and Upgrade. The lines
    are indistinguishable at this scale: power rises from about 8.6 kW at midnight to a peak near 12.9
    kW around 07:00, falls to about 7 kW near 15:30, and recovers to roughly 9 kW.'
- source_image: 96635_images/image_000006_c14ebd65bbad6a624ae0ed8b13e8493c5ebee596ae0676f840ed11ee18cd6988.png
