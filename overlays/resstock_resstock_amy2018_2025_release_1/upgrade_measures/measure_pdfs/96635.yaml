tables:
- label: Table 1
  caption: Summarized Apply Logic for Fuel Oil or Propane Furnace Upgrade Package
  source_pdf: measure_pdfs/96635.pdf
  source_pdf_sha256: 9af4cf0249bffa601a9a798305142b0eb92eb5202c0ed5c4f480efed8b8016a7
  page: 12
  method: vision-transcription
  transcribed_utc: '2026-11-11'
  replaces:
    table_sha256: fddb4d78208e83816a331924b216aa6f60cdde0a1259658c8d621fefb7e9ffc7
    why: 'The extractor put the merged Heating Fuel cells on the wrong rows: ''Fuel Oil'' on the first
      two rows only, ''Propane'' only on the sixth, and a blank on rows three to five, so the propane
      rows (None/Yes, 3.74%; None/No, 0.62%) read as having no fuel or as fuel oil. The merged ''None''
      cell was also blank on row two, and the footnote explaining ''Yes*'' was dropped from the document.
      All other cells were right. Merged cells are repeated on each row and the footnote is restored below
      the table.'
  markdown: '| Heating Fuel | HVAC Shared Efficiencies | HVAC Has Ducts | Propane Fuel Furnace | Fuel
    Oil Furnace | Stock Saturation (%) |

    |---|---|---|---|---|---|

    | Fuel Oil | None | Yes | No | Yes* | 3.03% |

    | Fuel Oil | None | No | No | No | 1.15% |

    | Fuel Oil | Fan Coil Cooling Only; Fan Coil Heating and Cooling, Fuel; Fan Coil Heating and Cooling,
    Electricity; Boiler Baseboards Heating Only, Fuel; Boiler Baseboards Heating Only, Electricity | Any
    | No | No | 0.50% |

    | Propane | None | Yes | Yes* | No | 3.74% |

    | Propane | None | No | No | No | 0.62% |

    | Propane | Fan Coil Cooling Only; Fan Coil Heating and Cooling, Fuel; Fan Coil Heating and Cooling,
    Electricity; Boiler Baseboards Heating Only, Fuel; Boiler Baseboards Heating Only, Electricity | Any
    | No | No | 0.90% |

    | Electric, Natural Gas, Other Fuel, None | Any | Any | No | No | 90.88% |


    *The upgrade is not applied when the dwelling’s existing furnace efficiency is greater than the upgrade’s
    furnace efficiency, accounting for <1% of dwellings.'
