  alt: Stacked area load shape of electricity demand for a Minnesota propane-heated house, Jan. 7
  description: 'Figure 5: stacked area chart for a single-family detached dwelling in Climate Zone 7A,
    Minnesota, heated with propane, on January 7. Left axis is average electricity demand (kW, 0 to 1)
    by hour of day, stacked by end use with Total and dotted Baseline lines; right axis is outdoor drybulb
    temperature (°F). Demand sits near 0.1 kW between short spikes reaching 0.4 to 1 kW; baseline and
    upgrade nearly coincide.'
- source_image: 96635_images/image_000007_d49e1338055fcda4dd186927efbd6f68c27987d7d73ceb8d4927ffc8171294b8.png
