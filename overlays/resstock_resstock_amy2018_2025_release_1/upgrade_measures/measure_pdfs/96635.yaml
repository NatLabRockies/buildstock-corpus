  alt: Stacked bars of annual all-fuel end-use energy for fuel oil and propane homes, baseline vs upgrade
  description: 'Figure 6: horizontal stacked bar chart of stock-wide all-fuels end uses (kWh, 0 to about
    160B), with a Baseline bar and a Propane/Oil Furnace bar for each heating fuel, Fuel Oil and Propane,
    and segments for each end use and fuel. Heating is by far the largest segment in every bar. Fuel oil
    homes fall from about 140B to 130B kWh, and propane homes from about 162B to 148B kWh.'
- source_image: 96635_images/image_000008_4cb8fbcbb8acd5cbcaac182c7ea030523002f77f772e6f253528d2a76c5782b7.png
