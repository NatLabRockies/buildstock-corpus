  alt: Stacked bars of average annual all-fuel end-use savings per dwelling for fuel oil and propane homes
  description: 'Figure 7: horizontal stacked bar chart of average all-fuels end-use savings per dwelling
    (kWh, 0 to about 3,000) for the Propane/Oil Furnace upgrade, one bar per heating fuel, with segments
    for each end use and fuel. Nearly all savings are heating: about 2,700 kWh for fuel oil dwellings
    and about 3,000 kWh for propane dwellings, the latter with small slivers of electricity savings at
    either end.'
