  alt: Line chart of daily aggregated average energy consumption across 2018 for the Colorado baseline
  description: 'Figure 3: line chart of daily aggregated average energy consumption (kBtu, about 100 to
    800) over January to December 2018 for the baseline in Colorado. Consumption is highest and most variable
    in winter, peaking near 780 kBtu in February, falls through spring to a flat summer floor of roughly
    110 kBtu from June to September, then climbs from October to about 700 kBtu at the end of December.'
- source_image: 96635_images/image_000005_ced61bb2204e6e95af901b6f8530080acf23441429a7091d455ce356cc34d28c.png
