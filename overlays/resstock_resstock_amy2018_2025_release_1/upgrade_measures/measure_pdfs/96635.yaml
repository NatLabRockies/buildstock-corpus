# Hand-authored overlay for measure_pdfs/96635.pdf
#
# 96635 is the ResStock measure documentation for the propane furnace 95% AFUE and fuel oil
# furnace 88% AFUE upgrade (measure 2). Every table and figure in the report was compared
# with the PDF on 2026-11-11, following "Checking every table and figure: the ResStock method"
# in overlays/README.md.
#
# Tables (page numbers are PDF pages, 1-based):
#   * Table 1 (p.12) and Table 3 (pp.15-16) are superseded: see each entry's `why`.
#   * Table 2, the List of Acronyms and the Upgrade Summary table are recorded under
#     `checked:` as correct.
#   * The Table of Contents and the List of Figures / List of Tables grids are contents
#     pages, not tables of the report, and have no entry.
#
# Figures: Figures 1-11 are described (40-70 words each, vision-description); every figure
# caption has its image. The cover art and wordmark (image_000000, image_000001) are
# decorative and omitted by the build.
#
# Flattening notes: Table 1's merged cells (Heating Fuel over three rows, "None" over two)
# are repeated on each row; its footnote, absent from the extracted body, is carried below
# the table. Table 3's spanning header "U.S. Census Division" is stated in a sentence above
# the sub-tables; row shading in the PDF is alternating bands and carries no meaning.

