  alt: Violin and box plots of annual site energy savings per dwelling by HVAC heating efficiency
  description: 'Figure 8: violin plots with box plots of site energy total consumption savings per dwelling
    (kWh, 0 to 35k), one row per baseline HVAC heating efficiency: Fuel Furnace 60%, 76%, 80% and 92.5%
    AFUE, each labelled with its model count. Savings shrink as baseline efficiency rises: the median
    is about 8k kWh at 60% AFUE, about 4k at 76%, about 3k at 80%, and under 1k at 92.5% AFUE.'
- source_image: 96635_images/image_000010_50dfbf7205ee7ad3ad5bd1913d3db19a12e8a64d234768643cbbdf7b71c87b1e.png
