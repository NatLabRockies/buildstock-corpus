# Hand-authored overlay for measure_pdfs/94461.pdf
#
# 94461 is the ResStock measure documentation for efficient electric vehicle adoption with Level 2 charging (measure 21).
# Every table and figure in the report was compared with the PDF on 2026-11-11, following
# "Checking every table and figure: the ResStock method" in overlays/README.md.
#
# Tables (page numbers are PDF pages, 1-based):
#   * Table 2 (p.14) is superseded: every cell was right, but the bin value 40-59% carried a
#     line-wrap space. It is the extractor's own grid with that value joined.
#   * Table 1 and the Measure Summary table (p.7, no caption) are recorded under `checked:` as
#     correct.
#   * The List of Acronyms (p.5) was extracted as one run-on paragraph, not a grid, so there
#     is no table to check; every entry is present.
#   * The Table of Contents and List of Figures / List of Tables grids are contents pages and
#     have no entry.
#   * The report's numbered page footnotes are all present, including the one Table 2's
#     caption points to. No number grid is shown as a picture.
#
# Figures: Figures 1-7 are described (40-70 words each, vision-description), one bitmap per
# figure; every figure caption has its image. The cover art and wordmark (image_000000,
# image_000001) are decorative and omitted by the build. Values read off an axis, not a data
# label, are worded "about". The Figure 5 bitmap carries the note "MMBtu = million British
# thermal unit" along its top edge; it is the printed note of Figure 4 above it.
#
# Flattening notes: Table 2 is split into bold-labelled parts to stay under the chunk limit,
# each repeating the header row; the labels are not in the PDF.

