# Hand-authored overlay for measure_pdfs/96634.pdf
#
# 96634 is the ResStock measure documentation for the 95% AFUE natural gas furnace upgrade
# (measure 1). Every table and figure in the report was compared with the PDF on 2026-11-11,
# following "Checking every table and figure: the ResStock method" in overlays/README.md.
#
# Tables (page numbers are PDF pages, 1-based):
#   * Table 1 (p.12) and Table 3 (pp.15-16) are superseded: see each entry's `why`.
#   * The Upgrade Summary table (p.9, no caption) is superseded: it was right except for
#     a line-wrap space inside the project configuration URL. It is the extractor's own
#     grid with that space removed.
#   * Tables 2, 4 and 5 and the List of Acronyms are recorded under `checked:` as correct.
#   * The Table of Contents, List of Figures and List of Tables grids are contents pages,
#     not tables of the report, and have no entry.
#
# Figures: Figures 1-10 are described (40-70 words each, vision-description). The cover
# art and wordmark (image_000000, image_000001) are decorative and omitted by the build.
#
# Flattening notes: Table 1's merged cells (Heating Fuel over three rows, "None" over two)
# are repeated on each row. Table 3's spanning header "U.S. Census Division" is stated in
# a sentence above the sub-tables; row shading in the PDF is alternating bands and carries
# no meaning.

