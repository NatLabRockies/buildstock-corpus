# Hand-authored overlay for measure_pdfs/96826.pdf
#
# 96826 is the ResStock measure documentation for the heat pump water heater upgrade
# (measure 9). Every table and figure in the report was compared with the PDF on 2026-11-11,
# following "Checking every table and figure: the ResStock method" in overlays/README.md.
#
# Tables (page numbers are PDF pages, 1-based):
#   * Table 6 (p.19) and Table 8 (p.22) are superseded: see each entry's `why`.
#   * Tables 1, 2, 3, 4 (two grids, pp.14-15), 5 and 7 and the List of Acronyms are
#     recorded under `checked:` as correct.
#   * NOT RESOLVED, the Measure Summary (upgrade summary) table on p.9: the extracted
#     "Not Applicable" row has lost the opening words of its cell, "This measure does not
#     apply to dwelling units with one of the following water", and starts at "heaters:".
#     Every other cell matches the page. The grid has no "Table N" caption, so a `tables:`
#     entry with `replaces:` cannot locate it, and a `checked:` entry would be false. It has
#     no entry here.
#   * The Table of Contents, List of Figures and List of Tables grids are contents pages,
#     not tables of the report, and have no entry.
#
# Figures: Figures 1-18 are described (40-70 words each, vision-description); every figure
# caption has its image. The cover art and wordmark (image_000000, image_000001) are
# decorative and omitted by the build. Figures 2 and 3 are grids of numbers drawn as
# pictures (COP and capacity multipliers, some 25 columns by 20 rows each) with no text
# layer; they are described as figures and their cells are NOT transcribed, since the
# digits are too small to read reliably at the page render.
#
# Flattening notes:
#   * Table 6: the PDF's Notes column is subdivided for Standby Loss and Nominal Heating
#     Capacity into a tank-size label per sub-row and one note shared by the sub-rows. Here
#     that is two columns; the name "Notes: HPWH option" is a reading, not printed. It is
#     blank on rows the PDF does not subdivide. Nominal Heating Capacity stacks a Btu/h and
#     a kW value per tank size; each printed value has its own row. Backup Heating Capacity
#     is one cell in the PDF ("15,355 or 4.5", "Btu/h kW") and is kept as one row. The three
#     bold sub-table labels are not in the PDF; row order is the PDF's.
#   * Table 8: the PDF header "Dwelling ID/State/Climate Zone" spans the two unlabelled
#     label columns; the column names "Metric" and "Case" are supplied, not printed, and the
#     printed header is given in the sentence above the table. Bold on the Change rows and
#     alternating band shading carry no meaning and are dropped.

