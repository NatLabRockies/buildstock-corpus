  alt: Stacked bar chart of total annual stock bill savings by heating fuel and bill type
  description: 'Figure 12: horizontal stacked bar chart of total annual housing stock bill savings (USD,
    0 to above 4B) for homes heated by Electricity, Natural Gas, Fuel Oil and Propane, with segments for
    electricity, natural gas, fuel oil and propane bills. Electricity-heated homes save the most, about
    $4.4B, all on electricity bills; natural-gas-heated homes save about $3.3B, mostly electricity; fuel
    oil and propane homes each save about $0.5B or less.'
