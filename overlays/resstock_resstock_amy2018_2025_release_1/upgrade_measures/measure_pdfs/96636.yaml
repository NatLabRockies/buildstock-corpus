# Hand-authored overlay for measure_pdfs/96636.pdf
#
# 96636 is the ResStock measure documentation for the Reference Space Heating and Air
# Conditioning Upgrade Circa 2025 (measure 3). Every table and figure in the report was
# compared with the PDF on 2026-11-11, following "Checking every table and figure: the
# ResStock method" in overlays/README.md.
#
# Tables (page numbers are PDF pages, 1-based):
#   * Table 1 (p.16) is superseded: nine rows were merged into four. See its `why`.
#   * Tables 2, 3 (p.18), 5 (pp.18-19), 6 and 7 (p.19) are superseded to restore the
#     footnotes the extractor dropped: their grids were right (Table 5 as two grids over
#     the page break; Table 7 with superscript markers flattened into the values), and the
#     rows are reused from the extraction, not retyped. The footnote text is from the PDF
#     text layer and appears nowhere else in the document.
#   * The second grid of the Upgrade Summary table (p.10, no caption) is superseded: the
#     project configuration URL carried a line-wrap space and the quoted word "none" was
#     broken. It is the extractor's own grid with those two corrected.
#   * Tables 4, 8, 9 and 10, the List of Acronyms and the first grid of the Upgrade
#     Summary table (p.9) are recorded under `checked:` as correct.
#   * The Table of Contents and the List of Figures / List of Tables grids are contents
#     pages, not tables of the report, and have no entry.
#
# Figures: Figures 1-13 are described (40-70 words each, vision-description), one bitmap
# per figure; no caption is without its image. The cover art and wordmark (image_000000,
# image_000001) are decorative and omitted by the build. In Figures 6-9 the plots' own
# legend calls the upgrade "Minimum Efficiency Furnace"; the descriptions say so.
#
# Flattening notes: Table 1's merged cells (Heating Fuel, HVAC Has Ducts, Shared Cooling,
# and "Ducted Heating" over three rows) are repeated on each row. Table 7's superscript
# footnote markers are written as Unicode superscripts. Row shading in the PDF is
# alternating bands and carries no meaning.

