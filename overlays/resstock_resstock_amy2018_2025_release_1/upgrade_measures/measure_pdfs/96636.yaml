  alt: Stacked bar chart of average annual all-fuel end-use savings per dwelling by HVAC cooling efficiency
  description: 'Figure 11: horizontal stacked bar chart of average all-fuels end-use savings per dwelling
    (kWh, 0 to 3,000) for ten HVAC cooling efficiency classes. Segments are end uses by fuel; electric
    cooling makes up most of the larger bars, with smaller fan and heating segments. AC, SEER 8 saves
    the most, about 2,900 kWh, then AC, SEER 10 at about 1,750 kWh; AC, SEER 15, Room AC, EER 12.0 and
    None save under 250 kWh.'
