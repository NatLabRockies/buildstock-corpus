  alt: Violin and box plots of annual bill savings per dwelling by HVAC cooling efficiency
  description: 'Figure 13: violin plots with box plots of all-fuels annual bill savings per dwelling (USD,
    0 to 1,200), one row for each of ten HVAC cooling efficiency classes, each labelled with its model
    count. AC, SEER 8 has the highest median, a little over $300, and the widest box, followed by AC,
    SEER 10; AC, SEER 15, Room AC, EER 12.0 and None sit close to zero. See Table 10 for mean savings
    and sample sizes.'
