    why: The table has nine rows in the PDF and was extracted as four. The five upgraded rows were merged
      into one row whose cells run the values together ('Yes Yes Yes Yes Yes', '43% 6% 5% 16% 5%'), which
      no longer says which heating type pairs with which cooling type, and the next two rows were merged
      the same way ('No No', '1% 21%') with their Shared Cooling values ('Yes', 'All options') in one
      cell and HVAC Has Ducts wrong for the first of them (printed 'Yes', extracted under 'No'). Merged
      cells in the first three columns are repeated on each row.
  markdown: '| Heating Fuel | HVAC Has Ducts | Shared Cooling | HVAC Heating Type | HVAC Cooling Type
    | Upgrade Applied? | Stock Saturation (%) |

    |---|---|---|---|---|---|---|

    | Electricity, Natural Gas, Fuel Oil, and Propane | Yes | No | Ducted Heating | Central AC | Yes |
    43% |

    | Electricity, Natural Gas, Fuel Oil, and Propane | Yes | No | Ducted Heating | Room AC | Yes | 6%
    |

    | Electricity, Natural Gas, Fuel Oil, and Propane | Yes | No | Ducted Heating | None | Yes | 5% |

    | Electricity, Natural Gas, Fuel Oil, and Propane | Yes | No | Ducted Heat Pump | Ducted Heat Pump
    | Yes | 16% |

    | Electricity, Natural Gas, Fuel Oil, and Propane | Yes | No | Non-Ducted Heating | Central AC | Yes
    | 5% |

    | Electricity, Natural Gas, Fuel Oil, and Propane | Yes | Yes | Ducted Heating | Central AC | No |
    1% |

    | Electricity, Natural Gas, Fuel Oil, and Propane | No | All options | All options | All options |
    No | 21% |

    | None, Wood | Yes | All options | All options | All options | No | 1% |

    | None, Wood | No | All options | All options | All options | No | 2% |'
