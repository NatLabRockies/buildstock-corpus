      path misses it, and the quoted word “none” was extracted as ''n one ''. The cell text is the extractor''s
      own with those two corrected from the PDF text layer.'
  markdown: '| Measure Title | Reference Space Heating and Air Conditioning Upgrade Circa 2025 |

    |---|---|

    | Not Applicable | This upgrade does not apply to: • Homes that do not have existing ductwork, including
    homes heated with electric resistance baseboard, boilers/radiators, ductless heat pumps, and wall/floor
    furnaces that do not have ducted air conditioning. • Heating systems sourced from wood and homes without
    heating (i.e., “none”). • Systems already meeting or exceeding the specified minimum efficiency thresholds
    (modeled as like-for-like replacements). These constraints exclude 24.8% of the dwelling units from
    receiving this measure upgrade. |

    | Original Release | 2025/resstock_amy2018_release_1; 2025/resstock_amy2012_release_1 |

    | Project Configuration File | https://github.com/NatLabRockies/resstock/blob/sdr_2025_Release_1/project_national/sdr_upgrades_amy2018.yml
    |'
