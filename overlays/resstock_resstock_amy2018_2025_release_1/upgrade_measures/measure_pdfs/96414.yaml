tables:
- label: Table 3
  caption: Summarized Apply Logic for the Dual Fuel Heat Pump Upgrade Package
  source_pdf: measure_pdfs/96414.pdf
  source_pdf_sha256: eb06df8d38643f4acb1e2bb11401ab8c782e55221545af90f0a1aef943ac18bc
  page: 18
  method: vision-transcription
  transcribed_utc: '2026-11-11'
  replaces:
    table_sha256: 93f9b9514fe49bd0a79e853ffdf7c1783edc05213bdcd1ba90f13016b2cee465
    why: Cells that span several rows in the PDF were split across the wrong rows. The Heating Fuel cell
      'Electricity, Natural Gas, Fuel Oil, Propane' covers the first three data rows, but the grid left
      it blank on the first row (the 1.85% row), put 'Electricity, Natural Gas, Fuel Oil,' on the second
      and 'Propane' alone on the third, so the 29.68% row read as propane only; 'Not Present', which covers
      the second and third rows, was blank on the third. The other columns and every number are right.
      Transcribed from page 18 with merged cells repeated on each row.
  markdown: '| HVAC Has Ducts | Heating Fuel | HVAC Shared Efficiencies | Does This Dwelling Have a Natural
    Gas Hookup? | Dual Fuel Heat Pump Applied? | Stock Saturation (%) |

    |---|---|---|---|---|---|

    | Yes | Electricity, Natural Gas, Fuel Oil, Propane | Present | All options | No | 1.85 |

    | Yes | Electricity, Natural Gas, Fuel Oil, Propane | Not Present | Yes | Yes | 44.65 |

    | Yes | Electricity, Natural Gas, Fuel Oil, Propane | Not Present | No | No | 29.68 |

    | Yes | Other Fuel, None | All options | All options | No | 0.84 |

    | No | All options | All options | All options | No | 22.98 |'
- label: Table 5
  caption: HPXML Default Values for the Dual Fuel Heating System Upgrade
  source_pdf: measure_pdfs/96414.pdf
  source_pdf_sha256: eb06df8d38643f4acb1e2bb11401ab8c782e55221545af90f0a1aef943ac18bc
  page: 21
  method: vision-transcription
  transcribed_utc: '2026-11-11'
  replaces:
    table_sha256: 811d8f7d0d2a52f25bdda43ef16e937ec7599ce114b3f661a1055fbd6b6e2b52
    also_removes:
    - a6522a0aeac5b26a6bd8d56123d2596113ff0ebc92d06832cee1a05dbe3eac2c
    why: 'The table runs over pages 21 and 22 and was extracted as two grids. In the second grid the Value
      cell is repeated in the Units column on ten rows: the heating ''Fan speed ratio'' read Value 1,
      Units 1 and the ''Rated COP equation'' appeared as its own units, where the page has Units blank;
      the eight coefficient lists were doubled the same way. The section bands (Cooling Curve Values,
      Cooling Capacity and COP Curve Coefficients, Heating Curve Values, Heating Capacity and COP Curve
      Coefficients) were ordinary data rows. Every value and note is the extractor''s own, compared with
      pages 21 and 22; the table is regrouped into one sub-table per section band, with a single Coefficients
      column where the page merges Value and Units.'
  markdown: '| HPXML Default Variable | Value | Units | Notes |

    |---|---|---|---|

    | Net sensible heat ratio | 0.73 | | |

    | Crankcase heater power | 50 | W | Based on RESNET Publication No. 002-2017, heater warms lubricating
    oil pan |

    | Fan power | 0.375 | W/cfm | Based on electronically commutating motor—a more efficient type of blower
    that allows for variable speeds and not on/off binary operation like permanent split capacitor (PSC)
    blowers |

    | Rated fan power | 0.18 | W/cfm | Based on ASHRAE 1449-RP |


    | Cooling Curve Values | Value | Units | Notes |

    |---|---|---|---|

    | Rated cfm per ton for cooling | 394.2 | cfm/ton | Derived from Cutler et al. (2013a) |

    | Cooling capacity ratio | 1 | | |

    | Cycling degradation coefficient | 0.07 | | Degradation coefficient encapsulates inefficiencies involved
    with system cycling, heating the coils, and distributing fluid. This value is derived from conversations
    with experts and engineering judgment |

    | Fan speed ratio | 1 | | |

    | Rated COPs equation | 0.2692 * SEER + 0.2706 | | This eqn. is a regression based on the inverse
    model of SEER as a function of rated COP |

    | Gross sensible heat ratio | Calculated using rated conditions at 80°F, nominal cfm/ton, the coil
    Ao factor, and the net sensible heating ratio | | Calculation from OpenStudio-HPXML is here |


    | Cooling Capacity and COP Curve Coefficients | Coefficients | Notes |

    |---|---|---|

    | | | The COP curve is expressed as a function of the energy input ratio (EIR) which is 1/COP. These
    values are derived from Cutler et al. (2013b) |

    | Capacity coefficients as function of operating temperatures | [[3.68637657, -0.098352478, 0.000956357,
    0.005838141, -0.0000127, -0.000131702]] | |

    | EIR coefficients as function of operating temperatures | [[-3.437356399, 0.136656369, -0.001049231,
    -0.0079378, 0.000185435, -0.0001441]] | |

    | Capacity coefficients as function of flow fraction | [[0.718664047, 0.41797409, -0.136638137]] |
    |

    | EIR coefficients as function of flow fraction | [[1.143487507, -0.13943972, -0.004047787]] | |


    | Heating Curve Values | Value | Units | Notes |

    |---|---|---|---|

    | Rated cfm per ton for heating | 384.1 | cfm/ton | |

    | Rated COP equation | 0.0353 * HSPF^2 + 0.0331 * HSPF + 0.9447 | | This eqn. is a regression based
    on the inverse model of HSPF as a function of rated COP. |

    | Fan speed ratio | 1 | | |


    | Heating Capacity and COP Curve Coefficients | Coefficients | Notes |

    |---|---|---|

    | | | The COP curve is expressed as a function of the EIR, which is 1/COP. These values are derived
    from Cutler et al. (2013b) |

    | Capacity coefficients as a function of operating temperatures | [[0.671428571, 0.18417308, -0.002303414,
    0, 0.007142857, 0]] | Calculated as a function of heating capacity retention fraction and heating
    capacity retention fraction temperature. Calculation from OpenStudio-HPXML here. Note: since capacity
    retention is specified in the ResStock outputs, this will not be used. |

    | EIR coefficients as a function of operating temperatures | [[0.718398423, 0.003498178, 0.000142202,
    -0.005724331, 0.00014085, -0.000215321]] | |

    | Capacity coefficients as a function of flow fraction | [[0.694045465, 0.474207981, -0.168253446]]
    | |

    | EIR coefficients as a function of flow fraction | [[2.185418751, -1.942827919, 0.757409168]] | |'
