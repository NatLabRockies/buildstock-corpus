# Hand-authored overlay for measure_pdfs/96414.pdf
#
# 96414 is the ResStock measure documentation for the dual fuel heat pump (dual fuel heating
# system) upgrade (measure 5). Every table and figure in the report was compared with the
# PDF on 2026-11-11, following "Checking every table and figure: the ResStock method" in
# overlays/README.md.
#
# Tables (page numbers are PDF pages, 1-based):
#   * Table 3 (p.18) and Table 5 (pp.21-22) are superseded: see each entry's `why`.
#   * Tables 1, 2, 4, 6 and 7 and the Measure Summary table (p.9) are recorded under
#     `checked:` as correct.
#   * The List of Acronyms (p.5) has no entry: the extractor emitted it as one run-on
#     paragraph, not a grid, so there is no table to check or to replace and no caption to
#     anchor a transcription to. The 13 acronyms and their expansions are all present in
#     that paragraph, in order.
#   * The Table of Contents and the combined List of Figures / List of Tables grids are
#     contents pages, not tables of the report, and have no entry.
#
# Figures: Figures 1-14 are described (40-70 words each, vision-description); every figure
# caption has its bitmap. The cover art and wordmark (image_000000, image_000001) are
# decorative and omitted by the build. The Figure 1 bitmap is cropped above the plot area
# (no chart title); it is matched to Figure 1 by its caption.
#
# Flattening notes: Table 3's merged cells (HVAC Has Ducts "Yes" over four rows, Heating
# Fuel over three, "Not Present" over two) are repeated on each row. Table 5 is split into
# five sub-tables at the shaded section bands the PDF itself prints, each band serving as
# its sub-table's header row; the header row repeated at the top of page 22 is a page
# continuation and is dropped. In the two coefficient sections the PDF merges Value and
# Units into one "Coefficients" cell, written here as one column, and the section's note
# sits in a first row with no variable name, as on the page. Hyperlinked words ("here",
# "RESNET Publication No. 002-2017", "Cutler et al.") are kept as text without their links.
# Row shading is alternating bands and carries no meaning.

