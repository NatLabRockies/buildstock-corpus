# Hand-authored overlay for measure_pdfs/96827.pdf
#
# 96827 is the ResStock measure documentation for the natural gas water heater upgrade
# (measure 10, a high-efficiency condensing natural gas tankless water heater). Every table
# and figure in the report was compared with the PDF on 2026-11-11, following "Checking every
# table and figure: the ResStock method" in overlays/README.md.
#
# Tables (page numbers are PDF pages, 1-based):
#   * Tables 1-7 (pp.10, 12, 14, 16, 17, 19, 20) are recorded under `checked:` as correct.
#   * UNRESOLVED, no entry: the Measure Summary table (p.9, no caption) is WRONG in the
#     extraction. Two cells lost their lead-in sentence: Applicability starts at "water
#     heating, cooking, ..." and is missing "This measure applies to all dwellings that have
#     natural gas space heating,"; Not Applicable starts at the first bullet and is missing
#     "This measure does not apply to dwelling units with one of the following
#     characteristics:", and its last word "upgrade." is dropped. The dropped text is nowhere
#     else in the document. A `tables:` entry is located by a Table N caption and this grid
#     has none, so the sidecar schema cannot carry the replacement; it is not recorded as
#     checked because it is not correct.
#   * The List of Acronyms (p.5) was extracted as one run-on paragraph, not a grid, so
#     there is no table to check; its eight entries are all present and in order.
#   * The Table of Contents grid and the List of Figures grid (which also swallowed the
#     List of Tables) are contents pages and have no entry. The first rows of the
#     References list (p.31) were extracted as a two-column grid with the entries'
#     opening words displaced; it is not a table of the report and has no entry.
#
# Figures: Figures 1-11 are described (vision-description), one bitmap each. The cover art
# and wordmark (image_000000, image_000001) are decorative and omitted by the build. No
# figure caption is without an image.
#
# Flattening notes: none; no table is hand-authored here. Row shading in the PDF is
# alternating bands and carries no meaning.

