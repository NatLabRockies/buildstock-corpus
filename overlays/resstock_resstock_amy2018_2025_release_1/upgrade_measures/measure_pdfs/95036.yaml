# Hand-authored overlay for measure_pdfs/95036.pdf
#
# 95036 is the ResStock measure documentation for the residential variable-speed geothermal
# heat pump (4.4 COP, 30.9 EER; measure 8). Every table and figure in the report was compared
# with the PDF on 2026-11-11, following "Checking every table and figure: the ResStock method"
# in overlays/README.md.
#
# Tables (page numbers are PDF pages, 1-based):
#   * Table 2 (p.15) is superseded: its header row lost four of seven cells. See its `why`.
#   * Tables 1 and 3 (p.15) and the Upgrade Summary table (p.10, under the "Measure Summary"
#     heading) are recorded under `checked:` as correct. Each grid sits under its own
#     caption; no grid is filed under a neighbouring caption.
#   * The List of Acronyms (p.5) was not extracted as a table at all: it reached the markdown
#     as run-together prose, so there is no grid to check or replace and it has no entry.
#   * The Table of Contents, List of Figures and List of Tables grids are contents pages,
#     not tables of the report, and have no entry.
#
# Figures: 37 bitmaps are described (40-70 words each, vision-description): Figures 1-6,
# 9-12, 15-18, 21-24, 25 (two bitmaps, top and bottom panel), 26-41 and A-1. The cover art
# and wordmark (image_000000, image_000001) are decorative and omitted by the build.
#
# Number grids captioned as figures (R4.2b): Figures 1, 2 (p.17), 7, 8 (pp.19-20), 13, 14
# (p.22), 19 (p.24), 20 (p.25) and A-1 to A-8 (pp.44-49) are rasterized, colour-scaled
# grids of numbers (EIR or capacity in W by air and water temperature; the appendix ones
# are manufacturer / curve-fit / difference grids), with no text layer. The converter kept
# the bitmaps of Figures 1, 2 and A-1 (described under `figures:`) and dropped the other
# thirteen. All sixteen are now transcribed as tables under their captions (`tables:`
# entries labelled "Figure N").
# How they were read: each figure's bitmap was taken from the PDF at its own resolution
# and read cell by cell with OCR (RapidOCR), every cell recognised twice. The readings
# were then checked without reference to the OCR: in the appendix figures,
# Manufacturer minus Curvefit equals Difference in every cell; in the others, every value
# lies on a second-order surface fitted to its grid, to within rounding of the last digit.
# Row and column labels were checked too (even steps; °F against °C). Cells the two
# recognitions disagreed on were settled by eye.
#
# Flattening notes: Table 2's spanning header "EER" is stated in a sentence above the
# table. The Median column is bold in the PDF in Tables 1 and 2 (the values the measure
# adopts, as the prose below Table 2 says); the emphasis is dropped. Row shading is
# alternating bands and carries no meaning.

