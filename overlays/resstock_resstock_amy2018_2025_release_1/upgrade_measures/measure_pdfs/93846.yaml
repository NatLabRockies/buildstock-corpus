  method: vision-description
  described_utc: '2026-11-11'
  alt: Line chart of heating energy consumption over five January days for three upgrade scenarios
  description: 'Figure 5: line chart titled ''Heating Energy Consumption''. X-axis is time over about
    five days in early January 2007; y-axis is energy. Three series, Upgrade 0, Upgrade 1 and Upgrade
    2, lie almost on top of each other, with short sharp drops and spikes once a day where the set point
    changes. The caption calls this a conditioned space temperature check; the plot''s own title is heating
    energy. Axis values are too small to read in the bitmap.'
- source_image: 93846_images/image_000007_10db1b29bf7776feccb0e8319ad0e975528394d7820b2a6d692c2bfcdc91a17f.png
