    1 to 7, 2007; y-axis is energy usage, 24 to 34. Three series, Upgrade 0, Upgrade 1 and Upgrade 2,
    are heating electricity in kWh. All rise from about 25 to about 33.5 over the week; Upgrade 1 runs
