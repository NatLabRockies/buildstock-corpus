  alt: Four bar charts of the distributions of cooling and heating set points, cooling setup and heating
    setback
  description: 'Figure 1: four bar charts of dwelling units. Top: cooling setpoint and heating setpoint
    distributions by temperature bin; the commonest cooling bins hold 19% to 20% of dwellings each, the
    commonest heating bins 21% and 23%. Bottom: cooling set up, where 66% of dwellings use 0°F, 20% use
    2°F, 9% use 5°F and 5% use 9°F; and heating set back, 58% at 0°F, 26% at 3°F, 12% at 6°F and 5% at
    12°F.'
- source_image: 93846_images/image_000003_06ad1ce32d34b0a4c47437dc4560d542e3896ac29aeb4ea0e7a85f2e95bb78c7.png
  source_image_sha256: f8ac83f6246bda5e037c96be860916a801d18cda779a48e5f3ff6d11d28a21f9
  method: vision-description
  described_utc: '2026-11-11'
  alt: 'Block diagram of the modeling approach: on-peak hour input, load flexibility measure, and results'
  description: 'Figure 2: block diagram in three columns headed On-peak Hour Input, Load Flexibility Measure
    and Results. The input is the on-peak hours in each state (summer, winter and intermediate peak start
    and end). The measure applies a relative set point offset during pre-peak and on-peak hours to the
    default set point schedule, with a random shift of -30 to 30 minutes, following a scenario design
    of pre-peak duration and offsets. Results are the baseline load profile and the profile after demand
    response.'
