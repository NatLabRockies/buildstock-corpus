    year. X-axis is state; y-axis is percent reduction, about 20 to 90. Six series are no pre-peak and
    pre-peak durations from 15 minutes to 4 hours. Reductions are about 65% to 88% in the leading state
    and about 23% to 27% in the last, with the lines crossing in a few low-reduction states.'
