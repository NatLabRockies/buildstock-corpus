# Hand-authored overlay for measure_pdfs/93846.pdf
#
# 93846 is the ResStock measure documentation for HVAC demand flexibility, the one report
# shared by measures 24 to 28 (on-peak load shedding and pre-peak load shifting at several
# durations and offsets). Every table and figure in the report was compared with the PDF on
# 2026-11-11, following "Checking every table and figure: the ResStock method" in
# overlays/README.md.
#
# Tables (page numbers are PDF pages, 1-based):
#   * Table 3 (pp.14-15) is superseded: it came out as one grid per page, with a garbled
#     two-row header. See its `why`.
#   * Table 8 (p.33) is superseded: the Upgrade and Pre-Peak Duration cells were run
#     together in four of five rows. See its `why`.
#   * The Measure Summary table (p.9, no caption) is superseded: it was right except for a
#     line-wrap space inside the project configuration URL.
#   * Tables 1, 2, 4, 5, 6 and 7 and the List of Acronyms (p.5) are recorded under `checked:`
#     as correct.
#   * The Table of Contents and List of Figures / List of Tables grids are contents pages and
#     have no entry. The References list was extracted partly as a one-column grid with
#     entries run together; it is not a table of the report and has no entry.
#   * The report's numbered page footnotes are present. No number grid is shown as a picture.
#
# Figures: Figures 1-19 are described (vision-description). Figures 8 and 9 are two bitmaps
# each (image_000009 and 000010; image_000011 and 000012): the 2°F and 4°F panels, then the
# 4°F peak with 6°F pre-peak panel. The cover art and wordmark (image_000000, image_000001)
# are decorative and omitted by the build. Values read off an axis, not a data label, are
# worded "about". The bitmaps of Figures 3, 4 and 5 are wide and short and their axis values
# cannot be read; those descriptions give the shape only. Figures 4 and 5 share one caption
# in the PDF, and Figure 5's plot is titled 'Heating Energy Consumption'.
#
# Flattening notes: in Tables 3 and 8 the two header rows are written together ('Summer:
# Peak Start', 'Pre-Peak: Duration'). Table 3 is split into bold-labelled parts to stay
# under the chunk limit, each repeating the header row; the labels are not in the PDF.

