  alt: Line chart of conditioned space temperature over five January days for three upgrade scenarios
  description: 'Figure 4: line chart titled ''Conditioned Space Temperature''. X-axis is time over about
    five days in early January 2007; y-axis is temperature in °F. Three series, Upgrade 0, Upgrade 1 and
    Upgrade 2, follow the same daily pattern as the set points in Figure 3: the space temperature rises
    above the baseline for a few hours each day under Upgrade 1 and then dips, and only dips under Upgrade
    2. Axis values are too small to read in the bitmap.'
- source_image: 93846_images/image_000006_237219a796170b95c283c7880a902ec35a40297ff8ae71239d18baa8505fdbb9.png
