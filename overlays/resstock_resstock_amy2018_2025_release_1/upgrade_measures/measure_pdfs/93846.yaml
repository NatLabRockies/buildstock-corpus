  alt: Line chart of heating set point over five January days for three upgrade scenarios
  description: 'Figure 3: line chart titled ''Temperature setpoint''. X-axis is time over about five days
    in early January 2007; y-axis is temperature in °F. Three series, Upgrade 0, Upgrade 1 and Upgrade
    2, are the heating set point. All follow the same daily schedule of a higher and a lower set point;
    once a day Upgrade 1 steps up above the others for a few hours and then drops below, and Upgrade 2
    only drops. Axis values are too small to read in the bitmap.'
- source_image: 93846_images/image_000005_07961a4f4885bb7ef48a54f29e7f3a97d1eafac235668c2a941a3f5648e1353b.png
