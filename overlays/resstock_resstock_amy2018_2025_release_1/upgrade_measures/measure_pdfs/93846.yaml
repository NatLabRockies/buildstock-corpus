  alt: Two line charts of percent cooling reduction by state on an extreme day, 2°F and 4°F offsets, six
    pre-peak durations
  description: 'Figure 8, first bitmap: two line charts, ''Offset: 2F'' above ''Offset: 4F''. X-axis is
    state, ordered from largest to smallest reduction; y-axis is percent reduction. Six series are no
    pre-peak and pre-peak durations of 15 minutes, 30 minutes, 1 hour, 2 hours and 4 hours. Longer pre-peak
    periods give larger reductions: about 35% to 45% in the leading state at 2°F and about 62% to 75%
    at 4°F, falling to about 10% and 30% in the last states.'
