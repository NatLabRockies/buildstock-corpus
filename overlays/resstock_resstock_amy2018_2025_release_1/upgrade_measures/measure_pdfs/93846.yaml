- label: Measure Summary
  uncaptioned: true
  source_pdf: measure_pdfs/93846.pdf
  source_pdf_sha256: 116beec10a3e99257e74721cdf9cfb152cf0c417cf09f615cd196892c45d7711
  page: 9
  method: extracted grid, with the cells named in `why` corrected from the PDF text layer
  transcribed_utc: '2026-11-11'
  replaces:
    table_sha256: 9b1ccc032a3fcf59cbe8e0f7ec8bea899e156a2f3cefd2eddd0204d633beb256
    why: The table is right cell for cell except the project configuration URL, which carries a space
      where the PDF wraps the line ('projec t_national'). A search for the real path, or a click on the
      link, misses it. The cell text is the extractor's own with that space removed; the joined URL is
      the one in the PDF text layer.
  markdown: '| Measure Title | HVAC Load Flexibility |

    |---|---|

    | Measure Definition | This upgrade lowers the heating set point and increases the cooling set point
    during predefined on-peak hours. It can also preheat or precool the dwelling units for 1 to 4 hours,
    depending on the measure settings. |

    | Applicability | This measure applies to all dwellings with either a heating system or a cooling
    system that is approximately 99.7% of the building stock. |

    | Not Applicable | This measure does not apply to the dwelling units that have neither a heating system
    nor a cooling system - approximately 0.3% of the building stock. |

    | Project Configuration File(s) | https://github.com/NatLabRockies/resstock/blob/sdr_2025_Release_1/project_national/sdr_upgrades_amy2018.yml
    |'
