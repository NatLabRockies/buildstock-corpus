  description: 'Figure 6: line chart titled ''Daily Total Heating Energy consumption''. X-axis is January
    1 to 6, 2007; y-axis is energy usage, 65 to 95. Three series, Upgrade 0, Upgrade 1 and Upgrade 2,
    are heating electricity in kWh and stay within about 2 of each other every day: all rise from about
