  markdown: '| Upgrade Measure | Housing Characteristics |

    |---|---|

    | Advanced Air Sealing | in.infiltration is 6 ACH50, 7 ACH50, 8 ACH50, 10 ACH50, 15 ACH50, 20 ACH50,
    25 ACH50, 30 ACH50, 40 ACH50, 50 ACH50 |

    | Attic Floor Insulation | in.insulation_ceiling is Uninsulated, R-7, R-13, R-19, R-30, R-38 if the
    dwelling unit is in climate zone 1. in.insulation_ceiling is Uninsulated, R-7, R-13, R-19, R-30, R-38,
    R-49 if the dwelling unit is in climate zones 2 through 8. |

    | Duct Sealing and Insulation | in.duct_leakage_and_insulation is 10% Leakage to Outside, R-4; 10%
    Leakage to Outside, R-6; 10% Leakage to Outside, R-8; 10% Leakage to Outside, Uninsulated; 20% Leakage
    to Outside, R-4; 20% Leakage to Outside, R-6; 20% Leakage to Outside, R-8; 20% Leakage to Outside,
    Uninsulated; 30% Leakage to Outside, R-4; 30% Leakage to Outside, R-6; 30% Leakage to Outside, R-8;
    30% Leakage to Outside, Uninsulated |'
