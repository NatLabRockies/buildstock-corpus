tables:
- label: Measure Summary
  uncaptioned: true
  source_pdf: measure_pdfs/96347.pdf
  source_pdf_sha256: 2ffcba94508cff195d23f09ac9ad8de1c693ce64057c8cbeb5131c639354a896
  page: 9
  method: extracted grid, with the cells named in `why` corrected from the PDF text layer
  transcribed_utc: '2026-11-11'
  replaces:
    table_sha256: 26982b18b71fdd3cdb80412bffed5df6a4c15e1322c9201c8dbd02fc84d86600
    why: 'The Not Applicable cell stops after its lead-in (''...none of the following housing characteristics:''):
      its five bullets and its closing sentence, ''These constraints exclude 2.1% of the dwelling units
      from receiving this measure upgrade.'', were dropped, and that sentence is nowhere else in the document.
      The five bullets are the same five the Applicability cell lists and are taken from that extracted
      cell; the closing sentence is from the text layer of page 9. The project configuration URL also
      carries a space where the PDF wraps the line (''project_nationa l'') and a space before its final
      full stop; both are removed.'
  markdown: '**Measure Summary, part 1 of 2**


    | Measure Title | Advanced Air Sealing, Attic Floor Insulation, and Duct Sealing |

    |---|---|

    | Measure Definition | This upgrade measure package applies advanced air sealing, attic floor insulation,
    and duct sealing and insulation for applicable dwelling units. A dwelling unit may receive none, some,
    or all three individual measures, depending on its housing characteristics. |

    | Applicability | This measure applies to all dwellings that have one of the following housing characteristics:
    • Equal or more than 6 ACH50 infiltration rate • Unfinished attic & less than R-49 attic floor insulation
    & in climate zone 1 • Unfinished attic & less than R-60 attic floor insulation & in climate zones
    2 through 8 • More than 6% duct leakage to outside • Less than R-6 duct insulation. With these applicability
    constraints, 97.9% of the existing dwelling units receive at least one of the measures. |


    **Measure Summary, part 2 of 2**


    | Measure Title | Advanced Air Sealing, Attic Floor Insulation, and Duct Sealing |

    |---|---|

    | Not Applicable | This measure does not apply to dwelling units that have none of the following housing
    characteristics: • Equal or more than 6 ACH50 infiltration rate • Unfinished attic & less than R-49
    attic floor insulation & in climate zone 1 • Unfinished attic & less than R-60 attic floor insulation
    & in climate zones 2 through 8 • More than 6% duct leakage to outside • Less than R-6 duct insulation.
    These constraints exclude 2.1% of the dwelling units from receiving this measure upgrade. |

    | Original Release | 2025 Release 1: 2025/resstock_amy2018_release_1 |

    | Project Configuration File(s) | https://github.com/NatLabRockies/resstock/blob/sdr_2025_Release_1/project_national/sdr_upgrades_amy2018.yml.
    |'
