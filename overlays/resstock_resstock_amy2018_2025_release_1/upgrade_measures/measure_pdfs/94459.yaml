    annual vehicle miles traveled (1,000 to 22,500) and by percent charged at home (0-19% to 100%). Unmet
    hours are near zero below about 13,000 miles. With Level 1 charging the measure is worse than the
    baseline: about 46 hours against 21 at 22,500 miles and about 4 against 1.5 for vehicles charged entirely
    at home.'
- source_image: 94459_images/image_000008_7cb57755deabd3e8df6c3982b5162471864d3feb2fd9b5a0b58ac4d806ae9fe7.png
