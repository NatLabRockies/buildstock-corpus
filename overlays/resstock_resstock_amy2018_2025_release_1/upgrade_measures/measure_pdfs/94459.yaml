  description: 'Figure 7: two stacked area charts of electricity usage in GW in Colorado by end use, with
    the baseline total as a dashed line and EV charging as the top layer. Left: January 15 to 17; right:
    July 15 to 17. EV charging adds to the evening peaks: the winter evening peak reaches about 1.65 GW
    and the summer peak about 1.2 GW, against baseline peaks of about 1.45 and 1.05 GW.'
