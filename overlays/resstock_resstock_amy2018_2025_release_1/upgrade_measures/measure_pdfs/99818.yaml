  described_utc: '2026-11-11'
  alt: Line chart of winter heating energy over one day for an example dwelling, baseline against upgrade
  description: 'Figure 1: line chart titled ''Winter Heating Energy: January 3-4, 2018''. X-axis is time
    over one day; y-axis is heating energy consumption in kWh, 0.5 to above 2.5. Series are Baseline and
    Upgrade. The upgrade runs at roughly half the baseline all day: about 1.2 kWh against 2.2 overnight,
    about 1.5 against 2.7 at the morning peak, and about 0.4 against 0.6 in the afternoon.'
- source_image: 99818_images/image_000003_399736cc038f78c854548212a1ee2fe59abe2fe4f674cb357e6bfac7f2e62da8.png
  source_image_sha256: ab37375ed7f1335db4ce4523a883d0b3769343f0ccd266632f233a653010684f
  method: vision-description
  described_utc: '2026-11-11'
  alt: Line chart of summer cooling energy over one day for an example dwelling, baseline against upgrade
  description: 'Figure 2: line chart titled ''Summer Cooling Energy: July 11-12, 2018''. X-axis is time
    over one day; y-axis is cooling energy consumption in kWh, 0 to above 0.3. Series are Baseline and
    Upgrade. The upgrade is below the baseline nearly all day; in the late afternoon the baseline peaks
    at about 0.32 kWh and the upgrade at about 0.17. Both drop to zero around midday.'
- source_image: 99818_images/image_000004_33e9629de1411eb0aa411ed5b81a43a6601ebece358f31b01763bb620121af3d.png
