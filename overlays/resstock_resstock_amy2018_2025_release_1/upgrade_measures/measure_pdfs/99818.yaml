  method: vision-description
  described_utc: '2026-11-11'
  alt: Grouped bar chart of annual site energy by end use for all applicable dwelling units, baseline
    against package
  description: 'Figure 3: horizontal grouped bar chart. Rows are end uses by fuel, from electric vehicle
    charging to generation, plus total site energy; x-axis is all-fuels end uses in kWh, 0 to above 3T.
    Series are Baseline and ''Light Air Sealing, Attic Insulation, and Duct Sealing''. Total site energy
    falls from about 3.25T to about 2.8T kWh; natural gas heating, the largest end use, falls from about
    1.1T to about 0.85T.'
- source_image: 99818_images/image_000005_5c67dc53470d03a040991a1d59d537a3218decc7dd191cf35338b4845e0ef72a.png
  source_image_sha256: 9a13ed7b0a5fd8aff7e6c6f650cf61fb7069c5fe6525e43e6ec6c907389ac96c
  method: vision-description
  described_utc: '2026-11-11'
  alt: Grouped bar chart of average annual site energy by end use per upgraded dwelling unit, baseline
    against package
  description: 'Figure 4: horizontal grouped bar chart with the same rows as Figure 3, per upgraded dwelling
    unit. X-axis is all-fuels end uses in kWh, 0 to 25k; series are Baseline and ''Light Air Sealing,
    Attic Insulation, and Duct Sealing''. Total site energy falls from about 25.5k to about 22k kWh, and
    natural gas heating from about 8.7k to about 6.7k.'
- source_image: 99818_images/image_000006_f4b1c423a98498dd7dfb915511b1ff1ddec902cc844117e16c6809db2bb194d2.png
  source_image_sha256: 6390a1fd87c6838fc9c030556b501caa0304055d0349ae9f0cbadd0fde7871e0
  method: vision-description
  described_utc: '2026-11-11'
  alt: Bar chart of percent site energy savings per upgraded dwelling unit by vintage
  description: 'Figure 5: horizontal bar chart. Rows are nine vintage bins from before 1940 to the 2010s;
    x-axis is site energy total consumption percentage savings, 0 to above 15. Savings are about 16% for
    homes built before 1960, about 14% to 14.5% for the 1960s to 1990s, and about 9.5% for the 2000s and
    2010s.'
- source_image: 99818_images/image_000007_e2baee4eaa779ed9d080b86a39b83a0091eb7542490304a061497591863c0640.png
  source_image_sha256: 0ee4524fc4ca6a39beafbb37649fa3e5e51a6e0ddf3c60936554c66bbef45da5
  method: vision-description
  described_utc: '2026-11-11'
  alt: Bar chart of percent site energy savings per upgraded dwelling unit by baseline infiltration rate
  description: 'Figure 6: horizontal bar chart. Rows are fifteen baseline infiltration rates from 1 to
    50 ACH50; x-axis is site energy total consumption percentage savings, 0 to above 15. Savings are about
    11% to 12.5% for 1 to 8 ACH50, where no air sealing is applied, and rise from about 13% at 10 ACH50
    to about 15% at 25 and about 17% at 50 ACH50.'
- source_image: 99818_images/image_000008_dcfb2121adb61ac9c9c6b49611f9ca0bb78bc21d7d8f84ed4f3fb34d6dbf017f.png
  source_image_sha256: fd41943c30f2da2f2469b289a28736d08b52d4711456a1be0ef8c6f3436c39c8
  method: vision-description
  described_utc: '2026-11-11'
  alt: Bar chart of percent site energy savings per upgraded dwelling unit by baseline attic insulation
    level
  description: 'Figure 7: horizontal bar chart. Rows are eight baseline attic insulation levels: R-7,
    R-13, R-19, R-30, R-38, R-49, Uninsulated and None; x-axis is site energy total consumption percentage
    savings, 0 to above 30. Uninsulated attics save most, about 36%, then R-7, about 22.5%, R-13, about
    19%, and R-19, about 17.5%; R-30 to R-49 save about 14% to 15% and None about 10%.'
- source_image: 99818_images/image_000009_ad41f0a02855532ba1b9fdec2e7c17b93a4e1dcb676ad809fc85d721cbaab3da.png
  source_image_sha256: 70b06993e0d5ce83df5595968f8fa28a3cb7e22add7896728aea214d611ce336
  method: vision-description
  described_utc: '2026-11-11'
  alt: Bar chart of percent site energy savings per upgraded dwelling unit by baseline duct leakage and
    insulation
  description: 'Figure 8: horizontal bar chart. Rows are fourteen baseline duct conditions: 0% leakage
    uninsulated, then 10%, 20% and 30% leakage to outside each with R-4, R-6, R-8 and uninsulated ducts,
    and None; x-axis is site energy total consumption percentage savings, 0 to above 20. Savings rise
    with leakage and are largest for uninsulated ducts: about 25% at 30% leakage, uninsulated, against
    about 6% to 7% for R-6 and R-8 at 10% leakage.'
- source_image: 99818_images/image_000010_2ec6ff900dc5ed99d7712da4713df36c8a8fecb7d38d289c335007fb77bcdfcd.png
  source_image_sha256: 1863fbd5c2375b1551a0ff8c193ffb839b6a5f29a8b6e26fb7ad8446bdc1a427
  method: vision-description
  described_utc: '2026-11-11'
  alt: Bar chart of stock-level energy bill savings by fuel
  description: 'Figure 9: horizontal bar chart. Rows are electricity, natural gas, fuel oil, propane and
    all fuels; x-axis is bills savings in US dollars, 0 to above 30B. The single series is ''Light Air
    Sealing, Attic Insulation, and Duct Sealing''. All-fuels savings are about $35B, of which electricity
    is about $19B, natural gas about $10.5B, fuel oil about $3B and propane about $2.5B.'
- source_image: 99818_images/image_000011_4e61da3669b0bfe92ffb114f9495ee1069571fff868bfdb02625477bc5ca7fa7.png
  source_image_sha256: be40c1ef181a691524b101b4adae559ffd5316fd0bae48263ee020e1a22faae2
  method: vision-description
  described_utc: '2026-11-11'
  alt: Bar chart of percent energy bill savings by fuel
  description: 'Figure 10: horizontal bar chart. Rows are electricity, natural gas, fuel oil, propane
    and all fuels; x-axis is bills percentage savings, 0 to above 15. Savings are largest for the heating
    fuels, about 19% for fuel oil, about 18% for propane and about 15.5% for natural gas, against about
    8% for electricity and about 10.5% for all fuels together.'
