# Hand-authored overlay for measure_pdfs/99818.pdf
#
# 99818 is the ResStock measure documentation for the light envelope package of light air
# sealing, attic floor insulation, and duct sealing and insulation (measure 30). Every table
# and figure in the report was compared with the PDF on 2026-11-11, following "Checking every
# table and figure: the ResStock method" in overlays/README.md.
#
# Tables (page numbers are PDF pages, 1-based):
#   * The Measure Summary table (no caption) was extracted as two grids. The second (p.10:
#     Original Release, Project Configuration File(s)) is superseded: it was right except for
#     a line-wrap space inside the commit hash of the project configuration URL. The first
#     (p.9) is recorded under `checked:` as correct.
#   * Tables 1, 2, 3 and 4 and the List of Acronyms (p.5) are recorded under `checked:` as
#     correct.
#   * The Table of Contents and List of Figures / List of Tables grids are contents pages and
#     have no entry.
#   * No table has a footnote, and no number grid is shown as a picture.
#
# Figures: Figures 1-10 are described (40-70 words each, vision-description), one bitmap per
# figure; every figure caption has its image. The cover art and wordmark (image_000000,
# image_000001) are decorative and omitted by the build. Values read off an axis, not a data
# label, are worded "about".
#
# Flattening notes: nested bulleted lists inside the Measure Summary's cells are run into the
# cell text, as extracted. Row shading in the PDF is alternating bands and carries no
# meaning.

