# Hand-authored overlay for measure_pdfs/95034.pdf
#
# 95034 is the ResStock measure documentation for the two-stage geothermal heat pump upgrade
# (measure 7; 4.0 COP, 20.5 EER). Every table and figure in the report was compared with
# the PDF on 2026-11-11, following "Checking every table and figure: the ResStock method" in
# overlays/README.md.
#
# Tables (page numbers are PDF pages, 1-based):
#   * Table 1 (p.15) is superseded: its grid was extracted under the Table 2 caption. The
#     values were right; the entry moves them under the Table 1 caption. See its `why`.
#   * Tables 2 and 3 (p.15) and the Measure Summary table (p.10) are recorded under
#     `checked:` as correct.
#   * The List of Acronyms (p.5) was extracted as one run-on line of prose, not as a grid,
#     so there is no table to check or replace. All seven acronyms and expansions are
#     present and right.
#   * The Table of Contents, List of Figures and List of Tables grids are contents pages,
#     not tables of the report, and have no entry.
#
# Figures: the report has 49 figure captions (Figures 1-41 and A-1 to A-8) and the
# extraction has 38 figure bitmaps, all described here (vision-description). Each bitmap
# was matched to its figure by the plot title or cell values on the PDF page, not only by
# the caption next to its ref. The cover art and wordmark (image_000000, image_000001)
# are decorative and omitted by the build.
#
# Captions with NO image (docling kept the caption and dropped the picture), 11 in all.
# Every one is a colour-scaled value grid pasted into the report as a picture, so its
# numbers are in neither the text layer nor the corpus:
#   * Figures 7 and 8 (p.19-20): full-load cooling EIR and capacity grids.
#   * Figures 13 and 14 (p.22): part-load heating EIR and capacity grids.
#   * Figures 19 and 20 (p.25): part-load cooling EIR and capacity grids.
#   * Figures A-1, A-2 (p.45-46), A-5, A-6 (p.49-50) and A-8 (p.52): curve fit against
#     manufacturer data.
# Figures 1, 2, A-3, A-4 and A-7 are grids of the same kind whose bitmaps survived; they
# are described as figures and their cell values are not transcribed.
#
# Flattening notes: Table 1's spanning header "COP" is carried on each column as
# "COP: Min" and so on. The Median column is bold in the PDF (it is the value the measure
# uses, as the text below Table 2 says); the emphasis is dropped. Row shading is
# alternating bands and carries no meaning.

