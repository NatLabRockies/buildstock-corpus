# Hand-authored overlay for measure_pdfs/99819.pdf
#
# 99819 is the ResStock measure documentation for the two-stage geothermal heat pump with light envelope improvements
# (measure 31). Every table and figure in the report was compared with the PDF on
# 2026-11-11, following "Checking every table and figure: the ResStock method" in
# overlays/README.md.
#
# Tables (page numbers are PDF pages, 1-based):
#   * The Measure Summary table (pp.9-10, no caption) was broken up in extraction: a first
#     grid with its first two rows, then the whole Applicable row as ordinary paragraphs and
#     bulleted lists, then a second grid with the last three rows. Nothing is missing and the
#     order is the page's, so the table is NOT rebuilt as one grid: the first grid is
#     recorded under `checked:` with a note, and the second is superseded only to join the
#     commit hash of the project configuration URL, which carried a line-wrap space.
#   * Table 1 (p.22) and the List of Acronyms (p.5) are recorded under `checked:` as correct.
#   * The Table of Contents and List of Figures / List of Tables grids are contents pages and
#     have no entry.
#   * No table has a footnote, and no number grid is shown as a picture.
#
# Text repair: the false heading "## Applicable" (the label of the summary table's third row)
# is demoted to a plain line.
#
# Figures: Figures 1-13 are described (vision-description), one bitmap per figure; every
# figure caption has its image. The cover art and wordmark (image_000000, image_000001) are
# decorative and omitted by the build. Values read off an axis, not a data label, are worded
# "about"; state percentages on the three maps are read from their printed labels.
#
# Flattening notes: nested bulleted lists inside the Measure Summary's Not Applicable cell
# are run into the cell text, as extracted.

product: resstock
