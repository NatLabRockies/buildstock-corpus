      matched the pages. The table''s own sub-header rows (Cooling Curve Values, Heating Curve Values
      and so on) are used as the header rows of five sub-tables.'
  markdown: '**HPXML defaults**


    | HPXML Default | Value | Unit | Notes |

    |---|---|---|---|

    | Net sensible heat ratio | 0.78 |  |  |

    | Crankcase heater power | 50 | W | Based on RESNET Publication No. 002-2017, heater warms lubricating
    oil pan |

    | Fan power | 0.375 | W/cfm | Based on electronically commutating motor—a more efficient type of blower
    that allows for variable speeds and not on/off binary operation like permanent split capacitor blowers
    |

    | Rated fan power | 0.18 | W/cfm | Based on ASHRAE 1449-RP |


    **Cooling curve values**


    | Cooling Curve Values | Value | Unit | Notes |

    |---|---|---|---|

    | Rated cfm per ton | [400, 400] | cfm/ton | Typical rated cfm per ton |

    | Cycling degradation coefficient | 0.25 |  | The degradation coefficient encapsulates inefficiencies
    involved with system cycling, heating the coils, and distributing fluid. This value is derived from
    conversations with experts and engineering judgment |

    | Gross sensible heat ratio | Calculated as a function of rated conditions, nominal cfm/ton, the coil
    Ao factor also known as the coil bypass factor, and the net sensible heat ratio. (the coil Ao factor
    is the effective coil surface area) |  | See the calculation for this here. |


    **Cooling capacity and COP coefficients as a function of flow fraction**


    | Cooling Capacity and COP Coefficients as a Function of Flow Fraction | Value | Unit | Notes |

    |---|---|---|---|

    | Cooling capacity as a function of flow fraction | [[1, 0, 0]]; [[1, 0, 0]] |  | No flow fraction
    coefficients are necessary because temperatures at min and max compressor speeds account for airflows
    |

    | Cooling energy input ratio as a function of flow fraction | [[1, 0, 0]]; [[1, 0, 0]] |  | No flow
    fraction coefficients are necessary because temperatures at min and max compressor speeds account
    for airflows |


    **Heating curve values**


    | Heating Curve Values | Value | Unit | Notes |

    |---|---|---|---|

    | Rated cfm per ton | [400, 400, 400] | cfm/ton |  |

    | Nominal to max ratio | 0.972 |  | This is the value for variable-speed compressors |


    **Heating capacity and COP coefficients as a function of flow fraction**


    | Heating Capacity and COP Coefficients as a Function of Flow Fraction | Coefficients |  | Notes |

    |---|---|---|---|

    | Heating capacity as a function of flow fraction | [[1, 0, 0]]; [[1, 0, 0]]; [[1, 0, 0]] |  | The
    functions of flow fraction are 1 because the blower is assumed to have constant flow |

    | Heating energy input ratio as a function of flow fraction | [[1, 0, 0]]; [[1, 0, 0]]; [[1, 0, 0]]
    |  | The functions of flow fraction are 1 because the blower is assumed to have constant flow |'
- label: Measure Summary
  uncaptioned: true
  source_pdf: measure_pdfs/96413.pdf
  source_pdf_sha256: 393e4cf9737a44e8b5df32353ffe20386d43565d27d84b004f3228e21241ec28
  page: 9
  method: extracted grid, with the cells named in `why` corrected from the PDF text layer
  transcribed_utc: '2026-11-11'
  replaces:
    table_sha256: 0a8586f01fe3de87ba9e092c9d3fd5ee34155560002a26bfb399ad74df8408fc
    why: The table is right cell for cell except the release URL, which carries a space where the PDF
      wraps the line ('github.com/ NatLabRockies'), so the link is broken. The cell text is the extractor's
      own with that space removed.
  markdown: '| Measure Title | Typical Cold Climate Air-Source Heat Pump |

    |---|---|

    | Measure Definition | This upgrade measure replaces any existing non-shared ducted heating and air
    conditioning system with a variable-speed ducted air-source heat pump (ASHP) with electric resistance
    backup. If the unit does not have air conditioning, the unit will receive air conditioning through
    the ASHP. The technology applied in this measure upgrade package is denoted in the ResStock options_lookup.tsv
    as the following: • Typical Cold Climate Heat Pump, HSPF2 8.5, SEER2 17.5. |

    | Applicability | This measure applies to all dwellings with: • Ducted non-shared (in-unit) HVAC with
    any of the following heating fuels: electricity, natural gas, fuel oil, or propane. With these applicability
    constraints, the measure upgrade applies to 74.3% of the existing dwelling units. |

    | Not Applicable | This measure does not apply to dwelling units with the following: • Shared HVAC
    • Non-ducted non-shared HVAC. These constraints exclude 25.7% of the dwelling units from receiving
    this measure upgrade |

    | Original Release | 2025 Release 1: 2025/resstock_amy2018_release_1; 2025/resstock_amy2012_release_1
    |

    | Project Configuration File(s) | See project_national/sdr_upgrades_tmy3.yml in https://github.com/NatLabRockies/resstock/releases/tag/2025_Release_1
    |'
