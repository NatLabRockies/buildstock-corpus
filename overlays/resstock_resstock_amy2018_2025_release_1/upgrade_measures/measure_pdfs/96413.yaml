# Hand-authored overlay for measure_pdfs/96413.pdf
#
# 96413 is the ResStock measure documentation for the typical cold climate air-source heat
# pump upgrade (measure 4). Every table and figure in the report was compared with the PDF
# on 2026-11-11, following "Checking every table and figure: the ResStock method" in
# overlays/README.md.
#
# Tables (page numbers are PDF pages, 1-based):
#   * Table 3 (p.17), Table 4 (pp.19-20) and Table 5 (pp.20-22) are superseded: see each
#     entry's `why`. Table 5 had lost its last row.
#   * The Measure Summary table (p.9, no caption) is superseded: it was right except
#     for a line-wrap space inside the release URL. It is the extractor's own grid with
#     that space removed.
#   * Tables 1, 2, 6 and 7 are recorded under `checked:` as correct.
#   * The List of Acronyms (p.5) was extracted as one run-on paragraph, not a grid, so
#     there is no table to fingerprint and it has no entry. All twelve acronyms and their
#     expansions are present in that paragraph.
#   * The Table of Contents, List of Figures and List of Tables grids are contents pages,
#     not tables of the report, and have no entry.
#
# Text repairs: two fragments the extractor left outside their tables are removed, since
# the transcriptions carry them: the paragraph "1.490" below Table 4 (the value that fell
# out of the first grid) and, under section 3.4, the paragraph "The functions of flow
# fraction are 1 because the blower is assumed to have constant flow" (the note of Table
# 5's dropped last row).
#
# Figures: Figures 1-16 are described (40-70 words each, vision-description); every figure
# caption has its image. The cover art and wordmark (image_000000, image_000001) are
# decorative and omitted by the build. Figure 5's plot is titled "Summer Day" in the PDF
# although its caption and the text call it a winter day.
#
# Flattening notes: Table 3's merged cells (HVAC Has Ducts "Yes" over five rows, the
# heating-fuel list over four, "Present" over three) are repeated on each row; the
# multifamily cell of the second row is a separate, empty cell on the page (by section 2.1
# that row is a multifamily case) and is left blank. Table 5's in-table sub-header rows
# become the header rows of its sub-tables; in the last one the page prints "Coefficients"
# across the Value and Unit columns, kept here as "Coefficients" plus an empty header cell.
# Hyperlinked text in Table 5 ("RESNET Publication No. 002-2017", "ASHRAE 1449-RP", "here")
# is kept as plain text. Row shading in the PDF is alternating bands and carries no meaning.

