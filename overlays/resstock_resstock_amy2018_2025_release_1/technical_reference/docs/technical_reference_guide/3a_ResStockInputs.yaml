# Hand-authored overlay for docs/technical_reference_guide/3a_ResStockInputs.tex
#
# Figure descriptions for the ResStock technical reference guide (plan step R4.5). The
# guide's tables come from LaTeX source and are not part of the measure-report sweep; its
# figures are pictures with a caption and no other text, so each gets an `alt` and a
# description written from the picture, on 2026-11-11.
#
# pandoc writes a LaTeX figure as a <figure> block, so the refs are HTML <img> tags. The
# overlay keeps the tag, sets the alt as its attribute, and places the description between
# the picture and its <figcaption>.
#
# The California and ENERGY STAR maps are PNGs the build rasterizes from PDFs in the
# source's images/ folder; each is pinned by the PNG the build wrote. Map descriptions
# say what the legend and labels say and where the regions lie; they do not list every
# state or county.

