  alt: Flow diagram of the five ResStock workflow steps, each with a box saying what happens in it
  description: 'Flow diagram: five chevrons left to right, Stock Characterization, Building Energy Model
    Articulation, Sampling, Batch Simulation, and Results and Publication, each joined by a line to a
    text box. As drawn, the boxes read: establish a conditional probability distribution describing housing
    technologies, structures and occupants in the United States; sample those distributions to create
    representative synthetic buildings; translate the sampled housing options into building energy model
    inputs via OpenStudio-HPXML; simulate all samples and upgrades with BuildStock Batch on high-performance
    or cloud computing; format the outputs, aggregate key results and publish all data on OEDI.'
