# Hand-authored overlay for docs/technical_reference_guide/2_ResStockStructureAndSampling.tex
#
# Figure descriptions for the ResStock technical reference guide (plan step R4.5). The
# guide's tables come from LaTeX source and are not part of the measure-report sweep; its
# figures are pictures with a caption and no other text, so each gets an `alt` and a
# description written from the picture, on 2026-11-11.
#
# pandoc writes a LaTeX figure as a <figure> block, so the refs are HTML <img> tags. The
# overlay keeps the tag, sets the alt as its attribute, and places the description between
# the picture and its <figcaption>.
#
# Figure 1.png, the flowchart and Figure 4.png are PNGs the build rasterizes from the
# PDFs in the source's images/ folder; each is pinned by the PNG the build wrote. The
# illustrative sample is a table shown as a picture: all 24 of its values are given in the
# description, which is therefore longer than the 40 to 70 word standard. In the workflow
# overview the text boxes under the second and third chevrons (Building Energy Model
# Articulation; Sampling) describe sampling and model articulation respectively, the
# reverse of the chevrons above them; the description gives the boxes in the order drawn.

