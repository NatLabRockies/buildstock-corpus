- source_image: images/Example EV Discharging Schedule.png
  source_image_sha256: 29ac3123235e3b66c947b0f1a3db9f02f073baaec3ef218d46bf5795789dee6e
  method: vision-description
  described_utc: '2026-11-11'
  alt: Annotated step chart of an occupant schedule and the EV battery discharge schedule built from it
  description: Annotated step chart for January 7, 2007, from 04:00 to about 21:00, with values from 0
    to 1. A blue line is the occupant schedule, 1 when the occupant is home, and an orange line the discharge
    schedule. Two away periods are marked, a long one from about 06:00 to 17:00 and a short one in the
    evening. Discharge occurs at the start and end of each away period, for a duration proportional to
    its length; a value below 1 means discharge does not last the full 15-minute timestep. A printed note
    says total discharge duration in a year equals total driving hours in a year.
