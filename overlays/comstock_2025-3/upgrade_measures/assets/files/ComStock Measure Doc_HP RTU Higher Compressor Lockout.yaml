#     something a pipe table can carry, so the emphasis is recorded in the note below the
#     tables rather than dropped.
#   * The Daikin Maverick's description cell is empty, which is not the same as the "N/A" the
#     source writes in six other cells. The blank is transcribed as a blank.
#   * The Lennox Enlight row writes its temperatures without degree signs ("min = -50F") where
#     every other row uses "°F". That is left as printed.
#   * The source uses en dashes for negative signs and ranges ("-45°F", "-20°F-50°F"); those
#     are normalized to the ASCII hyphen-minus that the rest of this corpus uses.
#   * The Carrier 50TCQ row puts both Fahrenheit values before both Celsius values where the
#     other three Carrier rows pair each unit with its conversion. Transcribed as printed.

