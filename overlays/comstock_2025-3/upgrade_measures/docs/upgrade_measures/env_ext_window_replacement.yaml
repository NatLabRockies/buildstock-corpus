# Hand-authored table transcriptions for env_ext_window_replacement.md
#
# The upstream page embeds these tables as pictures, so the extracted markdown keeps the
# caption and an image link while the numbers stay invisible to retrieval. Each entry below
# is a transcription of one such picture, injected at build time by overlay.py in place of
# the image ref. See overlays/README.md for the schema and the review procedure.
#
# Which of the 12 stock window types satisfy each energy code's allowable assembly maximums,
# for the climate zone 4 example. The same table appears in env_ext_secondary_window.md as its
# Table 4 ("Window Distribution Assumptions Example From Climate Zone 4A") under a different
# caption and from a different bitmap; the two were transcribed independently and agree.
#
# The source draws the code columns as a three-line header (code name, allowable assembly
# maximum U-value, allowable assembly maximum SHGC) above the window-type rows. GFM has one
# header row, so the two maximums are split off into their own sub-table, following the idiom
# the env_ext_secondary_window Table 4 entry already uses for this table. The picture carries
# no shading; the only other flattening is the window-type labels, which the source wraps onto
# two lines and which are transcribed as one.
#
# source_image_sha256 pins each transcription to the exact bitmap it was read from: if
# upstream redraws a table, the build reports a stale overlay instead of shipping numbers
# that no longer match the picture.

product: comstock
release: "2025-3"
source_id: upgrade_measures
source_path: docs/upgrade_measures/env_ext_window_replacement.md

tables:
  - label: "Table 2"
    caption: "Example of Available Window Assignment Options for Climate Zone 4 Based on the Energy Code Followed During the Last Window Replacement"
