# Hand-authored table transcriptions for env_window_film.md
#
# The upstream page embeds these tables as pictures, so the extracted markdown keeps the
# caption and an image link while the numbers stay invisible to retrieval. Each entry below
# is a transcription of one such picture, injected at build time by overlay.py in place of
# the image ref. See overlays/README.md for the schema and the review procedure.
#
# Baseline window, film product, retrofit performance, and climate-zone applicability for each
# window film pairing: the full 12-configuration x 6-film performance range (Table 2) and the
# subset that passes the applicability criteria (Table 3).
#
# Table 2 is a 20-column, 62-row grid with five header groups, too wide for GFM and far too
# long for one chunk, so it is decomposed. The baseline window configuration becomes its own
# 12-row table with a "Config" number the sub-tables key off; the six "Baseline Compared to
# AEDG ZE" booleans are constant within a configuration - the source simply repeats them on
# each of that configuration's six film rows - so they become a second 12-row table rather
# than 60 repeated rows; and the film rows become one table per configuration, named in the
# bold label. Configs 11 and 12 (Triple pane) have no film options and carry "n/a" in every
# retrofit column, which is transcribed as printed. The source writes the third climate zone
# band as "CZ7, 8" while writing "CZ 1, 2, 3" and "CZ 4, 5, 6" with spaces; the space is
# normalized here. Pane reads lowercase "single" in the source for configs 1-4 and is left
# as-is. The Low-E column is one tall merged cell per value ("No" for configs 1-6, "Yes" for
# 7-12) and is repeated on every row. The orange/grey/blue/cream heatmap fills only restate
# the percentages and TRUE/FALSE values already printed in the cells, so they are dropped.
#
# source_image_sha256 pins each transcription to the exact bitmap it was read from: if
# upstream redraws a table, the build reports a stale overlay instead of shipping numbers
# that no longer match the picture.

