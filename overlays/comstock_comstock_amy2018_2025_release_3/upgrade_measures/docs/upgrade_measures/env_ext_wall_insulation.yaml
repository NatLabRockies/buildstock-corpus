# Hand-authored table transcriptions for env_ext_wall_insulation.md
#
# The upstream page embeds these tables as pictures, so the extracted markdown keeps the
# caption and an image link while the numbers stay invisible to retrieval. Each entry below
# is a transcription of one such picture, injected at build time by overlay.py in place of
# the image ref. See overlays/README.md for the schema and the review procedure.
#
# Wall construction mapping and distribution, the baseline-vs-AEDG comparison (Table 3), plus the whole-wall assembly R-value grids for ASHRAE codes (Table 6), California DEER vintages (Table 7), and the stock average (Table 8).
#
# Table 3 is a spreadsheet screenshot of two stacked grids (frame walls, mass walls), each with
# two column groups over climate zones 1-8: the ComStock baseline R-value and the inches of XPS
# needed to reach the AEDG recommendation. It is transcribed as four sub-tables, one per grid
# and column group, since neither the stacking nor the column groups survive a GFM header. The
# corner cells ("Frame walls R-value" / "Climate Zone") name the sub-tables instead of a first
# column, whose header is "Energy Code" here to match Tables 6-8 in this file. Header tints mark
# the two grids and are dropped. Blanks are the source's own: a blank baseline R-value means the
# vintage does not occur in that climate zone, and the AEDG row has no XPS values by design.
#
# source_image_sha256 pins each transcription to the exact bitmap it was read from: if
# upstream redraws a table, the build reports a stale overlay instead of shipping numbers
# that no longer match the picture.

product: comstock
release: "comstock_amy2018_2025_release_3"
source_id: upgrade_measures
source_path: docs/upgrade_measures/env_ext_wall_insulation.md

