# Hand-authored table transcriptions for env_ext_secondary_window.md
#
# The upstream page embeds these tables as pictures, so the extracted markdown keeps the
# caption and an image link while the numbers stay invisible to retrieval. Each entry below
# is a transcription of one such picture, injected at build time by overlay.py in place of
# the image ref. See overlays/README.md for the schema and the review procedure.
#
# The window property data sources and which properties each one carries (Table 2), window
# distribution assumptions (Table 4), the 12 stock window configurations (Table 5), the
# proposed existing-plus-secondary window combinations by climate zone (Table 7), the
# secondary-window-plus-existing-window comparison to AEDG (Table 8), and the before/after
# U-value and SHGC comparison for the applied measure (Table 10).
#
# Flattening, per table. Table 2 draws the nine window-property columns as a presence matrix
# whose only content is a "P" glyph; the header hyphenates several labels across a line break
# ("Col-lection", "Ther-mal", "Coat-ing", "Vin-tage") and those are de-hyphenated here, and
# "Multi-family" is transcribed as "Multifamily", the spelling the rest of the corpus uses.
# Table 7 is a five-group, 20-column grid, too wide for GFM and too long for one chunk, so it
# is decomposed into the four sub-tables Table 8 already uses for the same window IDs; the
# source merges most rows across all three climate zone bands, which is written as "1-8" the
# way Table 8 writes it, and only IDs 7 and 8 differ by band. Green/red fill on Table 7's
# "Applicable?" column only restates the TRUE/FALSE already printed in the cell, so it is
# dropped. Table 10's alternating row shading is decoration and is likewise dropped.
#
# source_image_sha256 pins each transcription to the exact bitmap it was read from: if
# upstream redraws a table, the build reports a stale overlay instead of shipping numbers
# that no longer match the picture.

