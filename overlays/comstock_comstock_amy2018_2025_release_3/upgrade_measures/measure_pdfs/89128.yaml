  - label: "Table 5"
    caption: "Economizer Configuration Suggestions in ASHRAE 90.1-2010"
    source_pdf: measure_pdfs/89128.pdf
    source_pdf_sha256: "68cc557325046095d37ac589ab50a713377945180193b43154422f5a981046f8"
    page: 24
    method: vision-transcription
    transcribed_utc: "2026-08-17"
    markdown: |
      **TABLE 6.5.1.1.3A High-Limit Shutoff Control Options for Air Economizers**

      | Climate Zones | Allowed Control Types | Prohibited Control Types |
      |---|---|---|
      | 1b, 2b, 3b, 3c, 4b, 4c, 5b, 5c, 6b, 7, 8 | Fixed dry bulb; Differential dry bulb; Electronic enthalpy (a); Differential enthalpy; Dew-point and dry-bulb temperatures | Fixed enthalpy |
      | 1a, 2a, 3a, 4a | Fixed enthalpy; Electronic enthalpy; Differential enthalpy; Dew-point and dry-bulb temperatures | Fixed dry bulb; Differential dry bulb |
      | 5a, 6a | Fixed dry bulb; Differential dry bulb; Fixed enthalpy; Electronic enthalpy (a); Differential enthalpy; Dew-point and dry-bulb temperatures |  |

      (a) Electronic enthalpy controllers are devices that use a combination of humidity and dry-bulb temperature in their switching algorithm.

      **TABLE 6.5.1.1.3B High-Limit Shutoff Control Settings for Air Economizers**

      | Device Type | Climate | Required High Limit (Economizer Off When): Equation | Required High Limit (Economizer Off When): Description |
      |---|---|---|---|
      | Fixed dry bulb | 1b, 2b, 3b, 3c, 4b, 4c, 5b, 5c, 6b, 7, 8 | T_OA > 75°F | Outdoor air temperature exceeds 75°F |
      | Fixed dry bulb | 5a, 6a | T_OA > 70°F | Outdoor air temperature exceeds 70°F |
      | Differential dry bulb | 1b, 2b, 3b, 3c, 4b, 4c, 5a, 5b, 5c, 6a, 6b, 7, 8 | T_OA > T_RA | Outdoor air temperature exceeds return air temperature |
      | Fixed enthalpy | 2a, 3a, 4a, 5a, 6a | h_OA > 28 Btu/lb (a) | Outdoor air enthalpy exceeds 28 Btu/lb of dry air (a) |
      | Electronic enthalpy | All | (T_OA , RH_OA) > A | Outdoor air temperature/RH exceeds the "A" setpoint curve (b) |
      | Differential enthalpy | All | h_OA > h_RA | Outdoor air enthalpy exceeds return air enthalpy |
      | Dew-point and dry-bulb temperatures | All | DP_oa > 55°F or T_oa > 75°F | Outdoor air dry bulb exceeds 75°F or outside dew point exceeds 55°F (65 gr/lb) |

      (a) At altitudes substantially different than sea level, the Fixed Enthalpy limit shall be set to the enthalpy value at 75°F and 50% relative humidity. As an example, at approximately 6000 ft elevation the fixed enthalpy limit is approximately 30.7 Btu/lb.

      (b) Setpoint "A" corresponds to a curve on the psychrometric chart that goes through a point at approximately 75°F and 40% relative humidity and is nearly parallel to dry-bulb lines at low humidity levels and nearly parallel to enthalpy lines at high humidity levels.

# Hand-authored figure descriptions for measure_pdfs/89128.pdf (Batch E).
#
# 89128 documents the HP-RTU + ASHP Boiler + DCV + Heat/Energy Recovery + Economizers package.
# docling extracts every picture as a bare ![Image](...) ref: the caption line usually survives
# above it, but the chart itself is invisible to retrieval. Each entry below rewrites the ref
# with a hand-written alt and injects a description paragraph beneath it. Schema and depth
# budget: overlays/FIGURE_DESCRIPTIONS_ROLLOUT.md (section 2.1 -- 40-70 words, alt <=120 chars,
# no corroboration against body prose).
#
# Scope: all 18 non-decorative images (indices 000007-000024) -- Figures 1-17 plus the Table 6
# bitmap. The seven cover images (000000-000005 photos, 000006 logo) are deliberately not
# described.
#
# The `tables:` entries above are caption-anchored (Tables 1 and 5, by page and source PDF
# hash), so they consume no image index and nothing here overlaps them.
#
# QA notes (vision reads; confirm before treating as a release record):
#   * Table 6 survives ONLY as a caption-less bitmap (index 000013). Section 3.6 cites "Table 6"
#     in prose but no caption line is extracted, so the transcription below is the only place
#     its emissions factors exist as text. It prints propane as 182.3 kg/MWh -- the recurring
#     conversion error across these measure documents; 95005 prints the correct 275.7.
#   * Figure 4's caption reads "Upgrade applicability on building stock cooling energy", but the
#     chart's axis is % of total floor area and its series are economizer control types.
#   * Figure 13's in-chart title reads "Upgrade 32: Package 5 (unweighted)"; the document body
#     calls the scenario Package 5 throughout.
#   * Section 5.5 discusses only summer peak reductions. Figure 15 also shows large winter peak
#     INCREASES that the prose never mentions (Cold 2.01 to 2.72, Very Cold 2.79 to 4.16,
#     Subarctic 2.08 to 2.78 W/ft2).
#   * The extracted List of Figures is badly mangled -- Figure 14's entry is replaced by a
#     Table 7 line and several captions interleave. The body captions are intact, and those are
#     what these entries anchor to.

