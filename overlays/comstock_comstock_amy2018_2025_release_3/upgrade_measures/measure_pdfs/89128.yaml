# Hand-authored table transcriptions for measure_pdfs/89128.pdf
#
# Table 1 (p.15) and Table 5 (p.24) are rasterized regions with no text layer: docling keeps
# the captions and emits nothing beneath them. See overlays/README.md for the schema.
#
# This PDF's text layer also has broken kerning, so the extracted captions read
# "Table 1 . Boiler ..." and "Table 5 . Economizer C onfiguration S uggestions ...". Matching
# is by label, which overlay._find_caption normalizes, so the spacing artifacts do not matter;
# the `caption` fields below record the caption as the page prints it.
#
# Table 1 is the same boiler assignment table five of these reports reprint; see
# measure_pdfs/86199.yaml for its authoring notes.
#
# Authoring notes for Table 5:
#   * The figure is a screenshot of two ASHRAE 90.1-2010 tables, so it is transcribed as two
#     sub-tables under their own ASHRAE numbers, each followed by its footnotes as separate
#     paragraphs. Keeping the footnotes out of the table paragraph is what holds sub-table B
#     under the chunker's 1400-char paragraph limit.
#   * 6.5.1.1.3A lists allowed control types stacked vertically inside one cell; they are
#     joined with "; " because a pipe table has no way to hold a list.
#   * 6.5.1.1.3B's first visual row carries two climate/equation/description triples in one
#     undivided row. It is split into two rows repeating "Fixed dry bulb".
#   * Subscripts are rendered inline (T_OA, h_RA, DP_oa). The source prints the last row's
#     subscripts lowercase where every other row is uppercase; that inconsistency is left as
#     printed.
#   * Footnote markers are written "(a)"/"(b)" rather than superscripts, and the footnote text
#     is transcribed because none of it survived extraction as prose in this document.

