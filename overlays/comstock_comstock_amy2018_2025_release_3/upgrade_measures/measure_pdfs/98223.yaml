    Figure 1: ABB infographic on the importance of pumps, with three statistics on motor electricity use and three donut charts giving pump, fan and compressed-air shares of industrial motor system electricity
  description: |-
    Figure 1 of the ComStock Variable-Speed Pumps measure documentation, reproduced from ABB reference [2]. The graphic is fully legible. Three panels across the top read: 'Motors consume a lot of energy - Motors consumes about 1/3 of the world's electricity'; 'And it's going to increase - That number is expected to double by 2040'; and 'A lot - equivalent to adding an electricity market the size of China'. A red banner across the bottom asks 'Who are the biggest users?' and answers with three donut charts giving shares of total industrial motor system electricity consumption: PUMP SYSTEMS 40 percent, FAN SYSTEMS 20 percent, and COMPRESSED AIR SYSTEMS 22 percent. These three figures reproduce Section 1 of the report exactly, which states that U.S. industrial motor systems are primarily pump systems (40 percent), fan systems (20 percent) and compressed air systems (22 percent), that motors already account for roughly one-third of global electricity use, and that the demand could double by 2040. The figure is motivational context for the measure rather than a ComStock simulation result.
