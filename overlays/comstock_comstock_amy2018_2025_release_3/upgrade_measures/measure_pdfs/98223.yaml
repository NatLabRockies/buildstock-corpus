    Figure 7: eight-panel grid of annual average daily profiles comparing Baseline and Upgrade for the secondary chilled water and hot water loop pump power and flow, split between cooling season and heating season
  description: |-
    Figure 7 of the ComStock Variable-Speed Pumps measure documentation, the pump-replacement-only test on a medium office in Montgomery, Alabama (climate zone 3A) in which existing variable-speed pumps are replaced with higher-performing variable-speed models. The grid is four rows by two columns; the left column is the cooling season and the right the heating season, and each panel plots a 24-hour annual average daily profile with Baseline as an orange dotted line and Upgrade as a solid blue line. Rows are secondary chilled water loop pump power in W, secondary chilled water loop flow in kg/s, hot water loop pump power in W, and hot water loop flow in kg/s. In the cooling season the secondary chilled water pump power peaks near 1,510 W for the baseline against about 690 W for the upgrade, a reduction of roughly half, while the two flow traces lie on top of one another, peaking near 12.9 kg/s. Hot water power and flow are essentially zero in the cooling season apart from a brief early-morning blip. In the heating season the hot water pump power spikes near 820 W for the baseline against about 250 W for the upgrade with coincident flow traces. Flow being unchanged while power falls is the point Section 5.1 makes: the baseline pumps could already modulate, so the gain comes from the improved part-load curves in Figure 6.
