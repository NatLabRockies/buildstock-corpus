# Hand-authored figure descriptions for measure PDF 98223
# "Variable Speed Pumps" / "ComStock Measure Documentation: Variable-Speed Pumps"
# (ComStock 2025 release 3 upgrade measure, NLR/TP-5500-98223, Janghyun Kim and
# Chris CaraDonna, February 2026).
#
# 22 image refs in the extracted markdown. image_000000 (the cover photo grid) and image_000001
# (the laboratory wordmark) are decorative and deliberately have no entry. The 20 entries below
# cover Figures 1-16 and Figures A-1 to A-4. Tables ES-2/ES-3 and 1-5 all extracted as real
# markdown, so the only vision-transcription entry is Figure 4, a five-column text comparison
# graphic with no markdown equivalent.
#
# Note: this document uses the anonymized "National Laboratory of the Rockies" / NLR naming
# rather than NREL, including in its report number.
#
# QA FLAGS - vision-derived numbers need a human pass before publication.
#
# * HIGH confidence, every asserted number is a printed data label or printed equation read at
#   3-9x zoom and cross-checks against the prose: Figure 1 (000002, the three motor-system
#   percentages reproduce Section 1 exactly), Figure 3 (000004, 23 of 24 bars labeled and the
#   applicable bars sum to about 31% as Section 3.1 states), Figure 5 (000006, the inset
#   piecewise equation and R2 = 0.63 are printed; the two branches are continuous at x = 5, both
#   giving 94.909), Figure 6 (000007, the inset DHO equation is printed and integrating it gives
#   0.2588 against 0.25 for the affinity law, confirming Section 3.2.2's ordering), Figure 11
#   (000012, all 12 bars labeled), and Figure 12 (000013, band labels legible except as noted).
#
# * Figure 12's Heating Natural Gas band labels are white text on a red hatched fill and are NOT
#   directly legible. The asserted 944.4 -> 947.5 in panel (a) was settled by Table 4's -3.1 TBtu
#   natural gas heating penalty (944.4 + 3.1 = 947.5). Panel (b)'s Heating Natural Gas and
#   Cooling District Cooling labels are illegible by the same mechanism and are not asserted.
#
# * Figures 13-16 (000014-000017) - the n counts are legible at 3x and are asserted verbatim.
#   Interquartile ranges were measured programmatically from the blue box fill. Only ranges
#   spanning more than about 5 px are asserted: Figure 13's Electricity Pumps (33 to 94%) and
#   Electricity Heat Rejection (10 to 15%), Figure 14's Electricity Pumps (0.05 to 0.27
#   kBtu/ft2), and all 15 of Figure 16's climate zones. Medians are NOT separable from the box
#   edges at this resolution and no median is asserted anywhere. Figure 15's per-row IQRs are at
#   about 7.8 px per unit and are described only qualitatively.
#
# * Figures 7-10 (000008-000011) carry no data labels. Panel geometry was recovered from the
#   light-grey subplot backgrounds and each row was calibrated against its own y-axis tick-label
#   text rows, then series were traced by colour. Quoted magnitudes are therefore measured, not
#   eyeballed, but carry roughly one pixel of error (about 15-25 W on the power rows). Where the
#   Baseline and Upgrade traces coincide within one pixel - primary chilled water power in
#   Figure 8, chiller power and boiler gas usage in Figure 9 - no delta is asserted; the prose
#   independently confirms those differences are sub-percent.
#
# * Figures A-1 to A-4 (000018-000021) carry no data labels; bar heights were measured against
#   tick-label calibration (2.51 TBtu/px for A-1, 4.85 for A-3, 3.17 for A-2/A-4). The
#   baseline-to-upgrade deltas are at or below one pixel on most bars, so only the totals and the
#   direction of change are asserted, with Table 4's -3.1 TBtu gas and +14.4 TBtu electricity
#   quoted for the actual magnitudes. The two independent electricity disaggregations both total
#   about 3,310 TBtu, which is a useful cross-check on the calibration.
#
# DEFECTS FOUND IN THE SOURCE DOCUMENT - reported, not silently corrected:
#
# * Figure A-2 and Figure A-4 are the same graphic. Both show electricity total energy
#   consumption by ComStock building type (the y axis says so), but A-2 is captioned "Site annual
#   natural gas consumption ... by building type". The document therefore has no
#   natural-gas-by-building-type figure. Confirmed by pixel diff: the two PNGs differ only by
#   re-encoding noise (max channel delta 69, 91% of pixels identical).
# * Figure 16's caption says "Percentage site energy savings distribution ... by climate zone",
#   but its x-axis label is "Site EUI Savings by Climate Zone (kBtu/ft2)" - absolute intensity,
#   not percentage.
# * Figure 15 has no x-axis title at all, only bare tick labels from -4 to 16, so its units
#   cannot be determined from the graphic. Its caption claims percentage site energy savings.
# * Section 3.1 says "note the logarithmic scale on the x-axis" for Figure 3, but that axis is
#   plainly linear (0, 5, 10 ... 35 evenly spaced).
# * Figure 3's "PTAC with gas boiler" bar is the only one of 24 with no data label. It measures
#   about 1.3%, which is also exactly the amount needed for the applicable bars to reach the
#   stated approximately 31%.
# * Figure 4's bitmap is clipped at the bottom edge: the ECM column's last bullet ends mid-word
#   and the SynRM-squared Limitations list is cut off after its first item.
# * Section 5.2 references "Figure 9" four times where three different figures are meant - the
#   delta-T-driven flow increase is Figure 10, the cooling tower heat rejection reduction is
#   Figure 8, and the 5.5 / 12.5 / approximately 7 TBtu sensitivity numbers are Figure 11.
# * Section 5.2 says pump replacement "led to a 35% reduction in pump electricity use", but
#   Figure 11's own labels give 40.4 -> 24.7 TBtu = 38.9%. (Table 4's full-stock run gives 37.6%,
#   a legitimately different number from a different sample.)
# * Section 5.2's "approximately 7 TBtu" pump-energy increase from the reset is 6.3 TBtu by
#   Figure 11's labels (31.0 - 24.7).
# * Section 5.4 references "Table 3" three times for the utility bill comparison; the utility
#   bill table is Table 5. Table 3 is the single-building annual energy comparison.
# * Section 5.4 states 1.3% electricity savings and "$0.4 million per year" for applicable
#   buildings and 0.9% / "$0.37 million" in total. Table 5 gives 1.4%, $0.41 billion, 0.96% and
#   $0.37 billion - a 1000x unit error plus two rounding mismatches.
# * The Section 5.5 bullet list says "Figure 15 illustrates energy use intensity savings"; energy
#   use intensity savings are Figure 14.
# * Table ES-2's caption is followed by no table. The TBtu table appears under the Table ES-3
#   heading and the USD table appears after it, so the two captions and tables are misaligned by
#   one in the extracted markdown. The Fuel oil absolute saving in that table is garbled as
#   "-0.21 1", and the List of Tables block is missing Table ES-1 and truncates Table 4.
# * Soft flag: Figure 6's caption is "Regression fitting on manufacturer data: pump part-load
#   efficiency", but the figure shows analytically defined control curves plus a curve derived
#   from published savings percentages, not a regression on manufacturer data.
# * Soft flag: Figure 5's lowest plotted point is about 88.5%, marginally below the "89% to 96%"
#   catalog range stated in Section 3.2.1.
# * Soft flag: Section 5.1 says the upgraded condenser pump is "sized for approximately 40%
#   higher flow than the chilled water pumps" with design power "approximately 7,000 W". Figure
#   8's cooling-season condenser flow is about 30 kg/s for the upgrade against about 26 kg/s
#   primary chilled water (14%), and its power is about 4,820 W. Design and average-day
#   quantities differ, so this is not necessarily an error, but a reader may conflate them.
# * Soft flag: Section 5.1 says "the corresponding rise in pump power is typically modest", but
#   Figure 10's heating-season secondary chilled water pump power for the reset case is 5 to 13
#   times the baseline (about 1,040-1,690 W against about 90-230 W).
# * Soft flag: Section 5.5 concludes hotter climates see greater savings. That holds for zones
#   1A through 7 in Figure 16, but zone 8 - the coldest - shows the widest interquartile range of
#   any zone, on only 42 models.
