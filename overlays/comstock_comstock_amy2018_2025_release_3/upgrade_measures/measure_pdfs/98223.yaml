    Figure 12: two stacked bar panels comparing annual site energy consumption by end use and fuel between the ComStock baseline and the pump replacement scenario, for the entire stock and for applicable models only
  description: |-
    Figure 12 of the ComStock Variable-Speed Pumps measure documentation. Two panels titled '(a) Entire building stock' and '(b) Applicable models only' each plot two stacked bars - Baseline and Pump replacement - against 'Annual Energy Consumption (TBtu)'. A 21-entry legend runs from Heat Rejection Electricity at the top through Pumps Electricity, the Water Systems and Heating fuels, Interior Lighting Electricity, Cooling District Cooling and Cooling Electricity, Fans Electricity, and Interior Equipment Natural Gas and Electricity at the bottom. Panel (a) totals about 4,989 TBtu for the baseline against about 4,978 for the upgrade, a reduction of about 11 TBtu or 0.22 percent, matching the 0.2 percent and 11 TBtu quoted in Section 5.3. Panel (b) totals about 1,687 against 1,676, the same 11 TBtu on a smaller base and so about 0.65 percent. Individual band labels in panel (a) include Interior Equipment Electricity 782.8 unchanged, Interior Equipment Natural Gas 314.0 unchanged, Fans 673.6 to 673.8, Cooling Electricity 755.4 to 756.5, Interior Lighting 459.4 unchanged, Heating Electricity 244.6 to 244.7, and Heating Natural Gas 944.4 to 947.5 - the last an increase of 3.1 TBtu, the heating gas penalty Table 4 reports. Pump and heat rejection electricity are too thin to label at this scale.
