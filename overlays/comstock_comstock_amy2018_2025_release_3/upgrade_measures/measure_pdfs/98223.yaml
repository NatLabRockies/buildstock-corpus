    Figure 8: eight-panel grid of annual average daily profiles comparing Baseline and Upgrade for the primary chilled water and condenser water loop pump power and flow, split between cooling season and heating season
  description: |-
    Figure 8 of the ComStock Variable-Speed Pumps measure documentation, the companion to Figure 7 for the same medium office model but focused on the loops whose baseline pumps are constant speed. The layout is again four rows by two columns with cooling season left and heating season right, Baseline as an orange dotted line and Upgrade as solid blue. Rows are primary chilled water loop pump power in W, primary chilled water loop flow in kg/s, condenser water loop pump power in W, and condenser water loop flow in kg/s. In the cooling season all four traces are flat across the 24 hours because the constant-flow primary pump runs at design flow whenever the chiller runs. Primary chilled water power is about 1,700 W in both scenarios - the roughly 3 percent motor efficiency gain is, as Section 5.1 says, not noticeable in the plot - and primary flow is about 26 kg/s in both. The condenser water loop is where the savings appear: power drops from roughly 7,550 W to roughly 4,820 W and flow from roughly 35 to 30 kg/s. In the heating season the same panels show bell-shaped profiles rather than flat lines, because the chiller only runs for part of the day and the annual average smooths its on-off operation; condenser water power falls from a midafternoon peak near 5,530 W to near 3,510 W.
