    Figure 10: eight-panel grid of annual average daily profiles for the secondary chilled water and hot water loop pump power and flow under the pump replacement plus chilled water and hot water reset scenario
  description: |-
    Figure 10 of the ComStock Variable-Speed Pumps measure documentation. The panels match Figure 7 exactly - four rows by two columns, cooling season left and heating season right, secondary chilled water pump power and flow then hot water pump power and flow, Baseline orange dotted and Upgrade solid blue - but the upgrade now also includes outdoor-air-based chilled and hot water supply temperature reset. The reset changes the shape of the savings rather than only their size. In the cooling season the secondary chilled water pump peak is about the same as in Figure 7, near 1,500 W baseline against 690 W upgrade, but the upgrade's off-peak power is much higher (roughly 360 to 460 W against roughly 180 to 250 W in Figure 7) because the relaxed supply temperature narrows the loop delta-T and drives more flow. In the heating season the effect reverses the sign of the savings on that loop: the upgrade's secondary chilled water pump power runs roughly 1,040 to 1,690 W against a baseline of roughly 90 to 230 W, with flow rising from about 1 kg/s to 8-12 kg/s. The hot water loop meanwhile saves in the heating season, dropping from a baseline peak near 820 W to near 350 W - the split Section 5.1 describes as hot water loop savings during heating and secondary chilled water loop savings during cooling with increased power during heating.
