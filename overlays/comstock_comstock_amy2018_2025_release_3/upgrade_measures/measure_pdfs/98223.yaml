    Figure 4: five-column comparison graphic of motor technologies - Induction, SynRM, ECM, Interior PM and SynRM squared - each with a Benefits and a Limitations list
  description: |-
    Figure 4 of the ComStock Variable-Speed Pumps measure documentation, reproduced from ABB reference [2]. The graphic is a five-column text comparison of motor technologies with no equivalent markdown table in the extracted document, so its content is transcribed here. Columns, with their IEC efficiency class: Induction Motor (IE3) - benefits are low cost, robust and line start capable; limitations are rotor losses and lower efficiency at part load. SynRM Motor (IE4) - benefits are no rotor losses, cool running and no magnets; limitations are that it requires a VFD and has a lower power factor. ECM (IE4 to IE5) - benefits are high efficiency in small sizes and integrated electronics; limitations include that the entire unit must be replaced together with the fan, which restricts OEM fan designs. Interior PM (IE5) - benefits are the highest power density and efficiency; limitations are magnet cost and demagnetization risk. SynRM squared (IE5) - benefits are ferrite-assisted rotor efficiency without rare-earth magnets; limitations begin with 'Requires VFD'. Section 3.2.1 uses this figure to justify modeling pumps whose motors meet or exceed the IEC IE5 class, which it describes as an emerging ultra-premium category above NEMA Premium.
