    Figure 11: labeled grouped bar chart of the reduced-stock sensitivity analysis, comparing baseline, pump replacements only, and pump replacements plus chilled and hot water reset across four end-use energy categories
  description: |-
    Figure 11 of the ComStock Variable-Speed Pumps measure documentation, the sensitivity analysis run on a reduced stock of roughly 10,000 models rather than the full ComStock sample. Four groups of three horizontal bars are plotted against 'Value', with every bar carrying a printed data label, and the three scenarios in each group are Baseline, Pump replacements only, and Pump replacements plus chilled/hot water reset. Stock electricity for pumps is 40.4, 24.7 and 31.0 TBtu; stock electricity for cooling is 264.6, 265.7 and 260.2 TBtu; stock electricity for heat rejection is 6.2, 5.4 and 5.5 TBtu; and stock natural gas for heating is 542.6, 546.3 and 533.8 TBtu. The labels give a pump-replacement-only pump electricity reduction of 15.7 TBtu or 38.9 percent, and adding the reset costs back 6.3 TBtu of pump electricity while saving 5.5 TBtu of cooling electricity and 12.5 TBtu of heating gas relative to pump replacement alone - the last two matching the figures quoted in Section 5.2. Section 5.2 describes the pump reduction as 35 percent and the reset's pump penalty as approximately 7 TBtu. Because this is the reduced-stock run, its numbers are not directly comparable with the full-stock results in Table 4 and Figure 12.
