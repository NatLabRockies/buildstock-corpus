    Figure 9: ten-panel grid of annual average daily profiles for chiller outlet temperature, chiller power, chiller COP, boiler outlet temperature and boiler gas usage, comparing Baseline and Upgrade under chilled water and hot water supply temperature reset
  description: |-
    Figure 9 of the ComStock Variable-Speed Pumps measure documentation, the pump-replacement-plus-reset test on the same medium office model, showing the effect of resetting chilled and hot water supply temperature on outdoor air temperature. The grid is five rows by two columns with cooling season left and heating season right, Baseline as an orange dotted line and Upgrade as solid blue. Rows are chiller outlet temperature in degrees C, chiller power in W, chiller COP, boiler outlet temperature in degrees C, and boiler gas usage in W. The reset is clearly visible in the temperature rows: in the cooling season the baseline chiller outlet is flat at about 6.7 C while the upgrade starts near 8.2 C overnight and converges on the baseline by midmorning, and in the heating season the upgrade runs roughly 2 C warmer throughout. The boiler outlet rows move the other way, with the upgrade running roughly 12 to 13 C cooler than the baseline in the heating season. Chiller power, chiller COP in the cooling season and boiler gas usage are close enough between the two scenarios that the traces overlap at this resolution, consistent with the sub-1-percent single-building differences reported in Table 3; the heating-season chiller COP is visibly higher for the upgrade. No panel carries a data label.
