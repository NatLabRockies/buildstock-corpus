  alt: |-
    Figure 6: pump part-load power curves - Constant Flow, Riding Curve, VSD No Reset, VSD DP Reset and the new VSD DHO curve - plotted against part-load ratio with the affinity law shown dashed for reference
  description: |-
    Figure 6 of the ComStock Variable-Speed Pumps measure documentation. The y axis is 'Fraction of Full Load Power [-]' from 0 to 1 and the x axis is 'Part-load Ratio [-]' from 0 to 1. Five OpenStudio Standards style control curves are drawn - Constant Flow (flat near 1 across the whole range), Riding Curve (the highest of the modulating curves, slightly exceeding 1.0 at full load), VSD No Reset, VSD DP Reset, and the new VSD DHO curve in solid black - together with the affinity law y = x cubed as a dashed orange reference. An inset box prints the derived curve: 'VSD DHO: y = 0.10550*x^2 + 0.89450*x^3'. Integrating that expression over 0 to 1 gives 0.2588 against 0.25 for the affinity law, so the DHO curve sits about 3.5 percent above the ideal lossless curve while lying below VSD DP Reset - which is exactly the ordering Section 3.2.2 asserts when it says the resulting curve 'performs slightly below the affinity law but better than conventional reset strategy'. Section 3.2.2 derives the curve by reducing the area under the VSD DP Reset curve by 11 percent, the smaller of the two savings figures reported by Zhao et al. (11 percent) and Zhufang et al. (13 percent). No curve carries a data label.
