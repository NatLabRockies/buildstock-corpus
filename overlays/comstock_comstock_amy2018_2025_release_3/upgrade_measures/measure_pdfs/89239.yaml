    Figure A-4: grouped vertical bar chart of site annual electricity consumption in TBtu by census division, paired Baseline and Hydronic GHP bars, y-axis 0 to about 700. South Atlantic is the largest at roughly 700 TBtu, and each division's two bars are visually indistinguishable, consistent with the slight net change in stock electricity described in Section 5.3.
