    Figure A-1: grouped vertical bar chart of site annual natural gas consumption in TBtu by census division, with paired Baseline and Hydronic GHP bars on a y-axis reaching about 350. East North Central is the largest and shows the biggest absolute reduction, roughly 350 down to 270 TBtu; every division declines, with Middle Atlantic and Pacific next largest.
