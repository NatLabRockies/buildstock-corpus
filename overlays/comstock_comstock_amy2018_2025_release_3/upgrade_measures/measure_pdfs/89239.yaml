    Figure A-2: grouped vertical bar chart of site annual natural gas consumption in TBtu by ComStock building type, paired Baseline and Hydronic GHP bars, y-axis to about 190. Retail stripmall and warehouse are the largest and barely change, while primary and secondary schools show the deepest reductions - secondary school roughly halves - reflecting where hydronic systems are applicable.
