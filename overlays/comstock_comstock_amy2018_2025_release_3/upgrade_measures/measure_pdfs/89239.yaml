  alt: Bar chart of ComStock weighted floor-area fraction by hydronic HVAC system type
  description: |-
    Figure 1: vertical bar chart of the fraction of ComStock weighted floor area (y-axis 0 to 0.035) for each building-level hydronic HVAC system type, sorted descending. PVAV with gas boiler reheat leads at roughly 0.036, followed by PSZ-AC with gas boiler and VAV air-cooled chiller with gas boiler reheat; the DOAS and baseboard variants fall below 0.01. System-type definitions are in Table 1.
- source_image: 89239_images/image_000008_668c1f9b7b0a6740382a7a08dbd04cd5d0a1d8561bc78ed89856055859622525.png
