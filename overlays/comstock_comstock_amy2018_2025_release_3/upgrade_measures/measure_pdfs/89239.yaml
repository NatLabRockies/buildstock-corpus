# Hand-authored figure descriptions for measure_pdfs/89239.pdf
#
# 89239 is the Central Hydronic Water-to-Water Geothermal Heat Pump measure documentation
# (NREL/TP-5500-89239). docling extracts each figure as a bare ![Image](...) ref: the caption
# line survives above it, but the chart itself is invisible to retrieval and unreadable
# without the bitmap. Each entry below is image-anchored (see the figures: schema in
# overlays/FIGURE_DESCRIPTIONS_ROLLOUT.md): the ref is rewritten with a hand-written alt, and
# a description paragraph is injected below it for retrieval.
#
# Scope: figures only - Figures 1-19, A-1 through A-4, and C-1 (24 entries). The seven cover
# and title-page images (indices 000000-000006: NREL branding and stock photography) are
# deliberately not described.
#
# Depth: authored to the FIGURE_DESCRIPTIONS_ROLLOUT.md section 2.1 budget (40-70 words,
# alt <= 120 chars, no corroboration against body prose). This is the first document authored
# at the lowered standard.
#
# QA notes (vision reads; confirm before treating as a release record):
#   * Figures 5 and 6 are OpenStudio plant-loop screenshots whose component labels are
#     illegible at extraction resolution - described structurally only.
#   * Figure 15's caption says "percent site energy savings" but its x-axis reads "Site EUI
#     Savings by Climate Zone (kBtu/ft2)". Flagged in the description.
#   * Figures 17 and 18 are captioned "percent site energy savings" but their y-axis is a
#     fraction (-0.4 to 0.8 and -1.0 to 0.85). Flagged in the descriptions.
#   * Bar totals and printed data labels in Figures 10, 11, and 12 were read off the charts;
#     per-band values live in the document's tables.

