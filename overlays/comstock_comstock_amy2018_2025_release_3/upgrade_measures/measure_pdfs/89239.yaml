  description: |-
    Figure 11: two stacked bars of annual site energy consumption in TBtu for applicable buildings only, Baseline (675) versus Hydronic GHP (442), segmented by end use and fuel with values printed on each band. The dominant change is the loss of the natural gas heating band, about 316 TBtu in the baseline; interior equipment electricity is unchanged at 107.9. Section 5.2 reports 51% aggregate HVAC savings.
