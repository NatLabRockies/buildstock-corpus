    Figure A-3: grouped vertical bar chart of site annual electricity consumption in TBtu by ComStock building type, paired Baseline and Hydronic GHP bars, y-axis 0 to 400. Bar pairs are nearly identical across building types, with retail stripmall largest at about 395 TBtu and only small increases visible for secondary school and large office. Stock electricity is close to flat.
