  description: |-
    Figure 10: two stacked bars of annual site energy consumption in TBtu across the full ComStock stock, Baseline (total 4,338) versus Hydronic GHP (4,106), segmented by end use and fuel with values printed on each band. Natural gas heating falls from 667.3 to 615.6 TBtu while interior lighting and interior equipment are unchanged. Section 5.2 discusses stock energy impacts.
