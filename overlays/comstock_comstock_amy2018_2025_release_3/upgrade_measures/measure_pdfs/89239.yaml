    Figure 12: three side-by-side panels of annual GHG emissions in MMT CO2e, each comparing Baseline with Hydronic GHP under a different electricity carbon-intensity scenario - eGRID 2021, LRMER High RE Cost 15, and LRMER Low RE Cost 15. Bars stack electricity, natural gas, fuel oil, and propane. Totals fall 402 to 386 (-4%), 325 to 309 (-5%), and 240 to 225 (-6%).
