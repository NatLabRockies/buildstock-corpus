  alt: Grouped bar chart of annual GHG emissions by fuel and electricity grid scenario, Baseline vs
    HP-RTU gas backup
  description: |-
    Figure 5. Grouped bar chart of annual GHG emissions (MMT CO2e), y-axis 0 to 500, comparing ComStock Baseline (dark blue) and HP RTU G Backup (light blue). Bars are grouped by emissions source: Electricity under three grid scenarios plus on-site fuels. Electricity eGRID 2021: 336.6 to 322.3 (-14.3, 4.2%). Electricity LRMER High RE Cost 15: 253.3 to 244.1 (-9.2, 3.6%). Electricity LRMER Low RE Cost 15: 161.1 to 157.6 (-3.5, 2.2%). Natural Gas: 83.6 to 68.5 (-15.1, 18.1%). Fuel Oil: 4.8 to 4.2. Propane: 2.0 to 0.9. The largest percentage cut is in natural gas emissions; absolute electricity emissions reductions depend on the marginal-grid assumption.
