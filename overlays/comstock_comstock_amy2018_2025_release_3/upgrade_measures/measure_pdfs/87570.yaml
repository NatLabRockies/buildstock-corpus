# Hand-authored figure descriptions for measure_pdfs/87570.pdf
#
# 87570 is the HP-RTU with original fuel supplemental heat measure documentation. docling extracts
# each picture as a bare ![Image](...) ref; the chart itself is invisible to retrieval. Each entry
# rewrites the ref with a hand-written alt and injects a description paragraph below it.
#
# Scope: figures only (Figures 1-9, images 000002-000010, plus four uncaptioned appendix grouped-
# bar charts 000011-000014). The cover montage (000000) and NREL logo (000001) are omitted. Table 1
# (on-site fossil fuel emissions factors) is real markdown text in this doc, not a bitmap, so it is
# not among the images.
#
# method is vision-description: numbers were read off the charts and need a human QA pass.
# Least-certain reads: the Figure 9 data-bar matrix (000010) and the small stacked segments in
# Figure 4 (000005). Every entry pins the on-disk PNG sha256.

