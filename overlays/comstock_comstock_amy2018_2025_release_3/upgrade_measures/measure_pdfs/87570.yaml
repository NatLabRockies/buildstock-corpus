  description: |-
    Appendix figure (uncaptioned in the extracted text). Grouped bar chart of site annual natural gas total energy consumption (TBtu) by ComStock building type, y-axis 0 to about 210. Two bars per type (Baseline dark blue, HP RTU G Backup light blue) across FullServiceRestaurant, QuickServiceRestaurant, RetailStripmall, RetailStandalone, SmallOffice, MediumOffice, LargeOffice, PrimarySchool, SecondarySchool, Outpatient, Hospital, SmallHotel, LargeHotel, and Warehouse. RetailStripmall is largest (about 210 baseline to about 160); restaurants, schools, and warehouses are also high. Natural gas falls under the measure for nearly every building type.
