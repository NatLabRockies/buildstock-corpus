    gas backup
  description: |-
    Appendix figure (uncaptioned in the extracted text). Grouped bar chart of site annual natural gas total energy consumption (TBtu) by U.S. census division, y-axis 0 to about 300. Two bars per division (Baseline dark blue, HP RTU G Backup light blue) for New England, Middle Atlantic, East North Central, West North Central, South Atlantic, East South Central, West South Central, Mountain, and Pacific. Baseline gas exceeds the measure in every division; East North Central is largest (about 305 baseline to about 245), followed by Pacific (about 225 to 185) and Middle Atlantic (about 200 to 160). Shows the HP-RTU measure reduces natural gas across all divisions.
