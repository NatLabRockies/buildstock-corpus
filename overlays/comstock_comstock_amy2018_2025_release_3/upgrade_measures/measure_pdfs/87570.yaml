  description: |-
    Appendix figure (uncaptioned in the extracted text). Grouped bar chart of site annual electricity total energy consumption (TBtu) by ComStock building type, y-axis 0 to about 460. Two bars per type (Baseline dark blue, HP RTU G Backup light blue) across the standard ComStock building types. RetailStripmall and Warehouse are largest (about 450 baseline, falling modestly to about 410-425). Electricity changes are small in most types because cooling and fan savings roughly offset any heating electrification retained under gas backup.
