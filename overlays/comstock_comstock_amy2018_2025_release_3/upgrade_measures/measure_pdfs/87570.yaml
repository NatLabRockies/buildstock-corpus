  description: |-
    Appendix figure (uncaptioned in the extracted text). Grouped bar chart of site annual electricity total energy consumption (TBtu) by U.S. census division, y-axis 0 to about 700. Two bars per division (Baseline dark blue, HP RTU G Backup light blue) for the nine census divisions. South Atlantic is largest (about 670 baseline to about 640), followed by Pacific (about 520 to 460). Electricity declines modestly across divisions under the measure, consistent with cooling and fan efficiency gains outweighing retained heating electricity in the gas-backup scenario.
