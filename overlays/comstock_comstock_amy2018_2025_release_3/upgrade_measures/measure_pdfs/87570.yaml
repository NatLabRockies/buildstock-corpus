  alt: Violin and box plots of percent site energy savings by building type across applicable models
  description: |-
    Figure 8. Horizontal violin-plus-box plots of Percent Site Energy Savings by Building Type (%), x-axis about -20% to 70%, titled 'Upgrade 02: HP RTU G Backup (unweighted)'. Rows with model counts: FullServiceRestaurant (n=12337), Hospital (n=24), LargeOffice (n=141), MediumOffice (n=1689), Outpatient (n=2549), PrimarySchool (n=1025), QuickServiceRestaurant (n=8413), RetailStandalone (n=28547), RetailStripmall (n=43631), SecondarySchool (n=562), SmallOffice (n=32493), and Warehouse (n=47363). Most building types center between roughly 20% and 40% site energy savings; QuickServiceRestaurant is lowest (median around 5-10%), while warehouses, retail, and offices are among the highest.
