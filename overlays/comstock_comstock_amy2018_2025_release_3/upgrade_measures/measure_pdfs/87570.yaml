  alt: Violin and box plots of percent site energy savings by end use across applicable models
  description: |-
    Figure 6. Horizontal violin-plus-box plots of Percent Site Energy Savings by End Use (%), x-axis about -160% to 140%, titled 'Upgrade 02: HP RTU G Backup (unweighted)'. Rows with model counts: Other Fuel Water Systems (n=48), Other Fuel Heating (n=7899), Natural Gas Water Systems (n=5919), Natural Gas Heating (n=135378), Electricity Water Systems (n=4105), Electricity Refrigeration (n=16548), Electricity Interior Lighting (n=11), Electricity Interior Equipment (n=8), Electricity Heating (n=177649), Electricity Heat Recovery (n=3879), Electricity Fans (n=178758), and Electricity Cooling (n=178774). Combustion-heating rows cluster near +100% (on-site heating combustion eliminated for applicable systems), Electricity Heating shows large positive savings, and Fans and Cooling show moderate positive savings; long negative tails mark buildings with small absolute loads.
- source_image: 87570_images/image_000008_2491e5fc136fdfb36d83a7677754b32f2aa3b2ebde55c398613123743f20fe3d.png
  source_image_sha256: 6cac588e9dbcd15c15cc69d352ff260932b56c0a37ae981b80bb017255d7cccf
