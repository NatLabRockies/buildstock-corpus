  alt: |-
    Matrix chart of median noncoincident peak demand (W per square foot) by climate zone and season, Baseline vs gas backup vs electric backup
  description: |-
    Figure 9. Matrix (data-bar) chart of median noncoincident peak electric demand (W/SF) for models with gas RTUs, by Building America climate zone (rows: Hot-Humid, Hot-Dry, Marine, Mixed-Dry, Mixed-Humid, Cold, Very Cold, Subarctic) and season (columns: Summer, Winter, Shoulder). Each zone has three rows: Baseline, HP RTU G Backup, and HP RTU E Backup. Summer peaks fall under both HP-RTU scenarios (e.g. Hot-Humid Baseline 4.42 to 3.03; Hot-Dry 4.59 to 3.42). Winter peaks are similar or slightly higher under the measure, and electric backup drives the largest winter peaks in cold climates (e.g. Very Cold Winter reaches 5.97 W/SF under E Backup vs 3.53 under G Backup). Illustrates that electric resistance backup can substantially raise winter peak demand in cold zones. (Values read off a dense data-bar table; flag for QA.)
