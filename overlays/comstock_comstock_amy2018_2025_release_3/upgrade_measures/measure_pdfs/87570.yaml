  description: |-
    Figure 1. Horizontal bar chart of the ComStock baseline in-force energy code followed, as a percentage of applicable floor area served by applicable RTUs (PSZ-AC with gas coil and PSZ-AC with electric coil), x-axis 0% to about 50%. Bars from top: ComStock DOE Ref Pre-1980 0.07%, DOE Ref 1980-2004 46.50% (largest), 90.1-2004 9.10%, 90.1-2007 19.52%, 90.1-2010 5.85%, 90.1-2013 4.28%, DEER Pre-1975 0.07%, DEER 1985 0.86%, DEER 1996 2.38%, DEER 2003 2.66%, DEER 2007 2.93%, DEER 2011 2.14%, DEER 2014 0.75%, DEER 2015 1.52%, and DEER 2017 1.38%. Most applicable floor area follows the older DOE Reference 1980-2004 or 90.1-2007 vintages, indicating substantial efficiency-upgrade headroom.
- source_image: 87570_images/image_000003_42a1b06c9dff87f535dd65e0dc844f9fcaedb1ed74b4a1d10fd1d5085c19d495.png
