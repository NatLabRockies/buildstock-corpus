  described_utc: '2026-08-20'
  alt: Violin and box plots of percent site energy savings by fuel across applicable models
  description: |-
    Figure 7. Horizontal violin-plus-box plots of Percent Site Energy Savings by Fuel (%), x-axis about -160% to 100%, titled 'Upgrade 02: HP RTU G Backup (unweighted)'. Rows with model counts: Other Fuel (n=7909), Natural Gas (n=135743), Electricity (n=178772), and Site (total, n=178774). Natural Gas and Other Fuel distributions sit near +100% savings (combustion heating largely displaced), Electricity centers around 10-30% savings, and the overall Site savings distribution centers around 30-40% with a long negative tail. Confirms the measure's savings come mostly from displacing fossil heating and improving cooling/fan efficiency.
- source_image: 87570_images/image_000009_661e5b4e9504b80e7cd2b26c93e17094150a95f1a8700dfd3f25aac0693bb3b9.png
