  alt: |-
    Two-panel bar chart: left, percent of ComStock stock floor area by building type with LargeOffice highlighted at 9.72 percent; right, percent of each building type's floor area applicable to the measure split into heat-and-cool and cool-only electric HVAC, with LargeOffice at 33.30 percent heat and cool plus 66.70 percent cool only
  description: |-
    Figure 1 of the ComStock thermostat-control-for-load-shedding measure documentation establishes applicability. The left panel is a horizontal bar chart of each ComStock building type's share of national stock floor area: Warehouse 23.41%, PrimarySchool 11.29%, LargeOffice 9.72% (highlighted green as the only applicable type), RetailStripmall 9.38%, RetailStandalone 9.00%, SmallOffice 8.06%, MediumOffice 6.83%, SecondarySchool 5.63%, LargeHotel 4.82%, Hospital 4.34%, Outpatient 3.28%, FullServiceRestaurant 2.56%, SmallHotel 1.11%, QuickServiceRestaurant 0.56%; the printed values sum to 100%. The right panel is a 100% stacked bar per building type giving the share of that type's floor area with electric HVAC, split into orange 'Applicable: heat & cool' and blue 'Applicable: cool only', with grey 'Not applicable'. The highlighted LargeOffice row is fully applicable: 33.30% of large office floor area has both electric heating and electric cooling and the remaining 66.70% has electric cooling only, matching the text. Every other row retains a non-applicable fraction. The measure therefore applies to large offices only, 9.72% of total stock floor area, corresponding to 3158 large office model samples that weight up to 19,212 buildings nationally.
- source_image: 89340_images/image_000003_cf4332c6cfd36c54abe022695548a85168b50405d1c86d8ce48d78d6e4a74251.png
  source_image_sha256: 9625a4b5f1cbe5441ddcf22902cc6ecb256670064537dfb9c79698ae278adbc8
