  alt: |-
    Three stacked line charts of hourly load over five days in mid-July comparing baseline and default load shed profiles for Building 1 in ASHRAE climate zone 3A, Building 1 in zone 3B, and Building 2 in zone 3B
  description: |-
    Figure 3 of the ComStock thermostat-control-for-load-shedding measure documentation shows that peak windows are building- and weather-specific. Three vertically stacked panels plot hourly load (kWh, axis 50 to 350) for five consecutive days, 7/16 through 7/20: 'Building 1, ASHRAE Climate Zone 3A', 'Building 1, ASHRAE Climate Zone 3B', and 'Building 2, ASHRAE Climate Zone 3B'. Each panel overlays a dashed baseline profile with a solid 'Load shed, Default' profile. Building 1 in zone 3A peaks near 200 kWh daily; the same model in zone 3B peaks slightly lower, near 190 kWh; Building 2 in zone 3B has a much sharper profile peaking near 290 kWh with deeper overnight troughs. In every panel the load-shed curve tracks the baseline except for a distinct daily valley where the shed event occurs, and the timing and depth of that valley reveal the dispatched peak window. It falls at a different hour and has a different shape in each panel. Even the identical building in slightly different climate zones produces different profiles, so stock diversity in weather, internal gains, operating hours, and envelope performance yields a different daily peak window for every model.
- source_image: 89340_images/image_000005_0d341283ef45889cd4efef35c4c22492901956e2ea3276ede778c29c3f466d8c.png
  source_image_sha256: d49e4f0334475ed44dcf8bf8273598644518f452b5b0199ea393649c032b5e63
  method: vision-description
  described_utc: '2026-08-20'
  alt: |-
    Line chart of hourly load over five days in mid-July comparing baseline, default load shed, and load shed without rebound control for one building, showing the no-rebound-control case spiking above the baseline peak each day
  description: |-
    Figure 4 of the ComStock thermostat-control-for-load-shedding measure documentation isolates the rebound effect for a single large office model. Hourly load (kWh, axis 50 to 250) is plotted for five consecutive days, 7/16 through 7/20, with three traces: a dashed 'Baseline', a solid red 'Load shed, Default', and a solid yellow 'Load shed, No rebound control'. Baseline afternoon peaks reach roughly 190 to 200 kWh. The default scenario clips those peaks to roughly 170 to 180 kWh and returns to the baseline curve gradually. The no-rebound-control scenario sheds the same load during the window but then snaps the setpoint back, producing a narrow spike each day that reaches roughly 210 to 220 kWh, above the original baseline peak on every one of the five days. The text notes this pattern holds throughout the year across different building models and reflects an inherent drawback of load shedding for responsive systems governed by differential-equation dynamics such as HVAC. Rebound control is therefore necessary and is included in the default scenario, which ramps linearly back to the nominal setpoint over two hours.
- source_image: 89340_images/image_000006_dca1b76a4e9daf0588275fd480bc137d1526bc80e1e2fb9f7fec746223f1a620.png
