  alt: |-
    Three side-by-side stacked area plots of hourly electricity load by end use over three summer days for baseline, load shed without rebound control, and load shed with rebound control, each overlaid with a dashed green thermostat setpoint trace on a secondary axis
  description: |-
    Figure 2 of the ComStock thermostat-control-for-load-shedding measure documentation demonstrates why rebound control is needed. Three panels, 'Baseline', 'Control without rebound control', and 'Control with rebound control', plot stacked hourly electricity load (kW, left axis 0 to 20) by end use (Cooling, Fans, HeatRejection, ExteriorLights, Heating, InteriorEquipment, InteriorLights) with a Total line, for three summer days from 08-19 00 to 08-22 00. A dashed green cooling setpoint trace is drawn against a secondary right-hand axis spanning roughly 23 to 28 degrees C. In the baseline the setpoint alternates between occupied and unoccupied-setback levels and the daily load peaks smoothly at about 18 to 19 kW. In both control panels the setpoint is raised during the afternoon peak window, cutting cooling and fan load into a visible valley. Without rebound control the setpoint drops abruptly back to nominal and a narrow load spike appears immediately after the window, exceeding the original baseline peak. With rebound control the setpoint returns along a gradual ramp, the post-window recovery is spread out, and load rises smoothly so the daily peak stays at or below the baseline peak.
- source_image: 89340_images/image_000004_9b64138ceab7412fe9fdc09d57f67fbd6dbe0c5bd7507ceae6f8ba155c5d7de7.png
  source_image_sha256: 77fec24b7432ca73a997ea432ef9736bbbac4e781917abe14aa783cf24b5ee60
