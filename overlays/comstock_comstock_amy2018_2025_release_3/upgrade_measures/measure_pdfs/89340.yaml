  description: |-
    Figure 9 of the ComStock thermostat-control-for-load-shedding measure documentation compares annual site energy consumption between the baseline and the default load-shed scenario. The left panel, 'Stock', totals 4338 TBtu at baseline and 4336 TBtu with the measure; the right panel, 'Applicable large offices', totals 318 TBtu and 315 TBtu. Bands are stacked by end use and fuel: Interior Equipment, Fans, Cooling (Electricity and District Cooling), Interior Lighting, Heating (Electricity, Natural Gas, District Heating, Other Fuel), Water Systems (four fuels), Exterior Lighting, Pumps, Heat Recovery, and Heat Rejection. Stock band labels that reconcile exactly with the text: Fans, Electricity 519.1 to 518.2 TBtu (0.9 TBtu, 0.17%); Cooling, Electricity 667.3 to 666.3 (1.0 TBtu, 0.15%); Heating, Electricity 175.2 to 174.6 (0.6 TBtu, 0.34%); Interior Lighting, Electricity 451.9 and Interior Equipment, Electricity 739.7 both unchanged. In the large-office panel: Interior Equipment 108.6 unchanged, Fans 37.5 to 36.6, Cooling 60.7 to 59.6, Interior Lighting 31.4 unchanged, Heating Electricity 13.1 to 12.6, Heating Natural Gas 41.2 to 41.0. Total stock site energy savings are 0.046%, or 2 TBtu.
