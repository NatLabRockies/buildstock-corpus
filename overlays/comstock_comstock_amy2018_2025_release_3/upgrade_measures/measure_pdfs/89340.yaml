# Hand-authored figure descriptions for measure PDF 89340
# "Thermostat Control for Load Shedding" (ComStock 2025 release 3 upgrade measure).
#
# 20 image refs in the extracted markdown. image_000000 (NREL cover art) and
# image_000001 (a decorative rule) are decorative and deliberately have no entry.
# The remaining 18 are real figures: Figures 1-14 plus Appendix Figures A-1 to A-4.
#
# Tables 1, 2 and 3 all survived extraction as real markdown, so no
# vision-transcription entry is needed for this document.
#
# QA FLAGS - vision-derived numbers need a human pass before publication.
#
# * SOURCE DEFECT, high confidence: Figures A-3 and A-4 are captioned as SITE ANNUAL
#   ELECTRICITY consumption (by building type and by census division respectively), but
#   both bitmaps plot "Natural Gas Total Energy Consumption (tbtu)" and reproduce the
#   bar heights of Figures A-2 and A-1. Verified by cropping and upscaling the y-axis
#   label on both images. The two PNGs are not byte-identical to A-1/A-2 (different
#   sha256 and file size, i.e. re-rendered), but they are visually identical. The
#   intended electricity appendix figures appear to be missing from the source PDF.
#   The overlay describes what the bitmaps actually show and states the mismatch.
#
# * Figure 1 (000002) - HIGH confidence. All 14 left-panel percentages are legible and
#   sum to 99.99%, and the right-panel LargeOffice split (33.30% heat & cool / 66.70%
#   cool only) matches Section 3 prose exactly.
#
# * Figure 9 (000010) - only band labels that reconcile with the Section 5.3 bullets are
#   asserted: Fans 519.1->518.2 (0.9 TBtu = 0.17%), Cooling Electricity 667.3->666.3
#   (1.0 TBtu = 0.15%), Heating Electricity 175.2->174.6 (0.6 TBtu = 0.34%), plus the
#   unchanged Interior Lighting 451.9 and Interior Equipment Electricity 739.7. The
#   stock Heating, Natural Gas band pair is NOT asserted: the baseline label is
#   ambiguous (~654.9 or ~655.9) and neither read reproduces the text's 0.023% for a
#   0.2 TBtu saving, which would imply a ~870 TBtu base. The text bullet is quoted
#   instead. Panel totals 4338->4336 are integer-rounded; the sum of the individual
#   band deltas is ~2.7 TBtu, and the text's headline figure is 2 TBtu / 0.046%.
#
# * Figure 9 legend gap (extraction/authoring artifact, not repairable here): a
#   diagonally hatched dark band of about 452 TBtu, unchanged between bars, sits
#   between Interior Equipment Electricity and Fans Electricity in the Stock panel but
#   has no corresponding entry in the 17-item legend. It is left unnamed.
#
# * Figure 10 (000011) - HIGH confidence. All printed totals and component values are
#   legible and internally consistent: 314+81 vs 402, 237+81 vs 325, 152+81 vs 240,
#   each leaving the same ~7 MMT CO2e Fuel Oil + Propane residual.
#
# * Figures 13 and 14 (000014, 000015) - the 15 per-zone n values are legible and sum
#   to exactly 3158, the stated number of applicable large office model samples. Note
#   the zone list contains both "7 (n=8)" and "7A (n=8)" as separate rows; that is what
#   the bitmaps print, and the sum check corroborates it, but it is an unusual ASHRAE
#   zone labelling worth checking upstream.
#
# * CAPTION DEFECT: Figures 12 and 14 are captioned "Percent site EUI savings ...", but
#   both x-axes read absolute intensity in kBtu/ft2 ("Site EUI Savings by End Use
#   (kBtu/ft2)" and "Site EUI Savings by Climate Zone (kBtu/ft2)"). This matches the
#   Section 5.5 prose, which contrasts percent savings with absolute EUI savings, so
#   the word "Percent" in those two captions is wrong.
#
# * Figures 2, 5, 6, 7, 8 - no data labels. All quoted magnitudes are axis estimates,
#   and the qualitative conclusions come from the Section 5.1/5.2 prose. Figure 2's
#   secondary y-axis (setpoint) spans roughly 23-28 degrees C; the exact occupied and
#   setback setpoint values were not read off the axis.
#
# * Figure 5 (000006) - IMPORTANT context, from Section 5.1.3: this figure derives from
#   a reduced ComStock test run of 10,000 building samples in which only 90 large
#   offices were applicable, NOT the full 350,000-sample run used elsewhere.
#
# * Figures 3 and 4 (000004, 000005) - single-building illustrative runs; kWh peaks are
#   axis estimates.
#
# * Figures A-1 and A-2 (000016, 000017) - no data labels; all TBtu magnitudes are axis
#   estimates. The same estimates are reused in the A-3/A-4 entries because those
#   bitmaps duplicate these charts.
#
# * Extraction artifacts elsewhere in this document (not figure-related): Table 1
#   (On-Site Fossil Fuel Emissions Factors) lost its header row, so the first data row
#   "Natural gas | 147.3 lb/MMBtu (228.0 kg/MWh) a" acts as the header. Table 1 also
#   carries the same propane inconsistency seen in other measure PDFs: 177.8 lb/MMBtu
#   is paired with (182.3 kg/MWh) where ~275 kg/MWh is expected. Table 2's final row
#   is split, with "annual_peak_electric_demand_kw" left with an empty description and
#   the description "Building annual peak electric demand" on a following row with an
#   empty first cell.
