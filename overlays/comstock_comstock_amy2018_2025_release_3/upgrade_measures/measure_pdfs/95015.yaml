    Figure 8. Three-panel stacked bar chart of annual CO2e emissions by fuel for the baseline and the electric boiler measure scenario, under eGRID 2021 and two LRMER grid scenarios
  description: |-
    Figure 8 has three side-by-side panels using different electricity emissions assumptions: "eGRID 2021", "LRMER High RE Cost 15", and "LRMER Low RE Cost 15" (LRMER = long-run marginal emissions rate, 15-year levelization; RE = renewable energy). Each stacks annual emissions in million metric tons of CO2 equivalent (MMT CO2e) by fuel for the Baseline versus the Electric Resistance Boilers scenario, with totals printed above each bar and percent change in parentheses. eGRID 2021: Baseline 452, measure 463 (2%) -- emissions increase. LRMER High RE Cost 15: Baseline 346, measure 343 (-1%). LRMER Low RE Cost 15: Baseline 245, measure 233 (-5%). Natural gas emissions fall from 102 to 66 MMT CO2e identically in all three panels, since the gas heating displaced is the same regardless of grid assumption, while electricity emissions rise (345 to 393, 240 to 274, and 139 to 163 MMT CO2e). The sign of the net result therefore depends entirely on the grid: against the 2021 grid, electrifying to resistance heat is slightly worse for carbon, and it only becomes a modest improvement under the cleaner projected grids.
