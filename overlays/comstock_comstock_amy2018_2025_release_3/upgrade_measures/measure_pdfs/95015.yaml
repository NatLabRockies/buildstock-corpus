    Figure 10. Violin and box plot distribution of percent utility bill savings by fuel type for models with the electric boiler measure applied
  description: |-
    Figure 10 is a horizontal violin plot with embedded box plots of per-model percent utility bill savings by fuel type, annotated "Upgrade 17.0: Electric Resistance Boilers (unweighted)". The x-axis runs from about -160% to +100% with a reference line at 0%. Rows top to bottom with model counts: Fuel Oil Bill State Average (n=544), Natural Gas Bill State Average (n=30349), Electricity Bill w/ Mean Rate (n=28210), Bill Mean (n=30752). The two fossil fuel rows cluster on the positive side -- fuel oil almost entirely at 100% savings and natural gas with a box roughly spanning 70%-100% -- because the measure removes the heating fuel bill outright. The electricity row is squarely negative, with a box centered around -40% to -50% and a long left tail past -160%, reflecting the added electric resistance load. The "Bill Mean" row, which is the total bill across all fuels, is also negative but less so, centered around -20% to -30%. The figure shows that at the individual building level the fuel bill savings do not offset the electricity bill increase for most models.
