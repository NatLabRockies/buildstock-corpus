    Figure 7. Three-panel stacked bar chart of national annual utility bills by fuel for the baseline and the electric boiler measure scenario, under maximum, mean, and minimum electricity rates
  description: |-
    Figure 7 has three side-by-side panels titled "With Max Electricity Rate", "With Mean Electricity Rate", and "With Min Electricity Rate", each stacking annual utility bills in billion USD (2022) by fuel -- electricity, natural gas, propane, fuel oil -- for the Baseline and the Electric Resistance Boilers scenario. Totals are printed above each bar with percent change from baseline in parentheses. Max electricity rate: Baseline 144, measure 153 (6%). Mean electricity rate: Baseline 127, measure 134 (5%). Min electricity rate: Baseline 112, measure 116 (4%). The bills go UP in every rate case, which is the central negative result for this measure. The mechanism is visible in the segments: the electricity portion rises (125 to 141, 108 to 121, and 93 to 104 billion USD respectively) by more than the natural gas portion falls (17 down to 11 billion USD in all three panels). The increase is largest under the maximum electricity rate, since that is where the added electric load is most expensive.
