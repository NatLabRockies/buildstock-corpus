    Figure 11. Violin and box plot distribution of percent utility bill savings by ASHRAE climate zone for models with the electric boiler measure applied
  description: |-
    Figure 11 is a horizontal violin plot with embedded box plots of per-model percent utility bill savings by ASHRAE climate zone, annotated "Upgrade 17.0: Electric Resistance Boilers (unweighted)". The x-axis runs from about -100% to +80% with a reference line at 0%. Rows top to bottom with model counts: 1A (n=567), 2A (n=1518), 2B (n=760), 3A (n=3542), 3B (n=4238), 3C (n=1264), 4A (n=5266), 4B (n=1325), 4C (n=516), 5A (n=4612), 5B (n=2277), 6A (n=2430), 6B (n=922), 7 (n=1140), 8 (n=44). Every zone has a median on the negative side of zero, so the typical building's total bill rises. The penalty deepens systematically with heating climate: medians in the hot zones 1A through 2B sit close to 0% to -10%, mid zones 3A through 4A land around -15% to -25%, and the cold zones 6A, 6B, 7, and 8 fall to roughly -40% to -70%. Zone 8 has the widest and most negative distribution on the smallest sample (n=44). The trend follows directly from heating load: the colder the zone, the more gas heating gets converted to expensive electric resistance heat.
