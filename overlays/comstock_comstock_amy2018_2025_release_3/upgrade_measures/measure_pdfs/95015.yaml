    Figure 1. Schematic diagram of an electric boiler system serving space heating and domestic hot water, showing the boiler, hot water cylinder, radiators, and valves
  description: |-
    Figure 1 is a third-party schematic titled "Electric Boiler Diagram - Heating and Hot Water", carrying a GreenMatch logo in the upper right. It shows a residential-style hydronic layout rather than ComStock model output. Labeled components: "Mains water" entering at the upper left, a "Balanced supply" branch, a "Hot water cylinder" on the left, "The boiler" as a wall-mounted unit in the center with a small display panel, and two stacked "Radiator" panels on the right. Piping is color-coded, with blue for cold or return water and red for heated supply. Three valve groups are called out: "Full bore valves" and "Zone valves" beneath the boiler, and a "System drain point" at the bottom right. The figure is illustrative context for what an electric boiler is and how it connects to a hydronic distribution loop; it conveys no ComStock results.
