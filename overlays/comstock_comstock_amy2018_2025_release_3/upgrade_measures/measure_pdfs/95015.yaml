    Figure 6. Stacked bar comparison of annual site energy consumption between the ComStock baseline and the electric boiler measure scenario, for the full stock and for applicable buildings only
  description: |-
    Figure 6 is a two-panel stacked bar chart of annual site energy consumption in trillion British thermal units (TBtu), segmented by end use and fuel with an 18-entry legend. The left panel covers the full stock: ComStock Baseline 4865 TBtu versus Electric Resistance Boiler 4743 TBtu, a reduction of about 2.5%. The right panel covers applicable buildings only, on a y-axis reaching 1400 TBtu: Baseline 1432 TBtu versus Electric Resistance Boilers 1309 TBtu, a reduction of about 8.6%. In both panels the visible change is a swap rather than a shrink: the hatched Heating Natural Gas segment in the baseline is replaced by a solid Heating Electricity segment in the measure scenario, printed as 686.1 TBtu in the full-stock panel and 426.3 TBtu in the applicable-buildings panel. Untouched end uses hold constant -- Interior Equipment Electricity stays at 740.2 TBtu full-stock and 188.5 TBtu for applicable buildings, and cooling, fans, and lighting segments are unchanged. Site energy falls modestly because the electric boiler is modeled at 100% thermal efficiency against roughly 80% for the noncondensing gas boiler it replaces. Panel totals are read with high confidence; individual stacked-segment values are provisional.
