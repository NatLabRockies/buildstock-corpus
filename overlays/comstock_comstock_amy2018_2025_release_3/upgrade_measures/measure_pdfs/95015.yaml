# Hand-authored figure descriptions for measure PDF 95015 (Electric Resistance Boilers).
#
# Scope: 16 images are extracted from this PDF. Images 000000 and 000001 are decorative
# (the NREL photo-grid cover banner and the NREL wordmark logo) and are deliberately NOT
# described here -- describing them would inject noise into retrieval. The remaining 14
# (000002-000015) are real figures: Figures 1-14.
#
# All tables in this document extracted as real markdown text, so no vision-transcription
# entry is needed. Note that Table 2's caption was absorbed into its header row (repeated
# across all 8 columns), which is why it does not appear as a standalone caption line.
#
# QA flags for human review:
#   - Figure 2 (000003): the two cubic turndown curves ("Boiler with minimum turndown" and "Boiler
#     with no minimum turndown") are nearly coincident -- evaluating the Table 3 coefficients gives
#     values within ~0.01 of each other across most of the PLR range. The description therefore
#     does NOT assign the orange vs. gray series to a specific named curve.
#   - Figure 3 (000004): the source equation defining the electric boiler curve was DROPPED in
#     extraction (the text reads "using the following equation:" followed by nothing). The
#     description notes EIR = 0.98 + 0.02 x PLR as an inference read off the plot, explicitly
#     flagged as such, not as a transcription.
#   - Figure 9 (000010): a single broad left-tailed violin (roughly -140% to 0%) aligns with the
#     "Electricity Heating (n=14)" row. The row assignment is a visual read on a crowded axis and
#     should be confirmed; the interpretation (only models with nonzero baseline electric heating
#     have a defined percent savings, hence n=14) is consistent but inferred.
#   - Figures 6, 12 (000007, 000013): panel TOTALS are read with high confidence; the individual
#     stacked-segment values printed inside the bars are small and dense, so segment-level numbers
#     in those descriptions are provisional.
