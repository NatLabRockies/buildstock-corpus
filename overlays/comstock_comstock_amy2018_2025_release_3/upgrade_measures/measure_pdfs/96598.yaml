# Hand-authored figure descriptions for measure_pdfs/96598.pdf (Batch E).
#
# 96598 is the Upgrade Envelope to Current State Code measure documentation. docling extracts
# every picture as a bare ![Image](...) ref: the caption line survives above it, but the chart
# itself is invisible to retrieval. Each entry below rewrites the ref with a hand-written alt
# and injects a description paragraph beneath it. Schema and depth budget:
# overlays/FIGURE_DESCRIPTIONS_ROLLOUT.md (section 2.1 -- 40-70 words, alt <=120 chars, no
# corroboration against body prose).
#
# Scope: Figures 1-16 (16 charts and maps). The two cover images (indices 000000-000001:
# National Laboratory of the Rockies photo collage and logo) are deliberately not described.
# This document is unusually map-heavy: five of the sixteen figures are choropleths.
#
# The `tables:` entries above are the reading-order repairs for the six damaged tables on
# pages 20, 31 and 32. This figures: block is independent of them -- no figure entry anchors
# on a table bitmap, so the two blocks do not interact.
#
# QA notes (vision reads; confirm before treating as a release record):
#   * Section 5.4's opening sentence says "Figure 11 shows the impact ... on the median
#     seasonal peak intensity" and then refers to Figure 10 two sentences later. The chart in
#     that section is Figure 10; Figure 11 is the end-use savings distribution. Prose error.
#   * Figure 16 reprints Figure 5 (the final code-in-force map) under a second number. The two
#     bitmaps are byte-different, so each is described and pinned separately.
#   * Figure 7, the sampling-regions map, carries no legend, labels or scale in the source, so
#     it is described structurally only.

