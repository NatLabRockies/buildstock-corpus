# Hand-authored transcriptions for ComStock measure documentation 96598
# (Roof and Wall Insulation Upgrades).
#
# Unlike the other measure_pdfs overlays in this release, these entries do not fill gaps --
# they correct damage. Pages 20, 31 and 32 each carry two tables, and on all three pages
# docling shifted the reading order by one caption: every grid was emitted under the *next*
# table's caption. Table 5's numbers appeared under the Table 6 caption, Table 10's under
# Table 11's, Table 12's under Table 13's. On top of that, three grids lost the Roof Type /
# Wall Type column the captions name and one had it emitted empty, one lost a row to a merged
# cell, and one had two climate-zone labels merged so zones 12-16 were labelled 11-15.
#
# All six also lost their header row: docling filled the markdown header with the table's
# subtitle repeated across every column and pushed the real climate-zone labels down into the
# body as an ordinary data row.
#
# That is worse than a dropped table. A missing table is a visible gap; a table whose rows are
# attached to the wrong assembly, or whose columns are attached to the wrong climate zone,
# reads as authoritative and is wrong. So each entry here carries `replaces:`, pinned to the
# fingerprint of the damaged table it removes -- if a later docling emits anything different,
# including a correct table, the build reports it rather than discarding the better output.
#
# method: pdf-text-layer. Every value was read from the PDF's own text layer (pymupdf
# `get_text("words")`, clustered by y-centre), not transcribed by eye, and each row was
# checked to map each value to a distinct climate-zone column in order -- a shifted column
# fails rather than passing quietly. All six tables were then cross-read against 210-dpi
# renders of their page regions and match cell for cell.
#
# Observations recorded rather than corrected, per overlays/README.md ("transcribe, don't
# improve"):
#   * Table 6's caption reads "Baseline Roof U-Value" while the table's own printed title
#     reads "Whole Roof Assembly R-Value", and the values (15-38) are R-values. The
#     inconsistency is in the source. Both are transcribed as printed.
#   * Table 5's Metal building group genuinely has no Pre-1980 row -- five rows, not six.
#     docling's omission there was correct and is preserved.
#   * Table 10 covers 15 ASHRAE zones, not 16: the source has no 5C column.
#   * Trailing zeros are kept as printed (20.0, 13.0), as is the en-dash in "1980-2004".
#
# The grouping column is restored as a bold sub-table label per Roof/Wall Type, which both
# keeps each paragraph under the chunker's limit and puts the assembly name in the same chunk
# as its numbers. Tables 11 and 13 have exactly one row per type, so there the grouping stays
# a real column -- decomposing a one-row table would only separate the label from the data.

product: comstock
release: "comstock_amy2018_2025_release_3"
text_repairs:
- find: '## Data from [11], [23]'
  replace: Data from [11], [23]
  why: |-
    docling promoted this one-line source note to a level-2 heading. Because the
    chunker is heading-aware, that filed 30 of this document's chunks under a
    section named 'Data from [11], [23]' instead of '3.2.4 Roof Insulation
    Upgrade Methodology' -- and replaced the breadcrumb rather than nesting under
    it, so the section those chunks belong to was not recoverable from them. The
    line is restored to the prose it is in the source. A corpus-wide scan found
    this to be the only citation note promoted to a heading in the release.
