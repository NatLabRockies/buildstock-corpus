  description: |-
    Figure 11: horizontal violin-and-box plot of percent site energy savings by end use and fuel type, x-axis -160% to 100%, titled Upgrade 49.0: Code_Envelope (unweighted), with model counts per row (electricity cooling n=119,036; natural gas heating n=60,609). Medians sit modestly above zero for the heating and cooling end uses, with long negative tails from low-load models. Section 5.5 discusses those outliers.
