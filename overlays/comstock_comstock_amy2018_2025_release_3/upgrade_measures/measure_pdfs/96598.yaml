  description: |-
    Figure 5: choropleth map of the United States shading each state by the final assumed current code in force, legend 90.1-2004 through 90.1-2019 plus DEER 2020 for California. Most of the West, Upper Midwest and Northeast are assigned 90.1-2016 or 90.1-2019, while Kansas sits at 90.1-2004 and Wyoming, Arizona and Oklahoma at 90.1-2007. Table 9 lists the per-state assumptions.
- source_image: 96598_images/image_000007_a40a80e0b47796f9b2adcc7a989e7cfb8669cd58373b845e8ab4ffd70270b9eb.png
