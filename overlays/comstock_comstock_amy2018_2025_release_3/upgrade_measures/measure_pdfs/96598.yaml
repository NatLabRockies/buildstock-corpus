  description: |-
    Figure 10: three-panel horizontal bar chart of median electric peak intensity (W/ft2) by ASHRAE climate zone 1 through 8, baseline and Code_Envelope paired per zone, with panels for summer, winter and shoulder peaks. Every pair shows a small reduction; the largest printed drop is winter zone 7, 3.38 to 3.03 W/ft2. Section 5.4 notes these are medians only.
