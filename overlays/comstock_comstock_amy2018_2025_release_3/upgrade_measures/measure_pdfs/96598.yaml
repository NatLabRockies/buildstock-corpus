    rates
  description: |-
    Figure 9: three-panel stacked bar chart of annual utility bills (billion USD 2022, y-axis 0 to 160) for the baseline and Code_Envelope scenario, one panel each for the max, mean and min electricity rate, stacked by fuel. Totals fall from 149 to 139, 129 to 120 and 112 to 104 - a 7% reduction in every panel. Table 19 gives the savings by fuel.
