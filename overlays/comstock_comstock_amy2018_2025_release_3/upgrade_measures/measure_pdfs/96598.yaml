  description: |-
    Figure 7: map of the contiguous United States with counties grouped into ComStock sampling regions, each region filled a distinct color, with no legend, labels or scale in the source. The regions are irregular and vary widely in size, crossing state lines in places. Reproduced from the ComStock Reference Documentation; Section 3.4 uses it to discuss geographic limitations.
