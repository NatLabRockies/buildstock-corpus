  alt: County-level map of Colorado shaded by adopted IECC code year, with city and county legends
  description: |-
    Figure 4: county-level map of Colorado shaded by adopted IECC code year, with separate legends for cities and counties running from 2021 back to 2006 plus unadopted. Adoption is patchy: Front Range and Denver-metro jurisdictions carry newer years while many rural eastern and western counties show older or no adoption. Section 3.2.1.4 explains the statewide assumption drawn from it.
- source_image: 96598_images/image_000006_9d8000350f71d05ee78ba29803c5ea925a7015068bc2a9011a67c8254bab973d.png
