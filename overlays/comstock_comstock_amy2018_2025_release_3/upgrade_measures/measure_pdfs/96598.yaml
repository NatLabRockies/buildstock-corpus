  description: |-
    Figure 6: horizontal bar chart of weighted ComStock square footage by assumed current code in force, x-axis 0 to about 16 billion ft2, one bar per code with printed labels. 90.1-2013 is largest at 16.01B ft2, followed by 90.1-2019 at 14.49B and 90.1-2016 at 11.68B; DEER 2020 accounts for 7.60B and 90.1-2004 only 1.76B. Table 9 holds the state assignments behind it.
- source_image: 96598_images/image_000008_ab4a956bb9c7b0955d7dff2b4a94c9b6e8352dfb95a647f8cf80721bfbea46c5.png
