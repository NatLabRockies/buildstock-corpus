  alt: Stacked bar chart of annual site energy by end use and fuel, baseline vs Code_Envelope
  description: |-
    Figure 8: two stacked bar columns comparing annual site energy consumption (TBtu, y-axis 0 to 5,000) for the ComStock baseline and the Code_Envelope scenario, stacked by end use and fuel with a 20-entry legend. The total falls from 4,982 to 4,596 TBtu, about 7.7%. Natural gas heating drops from 691.7 to 612.2 and electric heating from 267.7 to 210.3. Table 18 summarizes the savings.
- source_image: 96598_images/image_000010_e60b2240dfa306944d6a932125f5b587de080eba3a334c880942b77214803726.png
