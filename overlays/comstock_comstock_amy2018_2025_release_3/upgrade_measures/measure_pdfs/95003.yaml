# Hand-authored figure descriptions for measure_pdfs/95003.pdf
#
# 95003 is the Chiller Replacement measure scenario documentation (NREL/TP-5500-95003). docling
# extracts each figure as a bare ![Image](...) ref: the caption line survives above it, but the
# chart itself is invisible to retrieval and unreadable without the bitmap. Each entry below is
# image-anchored (see the figures: schema in overlays/FIGURE_DESCRIPTIONS_ROLLOUT.md): the ref
# is rewritten with a hand-written alt, and a description paragraph is injected below it.
#
# Scope: figures only - Figures 1-24 and C-1 through C-6, plus the Table 4 bitmap (31 entries).
# The two cover/title images (indices 000000-000001) are deliberately not described.
#
# Depth: authored to the FIGURE_DESCRIPTIONS_ROLLOUT.md section 2.1 budget (40-70 words, alt
# <= 120 chars, no corroboration against body prose).
#
# QA notes (vision reads; confirm before treating as a release record):
#   * Index 000011 is "Table 4. On-Site Fossil Fuel Emissions Factors" surviving only as a
#     bitmap, so it uses method vision-transcription rather than vision-description. Its
#     propane row pairs 177.8 lb/MMBtu with 182.3 kg/MWh where ~275 kg/MWh is expected - the
#     same upstream defect already logged in seven other ComStock measure docs.
#   * Figures C-4 and C-6 are captioned as water-cooled chillers, but their legends key the
#     temperature families to outdoor dry-bulb (Toadb) rather than condenser water temperature
#     (Tcws) as C-3 and C-5 do. Noted in both descriptions; likely a source-figure defect.
#   * Figures 1 and 2 are Tableau table-with-bars visuals. They are captioned as Figures and
#     described (not transcribed); their per-row values live in the visual itself.
#   * Stacked-bar totals and printed data labels in Figures 14-21 were read off the charts.

