# Hand-authored figure descriptions for measure PDF 95119
# (Laboratory-Informed Modeling of Standard Performance Heat Pump Rooftop Units).
#
# Scope: 16 images are extracted from this PDF. Images 000000 and 000001 are decorative
# (the NREL photo-grid cover banner and the NREL wordmark logo) and are deliberately NOT
# described here -- describing them would inject noise into retrieval. The remaining 14
# (000002-000015) are real figures: Figures 1-12 plus appendix Figures A-1 and A-2.
#
# All tables in this document extracted as real markdown text, so no vision-transcription
# entry is needed.
#
# QA flags for human review:
#   - Figure 1 (000002): the "upgrade_applicable" legend's False/True color assignment is not
#     legible at this raster resolution. The description states that the two PSZ-AC rows are
#     shaded distinctly and identifies them as the applicable types by cross-checking the body
#     text (Section 3.1: applicable to 'PSZ-AC with gas coil' and 'PSZ-AC with electric coil',
#     24% + 12% = the stated 36% of stock floor area) rather than by reading the swatch colors.
#     The absolute Stock Floor Area and Stock Number of Buildings columns are dense; only the
#     top row's values (~15.1 billion sqft, 1.89 million buildings) are transcribed.
#   - Figure 12 (000013): per-state COP values on the two choropleths are small. The value range
#     (~1.7-2.8) and the north-cold/south-warm geographic trend are solid; specific state-level
#     assignments are provisional.
#   - Figures 7, A-1 (000008, 000014): bar TOTALS are high confidence (and 4865 - 4517 = 348 TBtu
#     matches the 7.2% savings stated in the body text, which corroborates the reads); the
#     individual stacked-segment values are provisional.
#   - Figure 6 (000007): the source legend misspells "Measured Data" as "Meaured Data"; quoted as
#     printed. The horizontal dashed "Minimum Flow" line is reported at its plotted position
#     (power multiplier ~0.40) without interpreting what flow limit it encodes.
