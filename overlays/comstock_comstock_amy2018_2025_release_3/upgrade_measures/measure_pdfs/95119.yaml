    Figure 8. Three-panel stacked bar chart of national annual utility bills by fuel for the baseline and the two HP-RTU measure scenarios, under maximum, mean, and minimum electricity rates
  description: |-
    Figure 8 has three side-by-side panels titled "With Max Electricity Rate", "With Mean Electricity Rate", and "With Min Electricity Rate", each stacking annual utility bills in billion USD (2022) by fuel -- electricity, natural gas, propane, fuel oil -- for the Baseline, HPRTU_Std_Perf, and HPRTU_Lab_Data scenarios. Totals are printed above each bar with percent change from baseline in parentheses. Max electricity rate: 144, then 140 (-3%), then 140 (-3%). Mean electricity rate: 127, then 122 (-4%), then 122 (-4%). Min electricity rate: 112, then 107 (-4%), then 107 (-4%). The two measure scenarios are indistinguishable at this scale. Savings come almost entirely from the natural gas segment, which drops from 17 to 14 billion USD in all three panels, while the electricity segment barely moves (125 to 125, 108 to 107, and 93 to 92 billion USD). Unlike a resistance-heating retrofit, the heat pump's efficiency keeps the added electric load small enough that displacing gas produces a net bill reduction of 3%-4% (roughly 3 to 4 billion USD) across every rate assumption. Note this includes buildings not applicable to the measure.
