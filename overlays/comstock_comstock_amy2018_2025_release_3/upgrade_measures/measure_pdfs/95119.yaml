    Figure 7. Stacked bar comparison of annual site energy consumption by end use and fuel across the ComStock baseline and the HP-RTU standard performance and lab data measure scenarios
  description: |-
    Figure 7 is a stacked bar chart of annual site energy consumption in trillion British thermal units (TBtu), segmented by end use and fuel with an 18-entry legend, for three scenarios with totals printed above each bar: Baseline 4865 TBtu, HPRTU_Std_Perf 4516 TBtu, and HPRTU_Lab_Data 4517 TBtu. The plot includes all ComStock buildings, including those not applicable to the measure. The two measure scenarios are within 1 TBtu of each other at stock scale, so substituting laboratory-measured performance data for the standard performance assumptions barely moves the national total; the lab-data case saves 348 TBtu, or 7.2%, against the baseline. Inside the bars the change is a fuel swap plus a fan-energy reduction: Heating Electricity rises from 260.1 TBtu in the baseline to roughly 357-358 TBtu, Heating Natural Gas falls from 727.0 to 701.1 TBtu, and Fans Electricity falls from 568.5 to roughly 490-498 TBtu. Untouched end uses hold flat, with Interior Equipment Electricity at about 740 TBtu and Interior Lighting at 440.4 TBtu in all three bars. Totals are read with high confidence; segment values are provisional.
