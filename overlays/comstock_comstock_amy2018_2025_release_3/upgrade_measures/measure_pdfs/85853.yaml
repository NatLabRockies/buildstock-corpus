# Hand-authored figure descriptions for measure_pdfs/85853.pdf
#
# 85853 is a webinar slide deck (NREL/PR-5500-85853, End-Use Savings Shapes: Commercial
# 2023 Release 1). docling extracts each slide's picture as a bare ![](...) ref with no
# caption, so its results charts, workflow diagrams and website screenshots are invisible to
# retrieval and unreadable without the image. Each figure below is image-anchored (see the
# figures: schema in overlays/README.md): the ref is rewritten with a hand-written alt, and
# substantive figures also get a description paragraph injected below for retrieval.
#
# Authoring notes:
#   * method is vision-description, not vision-transcription: these interpret a picture
#     rather than copy legible cells. Numbers were read off the charts and should get a
#     human QA pass before this is treated as a release record.
#   * Decorative images (logos, stock photos, dividers, icons) get a short functional alt
#     and decorative: true, and no description paragraph.
#   * Every entry pins the on-disk PNG sha256; if upstream repoints a bitmap the build drops
#     that injection and warns rather than shipping a stale description.

