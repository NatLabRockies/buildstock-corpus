# Hand-authored table transcriptions for measure_pdfs/86103.pdf
#
# Four tables in this report are lost in extraction. Tables 1, 2 and 3 are rasterized regions
# with no text layer, so docling keeps the caption and emits nothing beneath it; those are
# anchored to the PDF's own sha256 and page. Table 5 did come through as a picture, so it is
# anchored to that bitmap and replaces the image ref. See overlays/README.md for the schema.
#
# Authoring notes:
#   * Tables 1 and 2 are printed transposed — field names run down a shaded left-hand column
#     and each option gets a column. That is transcribed as-is: the first printed row becomes
#     the pipe table's header row. Row labels keep the source's lowercase styling ("model",
#     "manufacturer", "LG electronics").
#   * Table 2 carries meaning in cell shading, which a pipe table cannot express. The values
#     are transcribed plain and the legend plus a cell-by-cell shading note follow the table
#     as separate paragraphs, so nothing is silently dropped and nothing is invented either.
#     Its three "older VRF" columns share a header, so the shading note names manufacturers.
#   * Table 3 is decomposed into its own three row groups (cooling / heating / other) and the
#     merged group label is repeated per row. The source leaves the first two header cells
#     blank; "Group" and "Curve Name" are supplied so the pipe table is well-formed. The check
#     marks are transcribed as printed (√) rather than collapsed into one "assignment" column.
#   * Table 5 has no header row at all — the fuel names sit in a shaded label column. "Fuel"
#     and "On-Site Fossil Fuel Emissions Factor" are taken from the caption for the same
#     reason. Its footnote is transcribed because it did not survive extraction as prose in
#     this document (it does in nine sibling measure docs, but not this one), and its marker
#     is written "(a)" rather than as a superscript.

# Figure notes (figures: block, added 2026-08-22):
#   * 29 of this doc's 37 extracted images are real figures. Skipped as decorative: image_000000-
#     image_000005 (six NREL cover photo tiles) and image_000006 (NREL wordmark). image_000020 is
#     NOT in this block - it is the Table 5 bitmap the tables: block above anchors on, and figures
#     run after tables so that replacement wins. 7 decorative + 29 figures + 1 table bitmap = 37.
#   * Results are numbered Section 6.x in this document, not 5.x, so the pointers cite Sections
#     6.2-6.5. There are no stock-level results tables (Tables 7-9 are single-building examples),
#     so Figures 14-25 point at their narrative sections rather than a table.
#   * Figures 2, 4 and 13 are emitted with the caption BELOW the bitmap rather than above. For
#     Figure 2 the "(a) Three-pipe system example" / "(b) Two-pipe system example" sublabels also
#     survive as separate list items between the image and its caption.
#   * Figure 4 and Figure 13 are the SAME graphic printed twice (the ASHRAE DOAS discharge-
#     temperature schedule). The captions differ slightly and Figure 13's reads "recommendations
#     form ASHRAE DOAS Design Guide" ("form" for "from"). Both entries describe the chart and
#     cross-reference each other so either citation resolves.
#   * Figure 3 is a vendor data sheet; its shaded "recommended operating range" is described but
#     not measured, per the depth standard.
#   * Figure 23's rows are split on the raw column name applicability.hvac_vrf_hr_doas (True/False)
#     rather than a readable label, and the applicable-baseline case is not broken out separately.
#   * QA: Table 5's propane row again pairs 177.8 lb/MMBtu with 182.3 kg/MWh where ~275.7 is
#     expected - the tenth doc in the corpus with this shared-boilerplate error.

