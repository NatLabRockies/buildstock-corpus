# Hand-authored figure descriptions for measure_pdfs/95005.pdf (Batch E).
#
# 95005 documents the Geothermal Heat Pumps + High Efficiency Envelope package. docling extracts
# every picture as a bare ![Image](...) ref: the caption line survives above it, but the chart
# itself is invisible to retrieval. Each entry below rewrites the ref with a hand-written alt
# and injects a description paragraph beneath it. Schema and depth budget:
# overlays/FIGURE_DESCRIPTIONS_ROLLOUT.md (section 2.1 -- 40-70 words, alt <=120 chars, no
# corroboration against body prose).
#
# Scope: Figures 1-15 and A-1 (16 charts and diagrams) plus the Table 10 bitmap (index 000003),
# 17 entries. Deliberately not described: indices 000000-000001, the cover photo collage and
# the National Laboratory of the Rockies logo; and index 000002, the Table 4 bitmap already
# handled by the `tables:` block above.
#
# QA notes (vision reads; confirm before treating as a release record):
#   * Section 5.1 says Packaged GHP + Walls + Roof + Windows covers "61.7% of floor area";
#     Figure 2's printed data label reads 60.7% (confirmed on a 10x crop of the label). One of
#     the two is wrong. The entry uses the chart's own value.
#   * Table 10 has no text layer and no caption line -- its image ref sits bare at the end of
#     Section 3.8 -- so it is transcribed (method: vision-transcription) rather than described.
#     Unusually for this corpus, this copy prints the CORRECT propane value, 275.7 kg/MWh,
#     where most other measure docs print 182.3.
#   * Figures 7 and 8 use the same 15 climate-zone rows but their per-zone model counts differ
#     slightly (3A 11,556 vs 11,557; 5A 16,253 vs 16,241; zone 8 509 vs 503).
#   * Figure 12's pooled borehole-count axis stops at 13 boreholes per thousand ft2 while
#     Figure 14's zone-8 row runs to nearly 290. Consistent once whisker clipping is accounted
#     for (Section 5.8.1 gives a zone 8 median of 44), but the two axes cannot be compared by eye.
#   * Climate-zone rows here are clean: zone 7 appears once, with no 7A/7B split of the kind
#     recorded for 86599, 89340 and 89481.

