# Hand-authored table transcription for measure_pdfs/95005.pdf
#
# Table 4 is the California half of the wall-assembly pair on page 18. Its sibling Table 3
# extracted as a markdown table; Table 4 did not — docling classified it as a picture, so the
# caption survived with a bitmap under it. The entry is anchored to that bitmap and replaces the
# image ref. See overlays/README.md for the schema.
#
# Authoring notes:
#   * Not a vision read: the table still has a full text layer in the PDF, so all 576 values were
#     extracted with pymupdf's word boxes clustered by line, then spot-checked against a 250-dpi
#     render of the region. The cached bitmap is only 479x321, too coarse to read reliably, which
#     is the reason to go back to the PDF rather than transcribe the picture.
#   * Decomposed into one sub-table per wall type, which is how the source groups it (the wall
#     type is a merged cell spanning its nine energy-code rows). A single 36-row, 18-column pipe
#     table would be one ~4,700-character paragraph and chunk._pack would split it mid-row.
#   * The two title lines above the column headers are the table's own, not the caption, so they
#     are transcribed as bold lines rather than folded into the caption. "ft^2" is written the way
#     the PDF's text layer spells it.
#   * Values are transcribed as printed, trailing zeros included ("4.0", "8.0"), so they stay
#     comparable with Table 3 in the same document.

