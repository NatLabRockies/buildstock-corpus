# Hand-authored figure descriptions for measure_pdfs/89040.pdf (Batch E).
#
# 89040 documents the Variable Refrigerant Flow With 25% Upsizing Allowance for Heating measure.
# docling extracts every picture as a bare ![Image](...) ref: the caption line usually survives
# next to it, but the image itself is invisible to retrieval. Each entry below rewrites the ref
# with a hand-written alt and injects a description paragraph beneath it. Schema and depth
# budget: overlays/FIGURE_DESCRIPTIONS_ROLLOUT.md (section 2.1 -- 40-70 words, alt <=120 chars,
# no corroboration against body prose).
#
# Scope: the 21 images that carry content -- 20 figures (Figures 1-4, 6-17 and A-1 to A-4) plus
# one rasterized table. Deliberately excluded: indices 000000-000005 (cover photographs),
# 000006 (NREL logo) and 000007 (ComStock logo). The `tables:` block above is caption-anchored
# (source_pdf_sha256, no source_image), so it consumes no image index and nothing here overlaps
# it.
#
# QA notes (vision reads; confirm before treating as a release record):
#   * Figure 5 is DROPPED by the extractor. Its caption survives ("Figure 5. Narrative
#     description of upsizing algorithm in measure implementation") but docling emitted neither
#     an image nor text for it, and no image index falls between Figure 4's and the Table 2
#     bitmap. Same defect class as the dropped Figure 5 in measure_pdfs/86105.pdf; no overlay
#     entry can recover it. The 21 images account for 20 figures plus one table, so nothing
#     else is missing.
#   * image_000012 is the Table 2 bitmap, not a figure. Table 2 ("On-Site Fossil Fuel Emissions
#     Factors") has no text layer and survives only in the List of Tables, and the `tables:`
#     block above covers only Tables 1, 4 and 5. It is therefore transcribed here as
#     vision-transcription rather than described.
#   * Table 2 prints propane as 177.8 lb/MMBtu (182.3 kg/MWh). The metric figure is the
#     recurring corpus-wide error in this table -- measure_pdfs/95005.pdf prints the correct
#     275.7 kg/MWh. Transcribed as printed.
#   * Figure 9's bars are ordered Baseline, VRF 25pct upsizing, VRF original sizing -- the
#     reverse of Figures 7 and 8. Entries name the scenario rather than the bar position.
#   * Section 3.3 calls this measure "the window replacement scenario", a copy-paste from
#     another measure document.
#   * Figure 2 carries an overlaid callout claiming some percentage more pipe is required for
#     the equivalent 2-pipe system, but it is rendered too faintly to read at 8x and does not
#     reconcile with the printed totals (2,260 ft for 3-pipe against 5,320 ft for 2-pipe). The
#     entry gives the totals and omits the percentage.
#   * Chart titles read "Upgrade 06: VRF with 25pct Upsizing Allowance"; legends label the two
#     upgrade scenarios "VRF original sizing"/"VRF with regular sizing" and "VRF 25pct
#     upsizing"/"VRF with 25pct upsizing allowance". Entries use the chart's own label.

