# Hand-authored table transcriptions for measure_pdfs/89040.pdf
#
# Tables 1, 4 and 5 are rasterized regions with no text layer: docling keeps the captions and
# emits nothing beneath them. See overlays/README.md for the schema.
#
# Authoring notes:
#   * Table 1 shares its caption with Table 1 of measure_pdfs/86103.pdf but is a revised
#     version of it, not a reprint: the row labels are Title Case here, the operating
#     temperature cells carry both °F and °C, the dual piping/height units are printed
#     ft-first, and the refrigerant is spelled "R-410A". It is transcribed from this PDF's own
#     page render. Like 86103's, it is printed transposed, so the first printed row (the
#     manufacturer names) becomes the pipe table's header row.
#   * Table 4 has a two-level header: "Before upsizing" and "After upsizing" each span five
#     columns. A pipe table has one header row, so the group name is folded into each column
#     name ("Before upsizing: Design Capacity [W]"). Note the two groups do not list the same
#     columns in the same order — "Capacity Change from Original Sizing [%]" appears only under
#     "After upsizing", in second position.
#   * Table 4 is 11 columns wide and 27 rows deep, well past the chunker's paragraph limit, so
#     it is decomposed along the seam the source already rules: three sub-tables of three
#     indoor units each. Its folded header is long enough that each sub-table lands at 1,349 of
#     the 1,400 characters a paragraph may hold — adding a fourth unit to any of them, or
#     lengthening the header, would push it over, so split further rather than growing these.
#   * Table 4 gives each indoor unit three rows and only the cooling-coil row carries the
#     design capacity, load coverage, CFM/ton and capacity-change values; the heating and
#     backup rows leave those cells empty. That is transcribed as printed rather than filled
#     down, because the blanks are the source's statement that those quantities are reported
#     per unit and not per coil.
#   * The yellow fill on Table 4's "Capacity Change from Original Sizing" cells and the orange
#     and blue fills on its two group headers carry no legend and no meaning beyond marking the
#     column groups, so they are dropped rather than described.
#   * Table 5's first header cell is blank — the metric names sit in an unlabeled left-hand
#     column. "Metric" is supplied so the pipe table is well-formed. Its orange/blue cell fills
#     restate the "Impact on energy" value they sit behind, so they add nothing to transcribe.
#   * Table 5 prints the two capacity figures without thousands separators (51089, 59599) where
#     every other number in the table is formatted; that is left as printed.

