  alt: Grouped bar chart of annual GHG emissions by grid scenario and on-site fuel, baseline vs Package
    1
  description: |-
    Figure 4: grouped vertical bar chart of annual greenhouse gas emissions (MMT CO2e, y-axis 0 to 500) for the ComStock baseline versus Package 1 across three electricity grid scenarios - eGRID 2021, LRMER High RE Cost 15, LRMER Low RE Cost 15 - and three on-site fuels. Printed deltas are -16.9 (5.0%) for eGRID, -12.6 (5.0%) and -7.9 (4.9%) for the Cambium scenarios, and -9.8 (11.7%) for natural gas.
- source_image: 86599_images/image_000007_ef113aecfaea2636221ff21c33a0c5821eb76a6025864fcacbf8ab8b40d76505.png
