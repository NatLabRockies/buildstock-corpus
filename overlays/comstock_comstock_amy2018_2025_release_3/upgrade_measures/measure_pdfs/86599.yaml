# Hand-authored table transcription for measure_pdfs/86599.pdf
#
# Table 2 on p.13 is a rasterized region with no text layer: docling keeps the caption and emits
# nothing beneath it, so the extracted body runs straight from the caption into "## 2.3 Roofs".
# See overlays/README.md for the schema.
#
# Authoring notes:
#   * Vision read, unlike most of chunk 3's entries. The page carries the table as a single
#     embedded bitmap (xref 34, 1051x730) and has no text layer for it at all, so there are no
#     word boxes to cluster; the transcription comes from a 300-dpi render of the table region.
#   * 86602.pdf embeds the byte-identical bitmap of this same table on its own p.13
#     (sha256 fbe9f72d2cc511bccbfdbf37...), and that report reprints it under the same number.
#     Each is still transcribed and pinned against its own PDF, per overlays/README.md's rule
#     that a shared caption is not evidence of a shared table — here the two happen to agree,
#     which is a finding rather than an assumption.
#   * Cross-checked against Table 10 of 96598.pdf, which prints the same assembly R-values with
#     climate zone 3C added: every value matches once 3C is removed. Where the two disagree it is
#     only in printed precision - this table prints bare integers ("8", "1", "10", "20", "13",
#     "27") where 96598 prints "20.0", "13.0", "27.0". Transcribed as printed here.
#   * Decomposed into one sub-table per wall type, which is how the source groups it (the wall
#     type is a merged cell spanning its six energy-code rows). A single 24-row, 15-column pipe
#     table would be one ~2,900-character paragraph and chunk._pack would split it mid-row.
#   * The two lines above the column headers are the table's own title, not the caption, so they
#     are transcribed as bold lines rather than folded into it. The source sets the "2" of "ft2"
#     as a superscript; it is transcribed as the Unicode superscript.
#   * The first two rows of each block are stock averages (hence values like 4.4 and 6.7) and the
#     rest are code minima; the source marks that distinction only by the row labels, which are
#     preserved. Column-group shading is dropped - it restates the climate-zone header.

