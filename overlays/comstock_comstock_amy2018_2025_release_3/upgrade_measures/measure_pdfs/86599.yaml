  alt: Violin and box plots of site EUI savings by ASHRAE climate zone for Package 1
  description: |-
    Figure 7: horizontal violin-and-box plot of site EUI savings by ASHRAE climate zone, x-axis -15 to 35 kBtu/ft2, titled Upgrade 16: Package 1 (unweighted), with model counts per zone (1A n=5,533 down to 8 n=64). Medians sit just above zero in every zone and the distributions widen in colder zones such as 5A and 6A. The axis is absolute EUI, not the percent savings the caption states.
- source_image: 86599_images/image_000010_ab15bb29bff3c4578d0187407efba0e499913f9438bf56c398b4eb257317bbf1.png
