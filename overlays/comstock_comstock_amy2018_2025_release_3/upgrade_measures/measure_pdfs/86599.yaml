    Figure 2: two stacked bar columns comparing annual site energy consumption (TBtu, y-axis 0 to 4,750) for the ComStock baseline and Package 1, stacked by end use and fuel with a 20-entry legend. The total falls from 4,638 to 4,306 TBtu, about 7%. The largest reductions are natural gas heating (627.5 to 461.5) and electric heating (724.7 to 639.9); interior equipment is unchanged at 836.5.
