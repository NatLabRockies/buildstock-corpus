# Hand-authored figure descriptions for measure_pdfs/86599.pdf (Batch E).
#
# 86599 is the Wall and Roof Insulation and New Windows (High-Efficiency Envelope) package
# documentation. docling extracts every picture as a bare ![Image](...) ref: the caption line
# survives above it, but the chart itself is invisible to retrieval. Each entry below rewrites
# the ref with a hand-written alt and injects a description paragraph beneath it. Schema and
# depth budget: overlays/FIGURE_DESCRIPTIONS_ROLLOUT.md (section 2.1 -- 40-70 words, alt <=120
# chars, no corroboration against body prose).
#
# Scope: Figures 1-8 and A-1 through A-4 (12 charts), plus the Table 7 bitmap. The two cover
# images (indices 000000-000001: NREL photo collage and logo) are deliberately not described.
#
# Table 7 (index 000002) is a legible table bitmap with no text layer and no separate table
# overlay entry, so it is transcribed (method: vision-transcription) rather than described --
# otherwise its emissions factors would be lost to retrieval entirely.
#
# QA notes (vision reads; confirm before treating as a release record):
#   * Figure 6's caption says "percent savings" but the x-axis is a fraction running -0.65 to
#     0.00 -- every model shows a lighting penalty, not a saving. Flagged in the description.
#   * Figure 7's caption says "site energy use intensity savings distribution"; the axis is
#     absolute kBtu/ft2. It also lists 7 and 7A as separate climate-zone rows (a known upstream
#     issue, seen in 89340 and 89481 too).
#   * Figure 8's caption says "Maximum daily peak timing by season"; the x-axis plots peak
#     MAGNITUDE in W/ft2. The body text agrees with the axis, not the caption.
#   * Figure A-4 is captioned "Site annual electricity consumption ... by building type" but its
#     y-axis reads "Site Energy Total Energy Consumption (TBtu)", so it does not pair with A-3.
#   * Table 7's propane row prints 177.8 lb/MMBtu against 182.3 kg/MWh; 177.8 lb/MMBtu converts
#     to ~275 kg/MWh. Same error already confirmed in seven other measure PDFs.

