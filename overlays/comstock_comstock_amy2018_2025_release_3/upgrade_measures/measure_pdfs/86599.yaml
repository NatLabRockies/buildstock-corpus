  description: |-
    Figure 8: horizontal violin plot of maximum daily peak magnitude (W/ft2, x-axis 0 to about 320) for winter, summer and shoulder seasons, with baseline and Package 1 drawn as paired violins per season. The paired distributions are nearly identical, matching Section 5.7's statement of minimal peak change. The x-axis is magnitude, not the peak timing named in the caption.
- source_image: 86599_images/image_000011_85e105b586d6e0e31943d29ba96451071ae0d81e68b1829c5989ffd2ff79f10e.png
