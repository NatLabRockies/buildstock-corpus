  description: |-
    Figure 3: horizontal bar chart of average percent site energy savings by observed measure combination, x-axis 0 to 14%. The full Window+Roof+Walls combination averages 10.7% savings and Window+Roof averages 5.6%; the Not Applicable row is empty. Section 5.3 discusses why the three-measure combination roughly doubles the two-measure result.
