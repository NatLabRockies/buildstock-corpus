  description: |-
    Figure A-1: grouped vertical bar chart of site annual natural gas consumption (TBtu, y-axis 0 to about 320) by census division, baseline versus Package 1. East North Central is largest, falling from roughly 310 to 265 TBtu; Middle Atlantic drops from about 200 to 168; Pacific is nearly unchanged. Every division shows a reduction. Figure 2 carries the stock total.
