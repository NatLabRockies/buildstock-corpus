  alt: Bitmap of Table 7, On-Site Fossil Fuel Emissions Factors, in lb/MMBtu and kg/MWh
  description: |-
    Table bitmap, transcribed. Title: "Table 7. On-Site Fossil Fuel Emissions Factors". Rows: Natural Gas, 147.3 lb/MMBtu (228.0 kg/MWh); Propane, 177.8 lb/MMBtu (182.3 kg/MWh); Fuel Oil, 195.9 lb/MMBtu (303.2 kg/MWh). Footnote: "lb = pound; MMBtu = million British thermal units; kg = kilogram; MWh = megawatt-hour". No text layer exists for this table, so its factors survive only in this bitmap. The propane kg/MWh value is the known corpus-wide error - 177.8 lb/MMBtu converts to about 275 kg/MWh.
