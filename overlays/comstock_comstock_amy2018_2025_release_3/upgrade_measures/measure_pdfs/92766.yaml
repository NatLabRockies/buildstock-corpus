# Hand-authored figure descriptions for measure_pdfs/92766.pdf
#
# 92766 is the ComStock Standard Dataset Release webinar deck (Commercial 2024 Release 2). It is a
# SLIDE DECK, not a report: there are no numbered figure captions, so each entry anchors on the
# slide's own heading text instead of a "Figure N" label. docling extracts every picture as a bare
# ![Image](...) ref, so the charts are invisible to retrieval and unreadable without the bitmap.
# Each entry below rewrites the ref with a hand-written alt and injects a description paragraph
# below it for retrieval.
#
# Scope: figures only. 18 of the 50 extracted images are decorative and deliberately have no entry:
# the NREL and ComStock logos (000000, 000004, 000049), a gas-meter stock photo (000001 and 000003 -
# byte-identical), section pictograms and icons (000002, 000005, 000006, 000007, 000040, 000041,
# 000042, 000043, 000044), an NREL photo collage (000014), two publication cover thumbnails (000015,
# 000018), and one blank/near-empty bitmap on the Single Load Profile slide (000035).
#
# Depth: authored to the section 2.1 budget in overlays/FIGURE_DESCRIPTIONS_ROLLOUT.md - roughly
# 40-70 words per description (chart type, axes and units, series/legend, one headline number, and a
# pointer to where the values live). Printed data labels are not transcribed wholesale.
#
# Authoring notes:
#   * method is vision-description: these interpret a chart rather than copy legible cells. Numbers
#     were read off the bitmaps and should get a human QA pass before this is a release record.
#   * Every entry pins the on-disk PNG sha256; if upstream repoints a bitmap the build drops that
#     injection and warns rather than shipping a stale description.
#   * Degree signs are written "degF" and CO2e is written plainly to keep the sidecar ASCII.
#
# QA notes (vision reads; flag for a human pass):
#   * 000016 and 000017 are BPS TA Network dashboard screenshots whose axis and legend labels are
#     illegible at the extracted resolution - described structurally, with no values asserted.
#   * The three-panel utility-bill charts (000022, 000026, 000028, 000030) carry their percentages in
#     small orange callouts; only the headline figure is quoted per panel set.
#   * 000021's y-axis maximum (~3000 TBtu) is below the stock total quoted elsewhere in the deck
#     (4761 TBtu) - worth confirming whether that slide is applicable-stock only.
#   * 000035 is an empty/near-empty bitmap between the Single Load Profile chart and the Stock Peak
#     Load Savings slide - likely an extractor artifact rather than a real graphic.
#   * Line 156 of the processed markdown carries a stray bare "0" between the CBECS stacked bars,
#     left over from an axis label the extractor split off.

