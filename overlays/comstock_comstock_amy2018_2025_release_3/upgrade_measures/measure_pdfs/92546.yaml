  description: |-
    Figure A-3 (caption reads 'by building type', but this bitmap actually plots by census division). Grouped bar chart of site annual electricity total energy consumption (TBtu) by U.S. census division, y-axis 0 to about 700. Two bars per division (Baseline, dark blue; Ideal Thermal Loads, light blue) for New England, Middle Atlantic, East North Central, West North Central, South Atlantic, East South Central, West South Central, Mountain, and Pacific. Baseline electricity exceeds the Ideal scenario in every division; South Atlantic is the largest (baseline about 690, Ideal about 340). Electricity falls under the Ideal scenario because baseline electric cooling and fan energy are removed and cooling is re-metered as district cooling.
