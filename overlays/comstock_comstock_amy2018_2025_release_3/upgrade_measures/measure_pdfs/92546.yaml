  alt: Grouped bar chart of site annual natural gas consumption by building type, Baseline vs Ideal
    Thermal Air Loads
  description: |-
    Figure A-2. Grouped bar chart of site annual natural gas total energy consumption (TBtu) by ComStock building type, y-axis 0 to about 250. Two bars per type (Baseline, dark blue; Ideal Thermal Loads, light blue) across FullServiceRestaurant, QuickServiceRestaurant, RetailStripmall, RetailStandalone, SmallOffice, MediumOffice, LargeOffice, PrimarySchool, SecondarySchool, Outpatient, Hospital, SmallHotel, LargeHotel, and Warehouse. Baseline exceeds Ideal for every type; SecondarySchool is the largest (baseline about 245, Ideal about 25), with RetailStripmall, PrimarySchool, Hospital, and FullServiceRestaurant also high. Gas consumption falls sharply under the Ideal scenario as gas heating shifts to district heating.
