# Hand-authored figure descriptions for measure_pdfs/86602.pdf (Batch E).
#
# 86602 documents the combined High Efficiency Envelope, Interior Lighting and Heat Pump
# upgrade package (wall and roof insulation, new windows, LED lighting, HP-RTU and
# ASHP-Boiler). docling extracts every picture as a bare ![Image](...) ref: the caption line
# survives above it, but the chart itself is invisible to retrieval. Each entry below rewrites
# the ref with a hand-written alt and injects a description paragraph beneath it. Schema and
# depth budget: overlays/FIGURE_DESCRIPTIONS_ROLLOUT.md (section 2.1 -- 40-70 words, alt <=120
# chars, no corroboration against body prose).
#
# Scope: Figures 1-11 and A-1 through A-4 (15 charts). The five front-matter images (indices
# 000000-000004: four cover photo-collage fragments and the National Laboratory of the Rockies
# logo) are deliberately not described.
#
# Unlike 86599, Table 11 (On-Site Fossil Fuel Emissions Factors) extracted as TEXT here, so no
# table bitmap needs vision-transcription; every entry in this block is vision-description.
#
# The `tables:` entries above are unrelated to this block -- no figure entry anchors on a table
# bitmap, so the two do not interact.
#
# QA notes (vision reads; confirm before treating as a release record):
#   * Section 5.3 says emissions are avoided "across two of the three electricity grid
#     scenarios (not LRMER Low RE Cost 15)", but Figure 5 shows a reduction in all three
#     (-10.0 MMT, 6.2%, for LRMER Low RE Cost 15) and the very next sentence gives the range
#     as "between 6.2% and 9.7%", which includes it. The parenthetical looks wrong.
#   * Section 5.6 says the winter and shoulder peaks "are shifted later in the day by several
#     hours" and in the same sentence attributes the shift to morning electric heating. Figure
#     11's Package 3 violins appear to gain a mid-morning mode, i.e. EARLIER. Direction worth
#     a human check; the entry for Figure 11 quotes the prose rather than asserting a direction.
#   * Figure 8's caption says "percent savings" but the x-axis is a fraction (-0.65 to 0.00),
#     and every plotted model is a penalty -- the axis holds no positive values.
#   * Figure 9's model counts (site n=9,544) are two orders of magnitude below Figure 6's
#     per-end-use counts (electricity cooling n=328,932), and its chart title reads
#     "Upgrade 07: High Efficiency Envelope plus HP and LED" where Figures 6, 7 and 10 read
#     "Upgrade 18: Package 3". Two different result sets may be mixed into one section.
#   * Figure 10 lists 7, 7A and 7B as separate ASHRAE climate-zone rows -- same upstream issue
#     already recorded for 89340, 89481 and 86599.
#   * Table 11's propane row again pairs 177.8 lb/MMBtu with 182.3 kg/MWh where ~275 is
#     expected (text extraction here, not a bitmap read).

