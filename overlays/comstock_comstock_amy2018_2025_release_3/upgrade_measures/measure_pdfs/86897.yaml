    Figure 12. Bar chart of mean site energy percent savings by ASHRAE 2006 climate zone, with a data label on every bar, highest in 3C at 5.5%, 7A at 5.3% and zone 8 at 5.2% and lowest in 2B at 1.1%
  description: |-
    Vertical bar chart with a percentage printed above each bar. Y-axis: Mean Site Energy Percent Savings, 0% to 6%. X-axis, 17 ASHRAE 2006 climate zones. Values: 1A 1.6%, 2A 1.9%, 2B 1.1%, 3A 2.6%, 3B 4.6%, 3C 5.5%, 4A 3.3%, 4B 3.4%, 4C 2.9%, 5A 4.2%, 5B 3.3%, 6A 4.9%, 6B 4.3%, 7 4.1%, 7A 5.3%, 7B 4.6%, 8 5.2%. The three highest are 3C, 7A and zone 8, exactly the zones named in Section 5.6, with 6A at 4.9% close behind; the three lowest are 2B, 1A and 2A, the hot zones where cooling dominates and reduced outdoor air buys the least. The pattern is broadly increasing with heating-dominated climate, consistent with savings being driven mainly by reduced heating load, with the marine zones 3C and 4C breaking the trend in opposite directions. Note that this axis is in true percent, unlike the fractional axes of Figures 6, 8 and 9. Note also that the zone list includes 7, 7A and 7B as three separate rows, a superset of the standard ASHRAE zone set.
