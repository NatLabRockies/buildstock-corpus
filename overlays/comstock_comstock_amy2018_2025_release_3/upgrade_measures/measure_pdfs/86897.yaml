  description: |-
    Box-and-whisker plots with dense outlier scatter, one per ASHRAE 2006 climate zone. Y-axis: Site Energy Consumption Percent Savings, minus 10% to 45%, in true percent. X-axis: 1A, 2A, 2B, 3A, 3B, 3C, 4A, 4B, 4C, 5A, 5B, 6A, 6B, 7, 7A, 7B, 8. Medians are similar across zones at roughly 1% to 4%, the point Section 5.6 makes, with the lowest in 2B and 1A and the highest in 3C, 6A, 7A and 7B. Interquartile ranges are narrow, typically 0% to 5% in the hot zones and about 1% to 8% in the cold ones. Upper outlier columns are long: 3C reaches about 44%, 6A about 41%, 4C about 40%, 5A about 38%, 5B about 37%, 4B about 36% and 3B about 35%. Negative tails are deepest in 4C (about minus 10%) and 3C (about minus 9%), with 5A and 5B near minus 8%. Section 5.6 says 3C and 4C contain the models with the highest savings; 3C is clearly the single widest distribution, though at this resolution 6A's upper outliers look comparable to 4C's.
