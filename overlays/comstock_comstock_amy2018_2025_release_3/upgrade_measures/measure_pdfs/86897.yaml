    Figure 5. Panel of 17 horizontal violin and box distributions titled Upgrade 08: DCV (unweighted), showing percent site energy savings by end use and fuel type on an axis running from minus 140% to 100%, with model counts from n=8 to n=234,645
  description: |-
    Horizontal violin plots with embedded boxes, one row per end use and fuel combination, panel title Upgrade 08: DCV (unweighted). X-axis: Percent Site Energy Savings by End Use (%), minus 140 to 100. Rows top to bottom with their n: Other Fuel Water Systems (n=59), Other Fuel Heating (n=9549), District Heating Water Systems (n=82), District Heating Heating (n=2532), District Cooling Cooling (n=1420), Natural Gas Water Systems (n=1552), Natural Gas Heating (n=161865), Electricity Water Systems (n=2812), Electricity Refrigeration (n=4392), Electricity Pumps (n=55594), Electricity Interior Lighting (n=29), Electricity Interior Equipment (n=8), Electricity Heating (n=109850), Electricity Heat Rejection (n=7035), Electricity Heat Recovery (n=2803), Electricity Fans (n=148702), Electricity Cooling (n=234645). The heating rows (other fuel, district heating, natural gas, electricity) carry the widest positive interquartile ranges, roughly 0 to 20% with long right tails reaching 100%; district cooling, heat rejection, cooling and fans cluster tightly on zero. Long negative tails (penalties) appear on natural gas heating (to about minus 100%), electricity pumps (to about minus 135%), electricity cooling (to about minus 145%) and district cooling (to about minus 80%). The n=29 lighting row is the known baseline anomaly of Section 5.5.4.
