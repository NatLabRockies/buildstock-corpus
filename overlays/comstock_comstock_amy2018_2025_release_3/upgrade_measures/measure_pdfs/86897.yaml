# Hand-authored figure descriptions for measure PDF 86897
# "Demand Control Ventilation" (ComStock 2025 release 3 upgrade measure, NREL/TP-5500-86897,
# Amy Van Sant and Chris CaraDonna, January 2024).
#
# 21 image refs in the extracted markdown. image_000000 (the NREL cover photo grid) and
# image_000001 (the NREL wordmark) are decorative and deliberately have no entry. The 19 entries
# below cover Figures 1-15 and Figures A-1 to A-4. Tables 1-4 all extracted as real markdown, so
# no vision-transcription entry is needed in this document.
#
# QA FLAGS - vision-derived numbers need a human pass before publication.
#
# * Figures 3, 4, 10, 11, 12 and 14 (000004, 000005, 000011, 000012, 000013, 000015) - HIGH
#   confidence, every asserted number is a printed data label read at 2-9x zoom, and each set
#   cross-checks against the prose: Figure 3's four labeled HVAC deltas reproduce the Section 5.3
#   bullets to the tenth (0.7, 15.2, 18.3, 72.5 TBtu) and its totals give 119 TBtu / 2.57%;
#   Figure 4's six pairs and six percentages reproduce Section 5.4 exactly; Figure 10's 17 bin
#   counts sum to 11,096 with the top bin at 4,126 = 37.2%, matching "only 37%"; Figure 11's
#   eight counts sum to 4,129 with Marine + Cold + Very Cold = 88%; Figure 12's top three are
#   3C 5.5% / 7A 5.3% / 8 5.2% and Figure 14's are RetailStandalone 7.1% / PrimarySchool 6.8% /
#   SecondarySchool 5.8%, both matching Section 5.6.
#
# * Figure 3's Heating Natural Gas band labels are white text on a hatched fill and are NOT
#   directly legible. 827.5 -> 755.0 was settled by three converging methods: a partial glyph read
#   at 22x, a geometric band measurement (53 px at 15.564 TBtu/px = 827.6), and the requirement
#   that the delta equal the 72.5 TBtu in Section 5.3 (72.5/827.5 = 8.76%, the stated 8.8%). The
#   Interior Equipment Natural Gas label is illegible by the same mechanism and is given only as
#   "about 280, unchanged" - it is a non-HVAC end use that DCV cannot affect.
#
# * Figure 5 (000006) - the 17 n values are legible at 2.2x and are asserted verbatim;
#   Electricity Interior Lighting (n=29) matches Section 5.5.4's "Twenty-nine models" exactly.
#   Per-row medians and interquartile ranges could NOT be extracted reliably (blue-box detection
#   found only 8 of 17 rows and no consistent row pitch), so the distributions are described
#   qualitatively and no median or IQR number is asserted.
#
# * Figures 6, 8, 9, 13, 15 (000007, 000009, 000010, 000014, 000016) - no data labels. All
#   quoted magnitudes are axis estimates and every quantitative conclusion is taken from the
#   Section 5.5/5.6 prose.
#
# * Figures A-1 and A-2 (000017, 000018) - no data labels; bar heights were measured
#   programmatically against tick-label calibration (2.03 TBtu/px and 1.37 TBtu/px). Two
#   independent corroborations: the A-1 baseline bars sum to about 1,265 TBtu and the A-2 baseline
#   bars to about 1,260 TBtu for the same quantity, and A-1's total reduction of about 77 TBtu
#   brackets the 72.5 TBtu of gas heating savings in Section 5.3. A-2's four flat bars
#   (both restaurant types, both hotel types) are exactly the four not-applicable types in
#   Figure 2.
#
# * Figures A-3 and A-4 (000019, 000020) - baseline bars measured the same way (2.87 and 4.27
#   TBtu/px, summing to 3,140 and 3,134 for the same quantity), but the DCV reductions are at or
#   below one pixel and are deliberately NOT asserted per category.
#
# * SOURCE DEFECT, high confidence: the sentence printed under Figure 10 (line 535 of the
#   extracted markdown), "82 of 289 (28%) models have economizers on all air loops", contradicts
#   both Figure 10 itself (4,126 of 11,096 = 37%) and Section 5.5.2's own "only 37% of models".
#
# * SOURCE DEFECT, high confidence: Section 5.5.2 says "Figure 4 shows that several models with
#   the DCV measure applied have electricity cooling penalties". Figure 4 is the greenhouse gas
#   chart; the cooling penalties are in Figure 5.
#
# * SOURCE DEFECT, high confidence: Section 4 says "Table 6 includes a list of output variables".
#   That is Table 4, and the document contains only four tables.
#
# * SOURCE DEFECT, moderate confidence: Figure 11's counts sum to 4,129 models while Figure 10's
#   all-loops bin, which should be the same population, is 4,126 - a three-model discrepancy.
#
# * Caption vs axis mismatch: Figures 6, 8 and 9 are titled "Percent Savings ... [-]" but are
#   plotted as 0-1 fractions (ranges 1.0 to -1.8, 1.0 to -0.5, and -3.0 to 0.0). Figures 12, 13,
#   14 and 15 are in true percent. The descriptions say so explicitly so a retrieved chunk cannot
#   be misread by a factor of 100.
#
# * Climate-zone list: Figures 6, 8, 12 and 13 all print 17 ASHRAE 2006 zones including 7, 7A
#   AND 7B - a superset of the standard set. This extends the 7/7A issue already noted in 89340
#   and 89481; 95014 prints a single "7" row.
#
# * Table 3's propane row prints "177.8 lb/MMBtu (182.3 kg/MWh)" where about 275.7 is expected,
#   the same bad pairing already recorded for 89340, 89341, 89481, 89133 and 92618. Not a figure,
#   noted here because this document was read end to end.
#
# * Section 5.1 / Figure 1 (000002): the figure does not visibly demonstrate what the text says
#   it confirms. Outdoor air is flat at 0.11 lb/s through every occupied window on all three
#   days, including day 3 when occupancy peaks at 1.77 versus 3.53 on day 2, so the trace shows
#   scheduled on/off behavior plus a morning start-up transient rather than occupancy tracking.
#   Verified by resolution argument: the source bitmap is 468x345, one pixel is about 0.00035
#   lb/s, and a 0.11 to 0.09 step would span roughly 57 px. The description states the discrepancy
#   rather than repeating the prose claim.
#
# * Executive summary (line 118) says "As office buildings ... DCV is not applied to these
#   building types", which reads as contradicting Figure 2, where offices are almost entirely
#   applicable=True. In context it is a statement about the ComStock BASELINE already having DCV,
#   not about measure applicability. Not carried into any description.
