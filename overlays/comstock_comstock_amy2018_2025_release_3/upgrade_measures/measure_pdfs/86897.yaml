    Vertical bar chart with a percentage printed above each bar. Y-axis: Mean Site Energy Percent Savings. X-axis, the 10 building types to which DCV is applicable, alphabetically. Values: Hospital 1.8%, LargeOffice 2.3%, MediumOffice 3.8%, Outpatient 3.5%, PrimarySchool 6.8%, RetailStandalone 7.1%, RetailStripmall 3.7%, SecondarySchool 5.8%, SmallOffice 3.6%, Warehouse 0.6%. The top three are retail standalone, primary schools and secondary schools, exactly as stated in Section 5.6, which attributes the retail result to those buildings having the highest design outdoor air flow rates among the applicable types. Warehouses are the clear low outlier at 0.6%, and hospitals are second lowest at 1.8%, consistent with their high year-round process and ventilation loads leaving little occupancy-driven outdoor air to trim. The four building types shown as not applicable in Figure 2, the two restaurant types and the two hotel types, are absent from this chart.
