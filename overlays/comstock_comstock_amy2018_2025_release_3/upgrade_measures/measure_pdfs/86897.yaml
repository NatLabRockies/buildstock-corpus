    Figure 2. Two-panel stacked bar chart of DCV applicability, with building model count by ComStock building type on the left and total stock weighted floor area on the right, where 44.02 billion square feet is applicable and 16.54 billion is not
  description: |-
    Two panels sharing an Applicability legend: red is False, teal is True. Left panel, Y-axis Building Model Count, 0 to 80K, X-axis 14 ComStock building types in alphabetical order. Fully red (no models applicable): FullServiceRestaurant about 16.7K, LargeHotel about 2.2K, QuickServiceRestaurant about 9.7K, SmallHotel about 2.9K. Mostly teal with a thin red cap: Hospital about 0.6K, LargeOffice about 3.8K, MediumOffice about 7.0K (teal to roughly 6.3K), Outpatient about 11.0K (teal to roughly 10.4K). Mixed: PrimarySchool about 5.2K (teal to roughly 3.0K), SecondarySchool about 4.8K (teal to roughly 2.0K), RetailStandalone 53K (teal to 46K), RetailStripmall 73K (teal to 55K), SmallOffice 64K (teal to 44.3K), Warehouse 85.5K (teal to 71.5K). Right panel, Y-axis Weighted Floor Area in square feet, 0B to 60B, a single stacked bar labeled 44.02B applicable (teal) and 16.54B not applicable (red), a 60.56B total; 44.02 of 60.56 is 72.7%, the applicability figure quoted in Section 5.2 and the executive summary. As Section 5.2 notes, the measure is not applied to restaurants or hotels, which is what the four all-red bars show.
