    Figure 3. Stacked bar comparison of annual site energy consumption by fuel and end use for the ComStock baseline at 4,638 TBtu and the DCV scenario at 4,519 TBtu, a 119 TBtu (2.6%) reduction concentrated in heating and cooling
  description: |-
    Two stacked bars, Baseline and DCV, Y-axis Annual Energy Consumption in TBtu from 0 to about 4,700, with the total printed above each bar: 4638 for Baseline and 4519 for DCV, a 119 TBtu difference or 2.57%, matching the 2.6% and 119 TBtu in Section 5.3. The 19-item legend, top to bottom, is Heat Rejection Electricity, Heat Recovery Electricity, Pumps Electricity, Refrigeration Electricity, Exterior Lighting Electricity, Water Systems Other Fuel, Water Systems District Heating, Water Systems Natural Gas, Water Systems Electricity, Heating Other Fuel, Heating District Heating, Heating Natural Gas, Heating Electricity, Interior Lighting Electricity, Cooling District Cooling, Cooling Electricity, Fans Electricity, Interior Equipment Natural Gas, Interior Equipment Electricity. Printed band values, baseline to DCV: Interior Equipment Electricity 836.5 to 836.5 (unchanged), Interior Equipment Natural Gas unchanged at about 280 in both bars, Fans Electricity 588.3 to 587.6 (0.7 saved, 0.1%), Cooling Electricity 724.7 to 709.5 (15.2 saved, 2.1%), Interior Lighting Electricity 451.0 to 451.0, Heating Electricity 197.6 to 179.3 (18.3 saved, 9.3%), Heating Natural Gas 827.5 to 755.0 (72.5 saved, 8.8%). Those four HVAC deltas reproduce the Section 5.3 bullet list exactly. All remaining bands are thin and unlabeled.
