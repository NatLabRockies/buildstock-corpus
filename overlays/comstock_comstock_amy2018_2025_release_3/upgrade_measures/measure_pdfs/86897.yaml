    Figure 4. Grouped bar chart of annual greenhouse gas emissions in MMT CO2e for the baseline versus DCV across three electricity grid scenarios and three on-site combustion fuels, with reductions of 1.1% to 1.2% for electricity and 5.9%, 8.3% and 10% for natural gas, fuel oil and propane
  description: |-
    Grouped bar chart, dark blue Baseline against light blue DCV, Y-axis Annual GHG Emissions in MMT CO2e from 0 to 500. A bracket labeled Electricity Grid Scenarios: Choose 1 spans the first three groups. Values are printed inside the bars and the delta above each pair. Electricity: eGRID 2021, 336.6 to 332.8, minus 3.8 (1.1%). Electricity: LRMER High RE Cost 15, 253.3 to 250.3, minus 3.0 (1.2%). Electricity: LRMER Low RE Cost 15, 161.1 to 159.1, minus 2.0 (1.2%). Natural Gas, 83.6 to 78.7, minus 4.9 (5.9%). Fuel Oil, 4.8 to 4.4, minus 0.4 (8.3%). Propane, 2.0 to 1.8, minus 0.2 (10%). Every value reproduces Section 5.4. LRMER is the Cambium long-run marginal emissions rate and RE is renewable energy; MMT is million metric tons. For a combined figure the text directs the reader to pick one electricity scenario and add all three on-site combustion fuels. Emissions avoided on the grid side come from lower fan and cooling electricity; the larger percentage reductions on the combustion side come from the reduced heating load created by conditioning less outdoor air.
