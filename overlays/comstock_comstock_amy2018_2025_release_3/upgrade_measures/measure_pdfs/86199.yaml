    Figure 3: two small bar panels - percent of stock area and percent of stock gas heat - each with a Models with Boilers and a Models without Boilers row, the orange segment marking the applicable portion. The caption "Figure 3. Measure applicability" is printed inside the bitmap. Section 4.1 gives 33% of stock floor area as applicable and 94% of boiler buildings.
