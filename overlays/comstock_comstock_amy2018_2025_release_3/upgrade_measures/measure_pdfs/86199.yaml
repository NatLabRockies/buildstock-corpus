    Figure 4: line chart titled Target Capacity Values for Different ASHP Sizing Options, heating load in Btu/hr on the left axis, cooling load on the right, outdoor temperature -10 to 90F across the bottom. A descending heating load line carries callouts for Option 4D at the design heating load, Option 4C at 17F, and an Options 4A/4B range from 80% to 125% of design cooling load. Reproduced from reference 6.
