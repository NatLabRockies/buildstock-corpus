  description: |-
    Figure 20: choropleth map shading each state by percentage electricity savings, values printed, nearly all negative because electricity use rises with the heat pump. The coldest states run -11% to -12.35% and the Southeast near -1%; Florida is the lone positive at 0.01%, which Section 6.7 attributes to the autosizing limitation in Section 4.4.
