# Hand-authored table transcriptions for measure_pdfs/86199.pdf
#
# Both tables on p.11 of this PDF are rasterized regions with no text layer. docling keeps
# the captions but emits neither a table nor a picture for them, so the numbers are absent
# from the extracted markdown entirely. Each entry below is transcribed from the rendered
# page and inserted below its caption at build time by overlay.py. See overlays/README.md
# for the schema and the review procedure.
#
# source_pdf_sha256 is the same hash fetch recorded for this PDF and the manifest stores as
# the artifact's input_sha256: if upstream ships a revised report, the build reports a stale
# overlay instead of injecting numbers that no longer match it.
#
# Authoring notes for Table 1:
#   * Decomposed into one sub-table per energy-code template family. As one 26-row table it
#     is a single ~3,400-char paragraph, which the chunker would hard-split mid-row.
#   * Merged EFFFPLR and Notes cells are repeated on every row they span, so each row is
#     readable on its own.
#   * The Notes cell spanning all eight 90.1-2013 and 90.1-2016 rows is one merged cell in
#     the source holding both phrases; it is transcribed as "From 90.1-2013; From 90.1-2016"
#     on each of those rows rather than split per family, which the source does not do.
#   * Row 3 records Minimum Capacity 250,000,000 above Maximum Capacity 249,999,999. That
#     inversion is in the source and is left as printed.

