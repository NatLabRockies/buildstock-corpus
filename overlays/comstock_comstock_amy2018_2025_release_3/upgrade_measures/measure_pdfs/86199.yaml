# Hand-authored figure descriptions for measure_pdfs/86199.pdf (Batch E).
#
# 86199 documents the Boiler Replacement with Air-Source Heat Pump Boiler and Electric Boiler
# Backup measure. docling extracts every picture as a bare ![Image](...) ref: the caption line
# usually survives above it, but the chart itself is invisible to retrieval. Each entry below
# rewrites the ref with a hand-written alt and injects a description paragraph beneath it.
# Schema and depth budget: overlays/FIGURE_DESCRIPTIONS_ROLLOUT.md (section 2.1 -- 40-70 words,
# alt <=120 chars, no corroboration against body prose).
#
# Scope: all 23 non-decorative images (indices 000002-000024), covering Figures 1-22 and
# A-1 through A-3. The two cover images (000000 photo collage, 000001 logo) are deliberately
# not described. This document is diagram-heavy: seven of the entries are schematics, operating
# maps or performance-curve plots rather than results charts.
#
# The `tables:` entries above transcribe Tables 1 and 2 from the rasterized page 11. This
# figures: block is independent of them -- no figure entry anchors on a table bitmap.
#
# QA notes (vision reads; confirm before treating as a release record):
#   * Figures 10 and 11 arrive as ONE bitmap (index 000011), with Figure 10's caption printed
#     INSIDE the image between the two contour panels; only Figure 11's caption survives as
#     markdown text above it. The appendix does the same thing at index 000023 for Figures A-1
#     and A-2. Neither figure was dropped, but a reader of the extracted markdown sees one
#     image where the prose cites two figures, so both entries name both numbers.
#   * Index 000023 reprints index 000011's two panels. The bitmaps are byte-different, so each
#     is pinned separately.
#   * Figure 3's caption is printed inside its bitmap too, which is why no "Figure 3." line
#     appears in the extracted markdown.
#   * Figure 14's x-axis is labeled W/ft2 but runs to about 320 -- orders of magnitude above a
#     plausible peak demand intensity. Its caption also says "average daily maximum peak demand
#     comparison" while the chart plots full distributions, not averages.
#   * Section 6.7 opens "Figure 18 and Figure 19 show a state-by-state percentage natural gas
#     and electricity savings distributions"; the two state maps are Figures 19 and 20 (Figure
#     18 is the building-type bar chart). Prose error.
#   * This document has no On-Site Fossil Fuel Emissions Factors table, so the recurring propane
#     kg/MWh error does not arise here.

