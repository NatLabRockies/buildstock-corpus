  alt: Schematic of air-source heat pump boiler refrigerant cycle with a ref-to-water heating coil
  description: |-
    Figure 1: schematic of ASHP boiler operation. Refrigerant leaves a ref-to-air cooling coil, passes through a compressor to a ref-to-water heating coil that produces heating water, and returns through an electronic expansion valve (EXV) to the cooling coil. Green arrows mark the low-pressure side of the loop and orange the high-pressure side. Section 2 describes the cycle.
- source_image: 86199_images/image_000003_761fa8382000bfe82d38d118ecb461549bc748c6a5bdb4ad42ff0f41ec7a796a.png
  source_image_sha256: a44a8240c2777012b9bbc15d15d0828cba81f9fda97816a8c330c0004229c14b
  method: vision-description
  described_utc: '2026-08-21'
  alt: Scatter plot of boiler efficiency multiplier against boiler part load ratio for three curves
  description: |-
    Figure 2: scatter plot of boiler efficiency multiplier (y-axis 0 to 1.4) against boiler part load ratio (x-axis 0 to 1.4) for three curve families. One series is flat at 1.0 across the range; the other two fall to roughly 0.78 and 0.86 near zero part load and rise above 1.2 beyond a ratio of 1.2. Table 2 lists the coefficients.
- source_image: 86199_images/image_000004_d739b7b7fd422aa11e1a5a567ad20a7a9d3b7d588d6e7661feacf1c4b8b668b9.png
