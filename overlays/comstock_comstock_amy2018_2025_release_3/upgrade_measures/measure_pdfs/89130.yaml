# Hand-authored figure descriptions for measure_pdfs/89130.pdf (Batch E).
#
# 89130 documents the Electric Cooking Equipment measure. docling extracts every picture as a
# bare ![Image](...) ref: the caption line usually survives above it, but the image itself is
# invisible to retrieval. Each entry below rewrites the ref with a hand-written alt and injects
# a description paragraph beneath it. Schema and depth budget:
# overlays/FIGURE_DESCRIPTIONS_ROLLOUT.md (section 2.1 -- 40-70 words, alt <=120 chars, no
# corroboration against body prose).
#
# Scope: the 16 images that are figures (Figures 1-16). Deliberately excluded:
#   * indices 000000-000004 -- cover photos and the NREL logo;
#   * indices 000006, 000008, 000010, 000012, 000014 and 000016 -- the rasterized equipment
#     specification tables (Tables 2, 4, 6, 8, 10, 12), which the `tables:` block above already
#     owns and anchors on by source_image. Nothing here overlaps them.
#
# QA notes (vision reads; confirm before treating as a release record):
#   * Figure 12's caption reads "Percent site energy savings distribution for ComStock models
#     with the Max Tech HVAC package applied by end use and fuel type" -- a copy-paste from
#     another measure document. The chart's own title is "Upgrade 22: Electric Kitchen
#     Equipment (unweighted)".
#   * The charts label the scenario "Electric Kitchen Equipment" while the title and prose call
#     the measure Electric Cooking Equipment. Entries that name a series use the chart's label.
#   * Figures 1-6 are vendor product photographs and one annotated photo rather than data
#     graphics, so their descriptions are short and point at the rated-power tables instead.
#   * Figure 7's rotated x tick labels sit offset from their bars. The mapping used here puts
#     full_service_restaurant and quick_service_restaurant at 0%, which is what the caption's
#     CBECS caveat predicts, and hospital at the ~146% maximum.

