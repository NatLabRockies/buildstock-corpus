# Hand-authored table transcriptions for measure_pdfs/89130.pdf
#
# Tables 2, 4, 6, 8, 10 and 12 are pasted screenshots of retailer product listings. docling
# emitted each as a picture, so the caption survived and the specifications did not. Each entry
# is anchored to that bitmap and replaces the image ref. See overlays/README.md for the schema.
#
# Authoring notes:
#   * The numbers are not vision reads. Every product row in these tables still has a text layer
#     in the PDF (the screenshots cover only the product photographs and their names), so the
#     fuel and rated-input values were extracted with pymupdf's word boxes, clustered by line,
#     and then checked against the rendered bitmap. Only the product names come from the image.
#     `method` records both.
#   * Each table is printed transposed: field names run down the left column and each product
#     gets a column. The first printed row is the product row, so it becomes the pipe table's
#     header — its left-hand cell keeps the source's own "Image" / "Image [10]" label rather
#     than being replaced with an invented one.
#   * Every table is really two stacked blocks, gas above electric, with a repeated "Image" row
#     between them and a different set of rated-input rows in each (electric adds kW). They are
#     transcribed as two sub-tables so neither block inherits the other's header, and so the
#     chunker cannot split a header away from its rows.
#   * Product names are transcribed exactly as printed, including the ones the source truncates
#     mid-phrase ("... Range with Standard", "... Electric Floor Steamer -"). The listings'
#     photographs and their fuel/voltage badges are dropped; a note under each table records
#     that, per overlays/README.md, rather than describing the photos.

