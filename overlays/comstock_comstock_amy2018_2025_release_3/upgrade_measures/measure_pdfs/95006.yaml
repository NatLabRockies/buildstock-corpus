  described_utc: '2026-08-20'
  alt: |-
    Stacked column chart of annual stock site energy consumption by end use and fuel for the entire stock, Baseline vs three HP-RTU scenarios
  description: |-
    Figure 5. Stacked column chart of annual site energy consumption (TBtu) for the entire building stock, y-axis 0 to about 5000, comparing ComStock Baseline (total 4865) with HP RTU Std Perf (4516), HP RTU Std Perf + Roof (4501), and HP RTU Std Perf + Window (4514). Columns are segmented by end use and fuel per the legend. Legible segments: Interior Equipment Electricity 740.2 (unchanged), Fans Electricity 568.6 falling to about 498-500, Cooling Electricity 727.0 to about 685-701, Heating Natural Gas 260.1 dropping as heating fuel-switches to electricity, Water Systems Other Fuel 440.4, Water Systems Natural Gas 193.4. The three HP-RTU scenarios cut total site energy by roughly 7% versus baseline; the window variant saves slightly less than roof because a lower window SHGC raises heating load in cold climates.
- source_image: 95006_images/image_000008_98ee7f34ebc838f3302a6207ef95cbe57859fce4ecbaf2f6723a1e553f41867a.png
  source_image_sha256: 885d98484d624874aaca4322823e4744c81e6224cc81e82de182bfa6d4d4a85a
  method: vision-description
  described_utc: '2026-08-20'
  alt: Stacked column chart of annual site energy consumption for applicable buildings only, Baseline
    vs three HP-RTU scenarios
  description: |-
    Figure 6. Stacked column chart of annual site energy consumption (TBtu) restricted to buildings applicable to the upgrade, y-axis 0 to about 1800+, comparing ComStock Baseline (total 1890) with HP RTU Std Perf (1541), HP RTU Std Perf + Roof (1526), and HP RTU Std Perf + Window (1539). Segments per the legend: Interior Equipment Electricity 279.3 (unchanged), Fans Electricity 257.9 falling to about 185-190, Cooling Electricity 243.2 to about 201-217, Heating Natural Gas 173.0 dropping toward zero, and Heating Electricity rising from 81.6 (baseline) to about 178-191 as heating fuel-switches to the heat pump. Among applicable buildings the HP-RTU scenarios cut site energy by roughly 18-19%, with the window variant saving slightly less than roof.
- source_image: 95006_images/image_000009_d59703207f3582f9952f77aad4552541b15ec455b75ded57c5c21bdb125f720f.png
  source_image_sha256: 9292ca3d0c9280871de843a845d3a897a7c5063285abe91aa02b0f8a82f9d838
