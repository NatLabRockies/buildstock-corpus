  alt: |-
    Three-panel stacked bar chart of annual utility bill by fuel under maximum, mean, and minimum electricity rates, Baseline vs three HP-RTU scenarios
  description: |-
    Figure 7. Three-panel stacked bar chart of annual utility bill (Billion USD, 2022), y-axis 0 to about 150, under three electricity-rate assumptions (With Max, Mean, Min Electricity Rate). Each panel has four bars (Baseline, HP RTU Std Perf, +Roof, +Window) stacked by fuel (Electricity, Natural Gas, Propane, Fuel Oil). Max rate: Baseline 144 vs about 139-140 for the HP-RTU scenarios (roughly -3%). Mean rate: Baseline 127 vs about 122 (-4%). Min rate: Baseline 112 vs about 106-107 (-4% to -5%). Natural gas cost (about 17) falls as heating electrifies while electricity cost rises modestly, netting a low-single-digit percent total bill reduction.
- source_image: 95006_images/image_000010_8917c0405a75f37b0e7eec3917a25fc417e88b2312a0df7219832df04405f43f.png
  source_image_sha256: b75da29e506330333b7ccf2c5d9eb12065dd5bb51d9e2340e77821fa7a084a41
  method: vision-description
  described_utc: '2026-08-20'
  alt: |-
    Three-panel stacked bar chart of annual CO2e emissions by fuel under eGRID and two LRMER grid scenarios, Baseline vs three HP-RTU scenarios
  description: |-
    Figure 8. Three-panel stacked bar chart of annual CO2e emissions (MMT CO2e), y-axis 0 to about 460, under three grid-emissions assumptions (eGRID 2021, LRMER High RE Cost 15, LRMER Low RE Cost 15). Each panel has four bars (Baseline, HP RTU Std Perf, +Roof, +Window) stacked by fuel. eGRID 2021: Baseline 452 (Electricity 345, Natural Gas 102) vs about 428-430 (-5%), with natural gas falling to about 80 as heating electrifies. LRMER High RE Cost 15: Baseline 346 vs about 323-324 (-6% to -7%). LRMER Low RE Cost 15: Baseline 245 vs about 225-226 (-8%). Emissions reductions of roughly 5-8% depend on the marginal-grid assumption; fuel switching trades combustion gas emissions for grid electricity emissions.
- source_image: 95006_images/image_000011_c9b74dce26d0704290a2bece986d49504ffa7eca5d7238df3a65b3fe0af15ca5.png
  source_image_sha256: 7afc602142fa211c298dd25bf54517defaea7aa8ee5f493a6cd9aad9f54d80a7
  method: vision-description
  described_utc: '2026-08-20'
  alt: Violin and box plots of percent site energy savings by end use across applicable models
  description: |-
    Figure 9. Horizontal violin-plus-box plots of Percent Site Energy Savings by End Use (%), x-axis about -120% to 100%. Rows with model counts: Other Fuel Water Systems (n=102), Other Fuel Heating (n=3287), Natural Gas Water Systems (n=1239), Natural Gas Heating (n=16592), Electricity Water Systems (n=1427), Electricity Refrigeration (n=7257), Electricity Interior Equipment (n=31), Electricity Heating (n=14080), Electricity Heat Recovery (n=817), Electricity Fans (n=34334), and Electricity Cooling (n=34309). Combustion heating end uses (Other Fuel Heating, Natural Gas Heating) cluster near +100% savings because the heat pump eliminates on-site combustion; Electricity Heating shows large positive savings, and Electricity Fans and Cooling show moderate positive savings, with long negative tails for buildings in extreme climates or with small absolute loads.
- source_image: 95006_images/image_000012_7e73469a844f9fd0d9a4a50a0fa45a455e75d144bee2455362c351c76c9904ec.png
  source_image_sha256: da68760a106519ae883e0a2d8f766da804f72317252361ddb8ecc997dbb48654
  method: vision-description
  described_utc: '2026-08-20'
  alt: Violin and box plots of site EUI savings by end use across applicable models
  description: |-
    Figure 10. Horizontal violin-plus-box plots of Site EUI Savings by End Use (kBtu/ft2), x-axis about -80 to 120. Rows mirror Figure 9 with model counts (Other Fuel Heating n=3287, Natural Gas Heating n=16594, Electricity Heating n=33934, Electricity Fans n=34334, Electricity Cooling n=34320, etc.). The combustion-heating rows show positive EUI savings with long right tails (large absolute heating energy removed), while Electricity Heating shifts negative (an EUI increase from fuel switching to the heat pump); Fans and Cooling show small positive EUI savings. This absolute-intensity view complements the percentage view in Figure 9, showing heating dominates the aggregate impact.
- source_image: 95006_images/image_000013_4c41fa4c436c011631d64f65610e9a4f93c22aefc2b4ce19d681904d59e45b30.png
  source_image_sha256: ff1bc54e1ead2095923587635440b20513d036072145082486853f7c2489715c
