  alt: Horizontal bar chart of percentage of stock floor area assigned to each window type in the ComStock
    baseline
  description: |-
    Figure 2. Horizontal bar chart of the percentage of total stock floor area assigned to each window type in the ComStock baseline, x-axis % of Total Stock Floor Area 0% to about 18%. Bars from top (largest first): Single - No LowE - Clear - Aluminum (about 18%), Double - No LowE - Clear - Aluminum (about 13%), Single - No LowE - Clear - Wood, Single - No LowE - Tinted/Reflective - Aluminum, Double - No LowE - Clear - Wood, Double - No LowE - Tinted/Reflective - Wood, Double - LowE - Clear - Thermally Broken Aluminum, Double - LowE - Tinted/Reflective - Thermally Broken Aluminum, Triple - LowE - Clear - Thermally Broken Aluminum, and Triple - LowE - Tinted/Reflective - Thermally Broken Aluminum (smallest). The baseline is dominated by inefficient single- and double-pane clear aluminum-frame windows with no low-E coating, which the measure targets for replacement.
- source_image: 95006_images/image_000004_005c290c2a3b00cb9088681f340b96eb55ef02b6220bed573440e5bc19839e8a.png
  source_image_sha256: fc22882aeed8bfe7b38d8f9b78b45baad387c89c1d72d55392294bdda8ec1c81
