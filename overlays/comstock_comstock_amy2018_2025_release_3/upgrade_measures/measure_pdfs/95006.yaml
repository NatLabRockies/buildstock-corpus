  described_utc: '2026-08-20'
  alt: Violin and box plots of site EUI savings by ASHRAE climate zone across applicable models
  description: |-
    Figure 11. Horizontal violin-plus-box plots of Site EUI Savings by Climate Zone (kBtu/ft2), x-axis about -10 to 80, titled 'Upgrade 7.0: HPRTU_Std_Perf_w_Window (unweighted)'. Rows are ASHRAE climate zones with model counts: 1A (n=794), 2A (n=1768), 2B (n=1082), 3A (n=3302), 3B (n=3842), 3C (n=1277), 4A (n=5151), 4B (n=1547), 4C (n=443), 5A (n=5297), 5B (n=2780), 6A (n=3148), 6B (n=1350), 7 (n=2315), and 8 (n=242). Colder zones (5A, 6A, 7, 8) show the largest EUI savings (medians roughly 10-20 kBtu/ft2 with long right tails past 60), while hot zones (1A, 2A) cluster near 0-5, reflecting that heating electrification saves the most where heating demand is highest.
