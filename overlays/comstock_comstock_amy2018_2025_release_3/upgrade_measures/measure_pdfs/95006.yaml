  alt: Six-panel small-multiple chart of averaged daily heat-pump operating profiles, HP-RTU with vs
    without window upgrade
  description: |-
    Figure 4. Six-panel small-multiple chart of single-building model test results: daily profiles averaged over 365 days, x-axis Hour of day 0-24. Two series in each panel: HPRTU (StdPerf) red dotted and HPRTU (StdPerf) + Window blue solid. Panels: (1) Heat pump compressor power for heating [W], 0 to about 500; (2) Heat pump crankcase heater [W]; (3) Heat pump defrosting electricity [W]; (4) Heat pump compressor power for cooling [W], 0 to about 1000; (5) Heat pump cycling ratio, 0 to about 0.4; (6) Solar radiation into zone [W], 0 to about 400. The +Window case slightly lowers heating and cooling compressor power and reduces transmitted solar radiation versus the no-window HP-RTU, reflecting the improved envelope.
- source_image: 95006_images/image_000007_335d4666e32489025da675de75cd22192a7e5ed5c5ecdf46491003604c104acb.png
  source_image_sha256: e57cce7daf623ca0c7b73b68a33da724f0b833309eb2c82904219aa80cfc5003
