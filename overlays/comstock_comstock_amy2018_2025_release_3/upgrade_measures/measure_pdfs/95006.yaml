# Hand-authored figure descriptions for measure_pdfs/95006.pdf
#
# 95006 is the Heat Pump RTU with window upgrade (HP-RTU) measure documentation. docling extracts
# each picture as a bare ![Image](...) ref; the chart itself is invisible to retrieval. Each entry
# rewrites the ref with a hand-written alt and injects a description paragraph below it.
#
# Scope: figures only (Figures 1-11, images 000002-000004 and 000006-000013). The cover montage
# (000000) and NREL logo (000001) are omitted. NOTE for QA: image 000005 is NOT a chart -- it is a
# small legible TABLE bitmap (Table 3, on-site fossil fuel emissions factors), included with
# method: vision-transcription so the factors are retrievable (no separate table overlay exists).
#
# method vision-description entries: numbers were read off the charts and need a human QA pass.
# Least-certain reads: the small stacked segments in Figures 5/6/7/8. Every entry pins the
# on-disk PNG sha256.

