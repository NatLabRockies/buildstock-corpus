# Hand-authored figure descriptions for measure_pdfs/86601.pdf (Batch E).
#
# 86601 is the Interior Lighting and Heat Pump (LED + HP-RTU + ASHP boiler) package
# documentation. docling extracts every picture as a bare ![Image](...) ref: the caption line
# survives above it, but the chart itself is invisible to retrieval. Each entry below rewrites
# the ref with a hand-written alt and injects a description paragraph beneath it. Schema and
# depth budget: overlays/FIGURE_DESCRIPTIONS_ROLLOUT.md (section 2.1 -- 40-70 words, alt <=120
# chars, no corroboration against body prose).
#
# Scope: Figures 1-11 and A-1 through A-4 (15 charts). The two cover images (indices
# 000000-000001: NREL photo collage and logo) are deliberately not described. Table 5, the
# on-site fossil fuel emissions factors, extracted as text in this document, so unlike 86599
# there is no table bitmap to transcribe here.
#
# QA notes (vision reads; confirm before treating as a release record):
#   * Figure 5's LRMER Low RE Cost 15 pair shows a POSITIVE electricity delta (+1.9 MMT CO2e,
#     emissions go up) labeled "(-1.2%)". Same sign defect already flagged in 87746 Package 2.
#   * Figure 10 reuses Figure 9's caption verbatim ("Maximum daily peak timing by season") but
#     plots peak MAGNITUDE in W/ft2. The body text agrees with the axis, not the caption.
#   * Figure A-2 is the same chart as Figure 11 (stock natural gas by building type), reprinted
#     in the appendix under a second number. Both are described, each pinned to its own bitmap.
#   * Figure 7's x-axis spans -200 to 550 kBtu/ft2, so the bulk of the distribution is
#     compressed near zero; only the direction is read here, not per-row values.

