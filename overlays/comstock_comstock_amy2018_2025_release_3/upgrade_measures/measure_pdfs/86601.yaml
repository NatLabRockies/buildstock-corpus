  alt: Horizontal bar chart of Interior Lighting and Heat Pump applicability by measure combination
  description: |-
    Figure 2: horizontal bar chart of applicability for the Interior Lighting and Heat Pump package, x-axis fraction of floor area applicable (0 to 1.0), one row per observed measure combination. HP-RTU+LED covers 0.23, HP-Boiler+LED 0.22, LED Only 0.20, HP-RTU Only 0.13 and HP-Boiler Only 0.11, with 0.11 not applicable - so the package reaches 89% of stock floor area.
- source_image: 86601_images/image_000004_7ab8e41d451361fbbe298c7427a79ea892a019a3ce404aca08e6ff477e716718.png
