  alt: Stacked bar chart of annual site energy by end use and fuel, ComStock baseline vs Package 2
  description: |-
    Figure 3: two stacked bar columns comparing annual site energy consumption (TBtu, y-axis 0 to 4,750) for the ComStock baseline and Package 2, stacked by end use and fuel with a 20-entry legend. The total falls from 4,638 to 3,716 TBtu, about 20%. Interior lighting drops from 451.0 to 286.1 and gas heating from 627.5 to a residual band, while electric heating rises from 197.6 to 458.3.
- source_image: 86601_images/image_000005_5a5a4bf61a592e00dcd9d8ef7241819ffcb9ef94d7e09752851e3d03c8a3cbb4.png
