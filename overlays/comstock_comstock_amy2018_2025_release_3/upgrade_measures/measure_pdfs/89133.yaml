  alt: |-
    Violin and box plots of percent site energy savings by climate zone across the modeled stock for the Comprehensive GHP package
  description: |-
    Figure 8. Horizontal violin-plus-box plots of Percent Site Energy Savings by Climate Zone (%), x-axis about -100% to 100%, titled 'Upgrade 18: Comprehensive GHP (unweighted)'. Rows are IECC climate zones with model counts: 1A (n=5251), 2A (n=39670), 2B (n=5326), 3A (n=46206), 3B (n=24192), 3C (n=6994), 4A (n=68424), 4B (n=2264), 4C (n=9322), 5A (n=76536), 5B (n=13715), 6A (n=17910), 6B (n=2187), 7 (n=395), 7A (n=1716), and 7B (n=212). Most zones show positive median site energy savings (interquartile boxes roughly 10-40%) with long tails in both directions; colder zones (higher heating share) tend toward larger median savings. Confirms broadly positive but climate-dependent savings.
