  alt: |-
    Violin and box plots of percent site energy savings by end use across the modeled stock for the Comprehensive GHP package
  description: |-
    Figure 5. Horizontal violin-plus-box plots of Percent Site Energy Savings by End Use (%), x-axis about -160% to 100%, titled 'Upgrade 18: Comprehensive GHP (unweighted)'. Rows are end-use/fuel combinations with model counts, including Electricity Cooling (n=320253), Electricity Fans (n=305366), Electricity Heat Recovery (n=9255), Electricity Heat Rejection (n=9255), Electricity Heating (n=319002), Electricity Interior Equipment (n=6), Electricity Interior Lighting (n=16), Electricity Pumps (n=320269), Electricity Refrigeration (n=32657), Electricity Water Systems (n=50334), Natural Gas Heating (n=214797), Natural Gas Water Systems (n=57882), District Heating Water Systems (n=13), Other Fuel Heating (n=15527), and Other Fuel Water Systems (n=1420). Natural Gas Heating shows a large positive savings distribution (heating electrified off gas) and Electricity Cooling is positive, while Electricity Heating and Electricity Pumps skew strongly negative (electricity and pumping added by the ground-source heat pumps). (Dense rows -- flag exact counts for QA.)
- source_image: 89133_images/image_000013_fc026b05a86cc4f14d0f7483099ab2f7429c52fef42ef54f497f1fb9bb2f6818.png
  source_image_sha256: cad1add660ffb157a89b24a458a38a0d13f5f9708b70fb6e319503e968deeb40
