  alt: |-
    Three-panel stacked bar chart of annual greenhouse gas emissions under three grid scenarios, Baseline vs Comprehensive GHP
  description: |-
    Figure 4. Three-panel stacked bar chart of Annual GHG Emissions (MMT CO2e), y-axis 0 to about 420, under three grid-emissions scenarios (eGRID 2021, LRMER High RE Cost 15, LRMER Low RE Cost 15). Each panel has two bars (Baseline, Comprehensive GHP) stacked by fuel (Electricity, Natural Gas, Fuel Oil, Propane). eGRID 2021: Baseline 402 (Electricity 314, Natural Gas 81) vs Comprehensive GHP 351 (-13%) (Electricity 317, Natural Gas 33). LRMER High RE Cost 15: Baseline 325 (Electricity 237, NG 81) vs 279 (-14%) (Electricity 245, NG 33). LRMER Low RE Cost 15: Baseline 240 (Electricity 152, NG 81) vs 199 (-17%) (Electricity 165, NG 33). Natural gas emissions fall sharply as heating is electrified while electricity emissions hold roughly flat; net reductions are larger under cleaner (LRMER) grid assumptions.
