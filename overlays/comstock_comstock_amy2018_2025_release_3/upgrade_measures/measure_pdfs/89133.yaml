  alt: Horizontal bar chart of the percent of floor area applicable per GHP upgrade
  description: |-
    Figure 2. Horizontal bar chart titled 'Percent of Floor Area Applicable Per Upgrade', x-axis 0 to 60%. Bars: Packaged GSHP 56.1%, Not Applicable 19.6%, Hydronic GSHP 13.5%, and Console GSHP 10.8%. At least one measure from the Comprehensive GHP package was applicable to about 80% of stock floor area (20% not applicable), with the Packaged GSHP measure by far the most widely applicable.
- source_image: 89133_images/image_000010_8f7f65c756920bb051020c683d977a1740d306b8470700958f31443eaea12867.png
  source_image_sha256: 1cf9a23984b6521e204c8c2ec02fc6f3186d115dfe2552bb9468a5039d8eb75f
