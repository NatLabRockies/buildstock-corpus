# Hand-authored figure descriptions for measure_pdfs/89133.pdf (Comprehensive Geothermal Heat
# Pump Package: Hydronic GHP + Packaged GHP + Console GHP).
# Scope: figures + one embedded table bitmap. This End-Use Savings Shapes doc opens with a
# photo-grid cover: images 000000-000006 (NREL logos and stock photos) are ALL decorative and
# omitted. 000007 is a bitmap of Table 3 (On-Site Fossil Fuel Emissions Factors) embedded in the
# GHG-methods section -- captured with method vision-transcription. Figures 1-8 = images
# 000008-000015 (Figure 1 is a workflow diagram) with method vision-description (numbers read off
# charts, need QA). Least-certain reads: Figure 5 (000012) end-use rows and Figure 7 (000014)
# climate x season peak-intensity matrix have dense labels. See the Table 3 entry for a noted
# propane kg/MWh inconsistency in the source. Every entry pins the on-disk PNG sha256.

