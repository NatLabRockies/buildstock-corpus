  described_utc: '2026-08-20'
  alt: Box-and-whisker plots of maximum daily electric peak timing by season, Baseline vs Comprehensive
    GHP
  description: |-
    Figure 6. Box-and-whisker plots of Maximum Daily Peak Timing by Season (hour of day, x-axis 0 to 24), in three stacked panels (summer, winter, shoulder). Each panel has two rows (Baseline, Comprehensive GHP). In summer both scenarios peak in the afternoon (interquartile box roughly hours 12-15). In winter the baseline peak is spread across mid-day while the Comprehensive GHP peak shifts and widens toward morning/mid-day (box roughly hours 8-14) as electrified heating drives a new winter peak. Shoulder season is intermediate. Shows electrification mainly reshapes the winter peak.
- source_image: 89133_images/image_000014_0bfcdf699c05f656838864d210e834d868e6d4d74472be970aabcff6ef27f82a.png
  source_image_sha256: 83ccfae5d15d125c14c59e2413a85e36d0e48790687a0a81bc00144390347af9
