  described_utc: '2026-08-20'
  alt: Grouped bar matrix of median electric peak intensity by climate zone and season, Baseline vs
    Comprehensive GHP
  description: |-
    Figure 7. Grouped horizontal bar matrix of median electric peak intensity (W/ft2) by climate zone and season. Three value columns -- Median Summer, Median Winter, and Median Shoulder Elect. Peak W/ft2 -- with rows grouped by climate (Hot-Humid, Hot-Dry, Marine, Mixed-Dry, Mixed-Humid, Cold, Very Cold, Subarctic), each split into Baseline and Comprehensive GHP bars. Summer peak intensity falls from baseline to the GHP scenario in every climate (e.g. Hot-Humid about 3.8 to 2.7; Very Cold about 3.6 to 2.5). Winter peak intensity rises under the GHP scenario as heating is electrified (e.g. Very Cold winter about 3.5 versus a lower baseline), and shoulder peaks are intermediate. Illustrates the summer-peak reduction versus winter-peak increase trade-off of ground-source electrification. (Dense numeric matrix -- exact per-cell values are the least-certain reads in this doc; flag for QA.)
