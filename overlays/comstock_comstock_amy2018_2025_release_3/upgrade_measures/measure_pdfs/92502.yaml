  description: |-
    Grouped vertical bar chart of Electricity Total Energy Consumption (TBtu) with one pair of bars per ComStock building type, dark blue for Baseline and light blue for light_shed, y-axis to 450 TBtu. The 14 types along the x-axis are FullServiceRestaurant, QuickServiceRestaurant, RetailStripmall, RetailStandalone, SmallOffice, MediumOffice, LargeOffice, PrimarySchool, SecondarySchool, Outpatient, Hospital, SmallHotel, LargeHotel, and Warehouse. RetailStripmall is the largest electricity consumer at roughly 420 TBtu, followed by Warehouse near 378, SecondarySchool near 295, RetailStandalone near 285, PrimarySchool near 258, LargeOffice and LargeHotel near 215 to 220, Hospital near 208, SmallOffice near 205, FullServiceRestaurant near 200, MediumOffice near 185, Outpatient near 120, QuickServiceRestaurant near 72, and SmallHotel lowest near 35. Unlike the gas figures, here the light_shed bar is visibly shorter than the baseline in the applicable types, most clearly for Warehouse, the offices and the schools, and identical in the non-applicable retail, restaurant, hotel and health care types. Bars are unlabeled, so magnitudes are axis estimates.
