# Hand-authored figure descriptions for measure PDF 92502
# (Lighting Control for Load Shedding / "light_shed", ComStock Upgrade 25.0).
#
# Scope: the source markdown carries 18 image refs. Images 000000 and 000001 are the NREL cover
# photo grid and wordmark -- decorative, carrying no retrievable information, and deliberately NOT
# described. The 16 entries below cover every real figure that survived extraction.
#
# Tables: Tables ES-1 through ES-4 and Tables 1-6 all extracted as real markdown tables, so no
# vision-transcription entry is needed for this document.
#
# QA flags (least-certain reads and source/extraction artifacts, for the human review pass):
#  * DROPPED IMAGE. The document has 17 figures (1-13 plus A-1 to A-4) but only 16 image refs.
#    Figure 6 (max daily peak load reduction by month) and Figure 7 (median daily peak load
#    reduction by month) sit as two adjacent caption lines at ~549 and ~551 with a single image ref
#    after them at ~553. That surviving bitmap has a y-axis reading "Median Peak Savings [%]" and
#    its monthly medians (~3.5-4%) match the "Median Daily Peak of the Month" row of Table ES-4
#    (3.5%-4.1%) rather than the "Max Daily Peak" row (3.0%-3.8%), so it is Figure 7 and the
#    Figure 6 bitmap is genuinely absent from processed/. The overlay describes it as Figure 7.
#    Worth confirming against the PDF and, if the extractor is at fault, filing alongside the
#    known \resizebox table-drop issue. This is the second confirmed dropped-image case corpus-wide.
#  * Numeric inconsistency in the SOURCE, not the figure: Section 5.3 prose says the measure
#    "demonstrates 0.52% total site energy savings (22.5 TBtu)", but Table 6 in the same section
#    gives Total Energy 0.43% / 21.0 TBtu, and Figure 8's own column totals give 4838 -> 4817 = 21
#    TBtu (4838 * 0.43% = 20.8). The overlay follows Table 6 and the figure. Do not "fix" the prose.
#  * Caption/panel mismatch in the SOURCE: the Figure 9 caption prose says the bills are compared
#    "with respect to the maximum, mean, and median bills", but the figure's three panels are
#    labeled Max / Mean / MIN Electricity Rate, and the sentence immediately after the figure
#    confirms "maximum electricity rate, mean electricity rate and minimum electricity rate".
#    Figure 10 does use max/mean/median. Described as drawn.
#  * Figure 8 (000008) -- the Heating Natural Gas and Heating Electricity segment labels are the
#    least legible values in either panel and are NOT asserted; the description gives those changes
#    from Table 6 (-6.0 and -1.2 TBtu) instead. Every label that IS quoted cross-checks exactly
#    against Table 6: Interior Lighting 417.0 -> 392.4 and 210.9 -> 186.2 = 24.6/24.7 TBtu,
#    applicable Cooling 355.8 -> 352.8 = 3.0 TBtu, applicable Fans 269.3 -> 268.5 = 0.8 TBtu, and
#    totals 4838 -> 4817 / 2345 -> 2324 = 21 TBtu.
#  * Figures 3 and 4 (000004, 000005) -- all 28 printed percentages were legible and both sets sum
#    correctly: the six applicable floor-area shares total 68.00% and the six applicable
#    building-count shares total 59.29%, exactly matching Section 3.1. High confidence.
#  * Figure 1 (000002) -- only the 2015, 2017 and 2020 columns are quoted numerically. The 2025,
#    2030 and 2035 truth columns carry many small labels (some in leader-line callout boxes) that
#    are not reliably legible, so those columns are described only directionally.
#  * Figures A-1 to A-4 (000014-000017) -- no data labels on any bar, so all TBtu magnitudes are
#    axis estimates and should be treated as approximate. The baseline-vs-upgrade direction
#    (electricity down, gas up) is clear and is corroborated by Table 6.
#  * Figure 2 (000003) -- the "Small office BPR adjusted" series is flat at ~0.80-0.85 for all 24
#    hours, with no overnight setback, which looks anomalous next to the other three schedules.
#    Described as drawn; worth a sanity check against the underlying schedule data.
#  * Extraction artifacts in Table ES-1: the "Technology Description" row label repeats on every
#    bullet row, one bullet is split so that the word "from" lands on its own row, and the
#    "Applicability" / "Release" block after it lost its table structure entirely. Table ES-4 also
#    misspells February as "Fen".
