    Figure 7. Box-and-whisker distributions by calendar month of the percent reduction in the median daily electricity peak load relative to the ComStock baseline, for the default lighting load shed scenario
  description: |-
    Monthly box-and-whisker chart of percent peak load reduction across ComStock models for the default lighting load shed scenario. Twelve boxes are arranged left to right for Jan through Dec along the top axis, with a y-axis labeled Median Peak Savings [%] running from -10.0% to 20.0% and a horizontal reference line at 0.0%. Every month's interquartile box lies entirely above zero, spanning roughly 2% to 7% with the median line around 3.5% to 4%, consistent with the 3.5% to 4.1% monthly median values tabulated in Table ES-4. Upper whiskers reach 11% to 16% and are tallest in the winter and shoulder months. Lower whiskers dip below zero in most months, reaching about -7% in January and -6% to -7% in February, November and December, while summer months bottom out near -1% to -2%. The larger winter and shoulder-season variance is explained in the text: dimming lighting removes internal heat gain, which raises heating and fan load, and in buildings with natural gas heating the baseline electric load is low enough that a small fan increase produces a large negative percent change. Those negative-savings days are the minimum-electric-load days of the year, so their absolute impact is negligible.
