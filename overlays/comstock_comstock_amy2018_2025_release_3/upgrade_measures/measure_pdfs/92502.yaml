    Figure 9. Grouped stacked column chart of the stock annual utility bill in billions of 2022 USD by fuel, baseline versus light_shed, under three electricity rate assumptions: maximum, mean, and minimum electricity rate
  description: |-
    Stock annual utility bill comparison in billions of 2022 USD, shown as three side-by-side panels titled With Max Electricity Rate, With Mean Electricity Rate, and With Min Electricity Rate. Each panel holds a Baseline and a light_shed stacked column split by fuel: Electricity (blue), Natural Gas (yellow), Fuel Oil (green), Propane (orange). Totals are printed above each bar with percent change on the upgrade column. With Max Electricity Rate: 145 baseline versus 144 (-1%), electricity 124 to 123, natural gas 17 unchanged. With Mean Electricity Rate: 125 versus 124 (-1%), electricity 105 to 104, gas 17. With Min Electricity Rate: 111 versus 110 (-1%), electricity 91 to 90, gas 17. Fuel oil and propane are thin slivers and do not change. The pattern is uniform: the entire saving is a 1 billion USD reduction in the electricity bill, roughly 1%, driven by reduced lighting electricity consumption, with the non-electric fuel bills untouched because the rate scenarios vary only the electricity rate. Absolute bills scale down from the max-rate to the min-rate panel while the percent saving stays at about 1%.
