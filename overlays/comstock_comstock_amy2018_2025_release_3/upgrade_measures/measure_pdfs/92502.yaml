    Figure 13. Violin plot distributions of absolute site energy use intensity savings in kBtu/ft2 by end use and fuel type across applicable ComStock models for the lighting load shed upgrade, 17 rows with model counts
  description: |-
    Violin plot panel titled Upgrade 25.0: light_shed (unweighted), the absolute-magnitude companion to Figure 12. It carries the same 17 end-use-and-fuel rows, each suffixed Intensity, with identical model counts: Other Fuel Water Systems (n=113), Other Fuel Heating (n=9356), District Heating Water Systems (n=81), District Heating Heating (n=4819), District Cooling Cooling (n=3137), Natural Gas Water Systems (n=716), Natural Gas Heating (n=38806), Electricity Water Systems (n=995), Electricity Refrigeration (n=12112), Electricity Pumps (n=33600), Electricity Interior Lighting (n=80326), Electricity Interior Equipment (n=1), Electricity Heating (n=32937), Electricity Heat Rejection (n=12177), Electricity Heat Recovery (n=2414), Electricity Fans (n=65647), Electricity Cooling (n=71618). The x-axis, Site EUI Savings by End Use (kBtu/ft2), runs from -1 to 0.4, an asymmetric range set by the long negative tails. Electricity Interior Lighting is the largest positive distribution, centered near 0.2 kBtu/ft2. Other Fuel Heating, District Heating Heating and District Cooling Cooling show the widest spreads including substantial negative excursions toward -0.8 kBtu/ft2. Reading Figures 12 and 13 together separates large percent changes on small end uses from changes that matter in absolute terms.
