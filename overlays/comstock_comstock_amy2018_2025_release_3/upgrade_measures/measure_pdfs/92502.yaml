    Figure 3. Horizontal bar chart of each ComStock building type's share of total stock floor area, color-coded by whether the lighting load shed measure is applicable, totaling 68.00% applicable floor area
  description: |-
    Horizontal bar chart of the percent of total ComStock stock floor area held by each of 14 building types, with bars colored green where the lighting control for load shedding measure is applicable and gray where it is not. Building types are listed alphabetically down the y-axis and values are printed at the bar ends. The six applicable types are Warehouse 28.71%, Secondary School 8.84%, Primary School 8.72%, Large Office 8.54%, Small Office 6.77%, and Medium Office 6.42%, which sum to the 68.00% applicable floor area quoted in the text. The eight non-applicable types are Retail Standalone 8.57%, Retail Stripmall 8.10%, Large Hotel 5.66%, Hospital 3.79%, Outpatient 2.91%, Full Service Restaurant 1.52%, Small Hotel 0.98%, and Quick Service Restaurant 0.48%, summing to about 32%. Warehouse dominates the applicable set by area, holding more than the four office and school categories combined. The applicability choice follows the ASHRAE GEB guide, which excludes hospitals and laboratories on safety and environmental-control grounds and treats retail, restaurants and hotels as poor lighting-flexibility candidates for customer-satisfaction or occupancy-control reasons.
