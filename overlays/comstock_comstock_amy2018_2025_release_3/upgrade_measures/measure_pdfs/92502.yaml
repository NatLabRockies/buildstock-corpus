    Grouped vertical bar chart of Natural Gas Total Energy Consumption (TBtu) with one pair of bars per ComStock building type, dark blue for Baseline and light blue for light_shed, y-axis to 300 TBtu. The 14 types along the x-axis are FullServiceRestaurant, QuickServiceRestaurant, RetailStripmall, RetailStandalone, SmallOffice, MediumOffice, LargeOffice, PrimarySchool, SecondarySchool, Outpatient, Hospital, SmallHotel, LargeHotel, and Warehouse. SecondarySchool is the largest gas consumer at roughly 262 TBtu, followed by RetailStripmall near 222, FullServiceRestaurant near 195, PrimarySchool near 175, Hospital near 135, LargeHotel near 108, Warehouse near 103, RetailStandalone near 90, SmallOffice near 57, QuickServiceRestaurant near 48, LargeOffice near 44, MediumOffice near 37, Outpatient near 34, and SmallHotel lowest near 12. Each pair is nearly identical, with the light_shed bar marginally taller where the measure applies (offices, schools, warehouse) and unchanged in the non-applicable types, consistent with the small national gas heating penalty. Bars are unlabeled, so magnitudes are axis estimates.
