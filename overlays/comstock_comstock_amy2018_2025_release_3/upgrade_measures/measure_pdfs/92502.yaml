    Figure 4. Horizontal bar chart of each ComStock building type's share of total stock building count, color-coded by whether the lighting load shed measure is applicable, totaling 59.29% applicable buildings
  description: |-
    Horizontal bar chart of the percent of total ComStock building count held by each of 14 building types, with bars colored green where the lighting control for load shedding measure is applicable and gray where it is not. Building types are listed alphabetically down the y-axis and values are printed at the bar ends. The six applicable types are Warehouse 25.49%, Small Office 19.61%, Secondary School 6.27%, Primary School 5.14%, Medium Office 2.08%, and Large Office 0.70%, which sum to the 59.29% applicable building count quoted in the text (2,800,013 of 4,722,342 weighted buildings: 1,203,924 warehouses, 925,888 small offices, 296,142 secondary schools, 242,631 primary schools, 98,309 medium offices, 33,119 large offices). The eight non-applicable types are Retail Stripmall 14.27%, Retail Standalone 11.73%, Full Service Restaurant 4.95%, Large Hotel 3.34%, Quick Service Restaurant 2.51%, Outpatient 1.97%, Small Hotel 1.64%, and Hospital 0.29%. Comparing this chart with Figure 3 shows the count-based and area-based views diverge sharply for large buildings: Large Office is 8.54% of floor area but only 0.70% of buildings.
