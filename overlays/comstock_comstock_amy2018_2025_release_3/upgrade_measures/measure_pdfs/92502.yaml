  description: |-
    Violin plot panel titled Upgrade 25.0: light_shed (unweighted), showing the distribution of percent site energy savings across individual applicable ComStock models, one horizontal violin with an inner box plot per end-use-and-fuel category. The x-axis, Percent Site Energy Savings by End Use (%), runs from -100 to 100 with a vertical reference line at zero. Rows top to bottom with model counts: Other Fuel Water Systems (n=113), Other Fuel Heating (n=9356), District Heating Water Systems (n=81), District Heating Heating (n=4819), District Cooling Cooling (n=3137), Natural Gas Water Systems (n=716), Natural Gas Heating (n=38806), Electricity Water Systems (n=995), Electricity Refrigeration (n=12112), Electricity Pumps (n=33600), Electricity Interior Lighting (n=80326), Electricity Interior Equipment (n=1), Electricity Heating (n=32937), Electricity Heat Rejection (n=12177), Electricity Heat Recovery (n=2414), Electricity Fans (n=65647), Electricity Cooling (n=71618). Electricity Interior Lighting is the only row clearly displaced from zero, sitting around 5% to 15% savings on the largest sample. The heating rows sit slightly negative with long negative tails; the water systems, refrigeration and interior equipment rows are pinned at zero.
