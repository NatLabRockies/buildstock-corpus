# Hand-authored figure descriptions for measure_pdfs/95002.pdf
#
# 95002 is the "Reduced Thermostat Setbacks for Heat Pumps" (HP-RTU) measure documentation for
# ComStock 2025 release 3. docling extracts each figure as a bare ![Image](...) ref: the caption
# line survives above it, but the chart itself is invisible to retrieval and unreadable without
# the bitmap. Each entry below is image-anchored (see the figures: schema in overlays/README.md):
# the ref is rewritten with a hand-written alt, and a description paragraph is injected below it
# for retrieval.
#
# Scope: figures only - Figure 1, Figures 2-29, and appendix Figures A-1 through A-6, plus the
# Table 2 bitmap. The two cover/title images (indices 000000, 000001) are deliberately not
# described.
#
# Depth: authored to the section 2.1 budget in overlays/FIGURE_DESCRIPTIONS_ROLLOUT.md - roughly
# 40-70 words per description (chart type, axes and units, series/legend, one quantitative
# takeaway, and a pointer to the authoritative table). Values are not reconciled against the body
# text and unlabeled geometry is not resolved by zooming; the tables carry the per-segment numbers.
#
# Authoring notes:
#   * method is vision-description for the charts. Index 000003 is vision-transcription: it is the
#     "Table 2. On-Site Fossil Fuel Emissions Factors" table, which survives only as a bitmap and
#     has no table overlay, so its factors would otherwise be lost to retrieval.
#   * Every entry pins the on-disk PNG sha256; if upstream repoints a bitmap the build drops that
#     injection and warns rather than shipping a stale description.
#
# QA notes (vision reads; flag for a human pass):
#   * Table 2 (index 000003) pairs propane 177.8 lb/MMBtu with 182.3 kg/MWh, where ~275 kg/MWh is
#     expected from the lb/MMBtu value. This is the ninth ComStock measure doc carrying the same
#     upstream defect in the shared emissions-factor boilerplate; transcribed as printed.
#   * Figure 27(b) (climate zones 4B-8) has no image ref in the extracted markdown - only a bare
#     "(b)" line survives between Figure 27's single bitmap and its caption. The panel was dropped
#     by the extractor; the entry for index 000029 describes panel (a) only.
#   * The body paragraph introducing Figure 17 (line 537) opens "Figure 21 shows a distribution of
#     the fraction of reduction in maximum daily winter peak demand" - a wrong cross-reference, as
#     Figure 21 is the standard-setback end-use savings violin plot.
#   * Section 3.4 (line 381) says the grid scenarios compare the baseline against "the window
#     replacement scenario" in an HP-RTU document - the same stray-prose defect class already seen
#     in 89481.
#   * Bar-height reads in Figures A-1 through A-4 are approximate: those Tableau charts print no
#     data labels, so magnitudes are read off the axis.

