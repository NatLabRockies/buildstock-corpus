    Figure 5. Two side-by-side stacked column charts of annual energy consumption by end use in kWh for the single example building, Baseline versus Packaged GHP, with all loads on the left and HVAC loads only on the right
  description: |-
    Two stacked column charts comparing annual end-use energy consumption in kilowatt-hours for the single example building, a 17,500-square-foot office in Kansas City, Kansas (climate zone 4A), before and after the Packaged GHP upgrade. The left chart, Total Energy Consumption by End Use (kWh), covers all loads; its y-axis runs to 600,000 kWh, the Baseline column reaches roughly 510,000 kWh and the Packaged GHP column roughly 430,000 kWh. The right chart, HVAC Loads Only, uses a y-axis to 350,000 kWh; Baseline reaches roughly 330,000 kWh and Packaged GHP roughly 220,000 kWh, a much larger proportional reduction than the all-loads view. The shared legend covers Electricity Interior Equipment, Electricity Fans, Electricity Cooling, Electricity Interior Lighting, Natural Gas Heating, Electricity Heating, Natural Gas Water Systems, Electricity Exterior Lighting, and Electricity Pumps. The body text reports 22% total site energy savings for this building, a 94% decrease in natural gas and a 25% decrease in electricity; natural gas heating is eliminated and replaced by a smaller electric heat pump load, cooling falls (COP 4.3 to 6.7), and fan and pump energy rise. Gas water heating remains, so the building is not fully electrified. Its borefield holds 56 boreholes at 427 feet each.
