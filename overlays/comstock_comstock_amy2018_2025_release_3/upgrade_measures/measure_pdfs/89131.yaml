  alt: |-
    Figure 1. Schematic of the modeled packaged water-to-air GHP configuration: a ground loop with ground heat exchanger coupled through a water-water heat exchanger to a condenser loop that serves two zone water-to-air heat pumps, with an optional cooling tower drawn in a dashed box
  description: |-
    System schematic for the Packaged GHP measure, drawn as three stacked hydronic loops with supply and demand sides labeled at both ends of each loop and circulation pumps shown as circled symbols. The top loop is the ground loop, terminating in a Ground Heat Exchanger. It couples to the middle Condenser loop through a Water Water Heat Exchanger; the body text notes this heat exchanger is modeled as ideal. A Cooling Tower sits on the condenser loop inside a dashed orange box, marking it as optional auxiliary heat rejection used only when the user sizes the ground heat exchanger below the full cooling load. The condenser loop supplies two orange Water-to-air heat pump blocks, each containing a green Pre-heat coil, the electric coil that tempers outdoor air to the 50-55 degF minimum entering air temperature these coils require and that also serves as auxiliary heating when the borefield is sized below the full heating load. Each heat pump discharges into its own air loop: Air Loop 1 serving Zone 1, Air Loop 2 serving Zone 2. Blue arrows show flow direction. The two heat pumps are illustrative; every zone in the model gets its own water-to-air heat pump, and heating and cooling coils are configured never to run simultaneously.
