    Figure 6. Stacked column chart of the total estimated annual utility bill in USD by fuel for the example building, Baseline versus Packaged GHP, splitting median electricity bill from natural gas bill
  description: |-
    Stacked column chart titled Total Estimated Utility Bill by Fuel (USD) for the single example building, with two columns, Baseline and Packaged GHP, each split into a blue Median Electricity Bill segment and an orange Natural Gas Bill segment. The y-axis runs to about 45,000 USD. The Baseline column totals roughly 40,000 USD, of which about 31,000 USD is electricity and the remaining roughly 9,000 USD is natural gas. The Packaged GHP column totals slightly less, roughly 39,500 USD, and is almost entirely electricity with only a thin orange sliver of gas remaining. The visual point is that the two totals are nearly identical: the large increase in the electricity bill is offset by the near-elimination of the gas bill. The body text gives the components: after the upgrade the median annual electricity bill rose 24.5% (7,697 USD) and the average rose 19.8% (6,254 USD), while the natural gas bill fell 95.0% (8,051 USD), so the all-fuel total is expected to decrease slightly despite the added electric load. The text cautions that this outcome depends on which of several available electricity rate structures the building actually uses.
