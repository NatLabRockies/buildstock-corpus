    Figure 11. Horizontal bar chart of median electricity peak intensity in W/ft2 for the baseline and Packaged GHP scenarios, broken out by climate zone in rows and by season in three column panels (summer, winter, shoulder)
  description: |-
    Small-multiple horizontal bar chart of median electricity peak intensity in watts per square foot, with rows grouped by climate zone and, within each zone, a Baseline bar above a Packaged GHP bar. Three column panels give Median Summer Elect. Peak W/ft2, Median Winter Elect. Peak W/ft2, and Median Shoulder Elect. Peak W/ft2, each with values printed at the bar ends. Climate zone rows top to bottom: Hot-Humid, Hot-Dry, Marine, Mixed-Dry, Mixed-Humid, Cold, Very Cold, Subarctic. Summer peaks fall in every zone because the heat pumps cool more efficiently; Hot-Humid is the largest and clearest case, dropping from 3.8 to 3.0 W/ft2, and the body text gives 19% to 27% median reductions in all zones except Subarctic. The Subarctic summer panel is blank because that zone has no days classified as summer. In winter the heating-dominated Cold and Very Cold zones show a 17% to 22% increase in peak intensity from the added electric heating load, while cooling-dominated and moderate zones fall by up to 12% because HVAC efficiency gains outweigh the added heating. Shoulder-season peaks fall 9% to 17% in every zone. Subarctic winter and shoulder medians are unchanged, on a very small sample.
