    Figure 8. Grouped stacked column chart of annual greenhouse gas emissions in MMT CO2e by fuel, baseline versus Packaged GHP, under three electricity grid scenarios: eGRID 2021, LRMER High RE Cost 15, and LRMER Low RE Cost 15
  description: |-
    Greenhouse gas emissions comparison in million metric tons of CO2 equivalent (MMT CO2e), shown as three side-by-side panels, one per electricity grid scenario, each holding a Baseline and a Packaged GHP stacked column. Fuels are stacked and color-coded: Electricity (blue), Natural Gas (yellow), Fuel Oil (green), Propane (orange). Column totals are printed above each bar with percent change on the upgrade column. eGRID 2021: 402 baseline versus 370 (-8%), electricity rising 314 to 316 and natural gas falling 81 to 50. LRMER High RE Cost 15: 325 versus 297 (-9%), electricity 237 to 243, natural gas 81 to 50. LRMER Low RE Cost 15: 240 versus 215 (-10%), electricity 152 to 161, natural gas 81 to 50. The pattern is consistent: natural gas emissions fall 31 MMT (38.3%) in every scenario, electricity emissions rise 2 to 9 MMT (0.6% to 5.9%) because space heating is electrified, and net emissions avoided are 25 to 32 MMT (8% to 10%). Natural gas, fuel oil, and propane values are identical across the three panels because the scenarios differ only in the electricity grid. Absolute totals shrink from eGRID to Low RE Cost as the assumed grid gets cleaner, so the percentage reduction grows even as the absolute reduction narrows.
