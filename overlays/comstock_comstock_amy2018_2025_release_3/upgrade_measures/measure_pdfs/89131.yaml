    Figure 9. Violin plot distributions of percent site energy savings across applicable ComStock models for the Packaged GHP upgrade, one row per end use and fuel type with model counts, on an x-axis from -160% to 100%
  description: |-
    Violin plot panel titled Upgrade 02: Packaged GHP (unweighted), showing the distribution of percent site energy savings across individual applicable ComStock models, one horizontal violin with an inner box plot per end-use-and-fuel category. The x-axis runs from -160 to 100 percent savings with a vertical reference line at zero; positive is savings, negative is a consumption increase. Rows top to bottom with model counts: Other Fuel Water Systems (n=43), Other Fuel Heating (n=302), Natural Gas Water Systems (n=1570), Natural Gas Heating (n=5011), Electricity Water Systems (n=1378), Electricity Refrigeration (n=776), Electricity Pumps (n=7368), Electricity Heating (n=7336), Electricity Heat Recovery (n=205), Electricity Fans (n=6960), Electricity Cooling (n=7368). Natural Gas Heating and Other Fuel Heating are compressed against the 100% edge (near-complete space heating electrification), with a thin tail of low-savings warehouse models whose unconditioned storage retains gas unit heaters. Electricity Heating centers around 30% to 70% savings with a long negative tail. Electricity Cooling averages 30% to 40% savings. Electricity Pumps is far left, most models worse than -40%. Electricity Fans straddles zero, average change under 1%. Water systems, refrigeration and lighting barely move.
