    Figure 10. Box-and-whisker comparison of the hour of day at which the maximum daily electricity peak occurs, baseline versus Packaged GHP, in three stacked panels for summer, winter, and shoulder seasons
  description: |-
    Three stacked box-and-whisker panels, labeled summer, winter, and shoulder, comparing when the maximum daily electricity peak occurs for the ComStock baseline versus the Packaged GHP upgrade. Each panel has two rows under an Upgrade Name axis, Baseline and Packaged GHP, plotted against a shared x-axis of Maximum Daily Peak Timing by Season (Hour of Day) running 0 to 24. In all three seasons the interquartile boxes sit in the late morning to mid-afternoon window, roughly hours 10 through 15, with long whiskers stretching from the early morning into the evening and scattered outlier points near hour 22 and beyond. Baseline and upgrade distributions are similar in shape, so the effect is a shift in central tendency rather than a restructuring of peak timing. The body text reports that the winter peak moves earlier in the day because morning electric heating gains influence over winter peak load once heating is electrified, while the summer and shoulder peaks move slightly later, attributed to the ground-coupled heat pump's efficiency no longer tracking outdoor air temperature the way the baseline direct-expansion cooling equipment did.
