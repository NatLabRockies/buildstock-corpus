    Figure 4. Side-by-side OpenStudio plant loop diagrams for the initial load-calculation model and the final model, showing the three plant loops and the substitution of the vertical ground heat exchanger object for the temperature source object
  description: |-
    Paired OpenStudio plant-loop diagrams showing the same three-loop topology before and after ground heat exchanger sizing, with the GHEDesigner tool drawn between them. Both panels show three plant loops, labeled down the left margin of the left panel: Plant Loop 1, Heat Pump to Borefield Heat Exchanger; Plant Loop 2, Heat Pump to Heat Exchanger; Plant Loop 3, Heat Exchanger to Heating Coil. Object types are annotated above each component: OS:PlantComponent:TemperatureSource, OS:HeatPump:PlantLoop:EIR:Heating (WSHP), OS:HeatExchanger:FluidToFluid, OS:Coil:Heating:Water (heating coils, in red), and OS:GroundHeatExchanger:Vertical. In the left panel the ground side is a Temp Source object, the temporary dummy heat exchanger used for the initial load-calculation run, which regulates supply water temperature to meet demand every hour and reports the resulting hourly ground loads. An arrow labeled Timeseries ground loads runs from the left panel into the central GHEDesigner box; an arrow labeled G-function runs from GHEDesigner into the right panel, where the Temp Source has been replaced by a Vertical Ground HX object. Supply and demand sides are marked on each loop.
