  alt: |-
    Figure B-1. Grid of 17 histograms showing the distribution of soil thermal conductivity in W/m-K among ComStock model samples, one panel per IECC 2012 climate zone from 1A through 8AK
  description: |-
    Grid of 17 small histograms, one per IECC 2012 climate zone, showing how soil thermal conductivity is distributed across the ComStock sample within each zone. Panels are titled Climate Zone: 1A, 2A, 2B, 3A, 3B, 3C, 4A, 4B, 4C, 5A, 5B, 6A, 6B, 7A, 7AK, 7B, and 8AK. Each shares an x-axis of Thermal Conductivity (W/m-k) from 0 to 4 but has its own y-axis of Samples, so bar heights are not comparable between panels. Sample counts differ by orders of magnitude: 2A and 5A peak near 5,000-6,000 models, 3A and 3B in the low thousands, while 1A, 3C, 4C, 7A, 7AK, 7B, and 8AK hold only tens. Most zones are strongly unimodal with a sharp mode just below 2.0 W/m-K and mass concentrated between about 1.5 and 2.5 W/m-K. Zone 7B is the clear exception, distinctly bimodal with a large group near 0.5 to 1.0 W/m-K and a second group near 2.0 to 2.5 W/m-K. Zones 2B and 3C show broader, flatter left shoulders. Soil conductivity is drawn from the SMU Geothermal Laboratory dataset and is a GHEDesigner input that drives required borefield length, so these distributions govern how much ground heat exchanger each model receives.
