    Figure 3. Flow diagram of the ComStock GHEDesigner workflow, showing the two-pass simulation in which an initial load calculation feeds borefield sizing and the returned g-function feeds the final simulation
  description: |-
    Process flow diagram spanning a large horizontal arrow labeled ComStock simulation, showing that ground heat exchanger sizing is embedded in the ComStock run as a two-pass process. Reading left to right, the first box is Apply measure retrofitting existing system with GHP, feeding Initial load calculations. An arrow labeled hourly ground loads for borefield sizing runs down from the initial load calculation into the GHEDesigner Tool box at bottom center. GHEDesigner returns an arrow labeled g-function for ground heat exchanger, which feeds up into the Final simulation box at the right end. The figure makes clear that the borefield is not sized from a rule of thumb but from simulated hourly heating and cooling loads produced by a preliminary run of the retrofitted model, exported as a JSON file alongside borefield and soil property assumptions; GHEDesigner returns borehole count, borehole length and radius, ground properties, and g-function values, which re-enter the model before the annual simulation is rerun. Only that second run produces the results used for analysis.
