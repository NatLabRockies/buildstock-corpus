# Hand-authored figure descriptions for measure PDF 89131
# (Packaged Water-to-Air Geothermal Heat Pump Retrofit / "Packaged GHP", ComStock Upgrade 02).
#
# Scope: the source markdown carries 18 image refs. Images 000000-000004 are the standard NREL
# front-matter photo grid (staff/wind-turbine/lab photos, credited to Dennis Schroeder) plus the
# NREL wordmark -- decorative, carrying no retrievable information, and deliberately NOT described.
# Two of those are confirmed boilerplate by hash reuse across the corpus: 000003 is byte-identical
# to 89132's 000005, and 000004 (the wordmark) is byte-identical to 89341's 000001.
# The 13 entries below cover every real figure: Figures 1-12 in the body and Figure B-1 in
# Appendix B.
#
# Tables: Tables 1, 2, 3, 4, 5, 6, A-1, B-1 and B-2 all extracted as real markdown tables, so no
# vision-transcription entry is needed for this document.
#
# QA flags (least-certain reads and source/extraction artifacts, for the human review pass):
#  * Figure 7 (000011) -- the printed segment labels on the Heating Natural Gas band are the only
#    values in the chart that are not reliably legible at raster resolution, so the description
#    gives the change (-455.2 TBtu / 53.2%, from Section 5.2) rather than the two endpoints. Every
#    other quoted label cross-checks exactly against the body text: Cooling 667.3 -> 534.7 is the
#    stated 132.6 TBtu, Heating Electricity 175.2 -> 250.8 is the stated -75.6 TBtu, Fans 519.1 ->
#    541.5 is the stated -22.4 TBtu, and totals 4338 -> 3831 are the stated 507 TBtu / 11.7%. High
#    confidence overall.
#  * Figure 11 (000015) -- dense 8-zone x 3-season x 2-scenario value matrix. Only the clearest
#    anchor pair is quoted (Hot-Humid summer 3.8 -> 3.0, a 21% drop consistent with the stated
#    19-27% range); the remaining per-zone W/ft2 numbers are legible only approximately and are
#    NOT asserted. All directional and percentage statements come from Section 5.5.
#  * Figure 8 (000012) -- all 14 printed values were legible and the set is fully self-consistent
#    with Section 5.3 (gas 81 -> 50 = 31 MMT / 38.3%; totals -32/-28/-25 MMT = 8%/9%/10%;
#    electricity +2/+6/+9 MMT = 0.6% to 5.9%). High confidence.
#  * Figures 5 and 6 (000009, 000010) -- neither example-building chart carries data labels, so the
#    kWh and USD magnitudes given are axis estimates. The percentages quoted (22% site energy, 94%
#    gas, 25% electricity, 14.7% peak, 4.5% emissions, +24.5%/$7,697 electricity bill,
#    -95.0%/$8,051 gas bill) are from Section 5.1, not from the bitmaps.
#  * Figure 12 (000016) -- the panel title is clipped at the top of the extracted bitmap and its
#    upgrade number is not legible; Figure 9 (000013) prints the legible "Upgrade 02: Packaged GHP
#    (unweighted)", which is the number used. Also note the zone axis lists BOTH "7" (n=346) and
#    "7A" (n=1343) as separate rows -- an upstream labeling artifact also seen in 89341 -- and has
#    no zone 8 row even though Section 5.6 describes the trend as running to "8 - Subarctic".
#  * Source artifact, not a figure issue: Section 3.4 (around line 331) says the three grid
#    scenarios compare "the ComStock baseline and the window replacement scenario". This is a
#    copy-paste leftover from an envelope measure document; there is no window measure here.
#  * Extraction artifact: Table 5 (on-site combustion emissions factors) lost its header row, so
#    its first data row ("Natural gas | 147.3 lb/MMBtu (228.0 kg/MWh)") is rendered as the header.
#    That table also repeats the corpus-wide propane inconsistency -- 177.8 lb/MMBtu paired with
#    182.3 kg/MWh, where 177.8 lb/MMBtu is about 275 kg/MWh (89126 prints the self-consistent
#    275.7). Transcribed as printed elsewhere in the corpus; do not "fix" silently.
#  * Extraction artifact: the executive-summary savings table (around line 93) has its columns
#    rotated by one relative to its header row -- the "End Use" label lands in the last column.
#    The same five numbers appear correctly as a bullet list in Section 5.2, which is what the
#    Figure 7 description was checked against. Same defect as in 89132.
