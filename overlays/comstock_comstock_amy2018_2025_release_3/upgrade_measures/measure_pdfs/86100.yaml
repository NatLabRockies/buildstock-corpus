  alt: Bar chart of heating consumption savings by fuel for a PVAV gas-heat electric-reheat model
  description: |-
    Bar chart with y-axis Heating Savings for one model with 'PVAV with gas heat and electric reheat' (kBtu) from about -600K to 300K. Three bars: Natural Gas Heating +297,425 (apparent savings), Electricity Heating -582,637 (a penalty), and Natural Gas and Electricity Heating Savings combined -285,212. Gas alone suggests savings, but combining gas and electric shows the heating system consumes more energy after the LED measure, the expected behavior.
