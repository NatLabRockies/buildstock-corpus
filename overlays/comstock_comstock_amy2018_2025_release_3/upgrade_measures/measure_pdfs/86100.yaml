  alt: Two line charts of average lighting savings versus weekday and weekend operating hours
  description: |-
    Two line charts sharing a y-axis Average Lighting Savings (kBtu) from 0 to about 280K. The left panel plots Weekday Operating Hours (about 6 to 19) and the right plots Weekend Operating Hours (about 6 to 18). Average savings rise with operating hours: the weekday line climbs from roughly 160K at 6 hours to a peak near 270K around 16-17 hours, while the weekend line is flatter at roughly 180-220K. Longer operating hours yield larger lighting savings.
