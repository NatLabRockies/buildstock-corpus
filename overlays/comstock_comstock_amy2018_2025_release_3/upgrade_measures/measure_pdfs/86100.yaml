  alt: Horizontal distribution plots of EUI savings by end use and fuel, with per-group sample sizes
  description: |-
    Horizontal distribution (violin/box) plot titled EUI Savings by End Use, x-axis from about -30 to 30 (kBtu/ft2). Rows are end-use/fuel combinations with sample sizes, including Electricity Interior Lighting (n=219903), Electricity Cooling (n=210448), Electricity Fans (n=168687), Electricity Heating (n=134936), Natural Gas Heating (n=116178), Electricity Pumps (n=23905), Electricity Refrigeration (n=20054), District Heating Heating (n=1913), District Cooling Cooling (n=1898), and several smaller groups. Electricity Interior Lighting shows the largest positive savings spread; heating end uses skew negative (penalties), and most other end uses cluster near zero.
