  alt: Grouped bar chart of average site EUI savings by building type and original lighting generation,
    kBtu/ft2
  description: |-
    Grouped bar chart, y-axis Average Site EUI Savings (kBtu/ft2) 0-12, one group per building type, bars colored by In.Interior Lighting Generation (gen1_t12_incandescent, gen2_t8_halogen, gen3_t5_cfl). Savings are highest for the oldest generation (gen1) and fall for gen2 and gen3. Legible gen1 labels include QuickServiceRestaurant 10.009, SmallHotel 9.528, Hospital 6.210, LargeHotel 5.858, and RetailStripmall 5.098; quick-service restaurants, hospitals, and small hotels show the largest average savings.
