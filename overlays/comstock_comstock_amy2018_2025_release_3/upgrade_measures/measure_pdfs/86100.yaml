  alt: Paired bar charts of model count by lighting generation for applicable vs non-applicable models
  description: |-
    Two stacked panels split by Applicability (True on top, False on bottom), x-axis In.Interior Lighting Generation (gen1_t12_incandescent, gen2_t8_halogen, gen3_t5_cfl, gen4_led, gen5_led), y-axis Model Count. Applicable (True): gen1 49,548, gen2 155,768, gen3 14,587, and zero for gen4/gen5. Not applicable (False): gen4_led 98,942 and gen5_led 22,603, zero for gen1-3. This confirms the measure applied only to non-LED generations.
