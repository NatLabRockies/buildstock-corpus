  alt: Stacked bar of annual energy consumption by end use and fuel, Baseline vs LED Lighting, TBtu
  description: |-
    Stacked column chart, y-axis Annual Energy Consumption (TBtu) 0-4500, comparing Baseline (total 4342) and LED Lighting (total 4188). Each bar is segmented by end use and fuel per the legend (Interior Equipment, Fans, Cooling, Interior Lighting, Heating, Water Systems, Refrigeration, Heat Rejection, Heat Recovery, Pumps, and Exterior Lighting across Electricity, Natural Gas, District, and Other Fuel). Labeled values include Interior Equipment Electricity 775.9 (unchanged) and Cooling Electricity 591.4 vs 585.5, with an interior-lighting electricity segment falling from 426.7 to 269.0 (about the reported 157.7 TBtu interior-lighting savings); other paired segment labels read 457.8/467.6, 667.7/638.9, 232.9/247.9, and 458.5/473.2.
