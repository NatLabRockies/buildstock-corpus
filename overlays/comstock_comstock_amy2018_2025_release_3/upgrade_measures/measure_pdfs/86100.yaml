  description: |-
    Bar chart titled Total Interior Lighting Savings by Building Type, with a left y-axis in kBtu to about 600M and a right y-axis to about 1400M. Per-building-type bars carry data labels: FullServiceRestaurant 2.31e+07, Hospital 2.40e+07, LargeHotel 4.57e+07, LargeOffice 5.03e+07, MediumOffice 2.45e+07, Outpatient 3.44e+07, PrimarySchool 1.28e+07, QuickServiceRestaurant 4.43e+06, RetailStandalone 2.04e+08, RetailStripmall 5.10e+08, SecondarySchool 2.67e+07, SmallHotel 2.09e+07, SmallOffice 2.34e+07, Warehouse 2.25e+08, and a final total bar of about 1.25e+09. RetailStripmall, Warehouse, and RetailStandalone dominate the savings.
