# Hand-authored figure descriptions for measure_pdfs/86100.pdf
#
# 86100 is the LED Lighting measure documentation (NREL/TP-5500-86100). docling extracts
# each results figure as a bare ![Image](...) ref: the caption line survives above it, but
# the chart itself is invisible to retrieval and unreadable without the picture. Each entry
# below is image-anchored (see the figures: schema in overlays/README.md): the ref is
# rewritten with a hand-written alt, and a description paragraph is injected below for
# retrieval.
#
# Scope: figures only (Figures 1-10). The two cover/title images (indices 000000, 000001)
# are deliberately not described.
#
# Authoring notes:
#   * method is vision-description, not vision-transcription: these interpret a chart
#     rather than copy legible cells. Numbers were read off the figures and should get a
#     human QA pass before this is treated as a release record.
#   * Every entry pins the on-disk PNG sha256; if upstream repoints a bitmap the build drops
#     that injection and warns rather than shipping a stale description.

