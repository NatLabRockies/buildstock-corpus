# Hand-authored figure descriptions for measure_pdfs/95004.pdf
#
# 95004 is the Add Rooftop PV (40% of load) measure documentation. docling extracts each
# picture as a bare ![Image](...) ref; the chart itself is invisible to retrieval. Each entry
# rewrites the ref with a hand-written alt and injects a description paragraph below it.
#
# Scope: figures only (Figures 1-8, images 000003-000010). The cover montage (000000) and NREL
# logo (000001) are omitted. NOTE for QA: image 000002 is NOT a chart -- it is a small legible
# TABLE bitmap (Table 4, on-site fossil fuel emissions factors). It is included with
# method: vision-transcription (cells transcribed, not interpreted) because there is no separate
# table overlay for this doc and the factors would otherwise be lost to retrieval.
#
# method vision-description entries: numbers were read off the charts and need a human QA pass
# before treated as a release record. Least-certain reads: the exact per-state values on the two
# choropleth maps (Figures 7-8) and the small stacked segments in Figures 2/3/6. Every entry
# pins the on-disk PNG sha256.

