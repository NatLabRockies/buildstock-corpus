  alt: |-
    Two-panel time-series of a building's PV electricity produced and electricity purchased over an example July week, Baseline vs PV 40%
  description: |-
    Figure 1. Two-panel time-series over an example summer week (7/9/2018-7/15/2018) for a single building. Top panel: PV Electricity Produced (kW), y-axis 0 to about 55, single series ElectricityProduced:Facility for PV 40%; generation follows a daily bell curve peaking near 50-53 kW at midday and zero overnight (system rated near 68 kW). Bottom panel: electricity purchased from the grid (kW), y-axis 0 to about 45, two series ElectricityPurchased:Facility Baseline (blue) and PV 40% (orange). Baseline purchases track building load with daily peaks near 40 kW; under PV 40% midday purchases drop sharply toward zero as on-site PV serves the load, while early-morning and evening purchases (outside PV hours) are largely unchanged. Illustrates that a 40%-of-load PV system offsets midday grid purchases but not the evening peak.
- source_image: 95004_images/image_000004_ee182666c006dd5d3ae8a92f9280b9a163de792e6d8064fbdf2039d3ea346cf4.png
  source_image_sha256: 3fc8e7c9881ae58a4594fd4e1e60723613263ce5233d504b9e06982d428945c5
