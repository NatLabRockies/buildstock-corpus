  alt: U.S. state choropleth map of total installed PV capacity in megawatts under the PV 40% scenario
  description: |-
    Figure 7. Choropleth map of the contiguous United States shading each state by total installed PV capacity (MW) under the Add_PV_40pct scenario, with the value labeled on each state; darker blue = more capacity. The largest deployments are California (about 50,301 MW) and Texas (about 40,957 MW), followed by Florida (about 26,787 MW) and other populous Sun Belt and eastern states (e.g., Georgia about 16,580 MW, with several eastern states in the 10,000-17,000 MW range). Sparsely built or less-sunny Mountain and Northern Plains states show the smallest values (roughly 600-9,000 MW). The national total is on the order of 385 GW, consistent with the summary.
- source_image: 95004_images/image_000010_a385f24c4043f9d6c9515e900c15810bd50ff69a10fc3ecd09d17e0dffdad00f.png
  source_image_sha256: b3c86bc584ea63a31df48d710229d26e8f49434b25c05eb99ab9b9e749220d28
