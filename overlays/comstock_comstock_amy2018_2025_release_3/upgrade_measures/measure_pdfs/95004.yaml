  alt: U.S. state choropleth map of average realized PV capacity factor by state under the PV 40% scenario
  description: |-
    Figure 8. Choropleth map of the contiguous United States shading each state by average realized PV capacity factor under the Add_PV_40pct scenario, value labeled on each state; darker orange = higher. Values range from about 0.14 in the cloudier Pacific Northwest, Great Lakes, and Northeast to about 0.20-0.21 in the desert Southwest (Nevada about 0.21; Arizona, New Mexico, and California about 0.20). Most of the country falls in the 0.15-0.18 range, with Florida about 0.18. Reflects that PV in the sunny Southwest produces markedly more energy per installed watt than in the cloudier north.
