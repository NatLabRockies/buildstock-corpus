  alt: |-
    Three-panel stacked bar chart of annual CO2e emissions by fuel under eGRID and two LRMER grid scenarios, Baseline vs PV 40%
  description: |-
    Figure 6. Three-panel stacked bar chart of annual CO2e emissions (MMT CO2e = million metric tons), y-axis 0 to about 500, under three grid-emissions assumptions (eGRID 2021, LRMER High RE Cost 15, LRMER Low RE Cost 15). Each panel has two bars (Baseline, Add_PV_40pct) stacked by fuel (Electricity, Natural Gas, Propane, Fuel Oil). eGRID 2021: Baseline 452 (Electricity 345, Natural Gas 102) vs PV 338, a 25% reduction (Electricity 232). LRMER High RE Cost 15: Baseline 346 (Electricity 240) vs PV 283, an 18% reduction (Electricity 176). LRMER Low RE Cost 15: Baseline 245 (Electricity 139) vs PV 219, an 11% reduction (Electricity 113). Natural gas emissions are unchanged at 102 across scenarios; the electricity-emissions reduction ranges 11-25% depending on the marginal grid assumption (about 26-114 MMT avoided), matching the summary.
- source_image: 95004_images/image_000009_380e740a88608dc88c95cfcac3525ec8f02dbd8b46a14fd2b910ed0cf3a3b953.png
