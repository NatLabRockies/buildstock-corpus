  described_utc: '2026-08-20'
  alt: Violin and box plots of percent site energy savings by building type across the modeled stock
  description: |-
    Figure 4. Horizontal violin-plus-box plots of Percent Site Energy Savings by Building Type (%), x-axis about -5% to 27%, titled 'Upgrade 40.0: Lighting Controls (unweighted)'. Rows are ComStock building types with model counts: FullServiceRestaurant (n=8553), Hospital (n=2535), LargeHotel (n=8456), LargeOffice (n=8199), MediumOffice (n=13652), Outpatient (n=9014), PrimarySchool (n=9547), QuickServiceRestaurant (n=5039), RetailStandalone (n=11383), RetailStripmall (n=10988), SecondarySchool (n=10277), SmallHotel (n=3414), SmallOffice (n=13021), and Warehouse (n=10361). Warehouse has by far the largest savings (median around 6%, tail past 25%); most other types center between 1% and 5%, with restaurants and hospitals lowest. Reflects that lighting-heavy, sparsely-occupied spaces benefit most from controls.
