  alt: |-
    Three-panel stacked bar chart of annual utility bill by fuel under maximum, mean, and minimum electricity rates, Baseline vs Lighting Controls
  description: |-
    Figure 2. Three-panel stacked bar chart of annual utility bill (Billion USD, 2022), y-axis 0 to about 150, under three electricity-rate assumptions (With Max, Mean, and Min Electricity Rate). Each panel has two bars (Baseline, Lighting Controls) stacked by fuel (Electricity, Natural Gas, Propane, Fuel Oil). Max rate: Baseline 149 (Electricity 129, Natural Gas 18) vs 145, a 3% reduction (Electricity 125). Mean rate: Baseline 129 (Electricity 110, Natural Gas 18) vs 126, a 3% reduction (Electricity 106). Min rate: Baseline 112 (Electricity 93, Natural Gas 18) vs 109, a 3% reduction (Electricity 90). Natural gas cost is unchanged at 18; the roughly 3% total bill savings comes from reduced electricity purchases and is consistent across rate structures.
- source_image: 96597_images/image_000004_5298e2e5deb843d855902282dc5a9bc67ca7892121f75730e8e970649cab5b15.png
  source_image_sha256: 43dfe2fd254a5b971b5174af2b5834fa7245b9ea373310b41c3874184cc45c09
