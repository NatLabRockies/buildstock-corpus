  alt: Violin and box plots of percent site energy savings by end use across the modeled stock
  description: |-
    Figure 3. Horizontal violin-plus-box plots of Percent Site Energy Savings by End Use (%), x-axis about -140% to 100%, titled 'Upgrade 40.0: Lighting Controls (unweighted)'. Rows are end-use/fuel combinations with model counts, including Electricity Interior Lighting (n=124439), Electricity Cooling (n=119736), Electricity Fans (n=103599), Electricity Heating (n=61001), Natural Gas Heating (n=60790), Electricity Pumps (n=39539), Electricity Refrigeration (n=24859), plus smaller district-energy and other-fuel end uses. Electricity Interior Lighting shows a broad positive savings distribution (interquartile box roughly 20-40%), Cooling shows a small positive shift, and heating end uses skew slightly negative (take-back); most other end uses cluster at 0%.
- source_image: 96597_images/image_000005_ec2a74435df1c63f7306aa7a5f80d6bdd195da792aac7dceca444fa06a8b84db.png
  source_image_sha256: 27d40eae005bcc4bfce28819a48c2cc6f87cf468bfc429432a1e15e3fdea24d5
