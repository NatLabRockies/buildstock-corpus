  alt: Stacked column chart of annual stock site energy consumption by end use and fuel, Baseline vs
    Lighting Controls
  description: |-
    Figure 1. Stacked column chart of annual stock site energy consumption (TBtu), y-axis 0 to about 5000, comparing ComStock Baseline (total 4982) and Lighting Controls (total 4889), a reduction of about 93 TBtu (1.9%). Columns are segmented by end use and fuel per the legend (Heat Rejection, Heat Recovery, Pumps, Refrigeration, Exterior Lighting, Water Systems, Heating, Interior Lighting, Cooling, Fans, Interior Equipment across Electricity, Natural Gas, District Heating/Cooling, and Other Fuel). Legible segments: Interior Equipment Electricity 756.8 (unchanged), Interior Equipment Natural Gas 315.7, Fans Electricity 580.6 to 577.7, Cooling Electricity 744.5 to 731.2, the Interior Lighting Electricity segment 452.4 to 342.8 (the main reduction), and Heating Natural Gas 267.7 to 275.3 (a small heating take-back as lighting waste heat is removed). Illustrates that lighting-control savings come almost entirely from reduced interior lighting electricity, partly offset by higher heating.
