  alt: Violin and box plots of percent utility bill savings by fuel type across the modeled stock
  description: |-
    Figure 5. Horizontal violin-plus-box plots of Percent Utility Bill Savings by Fuel (%), x-axis about -160% to 100%, titled 'Upgrade 40.0: Lighting Controls (unweighted)'. Rows with model counts: Propane Bill State Average (n=3375), Fuel Oil Bill State Average (n=1481), Natural Gas Bill State Average (n=59806), Electricity Bill with Mean Rate (n=124438), and Bill Mean (n=124437). All distributions cluster near 0-5%; the Electricity Bill and overall Bill Mean are slightly positive with long tails on both sides, while the fossil-fuel rows sit essentially at 0% (lighting controls barely affect gas/propane/oil bills). Consistent with the modest ~3% aggregate bill savings.
- source_image: 96597_images/image_000007_65411953f979563be65dec3563a2903958c283304fcbb55ad0af75f9a20bfc08.png
  source_image_sha256: 4cabb174dc255bb0a0afa6cccebe97fa2e803760fa90561de0d7d0adf941d0e6
