  described_utc: '2026-08-20'
  alt: Violin and box plots of percent utility bill savings by ASHRAE climate zone across the modeled
    stock
  description: |-
    Figure 6. Horizontal violin-plus-box plots of Percent Utility Bill Savings by Climate (%), x-axis about -80% to 90%, titled 'Upgrade 40.0: Lighting Controls (unweighted)'. Rows are ASHRAE climate zones with model counts: 1A (n=3078), 2A (n=6608), 2B (n=3731), 3A (n=12962), 3B (n=15885), 3C (n=5267), 4A (n=19736), 4B (n=5277), 4C (n=1879), 5A (n=18576), 5B (n=9362), 6A (n=10481), 6B (n=4244), 7 (n=6682), and 8 (n=669). Every zone centers slightly positive (roughly 2-5% median bill savings) with long tails in both directions; there is little systematic variation across climates, since lighting-control savings are largely climate-independent.
