    Figure 3. Stacked bar chart comparing annual national site energy consumption by end use and fuel across the ComStock baseline and the three Comprehensive GHP package scenarios
  description: |-
    Figure 3 is a stacked bar chart of annual site energy consumption in trillion British thermal units (TBtu) for four scenarios, with the scenario total printed above each bar: ComStock Baseline 4865 TBtu; Comprehensive GHP 3689 TBtu; Comprehensive GHP + High Efficiency Envelope 3468 TBtu; Comprehensive GHP + High Efficiency Envelope + LED Lighting 3335 TBtu. That is roughly a 24% reduction from baseline for GHP alone, 29% with the envelope measures added, and 31% with LED lighting added on top. The y-axis runs 0 to 5000 TBtu. Each bar is segmented by end use and fuel with an 18-entry legend covering heat rejection, heat recovery, pumps, refrigeration, exterior lighting, water systems (other fuel, district heating, natural gas), heating (other fuel, district heating, natural gas, electricity), interior lighting, cooling (district cooling, electricity), fans, and interior equipment (natural gas, electricity). Interior equipment electricity is the largest single segment and is unchanged at 740.2 TBtu across all four scenarios, as expected for an end use no measure touches. The segments that shrink are heating and cooling electricity, natural gas heating, and fans; interior lighting falls only in the scenario that includes LED lighting. Totals are read with high confidence; the segment values printed inside the bars are provisional.
