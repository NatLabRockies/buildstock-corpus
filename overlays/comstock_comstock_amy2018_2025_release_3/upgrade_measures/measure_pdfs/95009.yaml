    Figure 7. Violin and box plot distribution of percent site energy savings by ASHRAE climate zone between the baseline and the Comprehensive GHP + High Efficiency Envelope + LED Lighting scenario
  description: |-
    Figure 7 is a horizontal violin plot with embedded box plots of percent site energy savings by ASHRAE climate zone, annotated "Upgrade 57.0: Package_11 (unweighted)", with an x-axis from about -100% to +80% and a reference line at 0%. Rows from top to bottom with model counts: 1A (n=2445), 2A (n=5793), 2B (n=3189), 3A (n=11558), 3B (n=13869), 3C (n=4388), 4A (n=17207), 4B (n=4653), 4C (n=1569), 5A (n=16207), 5B (n=8308), 6A (n=9283), 6B (n=3824), 7 (n=5883), 8 (n=503). Every zone has a median well to the right of zero. There is a subtle trend of increasing savings from the hottest to the coldest zone: in the warm zones 1A through 3A the median model saves roughly 30%-35% with the 75th percentile above 40%, while in the cold zones 5 through 7 medians reach up to about 40% with the 75th percentile at 50% or more. Zone 8 (subarctic) has the widest box, reflecting its small sample of 503 models. All zones carry long thin left tails of individual models with energy penalties.
