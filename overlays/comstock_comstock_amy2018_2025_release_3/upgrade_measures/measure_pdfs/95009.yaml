    Figure 6. Violin and box plot distribution of percent site energy savings by end use and fuel type for models with the Comprehensive GHP + High Efficiency Envelope + LED Lighting package applied
  description: |-
    Figure 6 is a horizontal violin plot with embedded box plots showing the distribution of percent site energy savings, per model, for the Comprehensive GHP + High Efficiency Envelope + LED Lighting package by end use and fuel type. The panel is annotated "Upgrade 57.0: Package_11 (unweighted)" and the x-axis runs from about -160% to +100%, with a reference line at 0% separating savings (right) from penalties (left). Rows top to bottom, with model counts, grouped by fuel: Other Fuel -- Water Systems (n=265), Heating (n=4704); District Heating -- Water Systems (n=30); Natural Gas -- Water Systems (n=12255), Heating (n=56388); Electricity -- Water Systems (n=10014), Refrigeration (n=33112), Pumps (n=16631), Interior Lighting (n=69947), Interior Equipment (n=67), Heating (n=50288), Heat Rejection (n=7291), Heat Recovery (n=3620), Fans (n=102413), Cooling (n=108647). The fossil heating rows cluster tightly near 100% savings, since the GHP measures eliminate fuel-fired heating entirely. Electricity heating shows large but more variable savings centered around 50%-75%. Interior lighting centers around 30%-40%, reflecting the LED measure. Pumps show a wide left-tailed distribution with many models seeing large penalties, consistent with new ground-loop circulation pumps being added where none existed. Cooling and fans show moderate savings with long left tails.
