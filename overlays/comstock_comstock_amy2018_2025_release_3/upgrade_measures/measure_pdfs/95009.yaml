# Hand-authored figure descriptions for measure PDF 95009
# (Comprehensive GHP + High Efficiency Envelope + LED Lighting package).
#
# Scope: 16 images are extracted from this PDF. Images 000000 and 000001 are decorative
# (the NREL photo-grid cover banner and the NREL wordmark logo) and are deliberately NOT
# described here -- describing them would inject noise into retrieval. The remaining 14
# (000002-000015) are real figures: Figures 1-13 plus appendix Figure A-1.
#
# All 17 tables in this document extracted as real markdown text, including Table 12
# (On-Site Fossil Fuel Emissions Factors), so no vision-transcription entry is needed.
#
# QA flags for human review:
#   - Figure 3 (000004): the four scenario TOTALS (4865 / 3689 / 3468 / 3335 TBtu) are read with
#     high confidence, but the individual stacked-segment values printed inside the bars are dense
#     and small; segment-level numbers in the description are provisional.
#   - Figure 11 (000012): dense data-bar matrix of 8 climate zones x 4 scenarios x 3 seasons. The
#     monotone ordering and the approximate W/sqft ranges are solid; individual cell values are
#     provisional.
#   - Not a figure issue, but noted while reading: the body text near Figure 7 says "A map of the
#     ASHRAE climate zones is included in 0 [22]" -- the cross-reference to Appendix A was lost in
#     extraction and rendered as a bare "0". Figure A-1 (000015) is that map.
