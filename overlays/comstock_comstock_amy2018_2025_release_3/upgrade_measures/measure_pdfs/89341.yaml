    Figure 9. Two stacked violin plot panels showing per-model site energy savings by end use and fuel for the load shift upgrade, expressed as percent savings (top) and as site EUI savings in kBtu/ft2 (bottom), with model counts per category
  description: |-
    Two stacked violin plot panels giving the distribution of savings across individual applicable ComStock models, broken out by end use and fuel. The top panel's x-axis is Percent Site Energy Savings by End Use (%), spanning -80 to 40; the bottom panel's is Site EUI Savings by End Use (kBtu/ft2), spanning -1 to 1.4. Both share the same category rows, with model counts: Other Fuel -- Water Systems (n=2), Heating (n=71); District Heating -- Water Systems (n=16), Heating (n=307); Natural Gas -- Water Systems (n=168), Heating (n=1623); Electricity -- Water Systems (n=277), Pumps (n=2282), Interior Lighting (n=1), Heating (n=1333), Heat Rejection (n=1835), Heat Recovery (n=106), Fans (n=3008), Cooling (n=3136). Nearly every distribution is a narrow spike centered on zero in both panels, consistent with a load-shifting measure that leaves annual energy essentially unchanged. Natural Gas Heating is the conspicuous exception, with a long left tail reaching roughly -40% in the percent panel and the widest EUI spread, reflecting a small number of models where the altered cooling setpoint schedule incidentally changed heating operation. Electricity Heating and Electricity Cooling show modest two-sided spread; scattered points beyond the whiskers are outliers past 1.5 times the interquartile range.
