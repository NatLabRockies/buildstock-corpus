    Figure 7. Two stacked column charts comparing annual site energy consumption in TBtu by fuel and end use, baseline versus load shift, for the whole ComStock stock (4338 to 4339 TBtu) and for applicable large offices only (317 to 318 TBtu)
  description: |-
    Paired stacked column charts of annual site energy consumption in TBtu, baseline versus Load shift. The left panel, Stock, covers all of ComStock and totals 4338 TBtu baseline against 4339 TBtu with the upgrade; the right panel, Applicable large offices, totals 317 against 318 TBtu. Both use the same 17-category legend spanning Heat Rejection and Heat Recovery Electricity, Pumps, Exterior Lighting, the Water Systems categories (Other Fuel, District Heating, Natural Gas, Electricity), the Heating categories (Other Fuel, District Heating, Natural Gas, Electricity), Interior Lighting, Cooling (District Cooling, Electricity), Fans, and Interior Equipment Electricity. At stock level the labeled segments barely move: Interior Equipment Electricity 739.7 unchanged, Interior Lighting 451.9 unchanged, Heating Electricity 175.2 unchanged, Cooling Electricity 667.3 rising to 667.5, and Fans 519.1 rising to 519.3. In the applicable-buildings panel the same pattern holds at smaller scale, with Interior Equipment 108.1 unchanged, Cooling 60.5 rising to 60.7 and Fans 37.4 rising to 37.7. The figure's point is that this is a load-shape measure, not an efficiency measure: total site energy is flat to very slightly higher, because pre-cooling adds cooling and fan energy that the peak-window setback does not fully recover.
