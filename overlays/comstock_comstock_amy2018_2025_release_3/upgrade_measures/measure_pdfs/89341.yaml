    Figure 6. Box plots of annual utility bill cost savings percentage for the default load shift scenario, split by electric versus non-electric heating and by whether savings are measured against the mean or median bill across applicable rate structures
  description: |-
    Box plot comparison of annual utility bill savings for the default load shift upgrade, on an x-axis of Utility bill cost savings [%] running from -1.0% to +1.0% with a zero reference line. Four rows are shown, grouped into two blocks: Electric heating, with Savings from mean bill and Savings from median bill, and Non-electric heating, with the same two rows. All four distributions are narrow and centered slightly to the left of zero, with interquartile boxes roughly between -0.4% and 0.0%, whiskers reaching about -1.0% on the low side and only about +0.6% on the high side. The reading is that bill savings are essentially zero and marginally negative for every combination, with no meaningful difference between electric and non-electric heating buildings. The accompanying text explains why: load shifting produces zero or slightly negative net energy savings, so the only sources of bill reduction are time-of-use rates whose peak price hours coincide with the identified daily peak window, and monthly or seasonal demand charge reductions. Those gains are offset by the extra energy consumed during pre-cooling. The text also notes this understates the measure's value, since daily-granularity demand response incentives cannot yet be represented in the ComStock bill calculation.
