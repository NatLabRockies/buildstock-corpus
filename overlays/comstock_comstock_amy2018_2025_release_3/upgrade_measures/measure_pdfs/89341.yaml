    Figure A-3. Grouped bar chart of annual site electricity consumption in TBtu by ComStock building type, baseline versus the load shift upgrade, showing pairs that are indistinguishable at annual resolution
  description: |-
    Grouped vertical bar chart plotting Electricity Total Energy Consumption (TBtu) against ComStock Building Type, with a dark blue Baseline bar and a light blue upgrade bar in each pair. Building types run left to right: FullServiceRestaurant, QuickServiceRestaurant, RetailStripmall, RetailStandalone, SmallOffice, MediumOffice, LargeOffice, PrimarySchool, SecondarySchool, Outpatient, Hospital, SmallHotel, LargeHotel, Warehouse. RetailStripmall is the largest electricity consumer at roughly 395 TBtu, followed by Warehouse near 360 TBtu, LargeOffice near 290 TBtu and RetailStandalone near 280 TBtu; SecondarySchool and PrimarySchool sit near 230 TBtu, SmallOffice and MediumOffice and LargeHotel near 190 to 200 TBtu, FullServiceRestaurant near 175 TBtu, Hospital near 165 TBtu, Outpatient near 125 TBtu, QuickServiceRestaurant near 65 TBtu and SmallHotel near 35 TBtu. Even for LargeOffice, the one applicable type, the baseline and upgrade bars are indistinguishable at this scale, which is the expected signature of a measure that relocates electricity use within the day rather than reducing it. Annual totals are the wrong resolution to see the effect.
