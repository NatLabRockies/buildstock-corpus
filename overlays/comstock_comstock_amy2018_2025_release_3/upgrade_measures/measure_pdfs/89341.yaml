# Hand-authored figure descriptions for measure PDF 89341
# (Thermostat Control for Load Shifting -- pre-cooling before the daily peak window, large offices).
#
# Scope: the source markdown carries 17 image refs. Images 000000 and 000001 are the NREL cover
# photo grid and the NREL wordmark -- decorative, no retrievable content, deliberately NOT
# described. The 15 entries below cover Figures 1-10, Figures A-1 through A-4, and Table 1.
#
# Table 1 (image 000003) is a vision-transcription, not a description: the on-site fossil fuel
# emissions factor table exists in the source ONLY as an embedded bitmap. The body text at Section
# 3.3 references "Table 1" but no markdown table was extracted and no caption line survives, so
# without this entry the emissions factors would be invisible to retrieval. Tables 2 and 3 both
# extracted as real markdown and need no overlay.
#
# QA flags (least-certain reads and source/extraction artifacts, for the human review pass):
#  * Table 1 (000003) -- the propane factor is printed as 177.8 lb/MMBtu (182.3 kg/MWh). Those two
#    numbers are mutually inconsistent: 177.8 lb/MMBtu converts to roughly 275 kg/MWh, matching the
#    self-consistent 275.7 printed in sibling document 89126. This looks like a source typo, and it
#    recurs in 89133 and 92618. Transcribed exactly as printed -- do not silently "fix" it.
#  * Figure 3 (000005) -- the chart shows FOUR scenario rows per month (Default load shift, More
#    aggressive, Shorter peak, Shorter pre-peak) but Table 3 defines only THREE parameter sets
#    (Default, More Aggressive Pre-Cooling, Shorter Pre-Peak). The extra "Shorter peak" row is
#    unexplained in the text; the description names all four rows as printed without inventing a
#    definition for it.
#  * Figure 1 (000002) -- only the LargeOffice (9.72%), Warehouse (23.41%) and PrimarySchool
#    (11.29%) floor-area labels are clearly legible; the other building-type percentages are printed
#    in light gray at small size and are NOT asserted. The 33.30% / 66.70% applicability split is
#    clear and matches the body text's "33.3% ... both electric heating and cooling ... remaining
#    66.7% ... only electric cooling".
#  * Figures A-1 to A-4 (000013-000016) -- these bar charts carry no data labels, so all TBtu values
#    quoted are axis estimates and are hedged with "roughly"/"near". The load-bearing claim (baseline
#    and upgrade bars coincide) is unambiguous and does not depend on those readings.
#  * Figure 4/5 (000006/000007) -- box statistics are read off unlabeled axes; the seasonal pattern
#    and sign are reliable, the exact percentile values are approximate.
#  * Source naming artifacts, not figure issues: (a) the captions for Figures 7-10 say "load
#    shedding" although this document is the load SHIFTING measure -- an apparent copy-paste from
#    the sibling load shedding report; the descriptions use "load shift" to match the plotted series
#    labels. (b) Figures A-1 to A-4 label the upgrade series with the internal measure key "shiftfb"
#    rather than a readable scenario name. (c) Figure 10's zone rows list both "7" and "7A", each
#    with n=8. (d) the Measure Summary block gives Release as "2024 Release 1" even though this PDF
#    ships with the 2025 Release 3 corpus. (e) Figure 6's caption says "for mean, and median bill"
#    while the body text mentions maximum, mean and median; the bitmap plots only mean and median,
#    so the caption matches the figure.
