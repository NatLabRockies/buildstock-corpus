    Figure 7. Violin plot distributions of percent site energy savings across applicable ComStock models for the Console GHP upgrade, one row per end use and fuel type with model counts, on an x-axis from -160% to 100%
  description: |-
    Violin plot panel titled Upgrade 17: Console GHP (unweighted), showing the distribution of percent site energy savings across individual applicable ComStock models, one horizontal violin per end-use-and-fuel category. The x-axis runs from -160 to 100 percent savings, with a vertical reference line at zero; positive values are savings and negative values are consumption increases. Rows top to bottom with model counts: Other Fuel Water Systems (n=62), Other Fuel Heating (n=4217), District Heating Water Systems (n=9), Natural Gas Water Systems (n=1809), Natural Gas Heating (n=27515), Electricity Water Systems (n=1627), Electricity Refrigeration (n=2041), Electricity Pumps (n=48016), Electricity Interior Lighting, Electricity Heating (n=47903), Electricity Fans (n=48022), Electricity Cooling (n=48012). Natural Gas Heating and Other Fuel Heating are compressed against the 100% edge, reflecting near-complete electrification of those loads. Electricity Fans sits far to the right near 80%, driven by the low static pressure assumed for non-ducted console units. Electricity Heating is wide, spanning large penalties to moderate savings, with a median near 10% savings. Electricity Cooling is broad with a long negative tail from buildings that had no baseline cooling; the mean is about 10% savings. Electricity Pumps straddles zero, median change under 5%.
