# Hand-authored figure descriptions for measure PDF 89132
# (Ground-Coupled Console Water-to-Air Heat Pump / "Console GHP", ComStock Upgrade 17).
#
# Scope: the source markdown carries 17 image refs. Images 000000-000006 are the standard NREL
# front-matter photo grid (staff/wind-turbine/lab photos) plus the NREL wordmark on the report
# cover -- decorative, carrying no retrievable information, and deliberately NOT described.
# The 10 entries below cover every real figure: Figures 1-9 in the body and Figure B-1 in
# Appendix B.
#
# Tables: Tables 1, 2, 3, 4, B-1 and B-2 all extracted as real markdown tables, so no
# vision-transcription entry is needed for this document.
#
# QA flags (least-certain reads and source/extraction artifacts, for the human review pass):
#  * Figure 5 (000011) -- the printed segment labels for the Heating Natural Gas band are the
#    least legible values in the chart at raster resolution, so the description gives the change
#    (-44.7 TBtu, from the body text) rather than the two absolute endpoints. The legible
#    segments cross-check exactly against the body text: Heating Electricity 175.2 -> 222.4 is
#    the stated -47.2 TBtu, Cooling 667.3 -> 655.2 is 12.1 TBtu, Fans 519.1 -> 493.0 is 26.1
#    TBtu, and the column totals 4338 -> 4296 are the stated 42 TBtu / 1.0% savings. High
#    confidence overall.
#  * Figure 9 (000015) -- dense 8-zone x 3-season x 2-scenario value matrix. Only the clearest
#    anchor values are quoted (Hot-Humid summer 3.8 -> 3.5; Very Cold winter ~2.8 -> ~3.0); the
#    remaining per-zone W/ft2 numbers are legible only approximately and are NOT asserted. The
#    directional statements (summer down 3-8% everywhere, winter up 5-7% in Cold/Very Cold, 0-4%
#    reductions elsewhere and in shoulder, blank Subarctic summer) come from the body text and
#    are solid.
#  * Figure 7 (000013) -- the "Electricity Interior Lighting" row is the one category whose (n=)
#    count is not legible in the bitmap, so it is listed without a count. Distribution shapes are
#    described qualitatively and corroborated by the body text (median electric heating ~10%
#    savings, mean cooling ~10% savings, median pump change <5%).
#  * Figure 4 (000010) -- the example-building kWh columns carry no data labels, so the ~1,000,000
#    kWh (all loads) and ~200,000 / ~150,000 kWh (HVAC only) readings are axis estimates. The
#    percentages quoted (6% site energy, 52% cooling decrease, 55% electric heating increase,
#    8.9% peak, 6.3% emissions, 9.0% / $5,433 bill) are from the body text, not the bitmap.
#  * Extraction artifact, not a figure issue: the executive-summary savings table (around line 93
#    of the processed markdown) has its columns rotated by one relative to its header row -- the
#    "End Use" label lands in the last column and the numeric columns are shifted. The same
#    numbers appear correctly as a bullet list in Section 5.2, which is what the Figure 5
#    description was checked against.
