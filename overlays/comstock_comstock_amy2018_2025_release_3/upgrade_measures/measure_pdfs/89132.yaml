    Figure 9. Horizontal bar chart of median electricity peak intensity in W/ft2 for the baseline and Console GHP scenarios, broken out by climate zone in rows and by season in three column panels (summer, winter, shoulder)
  description: |-
    Small-multiple horizontal bar chart of median electricity peak intensity in watts per square foot, with rows grouped by climate zone and, within each zone, a Baseline bar above a Console GHP bar. Three column panels give Median Summer Elect. Peak W/ft2, Median Winter Elect. Peak W/ft2, and Median Shoulder Elect. Peak W/ft2, each with values printed at the bar ends. Climate zone rows top to bottom: Hot-Humid, Hot-Dry, Marine, Mixed-Dry, Mixed-Humid, Cold, Very Cold, Subarctic. Summer peaks fall in every zone under the upgrade, by 3% to 8% per the accompanying text; Hot-Humid is the highest and clearest case, dropping from 3.8 to 3.5 W/ft2. The Subarctic summer panel is blank because that zone has no days classified as summer. In winter the heating-dominated Cold and Very Cold zones show a 5% to 7% increase in peak intensity from the added electric heating load, with Very Cold rising from about 2.8 to 3.0 W/ft2, while the cooling-dominated and moderate zones fall 0% to 4% because HVAC efficiency gains outweigh the added heating. Shoulder-season peaks fall 0% to 4% in all zones. Subarctic winter and shoulder values are unchanged owing to a very small sample.
