    Figure 2. Flow diagram of the ComStock GHEDesigner workflow, showing the two-pass simulation in which initial load calculations feed borefield sizing and the resulting g-function feeds the final simulation
  description: |-
    Process flow diagram spanning a large horizontal arrow labeled ComStock simulation, showing how ground heat exchanger sizing is embedded in the ComStock workflow as a two-pass process. Reading left to right, the first box is Apply measure retrofitting existing system with GHP, which feeds Initial load calculations. An arrow labeled hourly ground loads for borefield sizing runs down from the initial load calculation into the GHEDesigner Tool box at the bottom center. GHEDesigner returns an arrow labeled g-function for ground heat exchanger, which feeds up into the Final simulation box at the right end of the arrow. The figure makes clear that the borefield is not sized from a rule of thumb but from simulated hourly ground loads produced by a preliminary run of the retrofitted model, and that the sizing result re-enters the model as a g-function response factor set before the energy-consumption results are generated.
