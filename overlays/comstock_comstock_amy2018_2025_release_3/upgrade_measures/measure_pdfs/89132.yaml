    Figure 5. Stacked column comparison of annual site energy consumption in TBtu by fuel type and end use, ComStock baseline (4338 TBtu) versus Console GHP (4296 TBtu), with segment values labeled
  description: |-
    Stock-level stacked column chart of annual site energy consumption in TBtu, comparing the ComStock baseline against the Console GHP upgrade scenario, with per-segment values printed inside the bands and column totals above: Baseline 4338 TBtu and Console GHP 4296 TBtu, a 42 TBtu (1.0%) reduction. The legend spans 17 fuel-and-end-use categories, from Heat Rejection and Heat Recovery Electricity through Pumps, Refrigeration, Exterior Lighting, the Water Systems categories (Other Fuel, District Heating, Natural Gas, Electricity), the Heating categories (Other Fuel, District Heating, Natural Gas, Electricity), Interior Lighting, Cooling (District Cooling, Electricity), Fans, and Interior Equipment (Natural Gas, Electricity). Labeled segments that change: Heating Electricity rises from 175.2 to 222.4 (a 47.2 TBtu increase), Cooling Electricity falls from 667.3 to 655.2 (12.1 TBtu saved), and Fans Electricity falls from 519.1 to 493.0 (26.1 TBtu saved). Heating Natural Gas, the large hatched red band, drops by 44.7 TBtu. Unaffected segments are identical in both columns: Interior Equipment Electricity 739.7, Interior Equipment Natural Gas 212.1, Interior Lighting Electricity 451.9. The net effect is fuel switching with a small total site energy gain.
