  alt: Paired bars of HVAC system type by stock floor area and site energy, colored by upgrade applicability
  description: |-
    Figure 2: paired horizontal bar panels of ComStock HVAC system type prevalence - percent of stock floor area coverage and annual site energy consumption in TBtu - with bars colored by whether the high-efficiency RTU upgrade applies. The two applicable types are PSZ-AC with gas coil at 28.0 percent (1,452 TBtu) and PSZ-AC with electric coil at 12.3 percent (522 TBtu). Section 3.1 gives the criteria.
