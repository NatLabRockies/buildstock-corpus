# Hand-authored table transcription for measure_pdfs/98224.pdf
#
# Table 2 on p.21 is a rasterized region with no text layer: docling keeps the caption and
# emits nothing beneath it. See overlays/README.md for the schema.
#
# Authoring notes:
#   * The figure is one caption over two stacked grids, labeled by rotated spine text as "From
#     data source" and "To EnergyPlus". They do not share a column layout — the upper grid has
#     one column per manufacturer, the lower one has three per manufacturer — so they are
#     transcribed as separate sub-tables under those two names rather than forced into one.
#   * The lower grid is split again, between the two cooling-capacity curve groups and the
#     energy-input-ratio and part-load-fraction groups, to stay under the chunker's paragraph
#     limit.
#   * The lower grid's header names only the stage (Low/Med/High, three times over) and leaves
#     the manufacturer implicit: its three column groups line up under A, B and C in the upper
#     grid and share the outer rules with them. That alignment is what a pipe table cannot
#     carry, so the manufacturer is folded into each column name ("A: Low Stage").
#   * Its first header cell is a diagonally split box reading "Stage" above and "Size" below,
#     labeling the columns and the rows respectively. "Curve" and "Size" are supplied for the
#     two label columns so the pipe table is well-formed.
#   * Row labels are transcribed as printed, including the missing space in "Air Flow
#     FractionCurve" and the trailing "derived from" that the source wraps onto its own line.
#   * The symbols are transcribed as the glyphs the page prints, "O" and "Δ", and the footnote
#     that defines them is transcribed with them; it did not survive extraction as prose in
#     this document. The prose after the table restates the symbols by name but is not the
#     footnote.
#   * The blue and orange cell fills track the symbol already in the cell (blue behind every
#     "O" and every unqualified "Yes", orange behind every "Δ" and both "Yes for some units"),
#     so they add nothing that the transcribed values do not already say and are dropped.
#
# Figure notes (figures: block, added 2026-08-22):
#   * 28 of the 30 extracted images are figures. Skipped: image_000000 (NREL photo collage) and
#     image_000001 (NREL wordmark), both decorative. The tables: block above is caption-anchored,
#     so it claims no image index and the two counts add up exactly.
#   * Figures 7, 8, 9 and 10 are each ONE figure spanning TWO images. Each is a panel grid that
#     breaks across a page, and docling emits the first block, then the caption, then the second
#     block -- so the caption sits between the two halves rather than above them. The entries say
#     which unit-size block they cover ("small and medium unit blocks" / "large unit block").
#   * Figures 8, 10 and 11 have placeholder cells for large units reading "no data available for
#     curve development" (or "for lookup table development"), directing the reader to the curve
#     to the left or above. Described as printed.
#   * Figures 16 and 17 are captioned "Percentage site energy use intensity savings" but their
#     x-axes are absolute kBtu/ft2. The entries name the axis and flag the caption.
#   * Figures 18 and 19 are captioned "between the baseline (left) and high-efficiency RTU
#     (right)", but both charts put baseline and advanced RTU in ROWS and use the columns for the
#     two metrics. The entries say upper/lower row and note the caption. Figure 20's paired maps
#     genuinely are left and right.
#   * Figure 4's color scale is unlabeled -- ticks at 5k, 10k and 15k with no legend title -- so
#     the entry describes the two axes and the size breakpoints only.
#   * Sample counts disagree between figures that plot the same rows: natural gas heating is
#     n=18,806 in Figure 15 and n=24,382 in Figure 16, and Figures 14 and 17 differ by one model
#     in zones 5A, 6A and 8. Noted, not investigated.
#   * Figure 18's second panel (fan power minimum flow fraction) is not legible enough at normal
#     resolution to state where the advanced RTU distribution sits, so the entry gives the axes
#     and the fan-efficiency shift only.

