#   and is verbatim. Corroboration: the right panel's 1432 matches Table ES-2's applicable-only
#   baseline of 1431.7 exactly; the left panel's 4865 is 113.8 TBtu above Table ES-2's 4751.2
#   because Figure 10 also counts district heating end uses, which Table ES-2 omits.
#
# * Figure 17 (000019) - the per-state labels on the choropleth are small and several are
#   genuinely ambiguous at the bitmap's resolution (PA reads as $59M or $62M; MI and MN as
#   $39M/$29M and $31M/$21M). Only the three values stated in the Section 5.6 prose are
#   asserted - CA $136M, NY $81M, IL $76M - plus the "Not pictured" caption note. Everything
#   else is given as a qualitative range. The sum of all readable state labels is about $871M,
#   which brackets Table ES-3's $0.9B total, so no label is grossly misread.
#
# * SOURCE DEFECT, high confidence: Section 5.1 (page 17) says "Figure 11 shows the absolute and
#   percent natural gas heating savings by month for this single building example". That content
#   is TABLE 8, which immediately follows the sentence. Figure 11 is the national utility-bill
#   comparison chart in Section 5.3. The cross-reference is wrong in the source.
#
# * SOURCE DEFECT, minor: Figure 4's second histogram bin is labeled "84-85%" where every other
#   bin spans two points, so no bin covers 85%-86%. Transcribed as printed.
#
# * Figure 3 (000004) - HIGH confidence. The grey and orange series were identified by evaluating
#   Table 3's cubic coefficients at PLR 0, 0.1, 0.2, 0.3 and 1.3 and matching the plotted markers:
#   grey is "Boiler with minimum turndown", orange is "Boiler with no minimum turndown".
#
# * Figure 7 (000008) - HIGH confidence. Both panels' percentages sum to exactly 100.0%, and
#   Boiler + WSHP on the right panel (55.7% + 0.5% = 56.2%) reproduces the Table 1 total exactly.
#
# * Figure 4 (000005) - bar heights are axis estimates (no data labels). They sum to about 490,
#   consistent with the text's "nearly 500 condensing boiler products".
#
# * Figures 11 and 13 (000013, 000015) - HIGH confidence. All printed labels are legible and the
#   mean-rate / LRMER-High panels reproduce Table ES-3 and Table ES-4 to the rounding.
#
# * Figures 12, 14, 15, 16 (000014, 000016-000018) - the n values are legible; Figure 16's 15
#   per-zone counts sum to exactly 30,878, matching Figure 14's Site (n=30878). Distribution
#   shapes are described qualitatively and every quantitative claim is taken from the Section
#   5.3/5.5 prose rather than measured off the violin. Note this document lists a single "7" row
