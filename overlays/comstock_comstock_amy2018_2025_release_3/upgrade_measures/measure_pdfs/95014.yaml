# "Table 5" but no markdown table and no caption line survived extraction, so without this entry
# the emissions factors would be invisible to retrieval. Tables 1-4 and 6-9 all extracted as real
# markdown and need no overlay.
#
# QA FLAGS - vision-derived numbers need a human pass before publication.
#
# * Figure 10 (000012) - the in-band value labels are printed in white on hatched fills and are
#   NOT legible even at 20x upscale; a geometric band measurement was attempted and abandoned.
#   Only the four printed panel/band values that are cleanly legible are used: the panel totals
#   4865 -> 4782 (full stock) and 1432 -> 1348 (applicable only). No individual band value is
