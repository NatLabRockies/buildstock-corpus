    Figure 7. Paired horizontal bar chart of ComStock floor area share and natural gas heating energy share by HVAC heat type, with boilers at 25.3% of floor area but 55.7% of natural gas heating energy
  description: |-
    Paired horizontal bar chart grouped by the ComStock characteristic in.hvac_heat_type. Rows top to bottom: Furnace, Electric Resistance, Boiler, ASHP, District, GSHP, WSHP. Left panel, Total Weighted Square Footage (sqft) on a 0% to 40% axis: Furnace 35.2%, Electric Resistance 28.4%, Boiler 25.3%, ASHP 6.2%, District 3.3%, GSHP 1.3%, WSHP 0.3%; these sum to 100.0%. Right panel, Total Weighted Natural Gas Heating Energy (TBtu) on a 0% to 60% axis: Boiler 55.7%, Furnace 43.8%, WSHP 0.5%, and 0.0% for Electric Resistance, ASHP, District and GSHP; these also sum to 100.0%. The contrast is the applicability argument in Section 3.1: boilers occupy about a quarter of stock floor area but account for well over half of natural gas heating energy. The measure applies to gas-boiler buildings, 25.3% of floor area, plus the one WSHP system type that also uses a boiler, DOAS with water-source heat pumps and cooling tower with boiler at 0.3%, giving approximately 26% applicable floor area. Boiler plus WSHP on the right panel is 56.2%, matching the Table 1 total exactly.
