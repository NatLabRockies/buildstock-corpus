    Figure 17. Choropleth map of the contiguous United States shading each state by total annual utility bill savings in millions of dollars, led by California at $136M, New York at $81M and Illinois at $76M
  description: |-
    Choropleth map of the contiguous United States on a Mapbox and OpenStreetMap basemap, with each state labeled by its two-letter postal code and its total annual utility bill savings in millions of 2022 U.S. dollars; darker blue means larger savings. The three darkest states are California at $136M, New York at $81M and Illinois at $76M, as stated in Section 5.6. Below them a band of heating-dominated, gas-heavy states in the northern Midwest (Ohio, Michigan, Indiana, Minnesota, Wisconsin) and the northern mid-Atlantic (Pennsylvania, New Jersey), plus Texas, carry mid-range values of roughly $20M to $65M. The Mountain West, northern Plains and Deep South are lightest, generally under $10M and in several cases $1M to $5M. A caption note reads: Not pictured: Alaska ($3M), Hawaii ($1M). Summing the individually labeled states gives roughly $0.87B, consistent with the $0.9B total annual bill savings, 0.7% of the baseline, in Table ES-3 and with the $1 billion (1%) figure quoted in Section 5.3. Section 5.6 attributes the geographic pattern to states that are heating dominated and have high natural gas prevalence in the existing building stock.
