    Figure 6. Two stacked line charts comparing the Lochinvar Crest catalog boiler efficiency curve on top with the manually re-extracted curve used for modeling below, both plotting efficiency against return water temperature at firing rates of 5%, 50% and 100%
  description: |-
    Two stacked panels, both plotting boiler efficiency against return water temperature for three firing rates. Top panel is the manufacturer catalog image, headed Firing Rates with the legend Efficiency @ 5% (blue), Efficiency @ 50% (orange) and Efficiency @ 100% (green). X-axis: Water Return Temperature F, 60 to 170. Y-axis: Efficiency%, 85% to 100% on grey banded gridlines. The 5% firing-rate curve is highest throughout, starting near 99% at a 70 F return, and the 100% curve is lowest, starting near 97%. All three fall steeply between about 100 F and 130 F and flatten near 87%-88% by 150 F. The bottom panel is the curve manually digitized from that image for EnergyPlus, drawn with markers at roughly 5-degree intervals; its axes are Return Water Temperature (F) from 60 to 160 and Boiler Efficiency from 86% to 100%, with the same three series. The two panels are visually near-identical in level, spread and inflection point, which is the point of the figure: Section 3 states the Lochinvar Crest curves were chosen because that graph was the most granular and could be parsed, and were converted by manual data extraction into biquadratic performance maps compatible with EnergyPlus.
