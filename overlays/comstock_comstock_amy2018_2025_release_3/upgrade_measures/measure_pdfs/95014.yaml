  description: |-
    Table 5. On-Site Fossil Fuel Emissions Factors. This table exists in the source PDF only as an embedded bitmap, so its values are transcribed here.

    | Fuel | Emissions factor |
    | --- | --- |
    | Natural gas | 147.3 lb/MMBtu (228.0 kg/MWh) |
    | Propane | 177.8 lb/MMBtu (275.7 kg/MWh) |
    | Fuel oil | 195.9 lb/MMBtu (303.2 kg/MWh) |

    Footnote as printed: lb = pound; MMBtu = million British thermal units; kg = kilogram; MWh = megawatt-hour. The natural gas row carries a superscript a in the source. These factors apply to emissions from on-site combustion of fossil fuels and are taken from Table 7.1.2(1) of the draft ANSI/RESNET/ICC 301 standard. Section 3.3 directs that they be combined with the grid electricity emissions from a single chosen grid scenario (eGRID, Cambium LRMER High Renewable Energy Cost 15-Year, or Cambium LRMER Low Renewable Energy Cost 15-Year) to obtain total emissions. All three rows are internally consistent at 1 MMBtu = 0.293071 MWh.
