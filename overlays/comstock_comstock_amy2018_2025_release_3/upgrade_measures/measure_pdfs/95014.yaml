    Figure 4. Bar histogram titled Condensing Boiler Efficiencies of AHRI Products showing product quantity by thermal efficiency bin, peaking at about 158 products in the 94 to 96% bin and about 148 in the 96 to 98% bin
  description: |-
    Histogram titled Condensing Boiler Efficiencies of AHRI Products. X-axis: Thermal Efficiency, as nine labeled bins reading 82-84%, 84-85%, 86-88%, 88-90%, 90-92%, 92-94%, 94-96%, 96-98%, 98-100%. Y-axis: Quantity, 0 to 180 in steps of 20. Approximate bar heights are 82-84% about 22, 84-85% about 16, 86-88% about 21, 88-90% about 2, 90-92% about 61, 92-94% about 48, 94-96% about 158, 96-98% about 148, and 98-100% about 17. The bars sum to roughly 490, consistent with the Section 3 statement that the AHRI Directory of Certified Product Performance contains nearly 500 condensing boiler products sold in the United States and Canada. The distribution is strongly skewed toward high efficiency: values range from 82% to 100%, most products fall in the 94%-98% range, and the most common bin is 94%-96%. On that basis ComStock models the condensing boiler upgrade at 95% nominal thermal efficiency, described in the text as the median efficiency level of commercially available products. Note that the second bin is printed as 84-85%, one point wide where every other bin is two points, so no bin covers 85%-86%.
