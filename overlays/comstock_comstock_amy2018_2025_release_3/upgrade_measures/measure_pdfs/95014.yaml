    Figure 5. Line chart titled Boiler Efficiency Curve plotting boiler efficiency against entering water temperature in degrees Fahrenheit for 100%, 50% and 10% load, all falling from about 98-99% near 80 F to a flat plateau near 90% above 140 F
  description: |-
    Line chart titled Boiler Efficiency Curve, redrawn from the ASHRAE reference. X-axis: Entering Water Temperature (EWT), 80 to 180 in 20-degree steps, with plotted data stopping near 160 F. Y-axis: Boiler Efficiency, 89% to 100% on 1-point gridlines. Three curves are labeled in the legend as 100% Load, 50% Load and 10% Load. All three start high, roughly 98% to 99% at an EWT of 80 F with the lowest load highest, hold a shallow slope out to about 100 F, fall steeply between roughly 105 F and 130 F, and converge onto a nearly flat noncondensing plateau near 90% from 140 F upward where the three loads are indistinguishable. Section 3 uses the shape to make two points: sharp increases in efficiency are not seen until an EWT of about 135 F or lower is achieved, and the curves from all four sources consulted (Lochinvar, ASHRAE, New Jersey's Clean Energy Program and kW Engineering) follow this same trend. The modeling target of a 140 F supply with a 40 F delta-T, that is a 100 F return, sits on the steep condensing portion of the curve at 93%-96% depending on part load ratio.
