    Figure 10. Two side-by-side stacked bar charts of annual site energy consumption in TBtu comparing the ComStock baseline against the Condensing Boilers scenario, for the full stock (4,865 down to 4,782 TBtu) and for applicable buildings only (1,432 down to 1,348 TBtu)
  description: |-
    Two side-by-side panels of stacked bars, each holding a Baseline bar and a Condensing Boilers bar and sharing one 17-entry legend: eleven electricity end uses (Heat Rejection, Heat Recovery, Pumps, Refrigeration, Exterior Lighting, Water Systems, Heating, Interior Lighting, Cooling, Fans, Interior Equipment), three natural gas (Water Systems, Heating, Interior Equipment), two other fuel (Water Systems, Heating) and two district heating (Water Systems, Heating). Stacking order is the reverse of the legend, so Interior Equipment Electricity is the bottom band. Left panel, full stock, y-axis Annual Energy Consumption (TBtu) 0 to 5,000: printed totals 4,865 baseline and 4,782 with the measure, about 83 TBtu lower. Right panel, applicable buildings only, y-axis 0 to 1,400: 1,432 and 1,348, about 84 TBtu lower. The tall hatched red Heating Natural Gas band is the only band that visibly shrinks. Per Table 9 and Table ES-2 the natural gas saving is 84.8 TBtu, 5.6% across all buildings and 12.6% among applicable buildings; other fuel heating saves 1.0 TBtu, total site energy 83.4 TBtu, and cooling and fan changes are under 0.2%. The left-panel totals exceed Table ES-2's 4,751.2 TBtu because this chart also counts district heating end uses, which that table omits.
