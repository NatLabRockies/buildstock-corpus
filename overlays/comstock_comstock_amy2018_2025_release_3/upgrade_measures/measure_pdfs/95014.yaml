    Figure 13. Three panels of stacked bars comparing annual CO2e emissions for the baseline and Condensing Boilers scenario under the eGRID 2021, LRMER High RE Cost 15 and LRMER Low RE Cost 15 grid scenarios, with natural gas falling from 102 to 96 MMT in all three
  description: |-
    Three side-by-side panels of stacked bars titled eGRID 2021, LRMER High RE Cost 15 and LRMER Low RE Cost 15, each holding a Baseline bar and a Condensing Boilers bar. Shared y-axis: Annual Emissions (MMT CO2e), 0 to about 500. Legend: Electricity, Natural Gas, Propane, Fuel Oil. Printed values, baseline then measure: eGRID total 452 to 446 (-1%), electricity 345 to 346, natural gas 102 to 96; LRMER High RE Cost 15 total 346 to 340 (-2%), electricity 240 to 240, natural gas 102 to 96; LRMER Low RE Cost 15 total 245 to 240 (-2%), electricity 139 to 139, natural gas 102 to 96. Every Section 5.4 claim checks out against these labels: 5 to 6 MMT CO2e avoided annually, a 1%-2% reduction; natural gas emissions reduced by 6 MMT in all three scenarios and identical across them because the scenarios vary only the electricity grid; electricity emissions up 1 MMT under eGRID from minor cooling and fan increases; and no change in electricity under either LRMER scenario. The LRMER High panel matches Table ES-4, which gives a baseline of 345.9 total, 239.6 electricity and 101.8 natural gas MMT CO2e. Values are rounded to whole MMT, so small changes can be hidden.
