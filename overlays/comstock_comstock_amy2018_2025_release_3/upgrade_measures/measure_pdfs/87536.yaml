  description: |-
    Figure 10: horizontal violin plots of maximum daily peak magnitude by season - winter, summer, shoulder - one distribution per scenario on an x-axis of W/ft2 running to about 320. Every distribution is concentrated near zero with a long high tail, and the paired shapes are close enough that the seasonal shift is not visible at this scale. Section 6.3 gives the average changes.
