  description: |-
    Figure 3: two-panel bar chart of measure applicability, the left panel as a share of ComStock stock floor area and the right as a share of stock natural gas heating, each split between models with boilers (orange) and the rest. Boiler-bearing models are a minority of floor area but a much larger share of gas heating. Section 4.1 states the applicability criteria.
- source_image: 87536_images/image_000010_c9a84f78d017a8ec87fc72178afd0162a1fceb01e58f913ffc30f00fc11c451e.png
