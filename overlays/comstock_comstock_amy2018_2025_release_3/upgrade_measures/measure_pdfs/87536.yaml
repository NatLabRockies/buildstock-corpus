  description: |-
    Figure 14: bar chart of average percent savings in total energy consumption by ComStock building type, y-axis 0% to 22%, every bar labeled. SecondarySchool is highest at 21.5%, then PrimarySchool 16.0% and Hospital 12.6%, while QuickServiceRestaurant is 0.1% and FullServiceRestaurant 0.6%. Section 6.6 ties the ranking to boiler saturation - about 63% in the schools and hospitals.
