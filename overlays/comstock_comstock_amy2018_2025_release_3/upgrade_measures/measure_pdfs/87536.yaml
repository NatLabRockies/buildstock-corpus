# Hand-authored figure descriptions for measure_pdfs/87536.pdf (Batch E).
#
# 87536 documents the Boiler Replacement with Air-Source Heat Pump (ASHP) Boiler and Natural Gas
# Boiler Backup measure -- the gas-backup twin of 86199. docling extracts every picture as a
# bare ![Image](...) ref: the caption line usually survives above it, but the image itself is
# invisible to retrieval. Each entry below rewrites the ref with a hand-written alt and injects
# a description paragraph beneath it. Schema and depth budget:
# overlays/FIGURE_DESCRIPTIONS_ROLLOUT.md (section 2.1 -- 40-70 words, alt <=120 chars, no
# corroboration against body prose).
#
# Scope: the 22 images that are figures (Figures 1-21 and A-1 to A-3). Deliberately excluded:
# indices 000000-000006 -- the six cover photographs and the NREL logo. The `tables:` block
# above is caption-anchored (source_pdf_sha256, no source_image), so it consumes no image index
# and nothing here overlaps it.
#
# QA notes (vision reads; confirm before treating as a release record):
#   * image_000012 carries BOTH Figure 6 (CAPFT) and Figure 7 (EIRFT): Figure 6's caption is
#     printed inside the bitmap, so only "Figure 7. EIRFT performance curve output" survives in
#     the extracted text. image_000027 likewise carries both Figure A-1 and Figure A-2, with
#     A-1's caption inside the bitmap. Neither figure is dropped; both entries name both
#     numbers so a retrieval hit on either resolves.
#   * image_000027 (Figures A-1/A-2) is a byte-different but visually identical reprint of
#     image_000012 (Figures 6/7) -- same two contour plots, same ranges. Both entries describe
#     the plots and cross-reference each other rather than pretending they differ.
#   * Figure 9 panel (a): the data label on the upgrade's hatched natural-gas-heating band is
#     illegible at the extracted raster resolution. The description omits it rather than guess.
#     Arithmetic on the labels that are legible (totals 4,638 -> 4,293 TBtu, heating electricity
#     197.6 -> 362.0, baseline gas heating 627.5) implies roughly 119 TBtu.
#   * Figure 10's caption says "Average daily maximum peak demand comparison", but the chart is
#     a violin plot of the distribution of maximum daily peak magnitude by season (W/ft2), not
#     an average. Section 6.3 gives the averages: no summer change, +0.5% shoulder, +5% winter.
#   * Figure 12 is a screenshot of a simulation time series with a hand-drawn annotation and
#     ellipse; its axis labels do not survive at the extracted resolution, so the entry
#     describes the annotated behavior and points at Section 6.4.
#   * Figures 15-17 are choropleth state maps with per-state data labels and no color-bar
#     legend. On Figure 16 negative values are electricity INCREASES; Section 6.7 flags
#     Florida's positive outlier as an autosizing artifact discussed in Section 4.4.
#   * Chart legends label the upgrade "HP Boiler G Backup" and titles read "Upgrade 06"; the
#     electric-backup comparison series in Figures 19-21 is "HP Boiler E Backup" (that is
#     measure 86199). Entries that name a series use the chart's own label.

