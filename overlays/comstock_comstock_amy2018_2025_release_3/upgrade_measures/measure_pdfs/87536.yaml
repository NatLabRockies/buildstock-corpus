  alt: Grouped bar chart of median seasonal electric peak by climate zone for baseline and both backups
  description: |-
    Figure 20: grouped horizontal bar chart of median winter, shoulder and summer electric peak in W/ft2, three bars per ASHRAE climate zone - baseline, HP Boiler G Backup and HP Boiler E Backup - every bar labeled. The two backup options are nearly identical everywhere; winter peaks rise most in Subarctic (2.792 to about 3.60) and Very Cold (2.808 to 3.32-3.43). Section 6.9 discusses the comparison.
