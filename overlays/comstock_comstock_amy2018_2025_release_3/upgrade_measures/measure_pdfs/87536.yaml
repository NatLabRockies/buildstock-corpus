  description: |-
    Figure 9: two panels of stacked bar charts of annual energy consumption in TBtu, baseline versus HP Boiler G Backup, segmented by end use and fuel - panel (a) all ComStock buildings, totals 4,638 to 4,293, and panel (b) applicable buildings, 1,640 to 1,294. In both, the hatched natural gas heating band shrinks sharply while heating electricity grows. Section 6.2 lists the end-use changes.
- source_image: 87536_images/image_000015_7faa5cff90f8fd991babc982d9e712e2c0fd994743050e00affb4f59ac4371f4.png
