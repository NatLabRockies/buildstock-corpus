  alt: Schematic of air-source heat pump boiler refrigerant cycle from air coil to hot water coil
  description: |-
    Figure 1: schematic of ASHP boiler operation, tracing the refrigerant loop from a refrigerant-to-air cooling coil through an electronic expansion valve (EXV) and compressor to a refrigerant-to-water heating coil that delivers heating water. Green arrows mark the low-pressure side and orange the high-pressure side. Section 2 describes the cycle and the air-to-water configuration this measure models.
- source_image: 87536_images/image_000008_761fa8382000bfe82d38d118ecb461549bc748c6a5bdb4ad42ff0f41ec7a796a.png
  source_image_sha256: a44a8240c2777012b9bbc15d15d0828cba81f9fda97816a8c330c0004229c14b
  method: vision-description
  described_utc: '2026-08-21'
  alt: Scatter plot of boiler efficiency multiplier against boiler part load ratio for three curves
  description: |-
    Figure 2: scatter plot of boiler performance curves, with boiler part load ratio from 0 to 1.4 on the x-axis and boiler efficiency multiplier from 0 to 1.4 on the y-axis. One series is flat at 1.0 across the range while the other two dip to roughly 0.75-0.85 at low part load and rise above 1.2 near a ratio of 1.3. The tables above give the curve assignments and coefficients.
- source_image: 87536_images/image_000009_5b7a058bdb4ae7227bc982d5595d79f91db099450ecb3b9f856def78820a3397.png
