  alt: |-
    Two-by-two panel comparing an outpatient building's baseline model with zone exhaust fans against an upgrade model with an economizer, showing that adding the economizer eliminates the rapid overnight outdoor-air cycling and leaves rooms two to four degrees warmer in winter.
  description: |-
    Figure 7 (Section 3.4) illustrates a zone exhaust fan issue in an outpatient building. The left column, on peach, is "Baseline model with zone exhaust fan"; the right, on blue, is "Upgrade model with economizer". The top panels plot outdoor air flow rate over 48 hours on a 0-6 kg/s axis. The baseline holds about 5.45 kg/s through the two occupied blocks and then cycles rapidly between 0 and roughly 3.0 kg/s all night, driven by the exhaust needs of the anesthesia room, MRI room and soil work area. The upgrade keeps the same 5.45 kg/s occupied blocks but drops to exactly zero overnight: the nighttime cycling disappears entirely. The bottom panels plot temperatures for outdoor air, the anesthesia room, the MRI room, the soil work area and supply air across a winter period with outdoor air roughly -13C to 0C. In the baseline, supply air swings between about 13 and 19C overnight in step with the flow cycling and drops near 3C at the start of each occupied block. In the upgrade, supply air is smooth near 20-22C overnight, and the MRI room and soil work area sit roughly two to four degrees warmer than baseline because no cold outdoor air is drawn in at night - the winter heating saving the text describes. The two bottom panels use different temperature scales.
- source_image: 86105_images/image_000013_230f4385461ed643964245134c459ac953f473d18f26ff97d89f036cb50ff818.png
  source_image_sha256: 7b581d47da1069596662f84987c8ae92555fb4974a554a6eefffce7cd9f48fd6
