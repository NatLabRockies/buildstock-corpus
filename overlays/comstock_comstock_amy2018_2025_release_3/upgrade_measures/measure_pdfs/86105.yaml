  alt: |-
    Two-by-two panel of 48-hour simulation traces contrasting a baseline model with an economizer against an upgrade model with a new economizer, showing that the baseline economizes all night with no cooling call and overcools the zone to its heating setpoint, while the upgrade admits outdoor air only during daytime cooling hours.
  description: |-
    Figure 6 (Section 3.4, Limitations and Concerns) documents an EnergyPlus economizer issue. The left column, on a peach background, is "Baseline model with economizer"; the right, on blue, is "Upgrade model with (new) economizer". Both top panels plot two days (Hour 0-48) with temperature on the left axis and cooling load on the right: outdoor air temperature, zone temperature, zone heating setpoint (about 15C), zone cooling setpoint (about 26.7C), supply air temperature and cooling load. In the baseline the zone temperature is dragged down overnight to the heating setpoint near 15.5C before rising to the cooling setpoint each afternoon, supply air sits near 12.5C overnight, and cooling load is near zero apart from two afternoon peaks of roughly 4,000-6,000 W. In the upgrade the zone stays near 26.5-27C throughout with no overnight overcooling, and cooling load peaks near 18,000 W during the two afternoons. The bottom panels plot outdoor air fraction and outdoor air flow rate, which overlay because a fraction of 1.0 corresponds to about 3.1 kg/s. The baseline holds the damper wide open essentially continuously, including all night when there is no cooling call; the upgrade holds it at zero except two daytime blocks. That contrast is the figure's point.
- source_image: 86105_images/image_000012_009b074d59016c6830106b0017e5e0d1417886cd148677ecb09764cdb4dc2628.png
  source_image_sha256: be7505cc5a0cda34f5d08aa53b101f93205158bfb4e57cc4d7b4b7332d36de04
