    Small-multiples stacked bar grid showing, for Central Multi-zone VAV RTU and Central Single-zone RTU systems, how the baseline's large NoEconomizer share of floor area, cooling electricity and site total energy is replaced under the upgrade by differential enthalpy and differential dry-bulb control.
  description: |-
    Figure 16 (Section 5.5) shows what the upgrade does to the mix of economizer control types. The grid has two row groups, Central Multi-zone VAV RTU and Central Single-zone RTU, each split into a Baseline row and an Economizer upgrade row, crossed with three column panels: "Total floor area [sqft]" with ticks at 0B, 10B and 20B, "Electricity used for cooling [TBtu]" with ticks at 0, 100, 200 and 300, and "Site total energy [TBtu]" whose only tick labels are 0 and 1000. Bars are segmented by "Out.Params.Economizer Control Type": NoEconomizer, DifferentialEnthalpy, DifferentialDryBulb and FixedDryBulb. In every baseline row a large NoEconomizer segment occupies the right-hand end of the bar. In every upgrade row that segment is gone - only a thin sliver survives in the single-zone floor area panel - replaced by DifferentialEnthalpy plus a smaller DifferentialDryBulb block, while the FixedDryBulb segment representing systems that already had economizers is essentially unchanged in size. Bar totals match between the baseline and upgrade rows within each panel, since the population is the same. As the body notes, new economizers are configured mostly with differential enthalpy control following ASHRAE 90.1-2019.
