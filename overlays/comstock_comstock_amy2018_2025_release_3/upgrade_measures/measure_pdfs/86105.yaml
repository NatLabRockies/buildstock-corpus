  description: |-
    Figure 17 (Section 5.5) shows how much stock floor area is served by faulted economizers. The x-axis is "Building stock floor area [sqft]" with ticks at 0B, 5B, 10B and 15B - absolute area, not a percentage, which is worth noting because the List of Figures entry for this figure mislabels it as a percentage. Fourteen building types are stacked vertically in ascending order of total area, each with a Baseline bar and an Economizer upgrade bar, and the "Measure Names" legend splits each bar into a dark "with economizer fault(s)" segment and a light "no fault" segment. Warehouse dominates at roughly 17 billion square feet, more than three times the next largest; then come SecondarySchool, PrimarySchool, RetailStandalone, LargeOffice, RetailStripmall and SmallOffice in the 3.5 to 4.5 billion range, down to QuickServiceRestaurant, FullServiceRestaurant and SmallHotel under half a billion. The faulted segment is a small minority of every bar and is absent altogether from the hotel and restaurant types. Baseline and upgrade bars look almost identical; the body text quantifies the faulted share as 13% in the baseline and 15% in the upgrade, the increase coming from newly installed economizers picking up the damper-fully-closed fault.
