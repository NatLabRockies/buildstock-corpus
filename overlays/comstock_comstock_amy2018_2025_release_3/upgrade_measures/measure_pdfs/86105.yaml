  alt: |-
    Two-by-two panel comparing a strip-mall restaurant's baseline and upgrade models, showing that under the upgrade the kitchen make-up airflow steps between two levels, 0.115 and 0.13 kg/s, while the gas heating trace is essentially unchanged.
  description: |-
    Figure 8 (Section 3.4) shows a second zone exhaust fan issue, in a strip-mall restaurant. The left column, on peach, is "Baseline model with zone exhaust fan"; the right, on blue, is "Upgrade model with economizer". The top panels plot outdoor air flow on a 0-0.14 kg/s left axis and natural gas for heating on a 0-6,000 W right axis over 48 hours. In the baseline the outdoor air flow holds a single level of 0.115 kg/s across the kitchen exhaust window, which runs from 5 a.m. to midnight, and falls to zero overnight; gas for heating sits near 5,000 W through the first morning, declines to about 4,100 W with a bump near 4,500 W in the evening, and is much lower on the second day. In the upgrade the gas trace is nearly unchanged, but the outdoor air flow now steps between TWO levels - 0.115 kg/s for most of the window and 0.13 kg/s in two blocks - exactly reproducing the body's "airflow rate changing between 0.115 kg/s and 0.13 kg/s", where 0.115 is the rate rebalanced for zone mixing and 0.13 the original rate ignoring it. The bottom panels plot outdoor air rising from about -33C to 0C against dining and kitchen air temperatures and their setpoints, and are nearly identical between baseline and upgrade.
- source_image: 86105_images/image_000014_76e31c393566984ca818da00d3ddd7ec0817ec16bf679fc0e1f0ceaaab443a9c.png
