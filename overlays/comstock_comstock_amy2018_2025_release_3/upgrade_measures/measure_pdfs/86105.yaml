    Choropleth map of the contiguous United States shading each state by median percent electricity savings for cooling, from 1.3% in Florida to 12.3% in Washington, highest in the Pacific Northwest and northern Rockies and lowest along the Gulf Coast.
  description: |-
    Figure 18 (Section 5.5) maps the median percent electricity savings for cooling by state across the contiguous United States. Every state carries a printed value and the diverging colour legend, "Median electricity savings for cooling [%]", runs from 1.3% to 12.3% - endpoints that match the extreme states exactly, which self-corroborates the read, and that the body text rounds to "between 1% and 12 %". The highest savings form a contiguous northwestern block: Washington 12.3%, Montana 10.8%, Oregon 10.2%, Wyoming 9.4%, Idaho 9.1%, North Dakota 7.5%, Colorado 6.9%, California 6.5%. The lowest are along the Gulf and southeastern coasts: Florida 1.3%, Texas 1.9%, Louisiana 1.9%, Mississippi 2.0%, Arkansas 2.0%, Alabama 2.1%, Oklahoma 2.2%. The interior Midwest and Northeast fall in between, generally 2.3% to 6.0%, with Maine 5.9% and New York 4.2% somewhat higher than their neighbours and Nevada an outlier low at 2.4% for the West. The pattern reflects the report's explanation that dry climates with mild summer nights offer the most free-cooling hours, while hot humid climates offer the fewest.
