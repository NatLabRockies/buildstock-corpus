    Choropleth map of the contiguous United States showing the stock annual average percent of heating electricity used by supplemental heating by state, ranging from 6% to 56%.
  description: |-
    Choropleth map of the contiguous United States, one percentage printed on each state, shaded on a light-to-dark teal-blue scale (no colour bar; the printed labels carry the values). The quantity is the stock annual average percent of total heating electricity input used by the supplemental heating system under the HP-RTU measure scenario. Values span 6% to 56%, matching section 5.5's "ranges from 6% to 56%" exactly. The highest fractions are in the cold north: North Dakota 56%, Minnesota 47%, South Dakota 43%, Montana 39%, Wyoming 37%, Iowa 37%, Maine 37%, Wisconsin 36%. The lowest are in the warm south and west: California 6%, Florida 6%, Oregon 9%, Nevada 9%, Arizona 9%, Texas 9%, Louisiana 9%. The map is close to the inverse of Figure 14 - North Dakota pairs 56% supplemental with the lowest 2.1 COP, while California pairs 6% with the highest 5.6 COP - which is the correspondence the body text notes between higher supplemental heating fractions and lower effective COPs. The report attributes the pattern to reduced heat pump capacity in cold ambient conditions, to sizing the heat pump to the design cooling load, and to defrost operation temporarily disabling heat pump heating.
