# Hand-authored figure descriptions for measure PDF 86585
# "End-Use Savings Shapes Measure Documentation: Heat Pump Rooftop Units"
# Chris CaraDonna, Andrew Parker (NREL) and Ryan Meyer (PNNL),
# NREL/TP-5500-86585, August 2024
#
# The PDF yields 26 extracted images. Five are decorative and are deliberately
# left with no overlay entry: image_000000 is the cover photo collage,
# image_000001 a wind-turbine cover photo, image_000002 and image_000003 are
# laboratory photos on the cover, and image_000004 is the NREL wordmark.
# The remaining 21 images are real figures (plus one table that survives only
# as a bitmap) and are all described below, in document order:
#   000005 = Figure 1     000012 = Figure 8      000019 = Figure 14
#   000006 = Figure 2     000013 = Table 5       000020 = Figure 15
#   000007 = Figure 3     000014 = Figure 9      000021 = Figure 16
#   000008 = Figure 4     000015 = Figure 10     000022 = Figure A-1
#   000009 = Figure 5     000016 = Figure 11     000023 = Figure A-2
#   000010 = Figure 6     000017 = Figure 12     000024 = Figure A-3
#   000011 = Figure 7     000018 = Figure 13     000025 = Figure A-4
# Captions sit ABOVE their image refs throughout this document. The Table 5
# bitmap (000013) has no caption line at all in the markdown - its title is
# baked into the image - so it is transcribed rather than described, with
# method: vision-transcription.
#
# QA FLAGS - vision-derived numbers need a human pass before publication.
#
# High confidence (the value is printed on the figure itself, or is
# corroborated by body text or a table):
#   Fig 1  - all 15 bars carry printed data labels; they sum to 100.01%, and
#            the three early-2000s templates total 75.1%, supporting section 2's
#            "most ComStock baseline RTUs follow energy code requirements from
#            the early 2000s".
#   Fig 2  - all 18 bars carry printed data labels and sum to exactly 100.00%;
#            the two applicable rows sum to 44.96%, matching the Executive
#            Summary and section 3.1 "about 45% of the ComStock floor area".
#   Fig 4  - endpoints read directly off the axis grid (0.76 at PLR 0, 1.00 at
#            PLR 1).
#   Fig 9  - the airflow floor 0.255 kg/s over the 0.64 kg/s plateau is 39.8%,
#            matching section 3.2.2's stated 40% minimum supply airflow ratio;
#            the three interior speed boundaries land at 60%, 80% and 100%.
#   Fig 10 - every segment carries a printed data label; the bar totals
#            4342 -> 3893 TBtu give 449 TBtu / 10.34%, and all four Executive
#            Summary bullets reproduce exactly (gas heating -190.4 TBtu /
#            42.3%; heating electricity +6.1 TBtu / 2.6%; cooling -109.2 TBtu /
#            16.4%; fans -143.7 TBtu / 24.3%).
#   Fig 11 - every bar and delta carries a printed label and every percent
#            checks arithmetically; the spread of grid-scenario savings
#            (19-28 MMT) and the 13 MMT natural-gas figure match the Executive
#            Summary exactly.
#   Fig 12 - all ten row labels and sample counts are printed. Fan and cooling
#            medians read 41% and 37%, matching section 5.4's "both roughly
#            40%".
#   Fig 13 - all four row labels and sample counts are printed. The Site box
#            reads Q1 15% / Q3 32%, matching section 5.4's "generally between
#            15% and 35% for the 25th and 75th percentiles".
#   Fig 14 - every state carries a printed COP label; the 2.1 minimum and 5.6
#            maximum match section 5.5's "lower values around 2 COP and the
#            highest values above 5 COP".
#   Fig 15 - every state carries a printed EUI label; 161 / 12 = 13x, matching
#            section 5.5's "more than 10 times higher".
#   Fig 16 - every state carries a printed percent label; the 6% to 56% span
#            matches section 5.5's "ranges from 6% to 56%" exactly.
#   Fig 8  - the Stage 4 capacity-modifier 1.0 contour crosses at outdoor
#            8.56 C on the 21 C indoor line, matching Table 3's 8.3 C rated
#            point.
#   Table 5 - transcribed at 8x; all three lb/MMBtu to kg/MWh conversions check
#            out (x0.4536 x3.412 -> 227.9 / 275.2 / 303.2).
#   A-1 to A-4 - the aggregate deltas corroborate the body text: A-1 and A-2
#            both give roughly 186 TBtu of natural gas saved against section
#            5.2's 190 TBtu, and A-3 and A-4 both give roughly 242 TBtu of
#            electricity saved against Figure 10's end-use sum of 247 TBtu.
#            A-3 and A-4 independently agree on a 3000 TBtu baseline
#            electricity total.
#
# Medium confidence (pixel-derived, no in-document corroboration; per-item
# values in the appendix figures and the contour readings below should be
# treated as approximate):
#   Fig 5, 6, 7 - described qualitatively only. Contour label values are read
#            off the printed inline labels, but no point value is asserted from
#            the colour field.
#   Fig 7  - a labels-only read of the Stage 4 map at about 21 C indoor gives
#            roughly 2.3 / 3.0 / 4.2 at -17.8 / -8.3 / +8.3 C outdoor against
#            Table 4's 2.11 / 2.66 / 3.80 - consistently about 10% high. No
#            value is asserted in the description; a human should confirm
#            whether Table 4's points sit on a different indoor-temperature
#            line.
#   Fig 8  - the same offset appears here: the pixel scan at 21 C indoor gives
#            about 0.70 at -8.3 C and about 0.55 at -17.8 C against Table 3's
#            0.64 and 0.45, even though the 1.0 crossing matches the rated
#            point. No value is asserted in the description.
#   Fig 13 - the Natural Gas Q3 sits on the 100% axis limit, so it is reported
#            as "at or above 100%" rather than as a number.
#   A-1 to A-4 - per-division and per-building-type values are pixel reads from
#            unlabelled bars, converted with a tick-derived scale. Reported to
#            the nearest whole TBtu but good to only about +/-2 TBtu.
#
# DEFECTS found while describing (all verified against the body text):
#   (a) Reference [10] is cited but absent from the References list, which
#       jumps from [9] to [11]. It is cited in Figure 3's caption ("Image from
#       [10]") and in section 3.2.4 for the Rheem Renaissance data, while
#       section 3.2.2 credits [6] (TRANE) for the same single-zone-VAV
#       behaviour. [11] is listed once (Cogswell/Mahmoud) but is cited for both
#       the Daikin Rebel specification sheet and the Carrier lab study.
#   (b) Figure 4's caption says the EIR modifier "is divided by the EIR for the
#       time step", while section 3.2.3 item 1 says it "is multiplied against
#       the full-load EIR ... decreasing the EIR increases the realized
#       efficiency". Only the divided reading is consistent with "captures
#       losses due to part-load cycling". The caption also says "for all speed
#       levels" while section 3.2.3 says the curve "is only used for the lowest
#       compressor speed".
#   (c) Figure 5 Stages 1 and 2 are non-monotonic in outdoor temperature: the
#       capacity modifier dips into a blue lobe near 25-35 C and then rises
#       above 1.5 at 50 C, contradicting section 3.2.3 item 2's "the available
#       capacity decreases as outdoor temperature increases". Stages 3 and 4 do
#       decrease monotonically. Most likely biquadratic extrapolation beyond
#       the fitted range at low compressor speeds. Stage 1's panel title also
#       drops a word: "Capacity Function Temperature: Stage 1".
#   (d) Figure 6's axis tick ranges are transposed relative to Figure 5. The
#       horizontal axis is labelled "Outdoor Air Drybulb Temperature (C)" but
#       is ticked 15 to 24.5, and the vertical axis is labelled "Indoor Air
#       Wetbulb Temperature (C)" but is ticked 10 to 50 - i.e. each axis
#       carries the other's scale (an indoor wetbulb of 50 C is impossible, and
#       10-50 C is Figure 5's outdoor range). The contour gradients themselves
#       run in the physically correct directions for cooling, so only the tick
#       scales appear swapped. Consequence: Table 1's rated point (4.11 COP at
#       35 C outdoor / 19.4 C indoor wetbulb) cannot be located on the figure
#       as ticked. Stage 1's x-axis label is also misspelled "Temperaustre".
#   (e) Figure 7 Stage 1 is non-monotonic: a closed maximum lobe above 7.4 COP
#       sits near 12 C outdoor / 15-16 C indoor, with COP declining again above
#       about 15 C outdoor - non-physical for heating, and the same artifact
#       class as (c). Figure 6 Stages 1 and 2 show closed lobes of the same
#       kind.
#   (f) Figure 7 versus Table 4 offset - see the medium-confidence flags above.
#   (g) Figure 8 versus Table 3 offset - see the medium-confidence flags above.
#   (h) Section 5.3 says grid emissions avoided "range between 6.7% and 7.5%",
#       but Figure 11 prints eGRID at 7.6%, so the stated upper bound is wrong.
#       Figure 11 also plots eGRID second of the three electricity groups
#       whereas its own caption lists eGrid last.
#   (i) Sample counts are inconsistent between Figures 12 and 13. Figure 13's
#       "Natural Gas (n=113387)" is 50 LOWER than Figure 12's "Natural Gas
#       Heating (n=113437)", which is impossible for a fuel-level count versus
#       its own heating-only subset. The same problem appears for electricity:
#       Figure 13's "Electricity (n=211688)" is below Figure 12's "Electricity
#       Cooling (n=211973)" and "Electricity Fans (n=211949)". Only the Other
#       Fuel counts agree (6069 in both).
#   (j) Section 3.2.4 mis-cross-references its own tables: "Table 3 and Table 4
#       compare some key points ... for COP and capacity retention ...
#       respectively" is swapped (Table 3 is capacity, Table 4 is COP), and
#       "normalized to the rated COP of 3.8 ... (Table 1)" should read Table 2.
#       The same paragraph's COP-retention range "3% to 14%" also omits Table
#       4's 0% (Daikin) and 2.9% (Carrier) entries; the true span is 0% to
#       14.3%.
#   (k) Table 6 duplicates a description: stat.dx_heating_average_cop..COP is
#       described as "Average operational COP (compressor only) of DX cooling
#       models during simulation" - verbatim the dx_cooling row's text.
#   (l) Figure 12's caption reuses Figure 13's "for the fuel type category"
#       wording although its rows are end use crossed with fuel. Figure 14's
#       List of Figures entry omits the in-body caption's "for HP-RTU measure
#       scenrio" (typo "scenrio" is in the source).
#   (m) Table 5 survives only as a bitmap (image 000013) and is transcribed
#       below. Note that this document prints the CORRECT propane pairing
#       (177.8 lb/MMBtu = 275.7 kg/MWh); the 182.3 kg/MWh printed in measure
#       PDFs 89340, 89341, 89481, 89133 and 92618 is the erroneous value.
#   (n) The appendix was checked for the wrong/duplicated/swapped-graphic
#       defect class: A-1 is natural gas by census division, A-2 natural gas by
#       building type, A-3 electricity by building type and A-4 electricity by
#       census division, each matching its own caption. No swap or duplication.
