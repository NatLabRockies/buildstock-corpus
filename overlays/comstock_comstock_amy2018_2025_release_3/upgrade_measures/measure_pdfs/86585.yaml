    Violin and box plot of percent site energy savings distributions by end use and fuel type for ComStock models with the HP-RTU measure applied.
  description: |-
    Horizontal violin plots with embedded box plots, one row per end use and fuel combination, on an x-axis of percent site energy savings running from about -170% to +100% with a vertical reference line at 0%. Outlier points are drawn above the distributions. Rows, top to bottom, with the sample counts printed in the labels: Other Fuel Water Systems (n=2); Other Fuel Heating (n=6069); Natural Gas Water Systems (n=102); Natural Gas Heating (n=113437); Electricity Water Systems (n=212); Electricity Refrigeration (n=12657); Electricity Heating (n=133792); Electricity Heat Recovery (n=3923); Electricity Fans (n=211949); Electricity Cooling (n=211973). The two combustion-fuel heating rows pile up at 100% savings with a thin tail of lower values for models whose baseline fuel heating was partly non-applicable. Electricity Cooling reads about 29% at the first quartile, 37% at the median and 44% at the third quartile; Electricity Fans about 31%, 41% and 54%, matching section 5.4's "median fan and cooling energy savings are both roughly 40%". Electricity Heating is higher again, roughly 54% to 70% across the box, with a long negative whisker reaching about -160%. Electricity Heat Recovery straddles zero, with a median near -1.5%. Water systems and refrigeration barely move from zero.
