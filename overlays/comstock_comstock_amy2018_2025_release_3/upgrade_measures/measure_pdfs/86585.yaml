    Violin and box plot of percent site energy savings distributions by fuel type and for total site energy for ComStock models with the HP-RTU measure applied.
  description: |-
    Horizontal violin plots with embedded box plots, four rows, on an x-axis of percent site energy savings running from about -150% to +100% with a vertical reference line at 0%. Rows top to bottom, with sample counts printed in the labels: Other Fuel (n=6069); Natural Gas (n=113387); Electricity (n=211688); Site (n=211978). Other Fuel is effectively degenerate - a very narrow box pressed against roughly 100% savings, with a long thin tail extending left toward and below zero. Natural Gas has its first quartile near 40% and its median near 95%, with the third quartile at or above the 100% axis limit, and a small group of negative outliers. Electricity is centred much lower, roughly 5% at the first quartile, 15% at the median and 24% at the third quartile, with a substantial negative tail from models that switched from gas heating to electric heating. Total Site energy savings run about 15% at the first quartile, 23% at the median and 32% at the third quartile, matching section 5.4's statement that site savings fall "generally between 15% and 35% for the 25th and 75th percentiles". Note that the Natural Gas and Electricity counts here are slightly lower than the corresponding end-use counts in Figure 12, which should not be possible for a fuel total versus its own subset.
