  alt: |-
    Horizontal bar chart of ComStock baseline in-force energy code as a percentage of applicable RTU-served stock floor area, dominated by DOE Ref 1980-2004 at 46.50%.
  description: |-
    Horizontal bar chart with 15 categories on the y-axis and an x-axis labelled "% of Stock Floor Area Served by Applicable RTUs (%)" running 0% to 50%. Every bar carries a printed data label. Top to bottom: ComStock DOE Ref Pre-1980 0.07%; ComStock DOE Ref 1980-2004 46.50%; ComStock 90.1-2004 9.10%; ComStock 90.1-2007 19.52%; ComStock 90.1-2010 5.85%; ComStock 90.1-2013 4.28%; ComStock DEER Pre-1975 0.07%; ComStock DEER 1985 0.86%; ComStock DEER 1996 2.38%; ComStock DEER 2003 2.66%; ComStock DEER 2007 2.93%; ComStock DEER 2011 2.14%; ComStock DEER 2014 0.75%; ComStock DEER 2015 1.52%; ComStock DEER 2017 1.38%. The labelled values sum to 100.01%. DOE Ref 1980-2004 alone is nearly half the applicable floor area, and together with 90.1-2004 and 90.1-2007 accounts for 75.1%, which supports the body text statement that most ComStock baseline RTUs follow energy code requirements from the early 2000s. The nine DEER (California) templates together account for 14.7%. Applicable floor area covers only ComStock buildings with "PSZ-AC with gas coil" and "PSZ-AC with electric coil" HVAC system types.
