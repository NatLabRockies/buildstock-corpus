    Choropleth map of the contiguous United States showing ComStock baseline stock annual average heating energy use intensity by state, ranging from 12 to 161 kWh per square metre per year.
  description: |-
    Choropleth map of the contiguous United States, one value per state printed on the state, shaded on a light-to-dark red scale (no colour bar; the printed labels carry the values). The quantity is ComStock BASELINE stock annual average heating energy use intensity in kilowatt-hours per square metre per year - note this map is of the baseline, not the measure scenario, unlike Figures 14 and 16. Values span 12 to 161. The coldest states are highest: North Dakota 161, Montana 144, South Dakota 137, Minnesota 135, Wisconsin 131, Wyoming 127, Iowa 120 and Michigan 115. The warmest are lowest: Arizona 12, Florida 12, Louisiana 17, Texas 22 and Nevada 23. The ratio of the extremes is 161 to 12, about thirteen-fold, supporting section 5.5's statement that heating energy use intensity in colder states can be "more than 10 times higher" than in warmer climates - the point the report uses to stress the importance of cold-climate heat pump performance. The interior, northeast and mid-atlantic states generally fall between about 40 and 105, and the southeast between about 25 and 50.
