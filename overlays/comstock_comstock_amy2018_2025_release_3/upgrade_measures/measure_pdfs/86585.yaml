  alt: |-
    Bitmap of Table 5, On-Site Fossil Fuel Emissions Factors, giving emissions factors for natural gas, propane and fuel oil.
  description: |-
    This image is a table, not a chart: Table 5 survives in the extracted markdown only as a bitmap, so it is transcribed here. Title: "Table 5. On-Site Fossil Fuel Emissions Factors". Two columns, three data rows, fuel names in a dark blue header column at the left. Natural gas: 147.3 lb/MMBtu (228.0 kg/MWh), carrying footnote marker a. Propane: 177.8 lb/MMBtu (275.7 kg/MWh). Fuel oil: 195.9 lb/MMBtu (303.2 kg/MWh). Footnote a below the table reads "lb = pound; MMBtu = million British thermal units; kg = kilogram; MWh = megawatt-hour". All three unit conversions are internally consistent (multiplying lb/MMBtu by 0.4536 kg/lb and 3.412 MMBtu/MWh gives 227.9, 275.2 and 303.2 kg/MWh). Per section 3.3 these factors come from Table 7.1.2(1) of the draft ANSI/RESNET/ICC 301 standard and are applied to on-site combustion, to be combined with a single chosen electricity grid scenario when totalling emissions.
