  alt: |-
    Schematic of single-zone VAV control showing supply-air temperature setpoint and supply fan airflow against zone sensible load.
  description: |-
    Schematic line diagram (not simulation output; the caption credits an external source). The x-axis is "zone sensible load", running from "design zone heating load" at the left edge to "design zone cooling load" at the right edge. Two y-axes are used: the left axis, in orange, is "supply-air temperature setpoint"; the right axis, in black, is "supply fan airflow", with "design airflow" at the top. Two curves are drawn. The black supply-airflow curve starts at design airflow at the design heating load, falls steeply to a horizontal "minimum airflow limit" about one-fifth of the way across, runs flat along that limit through the middle of the load range, then rises steeply back to design airflow at the design cooling load - a broad V. The orange supply-air-temperature curve is flat at "maximum SAT for heating" over the left-hand fifth, then falls steadily across the middle of the load range, then flattens at "design SAT for cooling" on the right. Read from the heating end inward, supply air temperature is raised first until it hits its maximum and only then is airflow increased; read from the cooling end inward, supply air temperature is lowered to its design value first and then airflow is increased.
- source_image: 86585_images/image_000008_cfba557bdcd8313a48635f4ecb1411e7a001eea5521c4306bbba8ab8c97e50ef.png
  source_image_sha256: 78aba1bd62347fafebb71d264cece4c843fe54e8a656dad2ce408725836a8348
  method: vision-description
  described_utc: '2026-08-21'
  alt: |-
    Line chart of the energy input ratio modifier versus part load ratio, rising linearly from 0.76 at a part load ratio of 0 to 1.00 at a part load ratio of 1.
  description: |-
    Single-panel line chart. The x-axis is "Part Load Ratio" from 0 to 1; the y-axis is "EIR Modifier" from 0.75 to 1. One blue line is plotted and it is straight: it starts at 0.76 at a part load ratio of 0 and rises linearly to 1.00 at a part load ratio of 1, a slope of 0.24 over the full range, passing through roughly 0.82 at 0.25, 0.88 at 0.5 and 0.94 at 0.75. The same curve is used for both heating and cooling coils. Note a documented inconsistency in the surrounding text about how this modifier is applied: the figure caption says the value "is divided by the EIR for the time step, which effectively decreases efficiency at lower part load ratios", whereas section 3.2.3 item 1 says it "is multiplied against the full-load EIR" and that "decreasing the EIR increases the realized efficiency". Only the divided reading produces the cycling penalty the caption describes. The caption also says the curve applies to "all speed levels" while section 3.2.3 says it is used only for the lowest compressor speed, where cycling losses occur.
- source_image: 86585_images/image_000009_1fe8e49b5d32ef2cadf9000d5fa63c0064ff74d18b8a96221271653f6b43649e.png
  source_image_sha256: 4a5bfe0c00db7883736bce5b9c19d1069af0d9b0daab7fd5adb1d9ae2246d3fa
