    Choropleth map of the contiguous United States showing stock annual average effective heating COP by state for the HP-RTU scenario, ranging from 2.1 to 5.6.
  description: |-
    Choropleth map of the contiguous United States, one value per state printed on the state, shaded on a light-to-dark teal-blue scale (no colour bar; the printed labels carry the values). The quantity is stock annual average effective heating COP under the HP-RTU measure scenario, defined in the caption as total heating energy output over total heating energy input, including supplemental heat and defrost but excluding supply fan energy. Values span 2.1 to 5.6, matching section 5.5's "lower values around 2 COP and the highest values above 5 COP". The geographic pattern is clear: warm-climate states are highest - California 5.6, Florida 5.3, Arizona 5.1, Oregon 5.0, Nevada 5.0, Washington 4.6, Texas 4.5 - and cold northern-plains and upper-midwest states are lowest, with North Dakota 2.1, Minnesota 2.5, South Dakota 2.6, Montana 2.7, Wyoming 2.8 and Iowa 2.8. The interior and the mid-Atlantic and southeast fall in between, generally in the 3.0 to 4.4 range. This matches the body text explanation that heat pumps perform better in warmer conditions and that, because units are sized to the cooling load, warm-climate heat pumps cover a larger share of the design heating load. Figure 16 maps the inverse pattern of supplemental heating fraction.
