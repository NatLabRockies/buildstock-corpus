    Two stacked bar charts comparing annual site energy consumption of the ComStock baseline and the HP-RTU scenario, by fuel type and by end use.
  description: |-
    Two side-by-side stacked bar pairs comparing the ComStock baseline with the HP-RTU measure scenario on annual site energy consumption in TBtu; the left pair is segmented by fuel type and the right pair by end use, with printed data labels on the segments and a legend of fuel and end-use categories. Total site energy falls from 4,342 TBtu in the baseline to 3,893 TBtu with the measure, a saving of 449 TBtu or 10.3%. The direction and rough size of the end-use changes are: natural gas heating drops sharply, from 450.5 to 260.1 TBtu (-190.4 TBtu, 42.3%), the single largest change; fan electricity drops substantially, 591.4 to 447.7 TBtu (-143.7 TBtu, 24.3%); cooling electricity drops substantially, 667.7 to 558.5 TBtu (-109.2 TBtu, 16.4%); and heating electricity rises slightly, 232.9 to 239.0 TBtu (+6.1 TBtu, 2.6%), because gas-heated buildings are electrified even though electric resistance buildings become more efficient. Other fuels used for heating fall to near zero, and the remaining end uses (lighting, interior equipment, water systems, refrigeration) are essentially unchanged. Appendix Figures A-1 through A-4 give the same totals broken out by census division and building type; use Figures 12 and 13 for per-model savings distributions.
