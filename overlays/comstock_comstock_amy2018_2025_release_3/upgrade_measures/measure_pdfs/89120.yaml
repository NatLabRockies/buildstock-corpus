# Hand-authored figure descriptions for measure PDF 89120
# "End-Use Savings Shapes Measure Documentation: Improved Fan Scheduling and
#  Control of Outdoor Air During Unoccupied Periods"
# Amy Allen and Chris CaraDonna, NREL/TP-5500-89120, April 2024
#
# The PDF yields 24 extracted images. Seven are decorative and are deliberately
# left with no overlay entry: image_000000-image_000005 are the six cover photo
# tiles, and image_000006 is the NREL wordmark. The remaining 17 images are real
# figures and are all described below (image_000007 = Figure 1 ... image_000023 =
# Figure A-4). image_000008 is a bitmap of Table 1, which the markdown extraction
# lost entirely, so it is transcribed rather than described.
#
# QA FLAGS - vision-derived numbers need a human pass before publication.
#
# High confidence (values are printed on the figure itself, or corroborated by
# body text):
#   - Figure 1 (000007): every bar is value-labeled; all 13 rows transcribed.
#   - Table 1 (000008): all six numbers legible at 8x zoom.
#   - Figure 3 (000010), Figure 4 (000011), Figure 5 (000012), Figure 6 (000013):
#     segment/bar labels are printed; Figure 4's four deltas reproduce section
#     5.2's TBtu figures exactly, and Figure 6's deltas reproduce the Executive
#     Summary's "7 to 9 MMT" electricity and "3 MMT" natural gas claims exactly.
#   - Figure 7-10 row labels and n values (000014-000017): read at 7-8x zoom.
#     Figure 9's and Figure 10's n values both sum to exactly 192,092, which is a
#     strong mutual cross-check.
#   - Figure 11 (000018): box, median and whisker positions measured against
#     gridlines at 3.33 px per percent; corroborated across the two panels.
#
# Medium confidence (pixel-derived, no printed labels; treat as approximate):
#   - Figure 7-10 quartile positions: the interquartile boxes are 1-4 px wide at
#     the source resolution. Reported to the nearest whole percent; do not rely on
#     a stated difference of less than about 1 percentage point.
#   - Figure 4's hatched natural gas segment labels (854.9 / 804.4 / 212.1 TBtu)
#     were settled by band geometry plus section 5.2's deltas, because the
#     diagonal hatch strokes cross the digits.
#   - Figure 12 (000019): the red "max potential penalty" line's slope measures
#     1.25 kWh gas per kWh fan, i.e. exactly the 80% coil efficiency the text
#     claims. Individual scatter points are not enumerated.
#   - Figures A-1 to A-4 (000020-000023): the bars carry no value labels, so every
#     number is pixel-derived (+/- one pixel, worth 2.5 TBtu in A-1, 4.3 in A-2,
#     1.5 in A-3 and 2.7 in A-4). Bar pairs whose tops differ by one pixel or less
#     are reported as "no measurable change" rather than as a small delta.
#
# DEFECTS AND INTERNAL INCONSISTENCIES observed while describing these figures:
#   (a) The Executive Summary's savings bullets disagree with section 5.2 and with
#       Figure 4. The ES claims "3.3% stock cooling electricity savings (24 TBtu)"
#       and "14.5% stock fan electricity savings (87 TBtu)"; section 5.2 and
#       Figure 4's own segment labels give 2.7% / 18.3 TBtu cooling and 11% /
#       58.3 TBtu fans. The ES also omits section 5.2's heating-electricity bullet
#       (7.2% / 12.7 TBtu). The ES bullets sum to 161 TBtu, more than the 150 TBtu
#       total both sections claim; section 5.2's bullets sum to 139.8 TBtu, which
#       is what Figure 4's labels actually show.
#   (b) The Measure Summary table says the measure is "applicable to about 58% of
#       the floor area modeled in ComStock"; section 3.1 says "about 45% of the
#       sample in weighted floor area".
#   (c) Section 3.3 says the three grid scenarios "compare the emissions of the
#       ComStock baseline and the window replacement scenario" - a copy-paste
#       error from an unrelated window-replacement measure document.
#   (d) Table 1's propane factor reads 177.8 lb/MMBtu and 182.3 kg/MWh, but
#       177.8 lb/MMBtu converts to about 275.7 kg/MWh. The natural gas (228.0)
#       and fuel oil (303.2) SI values are both correct. This is the same bad
#       propane conversion that appears in measure PDF 86897.
#   (e) Table 1 survives only as a bitmap (image_000008); the markdown extraction
#       produced no table and no caption line for it, so its numbers are
#       unreachable without this figure overlay.
#   (f) Section 5.4 says "Figure 8 shows the distribution of savings percentage by
#       end use and fuel type" - that is Figure 7's content, and Figure 8 is the
#       by-HVAC-system-type version.
#   (g) Section 5.6 refers to "Figure 11" three times where it means Figure 12
#       (the natural gas penalty scatterplots).
#   (h) Section 5.2 cites "Fernandez et al. (2017)" and then "Fernandez et al.
#       (2013)"; only the 2017 entry exists in the reference list, and section 1
#       attributes the same 7.3%-small-office and 0.3%-stock-penalty results to
#       the 2017 paper.
#   (i) Figure 1's caption reads "Prevalence of HVAC system types to which this
#       measure is applicable", but its "% Stock Floor Area" column sums to 82.5%
#       and its "% Model Count" column to 84.2% - neither the 45% of section 3.1
#       nor the 58% of the Measure Summary. The panel shows system-type
#       prevalence, not applicability.
#   (j) Figure 1 includes a "PTAC with electric coil" row (2.8% of stock floor
#       area) and a "PSZ-HP" row, although section 3.1 explicitly excludes
#       zone-level PTAC and PTHP systems from applicability.
#   (k) Section 5.2 states 9.5% aggregate site energy savings for applicable
#       buildings; Figure 5's own printed totals give 151/1991 = 7.6%.
#   (l) Section 5.2's "fraction of fan energy savings (26%)" cannot be reproduced
#       from Figure 5: fan savings are 38.6% of the applicable-only total saving
#       and 22.2% of applicable-only baseline fan energy.
#   (m) Section 5.2's "5.6% stock heating gas savings" against Figure 4's own
#       labels, which give 50.5/854.9 = 5.9%.
#   (n) Section 5.1 says "a reduction in fan operating hours is not expected
#       through application of the measure" for the vent-cycle baseline, yet
#       Figure 3 shows Fans_Elec falling 19.1 to 11.1 GJ (-42%). The text then
#       attributes that drop to the heating and cooling load reduction.
#   (o) Sections 2 and 3.1 both state the measure was not applied to hospitals,
#       outpatient health care facilities or schools, but Figure 9 lists
#       Hospital (n=43), Outpatient (n=1777) and SecondarySchool (n=152), and
#       Figures A-3 and A-4 show a measurable Outpatient and SecondarySchool
#       change. Hospital, PrimarySchool, SmallHotel and LargeHotel do come out
#       exactly unchanged in A-3 and A-4.
#   (p) Figure 8's per-HVAC-system n values sum to 5,823, while Figure 9's and
#       Figure 10's both sum to 192,092. The three figures cannot all be counting
#       applicable ComStock models.
#   (q) Figures A-1 and A-3 disaggregate the same stock natural gas total two
#       ways and agree with each other (about 1,290-1,308 TBtu baseline, about
#       69-72 TBtu saved), but the saving they show is roughly 40% larger than
#       the 50.5 TBtu of section 5.2 and Figure 4. Figure A-4's electricity saving
#       (about 90 TBtu) does match Figure 4's electricity deltas (89.3 TBtu),
#       while Figure A-2's (about 130 TBtu) does not, and A-2's baseline total
#       (about 3,176 TBtu) exceeds A-4's (about 2,876 TBtu) by roughly 10%.
#   (r) Figure A-4's legend labels the measure "Unoccupied AHU Control" while
#       A-1, A-2 and A-3 label it "Unoccupied OA Control"; Figures 4 and 5 use
#       "Unoccupied AHU Control".
#   (s) Figure A-1's extracted bitmap has the stray word "Figure" baked into its
#       top-left corner, a bleed from the PDF text layer into the image crop.
#   (t) All four appendix figures label the y axis in lowercase "tbtu", and A-3
#       and A-4 label the x axis "Comstock Building Type" with a lowercase s.
#   (u) The List of Figures entry for Figure 2 describes a two-panel figure
#       ("...with ventilation (top, base case), cycling without ventilation
#       (bottom, after measure applied)"), but image_000009 is a single panel
#       with the two cases overlaid as two series; the in-text caption drops the
#       "top"/"bottom" wording.
#   (v) Figure 5's caption is split around its image reference: the head is at
#       markdown line 270, the image ref at 272, and the tail "Energy consumption
#       is categorized both by fuel type and end use." at 276.
#   (w) Figure 12's two panels plot the identical point cloud with different y
#       limits (0 to -20,000 kWh at left, 0 to -40,000 kWh at right). Since the
#       deepest plotted gas penalty is about -18,300 kWh, nothing is clipped in
#       either panel and the right-hand panel adds no information.
#   (x) The References block is badly scrambled by table extraction: the CaraDonna
#       and Dombrovski entry and the Present/Gagnon carbon-emissions-factors entry
#       have both lost their lead author lines, the Murphy (2006) URL is
#       truncated, and the CDC entry reads "COVID-10".
#   (y) "T he remaining samples retained their original nighttime ventilation
#       control." - a broken word from extraction. Section 1 and the Executive
#       Summary also carry "enduse", "longterm", "singlezone", "PSZHP" and
#       "eliminating of ventilation".
