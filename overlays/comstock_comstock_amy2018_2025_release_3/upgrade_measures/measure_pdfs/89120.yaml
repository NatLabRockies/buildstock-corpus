    Three-panel stacked bar chart of annual greenhouse gas emissions in million metric tons CO2e, baseline against measure, under three electricity grid scenarios
  description: |-
    Figure 6. Three side-by-side panels, one per electricity grid scenario, each holding a baseline and a measure stacked bar. The y axis is 'Annual GHG Emissions (MMT CO2e)' and the legend splits each bar into Electricity (blue), Natural Gas (orange), Fuel Oil (green) and Propane (brown). Panel 'eGRID 2021': 402 MMT total (electricity 314, natural gas 81) falling to 389, a 3% reduction (electricity 305, natural gas 78). Panel 'LRMER High RE Cost 15': 325 (237, 81) falling to 313, a 4% reduction (228, 78). Panel 'LRMER Low RE Cost 15': 240 (152, 81) falling to 230, a 4% reduction (145, 78). The fuel oil and propane segments are unlabeled and together account for roughly 6 to 7 MMT. All the quoted numbers are printed on the figure. The electricity reduction is 9, 9 and 7 MMT across the three scenarios and the natural gas reduction a constant 3 MMT, matching the Executive Summary's '7 to 9 MMT' and '3 MMT' claims; the proportional cut rises as assumed grid carbon intensity falls, because the gas share of the saving is fixed.
