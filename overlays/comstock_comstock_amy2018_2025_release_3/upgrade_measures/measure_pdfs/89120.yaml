  alt: |-
    Two boxplot panels of site energy savings by baseline nighttime ventilation control mode, without outliers at left and with outliers at right
  description: |-
    Figure 11. Two panels of three boxplots each, sharing the x axis 'in.hvac_night_variability' with categories night_fancycle_novent, night_fancycle_vent and night_fanon_vent, and the y axis 'Site energy savings (%)'. The panels differ only in y range: the left panel spans 0% to 30% and omits outliers, the right spans 0% to 60% and shows them. Left panel readings - night_fancycle_novent: the box collapses onto a green median line at 0.0% with no visible whiskers; night_fancycle_vent: Q1 +0.6%, median +1.2%, Q3 +3.0%, whiskers -1.5% to +6.6%; night_fanon_vent: Q1 +10.2%, median +14.7%, Q3 +19.5%, whiskers 0.0% to +33.3%. In the right panel the outlier clouds reach about +45% for night_fancycle_novent, about +62% for night_fancycle_vent and about +46% for night_fanon_vent. Sample sizes from the caption: night fan cycle no vent 1,678, night fan cycle vent 3,876, night fan on vent 2,230. The ordering confirms the text's expectation that fan-on-with-ventilation baselines have the most to gain.
