    Figure A-4. Grouped vertical bar chart with x 'Comstock Building Type' and y 'Electricity Total Energy Consumption (tbtu)', ticked 0 to 400. The legend 'Upgrade Name' pairs a dark blue Baseline bar with a light blue bar labeled 'Unoccupied AHU Control' - the only appendix figure to use the AHU wording - in each of 14 groups. No values are printed, so these readings are measured off the axis and are good to about 3 TBtu. Baseline then measure: FullServiceRestaurant 167 to 159; QuickServiceRestaurant 61 with no measurable change; RetailStripmall 396 to 382; RetailStandalone 276 to 265; SmallOffice 192 to 176; MediumOffice 181 to 167; LargeOffice 292 to 279; PrimarySchool 219 unchanged; SecondarySchool 224 to 222; Outpatient 124 unchanged; Hospital 159 unchanged; SmallHotel 34 unchanged; LargeHotel 189 unchanged; Warehouse 361 to 350. The bars sum to about 2,876 TBtu baseline and 2,786 with the measure. That 90 TBtu saving matches the 89.3 TBtu of electricity savings implied by Figure 4's labels closely, unlike Figure A-2's 130 TBtu.
