  alt: |-
    Two scatterplot panels of natural gas heating penalty against fan energy savings, colored by climate zone, with a red maximum-expected-penalty line
  description: |-
    Figure 12. Two scatterplot panels, identical point clouds drawn at two y scales. Both have x 'Fan energy savings (kWh)' from 0 to 60,000 and y 'Natural gas heating energy savings (kWh)' running down from 0; the left panel stops at -20,000 and the right at -40,000. Every point is a building with a gas heating penalty, so all y values are negative. The legend lists CZ 3 (blue), CZ 6 (orange), CZ 5 (green), CZ 4 (red), CZ 2 (purple) and a red 'Max potential penalty' line. That line falls from the origin with a measured slope of about 1.25 kWh of gas penalty per kWh of fan saving, i.e. the reciprocal of the 80% coil efficiency the text assumes, reaching -20,000 kWh at about 16,000 kWh of fan savings. Every plotted point lies above the line, confirming the text's 'gut check' that observed penalties stay below the theoretical maximum. Most points cluster between 0 and -4,000 kWh; the deepest is about -18,300 kWh at roughly 58,500 kWh of fan savings. Because nothing reaches -20,000, the wider right-hand panel adds no information. Buildings with fan savings above 60,000 kWh are excluded.
