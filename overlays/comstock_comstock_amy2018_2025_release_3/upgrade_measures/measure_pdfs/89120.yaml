  alt: |-
    Bitmap of Table 1, listing on-site fossil fuel emissions factors for natural gas, propane and fuel oil in pounds per million Btu and kilograms per megawatt-hour
  description: |-
    Table 1. On-Site Fossil Fuel Emissions Factors. A three-row, three-column table transcribed from the page bitmap; the markdown extraction dropped it entirely. Columns: 'On-Site Fuel', 'Emissions Factor (lb/MMBtu)', 'Emissions Factor (kg/MWh)'. Rows - Natural gas: 147.3 lb/MMBtu, 228.0 kg/MWh; Propane: 177.8 lb/MMBtu, 182.3 kg/MWh; Fuel oil: 195.9 lb/MMBtu, 303.2 kg/MWh. Footnote a reads 'lb = pound; MMBtu = million British thermal units; kg = kilogram; MWh = megawatt-hour'. Section 3.3 says these factors come from Table 7.1.2(1) of draft ANSI/RESNET/ICC 301 (Vijayakumar et al., 2022). Note that the propane SI value is wrong: 177.8 lb/MMBtu converts to about 275.7 kg/MWh, not 182.3. The natural gas and fuel oil conversions both check out, so only the propane row is affected.
