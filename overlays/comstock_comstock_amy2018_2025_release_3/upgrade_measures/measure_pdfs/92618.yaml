  alt: |-
    Grouped bar chart of site annual natural gas consumption by building type, Baseline vs HP RTU Std Perf vs Std Perf w Roof
  description: |-
    Figure A-2. Grouped bar chart of Natural Gas Total Energy Consumption (TBtu) by ComStock building type, y-axis 0 to about 250. Three bars per type (Baseline, HP RTU Std Perf, Std Perf w Roof) across FullServiceRestaurant, QuickServiceRestaurant, RetailStripmall, RetailStandalone, SmallOffice, MediumOffice, LargeOffice, PrimarySchool, SecondarySchool, Outpatient, Hospital, SmallHotel, LargeHotel, and Warehouse. SecondarySchool is the largest (baseline about 245), followed by RetailStripmall (about 220) and FullServiceRestaurant (about 195). Both measure scenarios reduce natural gas below baseline for every type, most sharply where gas heating dominates.
- source_image: 92618_images/image_000014_5f0491ffdde7a270736b5229cffcea1b28b97b3cf1cc846e64eb507fb1acd0e2.png
  source_image_sha256: a06ff0b8b3661f3bead4457c887ad1c9df8c108b3e533a6194a2eb4589f5cf00
