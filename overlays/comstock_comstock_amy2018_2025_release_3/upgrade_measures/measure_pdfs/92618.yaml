# Hand-authored figure descriptions for measure_pdfs/92618.pdf (Standard Performance Heat Pump
# Rooftop Unit with New Roof / improved roof insulation).
# Scope: figures + one embedded table bitmap; cover montage (000000) and NREL logo (000001)
# omitted; Tables 1, 3, 4, 5 and ES tables are real markdown text. Figures 1-9 and A-1 to A-4 =
# images 000002-000003 and 000005-000015 EXCEPT 000004, which is a bitmap of Table 2 (On-Site
# Fossil-Fuel Emissions Factors) captured with method vision-transcription. All charts use method
# vision-description (numbers read off charts, need QA). NOTE for QA: Figure 7 (000009) is captioned
# 'by end use and fuel type' in the source but the bitmap actually plots utility bill savings by
# climate zone -- the description matches the bitmap. Least-certain reads: Figure 2 (000003) HVAC
# distribution, Figure 4 (000006) energy stacks, and Figure 9 (000011) per-state choropleth labels.
# See the Table 2 entry for a noted propane kg/MWh inconsistency. Every entry pins the PNG sha256.

