  alt: |-
    Two U.S. choropleth maps of mean annual total utility bill savings by state for the HP-RTU-only scenario and the roof-insulation package
  description: |-
    Figure 9. Two side-by-side U.S. choropleth maps of Mean Bill Savings (%) by state, with a shared color scale from about -4.6% to 5.5%. Left map: HP RTU Std Perf (retrofit only). Right map: Std Perf w Roof (adds roof insulation). Most states show positive mean bill savings of roughly 1-4% (deeper blue in parts of the West and Southeast), while a handful of states show small negative savings (bill increases, e.g. labels near -0.7% and -0.6% in the north-central states). The roof-insulation package (right) shows modestly larger savings than the HP-RTU-only scenario (left) in most states. (Many small per-state labels -- flag exact state values for QA.)
- source_image: 92618_images/image_000012_b841943bcf844989328dbbba7c45e5b5340a541baeddd9453128a5f20e4a1595.png
