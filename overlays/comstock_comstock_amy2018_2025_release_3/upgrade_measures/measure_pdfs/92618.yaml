  alt: |-
    Grouped bar chart of site annual electricity consumption by census division, Baseline vs HP RTU Std Perf vs Std Perf w Roof
  description: |-
    Figure A-4. Grouped bar chart of Electricity Total Energy Consumption (TBtu) by U.S. census division, y-axis 0 to about 700. Three bars per division (Baseline, HP RTU Std Perf, Std Perf w Roof) for New England, Middle Atlantic, East North Central, West North Central, South Atlantic, East South Central, West South Central, Mountain, and Pacific. South Atlantic is the largest (about 690), followed by West South Central and Pacific (roughly 460-470). The measure scenarios are close to baseline in every division, reflecting the small net electricity change from the HP-RTU and roof-insulation package.
