  alt: |-
    Two-panel stacked bar chart of annual site energy consumption by end use and fuel, whole stock and applicable subset, Baseline vs HP RTU Std Perf vs Std Perf w Roof
  description: |-
    Figure 4. Two-panel stacked bar chart of Annual Energy Consumption (TBtu) by end use and fuel per the legend, comparing ComStock Baseline, HP RTU Std Perf, and Std Perf w Roof. Panel (a) whole commercial building stock, y-axis 0 to 5000: totals Baseline 4763, HP RTU Std Perf 4474, Std Perf w Roof 4457. Panel (b) only buildings applicable to the measure, y-axis 0 to about 1650: totals Baseline 1653, HP RTU Std Perf 1365, Std Perf w Roof 1347. In both panels Interior Equipment Electricity is unchanged (about 725.6 whole stock, 259.5 applicable); the reductions come from Heating Natural Gas being fuel-switched to Heating Electricity plus efficiency gains, with the roof-insulation variant slightly below the HP-RTU-only scenario. (Dense small labels -- flag exact segment values for QA.)
