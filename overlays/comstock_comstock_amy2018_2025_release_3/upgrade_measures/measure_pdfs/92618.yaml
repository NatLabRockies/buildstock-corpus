  alt: Table of on-site fossil fuel emissions factors for natural gas, propane, and fuel oil
  description: |-
    Table 2. On-Site Fossil-Fuel Emissions Factors. Natural Gas: 147.3 lb/MMBtu (228.0 kg/MWh). Propane: 177.8 lb/MMBtu (182.3 kg/MWh). Fuel Oil: 195.9 lb/MMBtu (303.2 kg/MWh). Footnote a: lb = pound; MMBtu = million British thermal units; kg = kilogram; MWh = megawatt-hour. These are the combustion emissions factors applied to on-site fossil fuel use when computing greenhouse gas emissions. (Note for QA: the propane kg/MWh value 182.3 is inconsistent with its 177.8 lb/MMBtu value, which converts to about 275 kg/MWh; transcribed as printed and likely a source typo.)
- source_image: 92618_images/image_000005_5cc07b0b8d69eeb01e1e1290e85dbe345b8734c2db16c955a00b01532b793f19.png
