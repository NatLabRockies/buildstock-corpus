  alt: |-
    Line chart comparing predicted sensible heating load over one week for a sample rooftop unit with and without the new roof insulation
  description: |-
    Figure 3. Line chart of Predicted Sensible Load (W), y-axis 0 to 6000, over the week Jan 11 to Jan 17, for a single sample rooftop unit on the top floor of a building (including exterior roof area). Two lines are plotted: HP RTU and HP RTU with New Roof. Both follow the same strongly diurnal pattern with peaks near 4000-5000 W; the 'with New Roof' line sits slightly below the plain HP RTU line at the load peaks, showing the added roof insulation modestly reduces the heating load.
