  alt: Two-panel horizontal bar chart of ComStock HVAC system type distribution by stock floor area
    and by number of buildings
  description: |-
    Figure 2. Two-panel horizontal bar chart of ComStock HVAC system type distribution; left panel % of Stock Floor Area, right panel % of Buildings. The measure scenario applies to PSZ-AC with gas coil and PSZ-AC with electric coil. Rows (floor area % / buildings %): PSZ-AC with gas coil 27% / 37%, PVAV with gas boiler reheat 9% / 8%, PSZ-AC with electric coil 9% / 13%, VAV chiller with gas boiler reheat 8% / 2%, PVAV with gas heat with electric reheat 6% / 2%, VAV air-cooled chiller with gas boiler reheat 4% / 2%, PVAV with PFP boxes 4% / 7%, Residential AC with residential forced air furnace 3% / 2%, PSZ-HP 3% / 3%, PTAC with electric coil 3% / 2%, PSZ-AC with gas boiler 2% / 3%, VAV chiller with PFP boxes 2% / 1%, PTHP 2% / 1%, DOAS with fan coil chiller with boiler 2% / 0%, VAV district chilled water with district hot water reheat 2% / 0%, DOAS with water source heat pumps cooling tower with boiler 2% / 0%, and Other System Types (<1% each) 8% / 6%. Establishes that PSZ-AC with gas coil dominates the applicable stock. (Dense small labels -- flag exact values for QA.)
