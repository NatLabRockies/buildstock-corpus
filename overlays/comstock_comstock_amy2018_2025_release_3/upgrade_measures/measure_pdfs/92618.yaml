  described_utc: '2026-08-20'
  alt: |-
    Grouped bar chart of site annual electricity consumption by building type, Baseline vs HP RTU Std Perf vs Std Perf w Roof
  description: |-
    Figure A-3. Grouped bar chart of Electricity Total Energy Consumption (TBtu) by ComStock building type, y-axis 0 to about 400+. Three bars per type (Baseline, HP RTU Std Perf, Std Perf w Roof) across FullServiceRestaurant, QuickServiceRestaurant, RetailStripmall, RetailStandalone, SmallOffice, MediumOffice, LargeOffice, PrimarySchool, SecondarySchool, Outpatient, Hospital, SmallHotel, LargeHotel, and Warehouse. RetailStripmall is the largest (about 420), followed by Warehouse (about 375) and SecondarySchool (about 345). The measure scenarios are close to baseline for most types, slightly higher where electrified heating adds load and slightly lower where cooling efficiency dominates.
