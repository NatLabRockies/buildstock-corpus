  described_utc: '2026-08-20'
  alt: Grouped bar chart of annual stock electricity energy consumption by building type, Baseline vs
    Package 3
  description: |-
    Figure 13. Grouped bar chart of Electricity Total Energy Consumption (TBtu) by ComStock building type, y-axis 0 to about 400+. Two bars per type (Baseline, dark blue; Package 3, light blue) across FullServiceRestaurant, QuickServiceRestaurant, RetailStripmall, RetailStandalone, SmallOffice, MediumOffice, LargeOffice, PrimarySchool, SecondarySchool, Outpatient, Hospital, SmallHotel, LargeHotel, and Warehouse. RetailStripmall is the largest (about 420), followed by Warehouse (about 375). Package 3 electricity is close to baseline for most types -- slightly lower where lighting/cooling savings dominate and modestly higher for some types where electrified heating adds load (e.g. SecondarySchool rises toward 345).
