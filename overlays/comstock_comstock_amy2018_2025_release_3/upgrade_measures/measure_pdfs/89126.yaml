  alt: |-
    Three-panel stacked bar chart of annual greenhouse gas emissions under three grid scenarios, Baseline vs Package 2 vs Package 3
  description: |-
    Figure 5. Three-panel stacked bar chart of Annual GHG Emissions (MMT CO2e), y-axis 0 to about 450, under three grid-emissions scenarios (eGRID 2021, LRMER High RE Cost 15, LRMER Low RE Cost 15). Each panel has three bars (Baseline, Package 2, Package 3) stacked by fuel (Electricity, Natural Gas, Fuel Oil, Propane). eGRID 2021: Baseline 436 (Electricity 330, Natural Gas 99), Package 2 378 (-13%), Package 3 388 (-11%). LRMER High RE Cost 15: Baseline 338, Package 2 281 (-17%), Package 3 288 (-15%). LRMER Low RE Cost 15: Baseline 242, Package 2 188 (-22%), Package 3 192 (-20%). Emissions reductions are larger under cleaner (LRMER) grid assumptions, and Package 2 slightly outperforms Package 3.
