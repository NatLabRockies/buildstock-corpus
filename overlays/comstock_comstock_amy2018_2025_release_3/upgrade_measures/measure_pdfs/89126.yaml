  alt: Violin and box plots of percent site energy savings by end use across the modeled stock for Package
    3
  description: |-
    Figure 9. Horizontal violin-plus-box plots of Percent Site Energy Savings by End Use (%), x-axis about -160% to 100%, titled 'Upgrade 36.0: Package 3 (unweighted)'. Rows are end-use/fuel combinations with model counts, including Natural Gas Heating (n=67480), Electricity Cooling (n=122050), Electricity Fans (n=126498), Electricity Heating (n=110299), Electricity Interior Lighting (n=118276), Electricity Interior Equipment (n=8), Electricity Pumps (n=53893), Electricity Refrigeration (n=30409), Electricity Water Systems (n=4872), Natural Gas Water Systems (n=3180), District Cooling (n=4433), District Heating (n=6547), and Other Fuel Heating (n=15961). Natural Gas Heating shows a large positive savings distribution (heating fuel-switched off gas), Interior Lighting and Cooling are positive, while Electricity Heating skews negative (electricity added by the heat pumps). (Dense rows -- flag exact counts for QA.)
