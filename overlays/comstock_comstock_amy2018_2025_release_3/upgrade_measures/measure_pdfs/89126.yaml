  alt: Stacked column chart of annual stock site energy consumption by end use and fuel, Baseline vs
    Package 2 vs Package 3
  description: |-
    Figure 4. Stacked column chart of Annual Site Energy Consumption (TBtu), y-axis 0 to 5000, comparing ComStock Baseline (total 4768), Package 2 (LED + HP-RTU + ASHP Boiler, total 3854), and Package 3 (LED + HP-RTU Standard Performance + ASHP Boiler, total 3946). Package 3 saves about 822 TBtu (roughly 17%) versus baseline. Columns are segmented by end use and fuel per the legend. Legible segments: Interior Equipment Electricity 725.7 (unchanged in all three); Fans Electricity 557.7 (baseline) to 452.8 (Pkg 2) / 488.0 (Pkg 3); Cooling Electricity 701.9 to 623.4 / 655.7; Heating Natural Gas 417.0 in the baseline largely replaced by Heating Electricity (503.6 in Pkg 2, 525.7 in Pkg 3) as gas heating is fuel-switched to heat pumps; Water Systems 191.0. Shows savings come from lighting and cooling plus fuel-switching heating to electricity.
- source_image: 89126_images/image_000007_dae8f65e86ec84032719ec76b9a71046d74291b0ee87a3a347f2011f3b795a0e.png
