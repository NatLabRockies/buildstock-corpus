  alt: Box-and-whisker plots of maximum daily electric peak timing by season, Baseline vs Package 2
    vs Package 3
  description: |-
    Figure 10. Box-and-whisker plots of maximum daily peak timing (hour of day, x-axis 0 to 24) by season, in three stacked panels (summer, winter, shoulder). Each panel has three rows (Baseline, Package 2, Package 3). In summer, peaks cluster in the afternoon (interquartile box roughly hours 11-14) similarly across all scenarios. In winter, the baseline peak is spread across mid-day (box roughly hours 8-14) while Package 2 and Package 3 shift and narrow toward late morning (box roughly hours 9-12) as electrified heating changes the peak. Shoulder season is intermediate. Shows electrification mainly reshapes the winter peak timing.
- source_image: 89126_images/image_000013_8607266614a095127848a2ffc3d3172d601e2274788e9a37b4c17cdb20eabad4.png
  source_image_sha256: 2b5d3d059e03340c1921213057ab56961bb79f7a8ead35457960efb0a7ca28d7
