# Hand-authored figure descriptions for measure_pdfs/89126.pdf (LED Lighting + HP-RTU Standard
# Performance + ASHP Boiler package).
# Scope: figures + one embedded table bitmap; cover montage (000000) and NREL logo (000001)
# omitted; Tables 1-4, 6, 7 are real markdown text. Figures 1-13 = images 000002-000015 EXCEPT
# 000004, which is a bitmap of Table 5 (On-Site Fossil Fuel Emissions Factors) embedded in the
# GHG-methods section -- captured with method vision-transcription so its factors are retrievable.
# All charts use method vision-description (numbers read off charts, need QA). Least-certain reads:
# Figure 2 (000003) HVAC prevalence and Figure 11 (000013) climate x season peak-intensity matrix
# have dense small labels -- treat those exact values as provisional. Every entry pins the on-disk
# PNG sha256.

