  alt: Horizontal bar chart of the fraction of floor area applicable per observed upgrade combination
  description: |-
    Figure 3. Horizontal bar chart titled 'Fraction of Floor Area Applicable per Upgrade Combination', x-axis 0 to 0.30. Bars by observed measure combination: LED Only 0.28, LED + HP-RTU 0.26, LED + HP-Boiler 0.22, Not Applicable 0.10, HP-RTU Only 0.08, and HP-Boiler Only 0.07. At least one measure applied to about 90% of stock floor area (10% not applicable), with LED lighting present in the great majority of applicable combinations.
- source_image: 89126_images/image_000006_0d865ddfb35564c218b84f7a52c6597439ab91ff1b3b73b7d5560fdbc3c866d4.png
  source_image_sha256: fc57cb0644810689c10f86c11844c8b831dd9e25339587b2be1e39c4b2790db6
