  alt: Grouped bar chart of annual stock natural gas energy consumption by building type, Baseline vs
    Package 3
  description: |-
    Figure 12. Grouped bar chart of Natural Gas Total Energy Consumption (TBtu) by ComStock building type, y-axis 0 to about 250. Two bars per type (Baseline, dark blue; Package 3, light blue) across FullServiceRestaurant, QuickServiceRestaurant, RetailStripmall, RetailStandalone, SmallOffice, MediumOffice, LargeOffice, PrimarySchool, SecondarySchool, Outpatient, Hospital, SmallHotel, LargeHotel, and Warehouse. Baseline gas is largest for SecondarySchool (about 245), RetailStripmall (about 225), FullServiceRestaurant (about 195), and PrimarySchool (about 155). Package 3 is dramatically lower for every type (e.g. SecondarySchool falls to roughly 30) as space heating is fuel-switched away from natural gas.
