  alt: Table of on-site fossil fuel emissions factors for natural gas, propane, and fuel oil
  description: |-
    Table 5. On-Site Fossil Fuel Emissions Factors. Natural Gas: 147.3 lb/MMBtu (228.0 kg/MWh). Propane: 177.8 lb/MMBtu (275.7 kg/MWh). Fuel Oil: 195.9 lb/MMBtu (303.2 kg/MWh). Footnote a: lb = pound; MMBtu = million British thermal units; kg = kilogram; MWh = megawatt-hour. These are the combustion emissions factors applied to on-site fossil fuel use when computing greenhouse gas emissions.
