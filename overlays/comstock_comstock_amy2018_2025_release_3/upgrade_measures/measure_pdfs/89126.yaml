  described_utc: '2026-08-20'
  alt: Grouped bar matrix of median electric peak intensity by climate zone and season, Baseline vs
    Package 2 vs Package 3
  description: |-
    Figure 11. Grouped horizontal bar matrix of median electric peak intensity (W/ft2) by IECC climate zone and season. Three value columns -- Median Summer, Median Winter, and Median Shoulder Elect. Peak W/ft2 -- with rows grouped by climate (Hot-Humid, Hot-Dry, Marine, Mixed-Dry, Mixed-Humid, Cold, Very Cold, Subarctic), each split into Baseline, Package 2, and Package 3 bars. Summer peak intensity falls from baseline to the packages in every climate (e.g. Hot-Humid 3.825 baseline to 2.984 Pkg 2 / 3.084 Pkg 3; Mixed-Humid 3.802 to 2.870; Cold 3.280 to 2.533 / 2.601). Winter peak intensity generally rises in the packages as heating is electrified (e.g. Very Cold winter 2.788 baseline to 4.777 Pkg 2 / 4.844 Pkg 3), and shoulder peaks are intermediate. Illustrates the summer-peak reduction versus winter-peak increase trade-off of electrification. (Dense numeric matrix -- the exact per-cell values are the least-certain reads in this doc; flag for QA.)
