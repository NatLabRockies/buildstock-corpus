  alt: |-
    Table 4, On-Site Fossil Fuel Emissions Factors, rendered as a bitmap: natural gas, propane, and fuel oil emissions factors in lb per MMBtu and kg per MWh
  description: |-
    Table 4, On-Site Fossil Fuel Emissions Factors, appears in the source PDF only as a bitmap image; the extraction produced no caption line and no markdown table for it, so the values below are transcribed from the image. The table has three rows and two value columns, an emissions factor in lb/MMBtu and the same factor restated in kg/MWh. Natural gas: 147.3 lb/MMBtu (228.0 kg/MWh), carrying footnote marker a. Propane: 177.8 lb/MMBtu (182.3 kg/MWh). Fuel oil: 195.9 lb/MMBtu (303.2 kg/MWh). The footnote reads: lb = pound; MMBtu = million British thermal units; kg = kilogram; MWh = megawatt-hour. These on-site combustion emissions factors are applied alongside the three electricity grid emissions scenarios (Cambium LRMER High and Low Renewable Energy Cost 15-year, and eGRID) to produce the greenhouse gas results in Section 5.3 and Figure 8. Note that the propane pair is internally inconsistent: 177.8 lb/MMBtu converts to roughly 275 kg/MWh, not the 182.3 kg/MWh printed. The same discrepancy appears in the equivalent table of other ComStock measure reports.
