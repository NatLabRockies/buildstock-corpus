    Violin and box plot distribution of percent site energy savings by fuel type for models with the HP-RTU plus energy recovery measure applied
  description: |-
    Figure 10 shows distributions of percent site energy savings by fuel type for applicable ComStock models with the HP-RTU plus heat/energy recovery measure applied, as violin plots with embedded boxes on a -160% to about 100% axis, annotated 'Upgrade 03: HP RTU + ER (unweighted)'. Four categories with sample counts, top to bottom: Other Fuel (n=7816), Natural Gas (n=125489), Electricity (n=173181), and Site (n=173190). Other fuel, meaning fuel oils and similar, shows over 90% savings and natural gas over 50%, both from replacing combustion-fuel heating; neither reaches 100% because commercial buildings use gas for cooking and water heating that this measure does not touch, and because the measure does not replace every gas heating device, such as unit heaters or RTUs serving kitchens. The Electricity distribution is centered much lower, with a median around 10% savings, savings above the 25th percentile, and increased electricity use below it, reflecting the mix of buildings electrifying gas heat against those replacing electric resistance RTUs. The overall Site distribution has a median around 25% savings.
