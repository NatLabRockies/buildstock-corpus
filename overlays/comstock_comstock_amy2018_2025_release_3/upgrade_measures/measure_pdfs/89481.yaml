    Two-panel stacked bar chart of annual site energy consumption by end use and fuel for the baseline, HP-RTU with electric backup, and HP-RTU plus energy recovery scenarios, for total stock and applicable stock
  description: |-
    Figure 7 stacks annual site energy consumption in TBtu by end use and fuel for three scenarios: Baseline, HP RTU E Backup, and HP RTU + ER. Panel (a), the total commercial building stock including non-applicable buildings, totals 4,338, 3,983, and 3,956 TBtu, a 382 TBtu or 9% saving. Labeled bands in panel (a): Interior Equipment Electricity 739.7, unchanged in all three bars; Fans Electricity 519.1, 426.2, 424.9; Cooling Electricity 667.3, 592.3, 581.9; Interior Lighting Electricity 451.9, unchanged; Heating Electricity 175.2, 242.7, 214.1. These reproduce the Section 5.2 figures of 13% (85 TBtu) cooling electricity savings, 15% (81 TBtu) combined fan plus heat recovery savings, and -22% (-39 TBtu) heating electricity, the last being an increase from electrifying gas RTUs. The large hatched red Heating Natural Gas band falls 28% (235 TBtu) and is identical between the two upgrade scenarios, since the remainder is heating in non-applicable buildings. Panel (b), the applicable stock only, totals 1,521, 1,166, and 1,139 TBtu; labeled baseline bands include Interior Equipment Electricity 251.2, Fans 226.0, Cooling 261.9, Interior Lighting 173.6, and Exterior Lighting 55.9, with HP RTU E Backup showing Fans 135.1, Cooling 127.0, and Heating Electricity 110.1.
