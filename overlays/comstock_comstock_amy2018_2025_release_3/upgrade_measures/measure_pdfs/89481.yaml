# Hand-authored figure descriptions for measure PDF 89481
# "Heat Pump RTU with Exhaust Air Energy Recovery" (NREL/TP-5500-89481, April 2024).
#
# 18 real graphics described; image_000000 (NREL cover logo) and image_000001 (cover art)
# are decorative and deliberately omitted.
#
# QA FLAGS -- vision-derived numbers need a human pass:
#
# * EXTRACTION GAP, RECOVERED HERE: Table 4 ("On-Site Fossil Fuel Emissions Factors")
#   exists in the extracted markdown ONLY as bitmap image_000006. There is no "Table 4."
#   caption line and no table body; only the table-of-contents entry (p. 12) and the
#   Section 3.3 prose reference survive. image_000006 sits exactly where the table belongs.
#   The bitmap text is fully legible, so this entry uses method: vision-transcription and
#   restores all six values. This is the one recoverable case of this defect class found so
#   far -- 87542's dropped Table 2 has no bitmap to recover from.
#
# * SOURCE DEFECT in transcribed Table 4: the propane row pairs 177.8 lb/MMBtu with
#   (182.3 kg/MWh), but 177.8 lb/MMBtu is roughly 275 kg/MWh. Natural gas and fuel oil
#   convert correctly. The identical inconsistency appears in 89340's Table 1, so this is a
#   defect in a shared boilerplate table, not a one-off typo.
#
# * Figure 3 (image_000004) -- HIGH confidence. All 15 bar labels legible after a 4x
#   crop-and-upscale, and they sum to 100.01%. That total also settles the axis basis: the
#   values are shares OF THE APPLICABLE RTU STOCK, not of total ComStock floor area
#   (which would have to sum to the 33.3% applicability figure).
#
# * Figure 7 (image_000009) -- the labeled bands asserted here all reconcile with Section
#   5.2: Cooling 667.3 -> 581.9 = 85.4 TBtu (the stated 13% / 85 TBtu); Fans 519.1 -> 424.9
#   = 94.2 TBtu, which nets to the stated 15% / 81 TBtu once the new ~13 TBtu heat recovery
#   end use is added; Heating Electricity 175.2 -> 214.1 = +38.9 TBtu (the stated -22% /
#   -39 TBtu). Panel totals 4338/3983/3956 and 1521/1166/1139 are labeled directly.
#
# * Figure 7 -- HEATING NATURAL GAS BAND LABELS NOT ASSERTED. The white-on-hatched-red
#   labels are illegible at every zoom factor tried (22x LANCZOS and NEAREST); the hatch
#   strokes are the same color as the glyphs. Pixel-geometry measurement, calibrated on the
#   labeled 739.7 and 451.9 bands, puts the baseline band at about 847 TBtu (+/- 22 TBtu,
#   one pixel), which corroborates the text's 28% / 235 TBtu gas heating saving (235/0.28 =
#   839) and rules out the ~650 value an unaided read of the blur suggests. The description
#   therefore cites the prose delta (28%, 235 TBtu) and does not quote a band value.
#
# * SOURCE DEFECT, Section 5.3 prose: "7%-9% annual GHG emissions avoided (219 to 372 MMT
#   CO2e)". 219 and 372 are the HP-RTU + ER bar TOTALS in the LRMER Low RE and eGRID panels
#   of Figure 8, not the amounts avoided. The avoided amounts are 402-372 = 30, 325-299 =
#   26, and 240-219 = 21 MMT CO2e. The percentages are right; the parenthetical is not.
#
# * Figure 8 (image_000010) -- HIGH confidence, all totals and electricity components
#   labeled. Natural gas 81 -> 65 in every panel, and the fuel oil plus propane residual is
#   a consistent ~7 MMT CO2e (402-314-81, 325-237-81, 240-152-81).
#
# * Figures 10/11 (image_000012/000013) -- HIGH confidence on sample counts: the 17
#   per-climate-zone n values in Figure 11 sum to exactly 173,190, matching Figure 10's
#   Site n. As in 89340, the zone list carries both "7 (n=226)" and "7A (n=974)" as separate
#   rows -- unusual ASHRAE labelling that recurs across ComStock measure documents and is
#   worth checking upstream.
#
# * Figure 12 (image_000014) -- HIGH confidence, all 42 values labeled, and they reproduce
#   the prose exactly: Cold 3.4 -> 2.8 = 18%, Very Cold 5.5 -> 4.7 = 15%, summer reductions
#   26%-37% versus baseline.
#
# * CAPTION/AXIS MISMATCH, Figure 13 (image_000015): the caption says "Stock annual average
#   percent heating electricity input used for supplemental heating", but the x-axis reads
#   "Fraction of Electric Heating Supplemental" on a 0.0-1.0 scale and the graphic is a
#   distribution of box plots, not a stock average. The description follows the axis.
#
# * Appendix figures CHECKED for the 89340 defect and CLEAN: y-axis labels were zoomed 6x
#   and confirm A-1/A-2 plot "Natural Gas Total Energy Consumption (tbtu)" and A-3/A-4 plot
#   "Electricity Total Energy Consumption (tbtu)", matching their captions. (In 89340 the
#   two electricity appendix figures were the wrong graphic entirely.)
#
# * Figures 1, 2, 5, 6, 13, A-1, A-2, A-3, A-4 carry no data labels. All magnitudes in those
#   descriptions are axis estimates, and the interpretive conclusions come from the Section
#   1, 2, 5.1, 5.5 and 5.6 prose.
#
# * Figures 7 and 9 descriptions deliberately mention that heat/energy recovery fan static
#   pressure is booked to the 'heat recovery' end use rather than 'Fans'. Without that
#   modeling note, Figure 9's large negative heat recovery savings and Figure 7's small
#   fans-only decrease read as contradictions.
#
# * Figure 9 (image_000011) -- the n=12 interior lighting and n=4 interior equipment
#   categories are a documented workflow bug (this measure does not touch those end uses).
#   Negative cooling outliers are the documented EnergyPlus multispeed-coil night-cycling
#   issue. Both are described in the source prose.
#
# * Figure 7 panel (a) has a narrow cross-hatched blue band between the Cooling and Interior
#   Lighting bands that does not correspond to any of the 15 legend entries in stack order.
#   Left unnamed rather than guessed.
#
# * NON-FIGURE extraction artifacts in this document, for the separate extractor ticket:
#   Table 1 carries a spurious pseudo-header row "| No Zone Exhaust Fans | No Zone Exhaust
#   Fans |" embedded mid-table before its "None" rows, and repeats "| Primary School |
#   Kitchen |" twice. Table 3's header is split across two physical rows (ER/ER/HR/HR then
#   Heating/Cooling/Heating/Cooling).
#
# * SOURCE DEFECT, copy-paste: Section 3.3 says the emissions comparison is between "the
#   ComStock baseline and the window replacement scenario" -- wrong measure name in an
#   HP-RTU document. Section 5.4 prose also reads "24 times higher efficiency" where
#   "2-4 times" is meant (Section 1 and 5.6 both use 2-4x).
