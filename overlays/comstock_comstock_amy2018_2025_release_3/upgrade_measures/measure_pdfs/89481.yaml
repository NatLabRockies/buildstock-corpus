    Violin and box plot distribution of percent site energy savings by ASHRAE climate zone for models with the HP-RTU plus energy recovery measure applied
  description: |-
    Figure 11 shows distributions of percent site energy savings by ASHRAE climate zone for applicable ComStock models with the HP-RTU plus heat/energy recovery measure applied, as violin plots with embedded boxes on a -10% to 70% axis, annotated 'Upgrade 03: HP RTU + ER (unweighted)'. Zones with sample counts, top to bottom: 1A (n=2357), 2A (n=17939), 2B (n=2857), 3A (n=24660), 3B (n=15176), 3C (n=4701), 4A (n=37415), 4B (n=1455), 4C (n=5090), 5A (n=40589), 5B (n=8860), 6A (n=9474), 6B (n=1274), 7 (n=226), 7A (n=974), 7B (n=112), and 8 (n=31). These counts sum to exactly 173,190, matching the Site sample count in Figure 10. Savings rise with heating load: warmer zones 1 through 3 show median site energy savings of 15% to 25%, while the colder zones from 5 upward show medians between 25% and 30%. The distributions overlap considerably and are highly variable within each zone, indicating that climate is only one of several drivers of savings.
