    Three-panel stacked bar chart of annual greenhouse gas emissions by fuel for the baseline and two heat pump RTU scenarios under eGRID and two Cambium LRMER grid scenarios
  description: |-
    Figure 8 compares annual greenhouse gas emissions in MMT CO2e for Baseline, HP RTU E Backup, and HP RTU + ER under three electricity grid scenarios, one panel each: eGRID 2021, Cambium LRMER High Renewable Energy Cost 15-year, and Cambium LRMER Low RE Cost 15-year. Bars stack Electricity (blue), Natural Gas (orange), Fuel Oil, and Propane. Labeled totals, with percent change from baseline: eGRID 2021 402, 375 (-7%), 372 (-8%); LRMER High RE Cost 15 325, 302 (-7%), 299 (-8%); LRMER Low RE Cost 15 240, 221 (-8%), 219 (-9%). The electricity components are 314, 305, 301 under eGRID; 237, 231, 228 under High RE Cost; and 152, 150, 148 under Low RE Cost. Natural gas falls from 81 in every baseline to 65 in both upgrade scenarios, reflecting electrification of gas-heated RTUs, and the residual fuel oil plus propane sliver is about 7 MMT CO2e in every bar. Adding heat and energy recovery to the HP-RTU scenario yields roughly 1% more emissions avoided, an additional 2 to 4 MMT CO2e, consistently across all three grid scenarios.
