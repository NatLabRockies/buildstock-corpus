  alt: |-
    Five-panel manufacturer product-data chart for the Ventacity VS1000 RT heat/energy recovery ventilator: fan operating range, HRV sensible efficiency, and ERV latent, sensible, and total efficiency versus airflow
  description: |-
    Figure 1 reproduces published product data for the Ventacity VS1000 RT rooftop heat/energy recovery ventilator (image from reference 3), used in this report as a source of detailed performance data for energy modeling of heat and energy recovery systems. Five panels are shown. 'Fan operating range' plots external static pressure (0 to 3.0 in. W.C.) against flow rate (0 to 1,200 CFM) as a single declining curve annotated '100% fan speed', with a shaded rectangle marking the recommended operating range and a header noting 175 to 1,020 CFM at 0 to 2.0 in. W.C. external static pressure. 'HRV sensible efficiency' plots percent effectiveness against airflow from 200 to 1,000 CFM for heating mode and cooling mode, declining from roughly 90%-92% at low airflow to roughly 84%-86% at 1,000 CFM. Three further panels give ERV latent, sensible, and total efficiency at AHRI 1060 standard conditions, each with separate heating-mode and cooling-mode curves on a 0%-100% axis that likewise decline as airflow rises, spanning roughly 55%-90%. The declining effectiveness-versus-airflow relationship and the 0 to 2 in. W.C. added static pressure range both inform the modeling assumptions in Section 3.
