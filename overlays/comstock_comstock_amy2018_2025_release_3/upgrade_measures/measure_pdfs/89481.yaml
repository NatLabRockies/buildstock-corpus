    Violin and box plot distribution of percent site energy savings by end use and fuel type for models with the HP-RTU plus energy recovery measure applied
  description: |-
    Figure 9 shows distributions of percent site energy savings by end use and fuel type for applicable ComStock models with the HP-RTU plus heat/energy recovery measure applied, plotted as violin plots with embedded boxes on a -160% to about 125% axis and annotated 'Upgrade 03: HP RTU + ER (unweighted)'. Categories with sample counts, top to bottom: Other Fuel Water Systems (n=85), Other Fuel Heating (n=7805), Natural Gas Water Systems (n=5834), Natural Gas Heating (n=125164), Electricity Water Systems (n=4288), Electricity Refrigeration (n=16921), Electricity Interior Lighting (n=12), Electricity Interior Equipment (n=4), Electricity Heating (n=171990), Electricity Heat Recovery (n=152812), Electricity Fans (n=173172), Electricity Cooling (n=173188). Combustion fuel heating clusters near 100% savings. Electricity heating has a median near 70% but a long negative tail from gas-heated buildings with only a small amount of baseline electric heating. Fans and cooling medians are both roughly 40%, consistent with a PNNL variable-speed RTU study. Heat recovery shows large negative savings because the added static pressure fan power is booked to that end use.
