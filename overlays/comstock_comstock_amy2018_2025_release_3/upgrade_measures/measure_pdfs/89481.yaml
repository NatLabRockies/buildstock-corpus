    Two-panel horizontal bar chart of median non-coincident winter and summer peak demand intensity by Building America climate zone for the baseline and two heat pump RTU scenarios
  description: |-
    Figure 12 compares median non-coincident peak electricity demand intensity for applicable models across Baseline, HP RTU E Backup, and HP RTU + ER, grouped by Building America climate zone, with a Winter panel and a Summer panel both in W/ft2 on a 0 to 6 axis. Labeled winter/summer values by zone, in scenario order: Hot-Humid 2.6/4.0, 2.0/2.8, 1.9/2.5; Hot-Dry 2.2/3.9, 1.9/2.9, 1.9/2.8; Marine 2.3/3.2, 2.0/2.5, 1.9/2.3; Mixed-Dry 2.0/3.4, 2.3/2.6, 2.2/2.5; Mixed-Humid 2.5/4.1, 2.7/2.8, 2.4/2.6; Cold 2.0/3.6, 3.4/2.8, 2.8/2.3; Very Cold 2.7/4.1, 5.5/2.8, 4.7/2.6. Adding heat/energy recovery cuts winter peak intensity 18% in Cold, from 3.4 to 2.8 W/ft2, and 15% in Very Cold, from 5.5 to 4.7, and the gap between the two upgrade scenarios widens as climates get colder. Both upgrade scenarios lower winter peaks versus baseline in warmer climates but raise them in Cold and Very Cold, where added supplemental electric resistance heating dwarfs fan savings. Summer peaks fall 25% to 37% versus baseline in every zone.
