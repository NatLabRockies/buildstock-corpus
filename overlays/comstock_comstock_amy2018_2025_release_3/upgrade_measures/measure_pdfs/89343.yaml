  described_utc: '2026-08-20'
  alt: 'Two stacked line charts of hourly load over five days: Figure 4 (fixed schedule) above Figure
    5 (OAT-based prediction)'
  description: |-
    Figures 4 and 5, stacked in one image. Both are line charts of hourly electricity load (kWh) for one building over five consecutive days (9/24-9/28), y-axis 50 to 250, daily peaks near 175-190 kWh. Top (Figure 4) compares Baseline (blue dashed), Perfect Prediction (red), and Fixed Schedule (yellow). Bottom (Figure 5) compares Baseline (blue dashed), Perfect Prediction (red), and OAT-based Prediction (yellow). In both, perfect prediction tracks and reduces the true baseline peak, while the fixed-schedule and OAT-based options largely fail to capture the actual peak timing, leaving load spikes unshed on most days.
- source_image: 89343_images/image_000006_9420c73265ec4c1660e8c363924ac2331c6655611a660ac9a2d39831abda932d.png
  source_image_sha256: 32d550e0e658dc83e6a8c7d915e642b56e2e9854bab7a21450645e59d1ca49f7
  method: vision-description
  described_utc: '2026-08-20'
  alt: Horizontal box plots of median daily peak load savings percent by month for three load-prediction
    options
  description: |-
    Figure 6. Horizontal box-and-whisker plot of median daily peak load reduction (Median Peak savings, percent) across a stock of large-office models, x-axis from about -5% to 15%. Rows are grouped by month (Jan through Dec), and within each month there are three bars: Perfect prediction, Fixed schedule, and OAT-based prediction. Boxes span Q1 to Q3 and whiskers extend to 1.5x IQR. Perfect prediction consistently shows the largest positive median peak savings (medians and boxes shifted right of zero, largest in summer months), OAT-based prediction gives modest positive savings, and the fixed-schedule option is often centered near or below zero, indicating it creates new higher peaks for many buildings much of the time.
