  alt: |-
    Two-panel stacked area chart of building electricity load over three summer days, Baseline vs DF control with fixed schedule
  description: |-
    Figure 1. Two-panel stacked area chart of a single building's electricity load (kW) over three summer days (8/19-8/21). Left panel is Baseline, right panel is 'DF control with fixed schedule'. Left y-axis Electricity load (kW) runs 0 to about 17.5 and a secondary right axis runs to about 30. Areas are stacked by end use per the legend (Cooling, Fans, HeatRejection, ExteriorLights, Heating, InteriorEquipment, InteriorLights, Total), with a green dashed Setpoint line overlaid. In the right panel the fixed-schedule setpoint steps up (thermostat setback) during an assumed evening peak window, but the resulting load reduction does not coincide with the actual daily load peak, illustrating that a fixed peak schedule misaligns demand-flexibility control with the building's true peak load.
- source_image: 89343_images/image_000003_08c15327cb8c2ad9c9282d0c3853081f84b896bd8f14097250684d5badca44d2.png
  source_image_sha256: 810f5c78dcbb4505f5c8c90cecda04cfac928177c8f4460ce8141bf1ef0d06f7
