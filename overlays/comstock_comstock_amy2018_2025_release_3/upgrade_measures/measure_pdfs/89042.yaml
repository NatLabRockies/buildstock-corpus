# Hand-authored table transcriptions for measure_pdfs/89042.pdf
#
# Three tables in this report are lost in extraction. Table 1 came through as a picture, so it
# is anchored to that bitmap and replaces the image ref. Tables 3 and 7 are rasterized regions
# with no text layer, so docling keeps the caption and emits nothing beneath it; those are
# anchored to the PDF's own sha256 and page. See overlays/README.md for the schema.
#
# Authoring notes:
#   * Table 1 ends with a detached box, ruled apart from the grid and aligned under the last
#     two columns, reading "Average 59% 50%". It is transcribed as a final row labeled
#     "Average" with the intervening cells left empty, which is where the source puts it.
#   * Table 1's model names are spelled "Weathermaker" and "Xion"; Table 3 spells the same
#     Carrier products "WeatherMaker" and "WeatherMaster". Both are left as printed.
#   * Table 3's rows run long, so it is decomposed into five sub-tables along the two seams the
#     source already has: the independent variable it is a function of (temperature pair, flow
#     fraction, rated capacity) and, within each, capacity modifiers before EIR.
#   * Table 3 fills the "Derived from" cells with a blue/orange/gray color scale and tints the
#     two "Independent variable" and the "Dependent variable" header cells. There is no legend
#     for any of it and no obvious ordering to it, so it is dropped rather than described.
#   * Table 7's legend is a detached two-cell box below the table: blue "Better", orange
#     "Worse". The fill covers each column whole rather than individual cells, so it is
#     transcribed as a note about the columns. Note the claim is column-level: on the "Heating
#     backup fraction" row the lower number is the better one, so the colors mark which unit
#     the report considers better overall, not which cell of each row is preferable.

