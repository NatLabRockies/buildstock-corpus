  description: |-
    Figure 2: paired horizontal bar panels of ComStock HVAC system type prevalence - percent of stock floor area and annual site energy consumption - with bars colored by whether the HP-RTU measure applies. The two applicable types, PSZ-AC with gas coil at 25.9 percent and PSZ-AC with electric coil at 7.8 percent, together cover about a third of floor area. Section 3.1 gives the criteria.
