    Figure 11. Violin and box plot distributions of percent site energy savings by end use and fuel type across applicable ComStock models for the energy recovery upgrade, 17 rows with model counts, on an x-axis from -160% to 100%
  description: |-
    Violin plot panel titled Upgrade 09: Energy Recovery (unweighted), giving the distribution of percent site energy savings by end use and fuel type across applicable ComStock models. The x-axis is Percent Site Energy Savings by End Use (%), from -160 to 100 with a zero reference line. Rows top to bottom with model counts. Other fuel: Water Systems (n=111), Heating (n=9969). District heating: Water Systems (n=146), Heating (n=3220). District cooling: Cooling (n=1808). Natural gas: Water Systems (n=2572), Heating (n=176108). Electricity: Water Systems (n=3877), Refrigeration (n=7274), Pumps (n=68168), Interior Lighting (n=29), Interior Equipment (n=10), Heating (n=100898), Heat Rejection (n=10392), Heat Recovery (n=259000), Fans (n=168260), Cooling (n=256684). The heating rows across all fuels cluster right of zero with medians of roughly 15% to 25%, and the cooling rows near 10%, both from preconditioning the ventilation load. The striking outlier is Electricity Heat Recovery, a broad violin spread across roughly -160% to 0%: models that already had some baseline heat recovery gain additional recovery energy from the upgrade, so this end use grows. That end use is a small share of whole-building consumption, so the heating and cooling savings normally outweigh it.
