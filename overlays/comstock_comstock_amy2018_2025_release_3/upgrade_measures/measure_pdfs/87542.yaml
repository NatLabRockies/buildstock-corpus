    Figure 1. Line chart of heat exchanger effectiveness and pressure drop versus relative airflow for a membrane plate heat exchanger, with six series plotted against a left effectiveness axis and a right pressure drop axis in inches of water
  description: |-
    Reproduced manufacturer/handbook chart (image from reference [11]) showing how a membrane counterflow plate heat exchanger trades effectiveness against pressure drop as airflow rises. The x-axis is RELATIVE AIRFLOW, %, spanning about 70% to 100%. The left y-axis is EFFECTIVENESS, 0.40 to 0.75; the right y-axis is PRESSURE DROP in inches of water, roughly 0.6 to 1.2. Six series are keyed in the legend below the plot: SENSIBLE, LATENT SUMMER, LATENT WINTER, TOTAL SUMMER, TOTAL WINTER, and PRESSURE DROP. All five effectiveness curves slope downward from left to right, so effectiveness degrades as airflow increases toward design: SENSIBLE is the highest series, falling from about 0.72 at 75% airflow to about 0.68 at 100%; LATENT WINTER and TOTAL WINTER sit in the middle 0.60 to 0.65 band; LATENT SUMMER and TOTAL SUMMER are lowest, near 0.55 falling to about 0.47. The PRESSURE DROP series is the only rising curve, climbing steeply from roughly 0.75 in. w.c. at 75% airflow to about 1.15 in. w.c. at 100%, illustrating the text's point that membrane heat exchanger pressure drop increases roughly linearly with airflow rate over a typical range of 0.1 to 1.1 in. w.c.
