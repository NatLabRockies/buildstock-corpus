# Hand-authored figure descriptions for measure PDF 87542
# (Exhaust Air Heat/Energy Recovery, ComStock Upgrade 09).
#
# Scope: the source markdown carries 20 image refs. Images 000000 and 000001 are the standard NREL
# report cover art / front-matter photo grid -- decorative, carrying no retrievable information,
# and deliberately NOT described. The 18 entries below cover every real figure: Figures 1-14 in
# the body and Figures A-1 through A-4 in the appendix.
#
# Tables: Tables 1, 3, 4, 5 and 6 all extracted as real markdown tables, so no vision-transcription
# entry is needed. See the Table 2 note below.
#
# QA flags (least-certain reads and source/extraction artifacts, for the human review pass):
#  * EXTRACTION GAP, not repairable here: Table 2 ("Fraction of ComStock Floor Area Conditioned by
#    Systems With Heat/Energy Recovery by Building Type and Code Year") has its caption in the
#    processed markdown (~line 358) but NO table body and NO accompanying bitmap -- the extractor
#    dropped it outright and there is no image to transcribe, so a figures: overlay cannot recover
#    it. Worth filing against the extractor alongside the known \resizebox table-drop case.
#  * Figure 12 (000013) -- dense 8-zone x 3-season x 2-scenario W/ft2 value matrix. NO per-cell
#    numeric values are asserted: at raster resolution the four-significant-figure labels are only
#    partially legible and the row-to-zone assignment within each group is ambiguous, and a naive
#    read of the top rows appeared to contradict the body text's "highest peak reductions occur
#    during the summer". The description therefore keeps the axis/panel/row structure (which is
#    clear) and takes all directional claims from Section 5.5 prose. The one structural claim made
#    from the bitmap is that the Subarctic rows have no summer values.
#  * Figure 8 (000009) -- only the segment labels that cross-check against the body text are
#    quoted: column totals 4638 -> 4334 (the stated 304 TBtu / 7% savings), Fans 588.3 -> 587.1
#    (the stated "<1%" fan savings), and the unchanged Interior Lighting 451.0 and Interior
#    Equipment Electricity 836.5. The heating and cooling band endpoints are NOT asserted -- the
#    second label in the cooling pair is ambiguous at this resolution (a plausible read of
#    724.7 -> 658.7 gives 66 TBtu, which does not reconcile with the text's 82 TBtu / 10% cooling
#    savings), so the description uses the Section 5.2 bullet values (heating 268 TBtu / 23%,
#    cooling 82 TBtu / 10%, fans+heat recovery -46 TBtu / -8%) instead.
#  * Figure 9 (000010) -- high confidence. All 12 printed values are legible and cross-check
#    exactly against Section 5.3: eGRID 6.6 + gas 13.3 + fuel oil 1.1 + propane 0.4 = 21.4 MMT
#    CO2e, and Low RE Cost 2.9 + 13.3 + 1.1 + 0.4 = 17.7 MMT CO2e, matching the stated range.
#  * Figures 1 and 2 (000002, 000003) -- reproduced third-party graphics ([11] and the Ventacity
#    [6] product sheet). Curve values are axis estimates, not printed labels. The Ventacity
#    effectiveness readings should be checked against Table 3, which is the modeled distillation of
#    Figure 2 (ER sensible 75%/75% at 100% airflow, 78%/78% at 75% airflow; ER latent 61%/55% and
#    68%/60%; HR sensible 84%/83% and 86%/84%; HR latent 0%).
#  * Figures 3 and 4 (000004, 000005) -- no data labels; all ft2 magnitudes are axis estimates.
#    The "about 70% of ComStock floor area is applicable" figure comes from Section 3.1 prose.
#  * Figures 5, 6, 7 (000006, 000007, 000008) -- these are OpenStudio/EnergyPlus timeseries plots
#    whose right-hand y-axis is a wrapped output-variable name that is not legible at raster
#    resolution, so the right axis is described generically as the RTU outdoor air node flow rate
#    (Figures 5-6) and the series axis is left unnamed (Figure 7). All quoted temperatures
#    (70-75F mixed air, 35-40F outdoor, ~60F ERV outlet, 35F frost limit) are from Section 5.1
#    prose, not read off the bitmaps.
#  * Figures 13 and 14 (000014, 000015) -- the maps carry no color legend, so only the printed
#    per-state values and the overall shading direction are described; individual state labels are
#    summarized as ranges rather than transcribed state by state.
#  * Figures A-1 to A-4 (000016-000019) -- no data labels; all TBtu magnitudes are axis estimates.
#  * Source misreferences (present in the PDF, not extraction damage): Section 5.1 says "Similarly,
#    Figure 5 demonstrates this behavior during a sample summer day" when it means Figure 6;
#    Section 5.2 attributes the 7% / 304 TBtu stock savings to "(Figure 7)" when it means Figure 8;
#    Section 5.3 attributes the emissions results to "(Figure 8)" when it means Figure 9; Section
#    5.4 says "Figure 10 shows the distribution of energy savings by end use and fuel type" when it
#    means Figure 11; Section 5.5 says "Figure 13 and Figure 14 show the median heating energy
#    savings intensity" when Figure 14 is cooling. Also, Figure 7 is discussed at ~line 451 before
#    the Figure 5 and Figure 6 captions appear at ~lines 455 and 459.
#  * Source numeric inconsistency: Section 5.1 prose says the sample model's "heating and cooling
#    end uses show 45% and 14% annual site energy savings" but Table 6 gives cooling 7% (175 -> 162
#    GJ); 14% is Table 6's Total row. The Figure 6 description does not repeat the 14%.
#  * Extraction artifact: Table 4 lost its header row, so its first data row ("Natural gas | 147.3
#    lb/MMBtu (228.0 kg/MWh) a") now acts as the header. Table 3's header is split across two rows
#    (ER/ER/HR/HR then Heating/Cooling/Heating/Cooling), which is faithful to the PDF but reads
#    oddly. Table 1 is split into two separate markdown tables and its second fragment contains a
#    "No Zone Exhaust Fans | No Zone Exhaust Fans" pseudo-header row.
#  * Source data artifact, same as other measure PDFs in this release: Table 4's propane factor
#    reads 177.8 lb/MMBtu (182.3 kg/MWh); the metric conversion is inconsistent with the other two
#    rows and should be roughly 275 kg/MWh (measure PDF 89126 prints 275.7).
