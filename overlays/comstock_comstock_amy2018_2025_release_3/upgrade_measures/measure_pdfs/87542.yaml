    Figure 4. Horizontal stacked bar charts of heat/energy recovery measure applicability by ComStock building type, with an absolute floor area panel and a percent-of-building-type panel, segmented into Added HR/ER, NA HR/ER, and Existing HR/ER, plus an All Types summary panel below
  description: |-
    Applicability summary for the heat/energy recovery measure, drawn as two stacked-bar panels over 14 building-type rows plus a separate All Types summary strip underneath. The upper left panel is Area [SF] with an x-axis from 0B to about 15B; the upper right panel is % Area for Building Type from 0% to 100%, so it normalizes each building type. The legend, headed Variable, has three segments: Added HR/ER (floor area served by systems upgraded by this measure), NA HR/ER (area without recovery that cannot be upgraded, chiefly food service), and Existing HR/ER (area that already has recovery in the baseline). Rows top to bottom: FullServiceRestaurant, Hospital, LargeHotel, LargeOffice, MediumOffice, Outpatient, PrimarySchool, QuickServiceRestaurant, RetailStandalone, RetailStripmall, SecondarySchool, SmallHotel, SmallOffice, Warehouse. Warehouse has by far the largest absolute area, reaching about 15B square feet and dominated by the Added segment. The restaurant rows are visibly different in the percent panel, being almost entirely NA because food service exhaust is excluded. The All Types strip runs to roughly 40B square feet and shows the stock-wide split behind the text's statement that about 70% of ComStock floor area served by AHU-based systems is applicable.
