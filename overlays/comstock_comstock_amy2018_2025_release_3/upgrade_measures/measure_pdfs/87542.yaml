    Figure 10. Violin and box plot distributions of percent site energy savings by fuel type across applicable ComStock models for the energy recovery upgrade, six rows with model counts, on an x-axis from -160% to 100%
  description: |-
    Violin plot panel titled Upgrade 09: Energy Recovery (unweighted), showing the distribution of percent site energy savings across individual applicable ComStock models, one horizontal violin with an embedded box plot per fuel category. The x-axis is Percent Site Energy Savings by Fuel (%), running -160 to 100 with a vertical reference line at zero; positive values are savings and negative values are consumption increases. Nonapplicable buildings are excluded. Rows top to bottom with model counts: District Cooling (n=1808), District Heating (n=3223), Other Fuel (n=9974), Natural Gas (n=176306), Electricity (n=258423), and Site (n=259065). The two heating-fuel rows, District Heating and Other Fuel, are shifted well to the right with medians in the roughly 20% to 30% range, the largest savings in the chart. The Site row shows the median applicable building saving about 7% of annual energy consumption, with a small number of outliers above 40% and a tail of buildings with negative savings, chiefly temperate-climate buildings where the added fan energy outweighs the recovery potential. Natural Gas has a long negative tail from mixed-fuel HVAC systems where recovery shifts energy between fuels; most such models have very low baseline gas use, so a small absolute increase reads as a large percentage penalty.
