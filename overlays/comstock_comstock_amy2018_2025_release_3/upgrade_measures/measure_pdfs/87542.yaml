    Figure 2. Ventacity VS1000 RT product data sheet reproduced as five small charts: a fan operating range curve of external static pressure versus flow rate, an HRV sensible efficiency curve, and ERV latent, sensible, and total efficiency curves, each with heating mode and cooling mode series
  description: |-
    Reproduced product data sheet for the Ventacity VS1000 RT heat/energy recovery ventilator (image from reference [6]); this is the source of the effectiveness values modeled in Table 3. Five panels. FAN OPERATING RANGE, annotated 175 to 1,020 CFM and 0 to 2.0 in. W.C. ESP, plots External Static Pressure (in. W.C.) from 0 to 3.0 against Flow Rate (CFM) from 0 to about 1,200. The curve marks 100% FAN SPEED and falls from roughly 2.9 in. W.C. at low flow to zero near 1,150 CFM; a shaded blue rectangle labeled recommended operating range covers approximately 200 to 700 CFM up to about 2.0 in. W.C. HRV SENSIBLE EFFICIENCY plots efficiency 80 to 95 against CFM 200 to 1,000, with Heating Mode and Cooling Mode curves both declining from about 93 at 200 CFM to roughly 82 to 84 at 1,000 CFM. Three ERV panels, all labeled AHRI 1060 Standard Conditions, plot efficiency 0 to 100 against FLOW RATE (CFM): ERV LATENT EFFICIENCY, ERV SENSIBLE EFFICIENCY, and ERV TOTAL EFFICIENCY. Each shows Heating Mode above Cooling Mode, with latent efficiency in the 60s to 70s, sensible in the high 70s to 80s, and total in between.
