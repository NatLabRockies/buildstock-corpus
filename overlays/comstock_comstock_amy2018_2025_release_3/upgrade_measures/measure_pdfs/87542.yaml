    Figure 3. Two side-by-side horizontal stacked bar charts of ComStock weighted floor area in square feet by HVAC system type grouping, one panel for systems with existing ERV/HRV and one for systems with no ERV, with bars segmented by ComStock building type
  description: |-
    Paired horizontal stacked bar charts showing how ComStock baseline floor area is distributed across air-handling system types, split by whether heat/energy recovery already exists. The left panel is Weighted Area with ERV/HRV [ft2] (not applicable to the measure) and the right panel is Weighted Area No ERV [ft2] (applicable to the measure); both share an x-axis from 0B to 25B square feet, so the two panels are directly comparable. Four rows label the system groupings: Single-zone Rooftop Units, Multi-zone VAV Systems, Systems Not Applicable, and DOAS Systems. Each bar is subdivided by In.Comstock Building Type, with a 14-entry legend: FullServiceRestaurant, Hospital, LargeHotel, LargeOffice, MediumOffice, Outpatient, PrimarySchool, QuickServiceRestaurant, RetailStandalone, RetailStripmall, SecondarySchool, SmallHotel, SmallOffice, Warehouse. In every applicable grouping the no-ERV bar is far longer than the with-ERV bar: single-zone rooftop units and multi-zone VAV systems each approach the 25B right edge without recovery while their with-recovery bars are only a few billion square feet, and DOAS area is small in both panels. This is the visual basis for the text's statement that about 70% of ComStock floor area is applicable to the measure.
