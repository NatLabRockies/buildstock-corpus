  description: |-
    Figure 15 is a single-panel stacked bar chart of annual site energy consumption in TBtu for applicable buildings only, with three bars: baseline, Package_6 (individual building peak reduction objective) and Package_7 (grid peak reduction objective). Totals are 2305, 2254 and 2270 TBtu, so the individual objective saves 51 TBtu and the grid objective 35 TBtu. Legible segments, baseline then Package_6 then Package_7: Interior Equipment Electricity 383.0/383.0/383.0; Fans Electricity 267.8/262.9/264.5; Cooling Electricity 358.8/340.0/343.8; Interior Lighting Electricity 225.0/199.4/207.0; Heating Electricity 149.0/142.4/146.5; Heating Natural Gas 595.3/600.2/598.7; Exterior Lighting Electricity 117.3/117.3/117.3. Interior lighting and cooling account for most of the difference between the two objectives, and heating natural gas rises under both packages because thermostat setback during the dispatch window is followed by a rebound. The segment deltas reproduce Table 6 and Table 7 for the electricity end uses.
