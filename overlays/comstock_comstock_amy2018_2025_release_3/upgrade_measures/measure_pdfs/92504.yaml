  alt: |-
    Monthly box plot of mean peak load savings measured during the grid peak window, for the grid peak reduction objective, with medians of 12 to 21 percent
  description: |-
    Figure 10 is a box plot with one box per calendar month on a y axis labeled 'Mean Peak Savings on Grid Peak [%]' running from 50% down to -10%. It shows Package_7, the grid-level peak reduction objective, evaluated during the grid peak window. No values are printed; boxes were measured against the thirteen y-axis tick labels (zero at 310.5 px, 5.833 px per percent). Reading Q1, median, Q3 and whisker range: Jan 7.63/13.46/23.06, -5.74 to 46.89; Feb 7.80/13.46/23.06, -7.80 to 46.71; Mar 6.77/11.91/19.80, -4.37 to 40.03; Apr 7.29/12.43/18.94, -1.97 to 36.77; May 9.86/16.54/23.23, -10.54 to 43.63; Jun 11.91/18.77/25.11, -6.94 to 45.69; Jul 13.80/20.83/28.03, -3.17 to 49.80; Aug 13.63/20.66/27.86, -3.17 to 49.63; Sep 11.06/17.40/23.40, -3.34 to 42.60; Oct 7.97/13.11/18.94, -2.31 to 35.91; Nov 7.80/13.29/21.86, -5.91 to 43.29; Dec 7.63/12.94/22.89, -6.94 to 46.20. The measured medians track Table ES-4's grid-objective grid-peak-window row (13.2, 13.2, 11.7, 12.2, 16.3, 18.5, 20.6, 20.5, 17.2, 12.9, 13.0, 12.8). Savings peak in July and August and are weakest in March and October, and the spread is roughly three times wider than the individual-objective results in Figure 3.
