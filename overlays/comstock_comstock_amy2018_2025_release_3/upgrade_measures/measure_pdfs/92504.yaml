  alt: |-
    Violin plot of percent site energy savings by fuel for six rows under Package_6, with electricity and total site energy positive and district heating slightly negative
  description: |-
    Figure 9 is a violin plot titled 'Upgrade 52.0: Package_6 (unweighted)' with the x axis labeled 'Percent Site Energy Savings by Fuel (%)' running from -120 to 100. Six rows are plotted top to bottom with sample counts: District Cooling (n = 1894), District Heating (n = 2675), Other Fuel (n = 1708), Natural Gas (n = 33540), Electricity (n = 64778) and Site (n = 64778). Zero sits at 284.5 px and the scale is 1.435 px per percent. The two resolvable positive rows are Electricity, whose interquartile box spans about +2.44% to +3.83% with whiskers from -3.1% to +19.9%, and Site, whose box spans about +1.05% to +3.14% with whiskers from -4.5% to +19.9%. District Heating is the only clearly negative row, with a box from about -3.14% to -1.74% and whiskers from -50.5% up to the +100% axis limit. The District Cooling, Other Fuel and Natural Gas boxes are one to two pixels wide and are not asserted; qualitatively District Cooling sits just above zero and Other Fuel and Natural Gas just below it, with natural gas whiskers spanning roughly -115% to +99%. Total site energy savings are positive because the electricity saving outweighs the small fossil heating penalty.
