  alt: |-
    Monthly box plot of mean peak load savings for the individual-building peak reduction objective, with all twelve boxes clustered near 6 to 7 percent
  description: |-
    Figure 3 is a box plot with one box per calendar month, January to December, on a y axis labeled 'Mean Peak Savings [%]' running from 20% down to -10%. It shows Package_6, the individual-building peak reduction objective, evaluated on each building's own mean daily peak load. No values are printed, so the boxes were measured from the fill against the y-axis tick labels (zero at 280.5 px, 11.2 px per percent). Reading Q1, median, Q3 and the whisker range for each month: Jan 3.53/6.38/9.69, whiskers -5.85 to 19.24; Feb 3.88/6.65/9.87, -5.31 to 19.15; Mar 3.71/6.12/9.15, -4.87 to 17.72; Apr 4.06/6.56/9.69, -4.69 to 18.35; May 4.78/7.46/10.40, -3.71 to 18.88; Jun 4.51/6.92/9.78, -3.44 to 17.72; Jul 4.60/7.01/9.87, -3.62 to 17.99; Aug 4.60/7.10/10.13, -3.88 to 18.71; Sep 4.96/7.46/10.49, -3.53 to 18.97; Oct 4.33/6.83/9.69, -3.88 to 17.90; Nov 3.79/6.56/9.69, -5.31 to 18.88; Dec 3.35/6.21/9.51, -6.03 to 18.97. The measured medians track Table ES-4's applicable-building medians (6.3, 6.6, 6.0, 6.5, 7.3, 6.9, 6.9, 7.1, 7.3, 6.7, 6.5, 6.1) to within a few tenths of a percent, and the lower whisker reaches below zero in every month, so a minority of buildings see their peak increase.
