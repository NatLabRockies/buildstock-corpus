    Figure A-3 is a grouped bar chart with the y axis labeled 'Electricity Total Energy Consumption (tbtu)' and the x axis labeled 'Comstock Building Type', with one pair of bars per building type: baseline in dark blue and Package 6 in light blue. No values are printed; bar tops were measured against the y-axis tick labels (zero at 164.0 px, 0.366 px per unit, so one pixel is about 2.7 tbtu). Baseline then Package 6: Full Service Restaurant 194 and 194; Quick Service Restaurant 68 and 68; Retail Stripmall 426 and 426; Retail Standalone 281 and 281; Small Office 199 and 194; Medium Office 175 and 172; Large Office 221 and 216; Primary School 262 and 254; Secondary School 295 and 284; Outpatient 123 and 123; Hospital 202 and 202; Large Hotel 213 and 213; Warehouse 380 and 369. The baseline sums to roughly 3075 tbtu, with Retail Stripmall and Warehouse the largest consumers. The only building types whose consumption falls are Small Office, Medium Office, Large Office, Primary School, Secondary School and Warehouse, exactly the six applicable types listed in Section 3.1, which is a useful internal consistency check on the applicability logic.
