  alt: |-
    Horizontal box plot of percent electricity utility bill cost savings for six rows, grouped into cooling-only and heating-and-cooling thermostat applications under Package_6
  description: |-
    Figure 6 is a horizontal box plot on an x axis labeled 'Electricity Utility Bill Cost Savings [%]' with ticks from -2 to 10. Six rows are grouped into two blocks of three: buildings where the thermostat measure applies to electric cooling only, and buildings where it applies to electric heating and cooling. Within each block the rows are 'With Max Bill', 'With Mean Bill' and 'With Min Bill', the three electricity rate scenarios. No values are printed; boxes were measured against the tick labels (zero at 160.5 px, 30.61 px per percent). Electric cooling only, giving Q1, median, Q3 and whisker range: Max Bill 2.63/3.68/5.05, -1.03 to 8.74; Mean Bill 2.76/3.81/5.15, -0.83 to 8.77; Min Bill 2.73/3.77/5.18, -1.03 to 8.97. Electric heating and cooling: Max Bill 3.12/4.10/5.34, -0.25 to 8.77; Mean Bill 3.28/4.26/5.50, -0.05 to 8.90; Min Bill 3.22/4.20/5.54, -0.41 to 9.13. Buildings with electric heating as well as cooling save about half a percentage point more at the median, and the choice of electricity rate scenario moves the median by less than two tenths of a point. The figure caption calls these the maximum, mean and median bills, but the plotted third row is labeled minimum.
