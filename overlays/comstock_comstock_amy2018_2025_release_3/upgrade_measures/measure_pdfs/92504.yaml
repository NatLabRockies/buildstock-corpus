  alt: |-
    Three-panel stacked bar chart of the annual national utility bill under maximum, mean and minimum electricity rates, baseline versus Package_6
  description: |-
    Figure 5 is a three-panel stacked bar chart with the y axis labeled 'Annual Utility Bill (Billion USD, 2022)' running from 0 to 160. Each panel holds a baseline bar and a Package_6 bar, and the panels differ only in the electricity rate applied: maximum rate, mean rate and minimum rate. Segments are Electricity, Natural Gas, Propane and Fuel Oil, with electricity dominating and natural gas holding a flat 17 billion dollars in all six bars. Maximum rate: total 144 to 142 billion dollars, a 2% reduction, with electricity falling 125 to 122. Mean rate: total 127 to 125, again 2%, electricity 108 to 105. Minimum rate: total 112 to 110, 2%, electricity 93 to 91. The percentage change is printed above each pair. Propane and fuel oil are too thin to read. Note that Table ES-3 reports the same mean-rate saving as '2' under a column header of 'Million USD, 2022' while this axis is in billions.
- source_image: 92504_images/image_000007_234c8e3b9c2aa499da89a095a2f892f20eb46485fe9b591dba9b2e9ab6d09532.png
