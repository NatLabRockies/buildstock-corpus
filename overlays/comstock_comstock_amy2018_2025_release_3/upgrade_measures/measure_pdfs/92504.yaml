  description: |-
    Figure A-2 is a grouped bar chart with the y axis labeled 'Natural Gas Total Energy Consumption (tbtu)' and the x axis labeled 'Comstock Building Type', with one pair of bars per building type: baseline in dark blue and Package 6 in light blue. No values are printed; bar tops were measured against the y-axis tick labels (zero at 164.0 px, 0.592 px per unit, so one pixel is about 1.7 tbtu). Baseline consumption by building type: Full Service Restaurant 193, Quick Service Restaurant 47, Retail Stripmall 220, Retail Standalone 88, Small Office 56, Medium Office 36, Large Office 42, Primary School 172, Secondary School 262, Outpatient 34, Hospital 133, Small Hotel 10, Large Hotel 108 and Warehouse 103 tbtu, summing to roughly 1500 tbtu. Secondary School and Retail Stripmall are the largest natural gas consumers. One-pixel increases are visible for Medium Office, Large Office, Secondary School and Large Hotel, consistent in direction with the natural gas heating penalty in Table 6, but all four are at the resolution limit and the magnitudes are not asserted.
