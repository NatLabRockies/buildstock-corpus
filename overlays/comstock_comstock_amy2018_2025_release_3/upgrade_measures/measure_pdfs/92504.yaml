  alt: |-
    Two-panel stacked bar chart of annual site energy consumption by end use and fuel, baseline versus Package_6, for the whole stock on the left and applicable buildings only on the right
  description: |-
    Figure 4 is a two-panel stacked bar chart of annual site energy consumption in TBtu, comparing the baseline against Package_6 (the individual-building peak reduction objective). The left panel covers the whole ComStock stock and totals 4865 TBtu at baseline against 4814 TBtu with the package, a 51 TBtu reduction. The right panel covers applicable buildings only and totals 2305 against 2254 TBtu, the same 51 TBtu. Legible whole-stock segment labels, baseline then package: Interior Equipment Electricity 740.2 to 740.2; Fans Electricity 568.5 to 563.6; Cooling Electricity 727.0 to 708.2; Interior Lighting Electricity 440.4 to 414.7; Heating Electricity 260.1 to 253.5; Heating Natural Gas 965.2 to 970.1; Exterior Lighting Electricity 193.4 to 193.4. Applicable-only segments: Interior Equipment 383.0 to 383.0; Fans 267.8 to 262.9; Cooling Electricity 358.8 to 340.0; Interior Lighting 225.0 to 199.4; Heating Electricity 149.0 to 142.4; Heating Natural Gas 595.3 to 600.2; Exterior Lighting 117.3 to 117.3. Every delta reproduces Table 6 exactly: fans 4.9, cooling 18.8, interior lighting 25.7 and electric heating 6.6 TBtu saved against a 4.9 TBtu natural gas heating penalty, summing to the 56.1 TBtu electricity saving and 51.1 TBtu total.
- source_image: 92504_images/image_000006_35524d7a48ae9aec6de12d47c60543906d59b27d093a98adbc279e045a56cee8.png
