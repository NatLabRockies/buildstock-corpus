# Hand-authored figure descriptions for measure PDF 92504
# "ComStock Measure Documentation: Thermostat and Lighting Control for Load Shedding"
# (ComStock 2025 release 3 upgrade measure, NREL/TP-5500-92504, Jie Xiong and
# Janghyun Kim, November 2025).
#
# 23 image refs in the extracted markdown. image_000000 (the cover photo grid) and image_000001
# (the NREL wordmark) are decorative and deliberately have no entry. The 21 entries below cover
# Figures 1-17 and Figures A-1 to A-4. Every real figure is a chart, so there are no
# vision-transcription entries; Tables ES-1 to ES-4 and 1-7 all extracted as markdown.
#
# The document documents a package of two measures - Thermostat Control for Load Shedding (a
# plus/minus 2 degree C setpoint shift over a 4-hour weekday dispatch window with a 2-hour rebound
# ramp) and Lighting Control for Load Shedding (30% dimming) - evaluated under two dispatch
# objectives: Package_6 targets each building's own peak and Package_7 targets the grid peak.
#
# QA FLAGS - vision-derived numbers need a human pass before publication.
#
# * HIGH confidence, every asserted number is a printed data label: Figure 1 (000002, all 40
#   segment labels legible and every column sums to 1.000), Figure 2 (000003, left panel labels
#   legible and the six green bars sum to exactly 68.00), Figure 5 (000006, bar totals and percent
#   changes printed), Figure 12 (000013, same).
#
# * HIGH confidence, measured from pixels but corroborated exactly against a markdown table:
#   Figure 4 (000005) and Figure 11 (000012) - every legible segment delta reproduces Table 6 and
#   Table 7 respectively to the tenth of a TBtu; Figure 15 (000016) likewise. Figure 3 (000004)
#   and Figure 10 (000011) medians agree with Table ES-4 to a few tenths of a percent.
#
# * MEDIUM confidence, measured from pixels with no independent corroboration. Boxes and whiskers
#   were located programmatically from the fill colors and calibrated against each panel's own
#   tick-label text positions, since these bitmaps carry no tick marks. This covers Figure 6
#   (000007), Figure 13 (000014), Figure 16 (000017) and Figure 17 (000018). Box fills have a
#   darker one-pixel border stroke, so the outer 2 px of each box was excluded before splitting
#   dark (Q1 to median) from light (median to Q3) shade; without that exclusion the median reads
#   equal to Q3.
#
# * LOWER confidence by construction, and deliberately hedged in the text: the violin plots
#   (Figures 7-9, 000008-000010). Their sample counts are printed and legible and are asserted
#   verbatim, but most interquartile boxes are one to two pixels wide. Only boxes spanning more
#   than about 3 px are given as numbers; the rest are described qualitatively. Whiskers that
#   reach the axis limit are flagged as clipped rather than reported as data.
#
# * Figure 14 (000015): the two off-diagonal panels are at 0.43% and 0.22% per pixel. The bottom
#   left panel's medians are quoted from Table ES-4 rather than measured. The top right panel's
#   interquartile ranges are given as approximate ranges only.
#
# * Figures A-1 to A-4 (000019-000022) are at 1.7 to 4.4 tbtu per pixel. Baseline bar heights are
#   asserted as approximate; deltas at or below one pixel are explicitly described as not
#   resolvable rather than quantified. In particular A-1's and A-2's Package 6 changes are NOT
#   asserted as numbers, and A-3's apparent Small Hotel increase is a one-pixel artifact - Small
#   Hotel is not an applicable building type - and is deliberately omitted.
#
# DEFECTS AND ODDITIES observed while describing (recorded here, not asserted in the
# descriptions unless noted):
#
# (a) Table ES-3's absolute-savings column header reads "Million USD, 2022" but the values are
#     billions: it records the mean-rate utility bill saving as "2", and Figure 5's axis is
#     "Annual Utility Bill (Billion USD, 2022)" with the mean-rate total falling 127 -> 125. A
#     1000x unit error, the same class as 98223's Section 5.4 defect. Flagged in the Figure 5
#     description.
# (b) Table ES-2 is garbled by table extraction: the fuel names are shifted into the last column
#     ("-0.32% | -0.75% | -4.9 | Natural gas") and the grid-objective electricity row reads
#     "Electricity | 1.23% | | 2.47% 39.0".
# (c) Table ES-2's grid-objective applicable-only electricity saving (2.47%) disagrees with Table
#     7's (3.40%) for the same quantity.
# (d) Table ES-4's February column header reads "Fen".
# (e) Figure 5's and Figure 12's captions say "the Lighting Control for Load Shedding scenario",
#     but the plotted bars are labeled Package_6 / Package_7, the whole thermostat-and-lighting
#     package (markdown lines 535 and 606).
# (f) Figure 6's and Figure 13's captions say "maximum, mean, and median bills", but the plotted
#     rows are "With Max Bill / With Mean Bill / With Min Bill" (markdown lines 541 and 612).
#     Noted in both descriptions.
# (g) Section 3.1 says "the package is applicable to 67.26% of the stock floor area". 67.26% is
#     the thermostat measure's applicability; Figure 2's green bars sum to exactly 68.00%, the
#     lighting measure's figure, and Table ES-1 lists both.
# (h) Section 5.1.1 says the monthly medians range "roughly from 5% to 7%"; Figure 3 gives 6.12
#     to 7.46 and Table ES-4 gives 6.0 to 7.3.
# (i) Figure 4's, Figure 11's and Figure 15's hatched-fill segment labels (Heating Natural Gas,
#     Water Systems Natural Gas, Interior Equipment Natural Gas) are illegible because the
#     diagonal hatch strokes cross the digits. Figure 4's Heating Natural Gas pair was recovered
#     via Table 6's -4.9 TBtu penalty (965.2 + 4.9 = 970.1); Figure 11's was not recovered and is
#     omitted. Whole-stock Interior Equipment Natural Gas is roughly 310 TBtu in both figures but
#     is not asserted.
# (j) Figure 2's right-panel labels are white text on saturated fills and are largely illegible.
#     The Hospital orange label and both Quick Service Restaurant labels could not be read; the
#     QSR pair cannot be reconciled to 100%.
# (k) Figure 3's "-10.00%" y tick label sits about 8 px out of place relative to the otherwise
#     uniform 56 px spacing of the other six labels. Figure 14's top row has the same misplaced
#     "-10%" label. Both were excluded from the calibration fit.
# (l) The Table of Contents and the List of Figures / List of Tables blocks are badly scrambled by
#     table extraction.
# (m) Figure 15's caption is split around its image ref: the head is at markdown line 632, the
#     image ref at 634, and the tail ("peak reduction objective, package 7 - grid peak reduction
#     objective), for applicable buildings only ...") at 636.
# (n) Figure 17's axis reads "Mean electricity utility bill cost [billion $]", but the four cost
#     groups are not additive (energy 164.8 + flat demand 93.7 + TOU demand 82.0 = 340.5 against
#     a plotted total electricity of 207.5) and the magnitudes are roughly double Figure 5's
#     stock electricity bill at the mean rate (about 108 billion). Flagged in the description.
# (o) Section 5.3 says the individual-objective strategy "reveals a higher potential of negative
#     savings risk", but in Figure 16 the individual-objective whiskers stop at about -0.8% while
#     the grid-objective whiskers reach about -2.1%. Hedged in the description, since whiskers
#     are 1.5 x IQR and outliers are not drawn.
# (p) Table 2 gives lighting power densities for Gen 1 to Gen 5 only, although Table 1 defines a
#     merged "Gen 4-8" row and Figure 1 plots gen1 through gen8. Checked against the source PDF
#     (page 14): the source table itself stops at Gen 5, so this is a source-document gap, not an
#     extraction defect.
# (q) Figure 11's applicable-only baseline total (2293 TBtu) is lower than Figure 4's and Figure
#     15's (2305 TBtu) for the nominally identical "applicable buildings only" subset, and every
#     segment in Figure 11's right panel is about 0.4% smaller. Table 7's 35.6 TBtu at 1.55%
#     implies about 2297. Recorded as an observation, not asserted as a defect.
# (r) Minor: Figures A-1 to A-4 label the y axis in lowercase "(tbtu)", and A-2 and A-3 label the
#     x axis "Comstock Building Type" rather than "ComStock".
# (s) The panel titles on Figures 7-9 read "Upgrade 52.0: Package_6 (unweighted)", exposing the
#     internal upgrade ID. Captured verbatim in those three descriptions.
