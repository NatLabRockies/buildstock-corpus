  alt: |-
    Violin plot of percent site energy savings by end use across seventeen fuel-and-end-use rows under Package_6, with interior lighting the largest and most consistent saver
  description: |-
    Figure 8 is a violin plot titled 'Upgrade 52.0: Package_6 (unweighted)' with the x axis labeled 'Percent Site Energy Savings by End Use (%)' running from -120 to 100. Seventeen rows are plotted top to bottom, each with its sample count: Other Fuel Water Systems (31), Other Fuel Heating (1700), District Heating Water Systems (47), District Heating Heating (2672), District Cooling Cooling (1894), Natural Gas Water Systems (2128), Natural Gas Heating (33111), Electricity Water Systems (2079), Electricity Refrigeration (15272), Electricity Pumps (25087), Electricity Interior Lighting (64778), Electricity Interior Equipment (3), Electricity Heating (30744), Electricity Heat Rejection (6770), Electricity Heat Recovery (2233), Electricity Fans (55250), Electricity Cooling (61157). Zero sits at 304.5 px and the scale is 1.26 px per percent. Only five rows have interquartile boxes wide enough to resolve: Interior Lighting +9.92% to +14.68% (whiskers -0.4% to +34.5%), Electricity Cooling +3.57% to +9.13% (-4.4% to +99.6%), Electricity Heating +1.98% to +9.13% (-99.6% to +99.6%, clipped by the axis), Heat Rejection +1.98% to +4.37% (-4.4% to +36.1%) and Fans +1.19% to +4.37% (-98.8% to +83.7%). Interior lighting is the largest and tightest saver, consistent with the 30% dimming measure, while the fossil and district rows sit on zero.
- source_image: 92504_images/image_000010_de40fdec7b722a3040c34ab28372427419fa4da98c51aa7750a0f07d95d64e84.png
  source_image_sha256: de3155145a3c2d6bf9f8265b0351eaf5334a2433a842bac808633bbfaddd3265
