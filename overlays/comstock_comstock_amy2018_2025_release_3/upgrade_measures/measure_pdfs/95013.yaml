  alt: |-
    Three-panel stacked bar chart of annual utility bill by fuel under maximum, mean, and minimum electricity rates, Baseline vs Package_8
  description: |-
    Figure 5. Three-panel stacked bar chart of Annual Utility Bill (Billion USD, 2022), y-axis 0 to about 150, under three electricity-rate assumptions. Each panel has two bars (Baseline, Package_8) stacked by fuel (Electricity, Natural Gas, Propane, Fuel Oil). With Max Electricity Rate: Baseline 144 (Electricity 125, Natural Gas 17) vs Package_8 121, a 16% reduction (Electricity 102). With Mean Rate: Baseline 127 (Electricity 108, NG 17) vs 107, a 15% reduction (Electricity 88). With Min Rate: Baseline 112 (Electricity 93, NG 17) vs 95, a 15% reduction (Electricity 76). Natural gas cost is unchanged at 17 across scenarios; the roughly 15-16% total bill savings comes entirely from reduced electricity purchases (controls plus PV).
