    Appendix figure (uncaptioned in the extracted text). Grouped bar chart of Natural Gas Total Energy Consumption (Btu) by U.S. census division, y-axis 0 to about 400. Two bars per division (Baseline, dark blue; Package 6, light blue) for New England, Middle Atlantic, East North Central, West North Central, South Atlantic, East South Central, West South Central, Mountain, and Pacific. East North Central is the largest (about 385), followed by Middle Atlantic and Pacific (roughly 215-240). Baseline and Package 6 are nearly identical in every division, showing the thermostat/lighting/PV measure barely affects natural gas. (Legend reads 'Package 6' here while the main figures label the package 'Package_8' -- flag this naming mismatch for QA.)
