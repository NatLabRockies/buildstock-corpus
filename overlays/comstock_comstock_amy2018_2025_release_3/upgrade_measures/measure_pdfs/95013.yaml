  alt: Violin and box plots of percent utility bill savings by fuel type across the modeled stock
  description: |-
    Figure 7. Horizontal violin-plus-box plots of Percent Utility Bill Savings by Fuel (%), x-axis about -160% to 100%. Rows with model counts: Propane Bill State Average (n=491), Fuel Oil Bill State Average (n=1206), Natural Gas Bill State Average (n=32142), Electricity Bill with Mean Rate (n=64752), and Bill Mean (n=64764). The Electricity Bill and overall Bill Mean show clear positive distributions (interquartile box roughly 25-45%), while the fossil-fuel rows sit essentially at 0% with long thin tails. Consistent with the measure's savings being almost entirely electricity-driven.
