  alt: Violin and box plots of percent site energy savings by end use across the modeled stock
  description: |-
    Figure 8. Horizontal violin-plus-box plots of Percent Site Energy Savings by End Use (%), x-axis about -120% to 100%. Rows are end-use/fuel combinations with model counts, including Electricity Cooling (n=61153), Electricity Fans (n=55235), Electricity Heat Recovery (n=2231), Electricity Heat Rejection (n=6769), Electricity Heating (n=30743), Electricity Interior Equipment (n=4), Electricity Interior Lighting (n=64777), Electricity Pumps (n=25073), Electricity Refrigeration (n=15273), Electricity Water Systems (n=2077), Natural Gas Heating (n=33121), Natural Gas Water Systems (n=2133), District Heating Cooling (n=1894), District Heating Heating (n=2672), District Heating Water Systems (n=54), Other Fuel Heating (n=1700), and Other Fuel Water Systems (n=30). Electricity Interior Lighting and Electricity Cooling show the largest positive savings distributions; heating end uses skew slightly negative (take-back); most other end uses cluster near 0%.
- source_image: 95013_images/image_000010_9b6e80fd8aec9386b8dcac0215aa3ddd5557664771e4b95b5cec1ae2029b5c18.png
