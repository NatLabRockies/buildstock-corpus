# Hand-authored figure descriptions for measure_pdfs/95013.pdf (Thermostat + Lighting Control
# for Load-Shedding with PV package).
# Scope: figures only; cover montage (000000) and NREL logo (000001) omitted; Tables 1-5 are
# real markdown text (no bitmap). Figures 1-9 = images 000002-000010; images 000011-000014 are
# uncaptioned appendix grouped-bar charts (gas/electricity by census division and building type).
# method is vision-description (numbers read off charts, need QA). Least-certain reads: Figure 1
# (000002) and Figure 2 (000003) have dense small labels, and Figure 4 (000005) PV netting is
# ambiguous. NOTE for QA: the appendix charts (000011-000014) label the package 'Package 6' while
# the main figures label it 'Package_8' -- a source naming mismatch. Every entry pins the on-disk
# PNG sha256.

