  alt: |-
    Box-and-whisker plots of percent electricity utility bill cost savings for electric-cooling-only and electric-heating-and-cooling buildings under maximum, mean, and minimum bill assumptions
  description: |-
    Figure 6. Box-and-whisker plots of Electricity Utility Bill Cost Savings [%], x-axis 0 to about 80, grouped into two categories, each with three rows (With Max Bill, With Mean Bill, With Min Bill): 'Electric cooling only' and 'Electric heating & cooling'. Median electricity bill savings cluster around 35-40% for both categories, with the electric-heating-and-cooling group's boxes shifted slightly lower and wider; whiskers extend from roughly 20% up to about 70%. Shows most buildings realize substantial electricity bill savings, with modest sensitivity to the bill (rate) assumption.
- source_image: 95013_images/image_000008_14d8f33e84982d80314002422967843d7464a67e1db72c2e5040027df9037f8a.png
