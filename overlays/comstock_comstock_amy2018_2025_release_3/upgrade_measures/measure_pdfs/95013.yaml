  alt: Violin and box plots of percent site energy savings by fuel type across the modeled stock
  description: |-
    Figure 9. Horizontal violin-plus-box plots of Percent Site Energy Savings by Fuel (%), x-axis about -120% to 100%. Rows with model counts: District Cooling (n=1894), District Heating (n=2675), Other Fuel (n=1708), Natural Gas (n=33554), Electricity (n=64777), and Site (n=64777). Electricity and overall Site show positive savings distributions (interquartile box roughly 3-10%) with long tails, while the district-energy, other-fuel, and natural-gas rows cluster tightly at 0%. Confirms the site energy savings are driven by reduced electricity use.
