  alt: Box-and-whisker plot of the percent mean daily peak load reduction by month across the modeled
    stock
  description: |-
    Figure 3. Box-and-whisker plot of Mean Peak Savings [%] by month, y-axis about -10% to 70%, one box per month January through December. Median peak savings are lowest in winter (roughly 13% in Jan-Feb and Nov-Dec) and highest in summer (roughly 30-32% in May-August), tapering through spring and fall. Whiskers reach up to about 70% in peak summer months and dip slightly negative (a small peak increase) in some winter months. Shows the load-shedding controls deliver their largest peak-demand reductions during the summer cooling season.
- source_image: 95013_images/image_000005_4d36b83070daa5b3afba1740d3315e402ad5a988b84fb7960c157ec0ea259e9d.png
  source_image_sha256: e189a92712bfbc92ef7b5050878c3ab6e256ba14de2eb84decb5be4b2a261d4e
