  described_utc: '2026-08-20'
  alt: |-
    Two-panel stacked bar chart of annual site energy consumption by end use and fuel, whole stock and applicable subset, Baseline vs Package_8, including on-site PV generation as negative segments
  description: |-
    Figure 4. Two-panel stacked bar chart of Annual Energy Consumption (TBtu) by end use and fuel per the legend, comparing Baseline and Package_8. Left panel (whole stock), y-axis 0 to about 5000: Baseline total 4865 vs Package_8 4814 at the top of the positive stack, and Package_8 adds a negative Photovoltaics Used segment of about -745.0 below zero (on-site generation), so net site energy is substantially lower once PV is netted. Right panel (applicable subset), y-axis about -1500 to 2500: Baseline 2305 vs Package_8 2254 positive, with a negative Photovoltaics segment of about -573.9. Legible positive segments are roughly constant between scenarios (e.g. Cooling Electricity near 740, District Heating near 706-727, Water Systems and Heating segments), indicating the site-energy change comes mainly from on-site PV generation plus modest controls savings rather than large end-use reductions. (The exact PV netting and whether 'excess' PV is included are the least-certain reads -- flag the net-savings percentage for QA.)
- source_image: 95013_images/image_000006_9c2a85b49e033d4b1310232d6f6f4024fa8707cc1d2e470b990b288f683a1f50.png
