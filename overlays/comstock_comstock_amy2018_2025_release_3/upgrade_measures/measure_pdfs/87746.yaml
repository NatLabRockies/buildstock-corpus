# Hand-authored figure descriptions for measure_pdfs/87746.pdf
#
# 87746 is the End-Use Savings Shapes: Commercial 2023 Release 2 webinar deck. It is a SLIDE DECK,
# not a report: there are no numbered figure captions, so each entry anchors on the slide's own
# heading text instead of a "Figure N" label. docling extracts every picture as a bare ![Image](...)
# ref, so the charts are invisible to retrieval and unreadable without the bitmap. Each entry below
# rewrites the ref with a hand-written alt and injects a description paragraph below it.
#
# Scope: figures only. 12 of the 61 extracted images are decorative and deliberately have no entry:
# the NREL logos (000000, 000060), a gas-meter stock photo appearing twice at byte-identical hashes
# (000001, 000004), a blue arrow (000002), the ComStock plus-icons pictogram (000005), an NREL photo
# collage (000011), and the five data-access tile icons on the "Accessing the Data" slide (000050,
# 000051, 000052, 000053, 000054).
#
# Depth: authored to the section 2.1 budget in overlays/FIGURE_DESCRIPTIONS_ROLLOUT.md - roughly
# 40-70 words per description (chart type, axes and units, series/legend, one headline number, and a
# pointer to where the values live). Printed data labels are not transcribed wholesale.
#
# The deck repeats five chart families across the measures, so the entries are deliberately
# parallel: stock site energy by fuel and end use (stacked columns in TBtu), annual GHG emissions by
# grid scenario and fuel (grouped bars in MMT CO2e), summer/winter peak load profiles (stacked area
# in MW, Boston/Suffolk County at 15-minute steps), applicability by measure combination, and
# average site percent savings by measure combination.
#
# Authoring notes:
#   * method is vision-description: these interpret a chart rather than copy legible cells. Numbers
#     were read off the bitmaps and should get a human QA pass before this is a release record.
#   * Every entry pins the on-disk PNG sha256; if upstream repoints a bitmap the build drops that
#     injection and warns rather than shipping a stale description.
#   * Temperatures are written plainly (16C, -15C, Celsius/Fahrenheit) to keep the sidecar ASCII.
#
# QA notes (vision reads; flag for a human pass):
#   * 000035, the exhaust-air heat-recovery emissions chart, prints a DIFFERENT baseline set
#     (344.4 / 257.5 / 162.4 / 89.3 MMT CO2e) than every other measure's emissions chart in the deck
#     (336.6 / 253.3 / 161.1 / 83.6). Worth confirming whether that slide came from another run.
#   * 000009 and 000010: only the bar totals (4366 and 4638 TBtu) are high-confidence; the individual
#     band labels are small and are quoted without attributing them to specific end uses.
#   * 000019's segment labels are too small to attribute reliably, so it is described by direction
#     only rather than by value.
#   * 000044 and 000046 abbreviate long measure-combination names in the source legend; the entries
#     paraphrase "window + wall + roof" as "envelope" where the label ran off.
#   * 000001 and 000004 are byte-identical (same sha256) - the same photo reused two slides apart.

