  alt: |-
    Schematic from Trane (2013) of the single-zone VAV airflow control scheme, showing two discrete supply fan speeds stepped against stages of heating and cooling capacity.
  description: |-
    Borrowed schematic (credited to Trane, 2013) illustrating the single-zone VAV airflow control scheme this measure emulates. Two staircase traces run left to right over an unlabelled horizontal axis representing increasing cooling demand. The right-hand black axis is "supply fan airflow", marked "design airflow" at the top with a dotted "minimum airflow" line partway down; the left-hand orange axis is "stages of cooling or heating capacity". At the left the black trace sits at design airflow while the orange trace is high and annotated "heater ON". The black trace then drops to a low plateau annotated "low fan speed" that coincides with the dotted minimum airflow line, holding that level while the orange trace steps from "both compressors OFF" up to "one compressor ON". At the right the orange trace steps to "both compressors ON" and the black trace jumps back to design airflow, annotated "high fan speed". The figure therefore shows only two discrete fan speeds, with first-stage cooling served at the low speed - the behaviour section 3.2 calls "effectively a fan control approach with two discrete speeds", although that section describes 40%, 75% and 90% airflow levels.
