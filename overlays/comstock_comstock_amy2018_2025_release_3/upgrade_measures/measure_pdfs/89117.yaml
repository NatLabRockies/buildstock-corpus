  description: |-
    Figure 15. Scatter plot with x-axis "Fan energy savings (kWh)" 0 to 40,000 and y-axis "Natural gas heating energy savings (kWh)" 0 down to -50,000; all plotted gas values are negative, i.e. penalties. Points are coloured by climate zone, legend order CZ 5 (blue, the most numerous), CZ 4 (orange), CZ 3 (green), CZ 6 (red) and CZ 2 (purple). A thick red line labelled "Max potential penalty" runs straight from the origin to (40,000, -50,000) - a slope of -1.25, which is exactly one over the 80% natural gas heating efficiency the text assumes, so the line represents all fan heat being replaced by gas at that efficiency. Every plotted point lies above the line, and most lie far above it, confirming that the modelled gas heating penalty is well below its theoretical maximum; this is the sanity check section 5.5 describes. Penalties are mostly between 0 and -20,000 kWh, deepening loosely as fan savings grow, with the deepest points near -22,000 kWh. Section 5.5 says buildings with fan energy savings above 300,000 kWh were omitted for clarity, but this axis stops at 40,000 kWh.
