    Figure 10, printed in the document with the caption "Figure 11". Three panels titled "eGRID 2021", "LRMER High RE Cost 15" and "LRMER Low RE Cost 15", each holding a "Baseline" and an "Advanced RTU Controls" stacked bar on a shared y-axis "Annual GHG Emissions (MMT CO2e)" from 0 to just over 400. Segments are Electricity (blue), Natural Gas (orange), Fuel Oil (green) and Propane (red-orange), with printed labels. eGRID 2021: 402 baseline to 384 with the measure, marked -4%, with electricity 314 to 297 and gas 81 to 80. LRMER High RE Cost 15: 325 to 312, marked -4%, electricity 237 to 225, gas 81 to 80. LRMER Low RE Cost 15: 240 to 231, marked -4%, electricity 152 to 145, gas 81 to 80. The electricity reductions of 17, 12 and 7 MMT bracket the Executive Summary's stated 7 to 17 MMT range, and the 1 MMT gas reduction is the on-site component. The scenario totals differ because the electricity carbon intensity differs, but the percentage reduction is 4% in all three. The panel order puts eGRID first, whereas the note beneath the figure lists eGrid last.
