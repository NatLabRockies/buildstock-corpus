    Figure 12, printed in the document with the caption "Figure 13". Horizontal violin plots with embedded box plots on an x-axis "Percent Site Energy Savings by HVAC System (%)" from -5 to 55; the plot title "Upgrade 13: Advanced RTU Controls (unweighted)" is clipped at the top edge of the bitmap. Six system-type rows with sample counts: PSZ-AC district chilled water with electric coil (n=12), PSZ-AC with district hot water (n=524), PSZ-AC with electric coil (n=39881), PSZ-AC with gas boiler (n=7511), PSZ-AC with gas coil (n=133472) and PSZ-HP (n=14110). The counts sum to 195,510, the full applicable sample. Approximate interquartile ranges and medians: district chilled water with electric coil 3% to 7.5% (median 5%); district hot water 6% to 13% (9.5%); electric coil 5% to 13% (9%); gas boiler 3.5% to 11% (7%); gas coil 3.5% to 11.5% (7.5%); PSZ-HP 5.5% to 15% (10%). The two largest system types, gas coil and electric coil, do have similar spreads as the text says. The higher upper range for the heat pump, electric coil and district hot water rows is consistent with the text's argument that a fan heat penalty costs less site energy where heating is more efficient.
