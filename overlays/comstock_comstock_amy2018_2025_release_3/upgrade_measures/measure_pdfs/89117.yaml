# Hand-authored figure descriptions for measure PDF 89117
# "End-Use Savings Shapes Measure Documentation: Advanced Rooftop Unit Control"
# Amy Allen and Chris CaraDonna, National Renewable Energy Laboratory,
# NREL/TP-5500-89117, April 2024
#
# The PDF yields 26 extracted images. Five are decorative and are deliberately
# left with no overlay entry: image_000000 is the cover photo collage,
# image_000001 to image_000003 are cover photos and image_000004 is the NREL
# wordmark. The remaining 21 images are real figures (plus one table that
# survives only as a bitmap) and are all described below, in document order.
#
# IMAGE -> FIGURE MAP. Captions sit ABOVE their image refs throughout. The
# in-body caption NUMBER is wrong for ten consecutive images; the authoritative
# number is the one used by the List of Figures and by the body
# cross-references. The printed caption number is given in parentheses where it
# differs:
#   000005 = Figure 1          000015 = Figure 9  (printed "Figure 10")
#   000006 = Figure 2          000016 = Figure 10 (printed "Figure 11")
#   000007 = Table 1 bitmap    000017 = Figure 11 (printed "Figure 12")
#   000008 = Figure 3          000018 = Figure 12 (printed "Figure 13")
#   000009 = Figure 4          000019 = Figure 13 (printed "Figure 14")
#   000010 = Figure 5a         000020 = Figure 14 (printed "Figure 15")
#   000011 = Figure 5b (printed "Figure 6b")
#   000012 = Figure 6  (printed "Figure 7")
#   000013 = Figure 7  (printed "Figure 8")
#   000014 = Figure 8  (printed "Figure 9")
#   000021 = Figure 15         000022 - 000025 = Figures A-1 to A-4
# The numbering resyncs at 000021, so TWO different images carry the printed
# caption "Figure 15": 000020 (savings by climate zone) and 000021 (the gas
# penalty scatter). Every description below names its authoritative figure
# number and, where they differ, the printed one, so a retrieval hit on either
# number lands on the right image.
#
# The Table 1 bitmap (000007) has no caption line at all in the markdown - its
# title and footnote are baked into the image, and only the three data rows
# survived docling's table extraction - so it is transcribed rather than
# described, with method: vision-transcription.
#
# QA FLAGS - vision-derived numbers need a human pass before publication.
#
# High confidence (the value is printed on the figure itself, or is
# corroborated by body text):
#   Fig 1  - the labelled bars are printed data labels. The derived total stock
#            floor area 60.56 billion ft2 (16,744,407,702 / 0.2765) is confirmed
#            by "All others" 5,209,708,660 / 60.56B = 8.602%, matching its own
#            printed 8.60%. The three PSZ-AC rows total 38.62%, matching the
#            Executive Summary and Measure Summary "about 39% of the floor area
#            modeled in ComStock".
#   Fig 3  - the measure plateau 0.58 kg/s over the baseline plateau 1.45 kg/s
#            is 40.0%, matching the stated 40% minimum supply airflow ratio; all
#            zone loads are negative, matching the note "a negative load
#            corresponds to cooling"; the x range 5040-5232 is the stated
#            "roughly one-week period in July".
#   Fig 5a - outdoor air enthalpy stays below return air enthalpy for the whole
#            window, matching section 5.1 exactly.
#   Fig 5b - the occupied plateau 0.58 kg/s is shared by both series, matching
#            "generally operating at 100% outdoor air".
#   Fig 6  - the occupied plateau 0.58 kg/s is 40% of Figure 3's 1.45 kg/s
#            baseline maximum, matching section 5.1's "never drops below 0.6
#            kg/s (40% of the maximum airflow) during occupied periods" (the
#            text rounds 0.58 to 0.6).
#   Fig 8  - segment labels are printed. The totals 4338 -> 4156 TBtu give
#            exactly the stated 182 TBtu / 4.2%; fans 519.1 -> 382.0 gives the
#            stated 137.1 TBtu / 26%; cooling 667.3 -> 643.3 gives the stated
#            24.0 TBtu / 3.6%.
#   Fig 10 - every bar carries a printed label. Electricity deltas 17, 12 and 7
#            MMT and the 1 MMT gas delta reproduce the Executive Summary's
#            7-17 MMT range plus 1 MMT on-site gas, and all three panels print
#            -4%.
#   Fig 11 - "District Cooling Cooling (n=12)" matches section 5.4's "PSZ-AC
#            with district chilled water and an electric heating coil had only
#            12 incidences"; the cooling box 4-13% matches the stated 5%-15%
#            interquartile range; the fan distribution stops at 67%, matching
#            "no datapoints with fan energy savings exceeding 67%".
#   Figs 12, 13, 14 - the per-category n values sum to exactly 195,510 in all
#            three figures independently, and PSZ-AC with gas coil (133,472) and
#            PSZ-AC with electric coil (39,881) are the two largest system
#            types, as section 5.4 states.
#   Fig 15 - the red "Max potential penalty" line runs from (0, 0) to
#            (40,000 kWh, -50,000 kWh), a slope of exactly -1/0.8, reproducing
#            the stated 80% natural gas heating efficiency assumption; every
#            point lies above it, as section 5.5 states.
#
# Medium confidence (read off the plot against gridlines or a pixel-derived
# scale; corroboration is partial):
#   Fig 1  - the seven unlabelled percentages were derived from the adjacent
#            absolute-floor-area panel, not pixel-read. PTAC with gas coil is
#            unlabelled in all three panels and is only bounded by the residual
#            (about 1.1%); it is not asserted in the description.
#   Fig 4  - the plateau 2,330 W and floor about 820 W come from a gridline
#            pixel calibration (43.33 px per 500 W). Their ratio is about 35%,
#            not the 30% fan power minimum the text asserts - see defect (i).
#   Figs 3, 5b - the peak zone loads are read against 5,000 W gridlines and are
#            good to about +/-300 W.
#   Fig 9  - fans 268.8 -> 131.6 and cooling 243.9 -> 220.0 are printed labels
#            and their deltas match the stock values, but the implied percentage
#            reductions (about 51% and 10%) are below the 53.3% and 11.2% the
#            body text gives for applicable buildings - see defect (j).
#   Figs 8, 9 - the natural gas heating and interior equipment gas segment
#            labels are illegible at the source bitmap resolution and are NOT
#            asserted; the body text values (18.1 TBtu / 2.1% stock, 6.1% among
#            applicable buildings) are quoted instead.
#   Figs 11, 12, 13, 14 - box edges and medians are pixel reads off unlabelled
#            box plots, good to about +/-1 percentage point.
#   Figs A-1 to A-4 - the bars carry no data labels. Summing the pixel-read bar
#            heights gives a total about 3% above Figure 8's printed all-fuel
#            totals, so the bar heights are systematically slightly overread.
#            The descriptions therefore give ordering, direction and rough
#            magnitude only, and no per-category value is asserted as exact.
#
# DEFECTS found while describing (all verified against the body text):
#   (a) Systematic caption misnumbering. Images 000011 to 000020 each print a
#       caption number one higher than the List of Figures and the body
#       cross-references use. The numbering resyncs at 000021, so two images
#       both print "Figure 15". Image 000011 additionally prints "Figure 6b"
#       where the body calls it "Figure 5b".
#   (b) Figure 5a is missing from the List of Figures entirely - the list jumps
#       from "Figure 4. Fan power ..." straight to "Figure 5b. System total
#       airflow ...".
#   (c) Applicability contradiction. The Executive Summary and the Measure
#       Summary table both say "about 39% of the floor area modeled in
#       ComStock", which matches Figure 1's three PSZ-AC rows (38.62%), but
#       section 3.1 says "about 45% of the weighted floor area". 45% is not
#       supported by Figure 1 even if PSZ-HP is included (42.02%); it is the
#       figure quoted for a different baseline in measure PDF 86585.
#   (d) Table 1 prints the wrong propane conversion: 177.8 lb/MMBtu paired with
#       182.3 kg/MWh, where 177.8 x 0.4536 x 3.412 gives 275.2. Measure PDF
#       86585's Table 5 prints the correct pairing (275.7 kg/MWh), so 89117
#       joins 89340, 89341, 89481, 89133 and 92618 in carrying the error.
#       Table 1's title and footnote also survive only as the 000007 bitmap.
#   (e) Section 3.3 copy-paste error: "compare the emissions of the ComStock
#       baseline and the window replacement scenario" - the wrong measure name.
#   (f) Section 5.2 units garbled: "4.2% total site energy savings (182 trillion
#       TBtu)" should read "182 trillion British thermal units (TBtu)".
#   (g) Section 5.3 says "a reduction in carbon emissions lower than the
#       reduction in overall site energy use (11.3%)", but the Executive Summary
#       and section 5.2 both give total site energy savings as 4.2%. 11.3%
#       appears to be a stray value (section 5.2's applicable-buildings cooling
#       savings is 11.2%).
#   (h) Wang et al. (2013) is quoted as "an average of 57% RTU-level energy
#       savings" in section 1 and "an average of 55% RTU energy savings" in
#       section 5.2. Studer et al. is cited as (2012) in section 1 and in the
#       References but as "Studer et al. (2013)" in section 5.2.
#   (i) Figure 4's plotted low-load fan power floor is about 35% of the baseline
#       occupied draw (about 820 W against 2,330 W), not the 30% minimum the
#       text asserts twice. The figure is internally consistent with section
#       5.4's ceiling, though: 1 - 0.353 = 64.7%, and section 5.4 reports "no
#       datapoints with fan energy savings exceeding 67%".
#   (j) Figure 9's plotted applicable-buildings pairs imply about 51% fan and
#       about 10% cooling reductions, whereas section 5.2 states 53.3% and
#       11.2%. The absolute deltas match the stock-level values exactly
#       (137 TBtu fans, 24 TBtu cooling), so the disagreement is in the
#       denominator used for the stated percentages, not in the savings.
#   (k) Section 5.4 describes the fan interquartile range as "roughly 30% to
#       67%", but 67% is where the distribution ends, not its 75th percentile;
#       the plotted box runs from about 32% to about 62%.
#   (l) Section 5.5 says buildings "with fan energy savings greater than 300,000
#       kWh were omitted here for clarity", but Figure 15's x-axis tops out at
#       40,000 kWh, so the stated cutoff is off by roughly an order of
#       magnitude relative to what is plotted.
#   (m) Minor label defects: Figure 5a's y-axis reads "Enthalpy (j/kg)" with a
#       lowercase j; Figures A-1 to A-4 label their y-axis units "(tbtu)"
#       lowercase; Figure 12's plot title is clipped at the top edge of the
#       bitmap; Figure 14 lists a bare climate zone "7" (n=268) alongside "7A"
#       and "7B"; and Figure 10 plots eGRID first while the note beneath it
#       lists eGrid last.
#   (n) The appendix was checked for the wrong/duplicated/swapped-graphic defect
#       class: A-1 is natural gas by census division, A-2 natural gas by
#       building type, A-3 electricity by building type and A-4 electricity by
#       census division, each matching its own caption. No swap or duplication.
#       A-2 to A-4 carry 14 building types including LargeHotel, which is absent
#       from Figure 13 because no LargeHotel model was applicable; the appendix
#       charts cover the whole stock, so this is consistent, not a defect.
