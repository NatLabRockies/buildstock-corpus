    Figure 14, printed in the document with the caption "Figure 15" - the same printed number as the following scatter plot. Horizontal violin plots with embedded box plots, titled "Upgrade 13: Advanced RTU Controls (unweighted)", on an x-axis "Percent Site Energy Savings by Climate Zone (%)" from -5 to 55. Eighteen climate zone rows with sample counts: 1A (n=3290), 2A (n=22148), 2B (n=3321), 3A (n=27797), 3B (n=15954), 3C (n=4938), 4A (n=42705), 4B (n=1522), 4C (n=5802), 5A (n=45307), 5B (n=9475), 6A (n=10400), 6B (n=1376), 7 (n=268), 7A (n=1052), 7B (n=120) and 8 (n=35), summing to 195,510. Note the bare zone "7" listed alongside 7A and 7B. Zones 3B (about 11% to 18.5%, median near 14%) and 3C (about 10.5% to 17%, median near 14%) stand well above the rest; 2B reaches about 4.5% to 17%. Most other zones cluster at a 25th percentile of roughly 2% to 5% and a 75th percentile of roughly 10% to 14%, matching the text's "25th percentile around 2.5% ... 75th percentile around 12.5%". The colder zones 5A, 5B, 6A, 6B, 7A and 7B are the lowest, with medians near 6%.
