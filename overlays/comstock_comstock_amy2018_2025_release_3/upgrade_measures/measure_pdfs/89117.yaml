  description: |-
    Table bitmap, transcribed. Title: "Table 1. On-Site Fossil Fuel Emissions Factors". Columns: Fossil Fuel Type; Emissions Factor. Rows: Natural gas, 147.3 lb/MMBtu (228.0 kg/MWh); Propane, 177.8 lb/MMBtu (182.3 kg/MWh); Fuel oil, 195.9 lb/MMBtu (303.2 kg/MWh). Footnote: "lb = pound; MMBtu = million British thermal units; kg = kilogram; MWh = megawatt-hour". Only the three data rows survived the automated table extraction in this document; the title and the footnote exist solely inside this bitmap. Note that the propane pairing printed here is wrong: 177.8 lb/MMBtu converts to 275.2 kg/MWh, and measure PDF 86585's Table 5 prints 275.7 kg/MWh for the same fuel. The 182.3 kg/MWh value shown here is the same error that appears in measure PDFs 89340, 89341, 89481, 89133 and 92618.
- source_image: 89117_images/image_000008_1e6455e396be61ff49ba9a5bf20b0c7576f43ac1e3810ec95f6ca7b978f59e57.png
  source_image_sha256: f6e4ee2e3085d40e6137bdc2bd1ce93cef9eb9a6471d7b4a8d09249983f233f4
