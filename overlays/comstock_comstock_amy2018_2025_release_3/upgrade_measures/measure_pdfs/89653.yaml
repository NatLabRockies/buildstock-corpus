  alt: Flow diagram of the demand flexibility dispatch logic for load shed and load shift
  description: |-
    Flow diagram on the demand flexibility 'Technology Specifications' slide. The measure assumes perfect prediction of the load profile, then creates a daily dispatch schedule for the peak window. Two columns follow: load shed adjusts the thermostat setpoint by 2C in the 4-hour daily peak with 2-hour rebound control afterward; load shift adjusts it by 1C over a 2-hour pre-peak window.
