# Hand-authored figure descriptions for measure_pdfs/89653.pdf
#
# 89653 is the End-Use Savings Shapes: Commercial 2024 Release 1 webinar deck - the third and largest
# slide deck in this sweep after 92766 and 87746. Like those, it has no numbered figure captions, so
# each entry anchors on the slide's own heading text instead of a "Figure N" label. docling extracts
# every picture as a bare ![Image](...) ref, so the charts are invisible to retrieval and unreadable
# without the bitmap. Each entry below rewrites the ref with a hand-written alt and injects a
# description paragraph beneath it.
#
# Scope: figures only. 18 of the 64 extracted images are decorative and deliberately have no entry:
# the NREL logos (000000, 000063), the gas-meter stock photo appearing twice at byte-identical hashes
# (000001, 000003 - the same photo as in 87746), two arrows (000002, 000025), the ComStock logo
# (000004), the five workflow pictograms (000005 building, 000006 atom, 000007 and 000008 plus signs,
# 000009 cloud), an NREL photo collage (000014), and the five data-access tile icons on the
# "Accessing the Data" slide (000054, 000055, 000056, 000057, 000058).
#
# Depth: authored to the section 2.1 budget in overlays/FIGURE_DESCRIPTIONS_ROLLOUT.md - roughly
# 40-70 words per description (chart type, axes and units, series/legend, one headline number, and a
# pointer to where the values live). Printed data labels are not transcribed wholesale.
#
# Chart families repeated across the measures, so the entries are deliberately parallel:
#   * stock site energy by fuel and end use (stacked columns in TBtu, baseline 4338 for this release)
#   * annual GHG emissions (THREE side-by-side panels, one per electricity grid scenario, each
#     stacked by fuel - a different layout from 87746's single grouped-bar chart)
#   * peak-week load profiles (stacked area in MW, Rochester NY at 15-minute steps)
#   * applicability as percent of floor area per measure combination
#   * demand-flexibility load profiles and monthly peak-savings box plots
# This release also adds an energy-bills chart (000019) with no counterpart in the earlier decks.
#
# Authoring notes:
#   * method is vision-description: these interpret a chart rather than copy legible cells. Numbers
#     were read off the bitmaps and should get a human QA pass before this is a release record.
#   * Every entry pins the on-disk PNG sha256; if upstream repoints a bitmap the build drops that
#     injection and warns rather than shipping a stale description.
#   * Temperatures are written plainly (1C, 2C) to keep the sidecar ASCII.
#
# QA notes (vision reads; flag for a human pass):
#   * 000029 is the ONLY site-energy chart in the deck scoped to applicable models rather than the
#     whole stock: its baseline is 2639 TBtu, not the 4338 TBtu used by every other such chart. Do not
#     compare it against the others without noting the scope change.
#   * 000034 and 000035: the VRF original-sizing and 25%-upsizing cases land within 1 TBtu of each
#     other on site energy and on identical rounded emissions totals in all three grid scenarios.
#     Worth confirming the upsizing run is actually distinct rather than a duplicated series.
#   * 000031: all three economizer emissions panels round to a 0% change; only the unrounded totals
#     (402 to 401, 325 to 324, 240 to 239) show the direction.
#   * 000051 spans -10% to 15% while 000053 spans -3% to 3%. The two monthly peak-savings box plots
#     are NOT on a common y-axis, so load shed and load shift cannot be compared by eye.
#   * 000013's top hatched band (827.4 to 854.9) is read from a small label over a hatched fill and is
#     the least confident number in this file.
#   * 000001 and 000003 are byte-identical to each other and to 87746's gas-meter photo.

