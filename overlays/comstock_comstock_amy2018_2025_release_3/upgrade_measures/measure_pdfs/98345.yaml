  description: |-
    Figure 14. Scatter plot of pump electricity savings against natural gas heating energy savings for the applicable buildings that have hydronic heating systems, used to explain why the pump energy distribution in Figure 12 is centered near zero. Natural gas heating savings is on the horizontal axis and pump electricity savings on the vertical, both as percentages, with the plot area's bottom spine at the axis and evenly spaced ticks. The surrounding text identifies two distinct trends within the cloud. Buildings with hydronic heating but no hydronic cooling show a pump energy penalty whose magnitude shrinks as the natural gas heating penalty shrinks, because in those buildings the hydronic heating load is the primary driver of circulation pump energy. Buildings with both hydronic heating and hydronic cooling generally show pump energy savings, because the reduced hydronic cooling load outweighs the increased heating pump operation. The superposition of these two trends is what produces the wide, roughly zero-centered pump distribution in Figure 12.
