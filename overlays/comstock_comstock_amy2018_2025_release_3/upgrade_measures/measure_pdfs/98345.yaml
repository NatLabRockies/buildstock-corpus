  description: |-
    Figure 16. Scatter plot of annual fan energy savings through the SP reset against average annual VAV airflow ratio among applicable buildings. Average airflow ratio is on the horizontal axis and percentage fan energy savings on the vertical. Point density is highest at low airflow ratios, below about 0.4, where the vertical spread of fan energy savings is also widest; savings decline as airflow ratio rises. Section 5.6 reads the cloud as approximating the inverse of the fan power versus airflow curve, and notes that an annual average airflow ratio cannot perfectly predict fan energy savings because the EnergyPlus fan power curve is a cubic polynomial, so averaging over the year loses information. The figure is presented as confirmation that the relatively high fan energy savings observed across the ComStock sample, 65% among applicable buildings, are expected given the large share of the sample operating at low fan airflow ratios, rather than an artifact of the modeling approach.
