  alt: |-
    Box-and-whisker distributions of percentage annual utility bill savings under the Fan SP Reset measure, broken out by fuel type, with per-row model counts.
  description: |-
    Figure 9. Distribution of percentage annual utility bill savings across ComStock models under the Fan SP Reset measure, broken out by fuel type. Each fuel is one horizontal box-and-whisker distribution with its unweighted model count n printed on the row; points beyond the whiskers are outliers falling outside 1.5 times the interquartile range, per the note below the figure. Electricity and the total bill both sit on the savings side of zero, while natural gas and fuel oil sit on the penalty side, matching Section 5.3: bill savings are achieved for the overall bill and the electricity bill, with increases for natural gas and fuel oil. The total-bill distribution closely mirrors the electricity distribution but shifted slightly toward lower savings, which Section 5.3 attributes to electricity making up most of the utility bill in commercial buildings while the fuel penalties trim the net. The electricity bill shown is computed at the mean available rate per building. Section 5.3 adds that about 1.4% of the sample sees a slight bill increase, and that 41% of that small set, 223 buildings, heat with fuel oil.
