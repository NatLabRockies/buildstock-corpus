  alt: |-
    Schematic fan-curve diagram showing how a fixed static pressure setpoint pushes the fan operating point left into the stall region as VAV box dampers close and airflow falls.
  description: |-
    Figure 1. Vendor schematic, credited to Integra Controls in reference 2, illustrating fan behavior under a fixed static pressure setpoint as load declines. Static pressure is on the vertical axis, 0 to 10 inches of water column, and airflow on the horizontal axis, 0 to 8,000 CFM. Three blue fan curves are drawn for constant fan speeds of 1600, 2600 and 3600 RPM. Each curve is shaded red over its left-hand rising-to-peak portion, marking the stall or surge region, and green to the right of the peak, marking stable operation; a magenta dotted line traces the stall boundary through the three peaks. Orange dotted system curves rise from the origin and steepen as duct resistance increases. A horizontal orange line labeled Operating Line sits at about 5.2 inches WC and joins two white circular operating points, one where a system curve meets a fan curve at 5,000 CFM and one at 2,000 CFM, with grey dashed verticals dropping from both to the airflow axis. The 2,000 CFM point falls inside the red stall band, which is the hazard the figure exists to show. A right-hand panel headed DESIGN SPECS lists Max Airflow 5,000 CFM, Min Airflow 2,000 CFM and SP Setpoint 5.2 in. WC.
