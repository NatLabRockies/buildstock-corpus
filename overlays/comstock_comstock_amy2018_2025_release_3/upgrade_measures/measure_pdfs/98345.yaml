    Box-and-whisker distributions of percentage annual utility bill savings under the Fan SP Reset measure, broken out by ASHRAE climate zone, with per-row model counts.
  description: |-
    Figure 10. Distribution of percentage annual utility bill savings across ComStock models under the Fan SP Reset measure, broken out by ASHRAE climate zone. Each zone is one horizontal box-and-whisker distribution with its unweighted model count n printed on the row; outliers beyond 1.5 times the interquartile range are drawn as individual points. The climate-zone rows include 7 and 8 as such, with no separate 7A row. Climate zone 8 carries n = 19, matching the surrounding text's warning about the very small number of buildings in zone 8 with this measure applicable. Per that text, zones 6A, 6B and 7 show lower 25th percentile, median and 75th percentile bill savings than zones such as 2A, 3B and 3C, which tracks the site energy savings distributions in Figure 11 and also reflects the relative magnitudes of electricity and heating fuel rates, since the measure saves electricity and imposes a heating fuel penalty. Note that this figure's footnote is the fuel-type boilerplate, describing n as the count applicable for energy savings for the fuel type category, on a climate-zone figure.
