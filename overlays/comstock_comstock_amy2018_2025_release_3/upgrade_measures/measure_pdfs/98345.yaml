    Scatter plot of average fan airflow ratio against heating degree days base 50 for all applicable buildings, the spread narrowing as heating degree days rise.
  description: |-
    Figure 17. Scatter plot of average fan airflow ratio against annual heating degree days with a base of 50 degrees Fahrenheit, HDD 50, for all applicable buildings. HDD 50 is on the horizontal axis and average airflow ratio on the vertical. The point cloud is widest at low HDD 50 and narrows as HDD 50 increases: Section 5.6 states that among buildings with more than 1,000 HDD 50, a tighter range and a lower maximum fan airflow ratio were observed. The hypothesis offered is that, because commercial buildings are typically cooling dominated, buildings in cooler climates tend to operate closer to their balance point temperature and therefore have less cooling-load-driven airflow. Design fan airflow in ComStock is set from heating and cooling design days, system operating parameters and ventilation requirements, while operating airflow at any moment depends on internal thermal loads, outdoor conditions and ventilation, so the climate relationship is indirect. This figure motivates the mild-climate subset examined in Figure 18.
