# Hand-authored figure descriptions for measure PDF 98345
# "ComStock Measure Documentation: Fan Static Pressure Reset for Multizone
#  Variable Air Volume Systems"
# Amy Allen, National Laboratory of the Rockies, NLR/TP-5500-98345, March 2026
#
# The PDF yields 25 extracted images. Two are decorative and are deliberately
# left with no overlay entry: image_000000 is the cover photo collage and
# image_000001 is the laboratory wordmark. The remaining 23 images are real
# figures and are all described below, in document order:
#   000002 = Figure 1     000010 = Figure 8      000018 = Figure 16
#   000003 = Figure 2     000011 = Figure 9      000019 = Figure 17
#   000004 = Figure 3     000012 = Figure 10     000020 = Figure 18
#   000005 = Figure 4     000013 = Figure 11     000021 = Figure A-1
#   000006 = Figure 5     000014 = Figure 12     000022 = Figure A-2
#   000007 = Figure 6     000015 = Figure 13     000023 = Figure A-3
#   000008 = Figure 7a    000016 = Figure 14     000024 = Figure A-4
#   000009 = Figure 7b    000017 = Figure 15
# Note that in this document the captions sit ABOVE their image refs, except for
# Figure 7, whose caption sits between the 7a and 7b images.
# No table survives only as a bitmap in this document: Tables 1-6 all extracted
# as markdown tables, so every entry here is a vision-description.
#
# QA FLAGS - vision-derived numbers need a human pass before publication.
#
# High confidence (values are printed on the figure itself, or corroborated by
# body text or a table):
#   - Figure 3 (000004): every visible segment label transcribed; the four
#     labeled orange (applicable) segments read 6% + 5% + 4% + 3% = 18%, and
#     pixel widths put the four unlabeled orange slivers at about 1.7 + 1.7 +
#     1.2 + 0.2%, for a total of about 22-23% against Section 3.1's 23% of
#     weighted floor area. The right-hand panel's printed square-foot labels
#     also close: 16,943,563,786 at 26% implies about 65 billion sq ft of stock,
#     23% of which is 15.0 billion, against the stated 14.6 billion.
#   - Figure 4 (000005): the nine bin counts sum to about 35,500 against the
#     35,040 15-minute steps in a year, and bins 1+2 = 26,161 = 74.7% against
#     Section 5.1's "almost 75% of the year" at or below 40% airflow. The bin
#     range 0.333-0.630 also matches Figure 6's marker span of 0.33-0.66.
#   - Figure 7a (000008): every band delta reproduces Table 5. Fans 673.6 ->
#     588.3 = 85.3 against Table 5's 85.4 TBtu; cooling 755.4 -> 736.6 = 18.8
#     exactly; electric heating 244.6 -> 250.0 = -5.4 exactly; gas heating
#     944.4 -> 956.6 = -12.2 exactly, and -12.2/944.4 = -1.29% -> Table 5's
#     -1.3%; totals 4,989 -> 4,896 = 93 against 92.7 TBtu. Back-solving Table 5
#     the other way also lands on the measured bands (85.4/0.127 = 672 vs 673.6;
#     18.8/0.025 = 752 vs 755.4; 5.4/0.022 = 245 vs 244.6), and total heating
#     -17.6 = -12.2 + -5.4 exactly.
#   - Figure 7b (000009): Fans 131.1 -> 45.7 = 85.4 TBtu and 65.1%, against the
#     "65%" in Section 5.2; cooling 189.5 -> 170.7 = 18.8 and 9.9%; electric
#     heating 64.4 -> 69.8 = -5.4 and -8.4%; totals 1,070 -> 977 = 8.7%, against
#     Section 5.2's 8.7% among applicable buildings.
#   - Figure 5 (000006): the two dashed reference lines read 31.0 kW and 9.7 kW,
#     ratio 0.314, consistent with Figure 2's 0.137/0.476 = 0.288 and with the
#     "about 30%" of Section 5.6.
#   - Figures 10, 11, 12 and 13 (000012, 000013, 000014, 000015): row labels and
#     n values read at 7-8x zoom. Figure 10's zone 8 n = 19 matches the prose
#     exactly; Figure 12's Interior Equipment Electricity n = 4 matches the
#     elevator-schedule-bug note exactly; and Figures 11 and 13 both have n
#     values summing to 18,400, a strong mutual cross-check.
#   - Figure 12 (000014): the fans row's median reads 68%, matching the "median
#     fan energy savings value is 68%" in the body text, and its IQR is 65-70%.
#   - Figure 15 (000017): bins sum to about 100% normalised, and the cumulative
#     share reaches about 92% by airflow ratio 0.43 against Section 5.6's "90%
#     ... 0.4 or less".
#   - Appendix defect-class check is CLEAN. Each of Figures A-1 to A-4 was
#     zoomed on its axis labels and each matches its caption (A-1 gas by census
#     division, A-2 gas by building type, A-3 electricity by building type, A-4
#     electricity by census division). No wrong, duplicated or swapped appendix
#     graphic in this document.
#
# Medium confidence (pixel-derived, no printed labels; treat as approximate):
#   - Figure 2 (000003): the nine or ten plotted points per series were measured
#     against gridlines found at 21.5-px spacing, so each value is good to about
#     +/- 0.01 in power fraction.
#   - Figures 7a and 7b (000008, 000009) are DELIBERATELY DESCRIBED QUALITATIVELY.
#     Per project convention for stacked end-use/fuel bar charts, the description
#     gives the bar totals, the direction and rough magnitude of each end use's
#     change, and then points the reader at Table 5 for per-segment numbers,
#     rather than enumerating every colored and hatched band. Several segment
#     labels in these two figures are white text over a hatched fill and are not
#     legible at any zoom, so an enumerated read would in any case have had to
#     fall back on Table 5 for the values that matter most.
#   - The band-by-band measurements behind defect (a) below were still taken, and
#     are recorded there as evidence, but they are not asserted in the figure
#     descriptions. The relevant calibrations were 22.17 TBtu per pixel in Figure
#     7a and 4.82 TBtu per pixel in Figure 7b. In Figure 7b the whole red heating
#     block spans 62 px = about 299 TBtu; less the labeled 64.4 TBtu of electric
#     heating that leaves about 234 TBtu of fossil heating across gas, fuel oil
#     and propane, consistent with the roughly 214 TBtu of gas heating implied by
#     Table 5's -12.2 TBtu at -5.7% of the applicable total
#     but is not precise enough to assert a gas-only number.
#   - Figure 13 (000015): the electricity median measures about 14.7% against
#     Table 5's 14.0%, and the site energy median about 9% against 8.7%. The
#     calibration is only about 1.5 px per percent, so those two reads should not
#     be quoted more precisely than "about".
#   - Figures 8 (000010): the mean-rate panel total was read as about 130 -> 127
#     billion USD. Only the printed 2% labels are firm; the absolute bar heights
#     are approximate and Table 6's 3,015 million USD is the number to cite.
#   - Figures 14, 16, 17 and 18 (000016, 000018, 000019, 000020): unlabeled
#     scatter clouds. These are described qualitatively, in the terms the body
#     text itself uses, with only envelope values (Figure 18's dense mass topping
#     out near 0.45-0.55 with outliers to about 0.74) given as measurements.
#   - Figures A-1 to A-4 (000021-000024): the bars carry no value labels, so
#     every number is pixel-derived, +/- one pixel. The per-division and
#     per-type deltas are at or below the one-pixel threshold in many groups, so
#     they are reported as "equal to or about N taller/shorter" rather than as
#     precise deltas. The column sums (A-1 about 1,422; A-2 about 1,428; A-3
#     about 3,219; A-4 about 3,285 TBtu) are the load-bearing reads and are
#     mutually consistent.
#
# DEFECTS AND INTERNAL INCONSISTENCIES observed while describing these figures:
#   (a) Table ES-2 and Table 5 disagree on the all-buildings natural gas result.
#       Table ES-2 gives -1.0% while Table 5 gives -0.8%, for the identical
#       -12.2 TBtu absolute penalty and the identical -4.5% applicable-buildings
#       figure. Three independent measurements of stock baseline natural gas
#       settle it: about 1,443 TBtu from summing Figure 7a's gas bands, about
#       1,422 from Figure A-1's nine census divisions, and about 1,428 from
#       Figure A-2's fifteen building types. -12.2 on about 1,430 is -0.85%, so
#       TABLE 5's -0.8% IS CORRECT AND TABLE ES-2's -1.0% IS THE ERROR (-1.0%
#       would require a stock gas total near 1,220 TBtu, about 15% below all
#       three measurements). The same method checks out on electricity, where
#       A-3 sums to about 3,219 and A-4 to about 3,285 against the 3,333 implied
#       by Table 5's 100 TBtu at 3.0%.
#   (b) Section 5.2 cites "(Figure 3)" for the stock site energy savings result;
#       Figure 7 is meant. Figure 3 is the applicability chart.
#   (c) Three references to "Section 4.6" (in the Figure 7 discussion, in the
#       past-studies comparison, and in the Figure 12 discussion) should be to
#       Section 5.6. Section 4 has no subsections.
#   (d) Section 5.3's utility bill penalty arithmetic does not close. It says
#       "about 1.4%" of the sample sees a bill increase and that "Forty-one
#       percent of this small set of buildings (223 buildings)" use fuel oil.
#       Reading 223 as 41% of the set puts the set at 544, and 544 as 1.4%
#       implies a sample of about 38,900 - but the applicable-model n values in
#       Figures 11 and 13 sum to 18,400. Reading the parenthetical as the size
#       of the whole set instead gives 223/18,400 = 1.2%, not 1.4%.
#   (e) Figures 10 and 11 (climate-zone figures) both carry the fuel-type
#       boilerplate footnote defining n as "the number of ... models that were
#       applicable for energy savings for the fuel type category".
#   (f) Figure 2's baseline (blue) series is truncated at airflow fraction 0.8
#       while both reset curves extend to 0.9. Separately, Section 5.1's "at an
#       airflow fraction of 40%, the fraction of design power is reduced from
#       about 40% under the baseline curve ... to 12%" is rounded away from what
#       Figure 2 plots (about 0.48 and 0.14), though the ratio of the plotted
#       values, about 0.29, does match the "about 30%" of Section 5.6.
#   (g) Section 3.2's point that the curves coincide at 100% flow is not visible
#       in Figure 2, since no series there reaches airflow fraction 1.0. It is
#       visible in Figure 6, where both curves meet at (1.0, 1.0).
#   (h) The List of Figures table is mangled in the markdown extraction (a
#       docling artifact, not a document defect).
#   (i) Medium confidence: Figure 6's zero-flow intercepts (baseline about 0.19,
#       reset about 0.05) differ from Figure 2's values for what should be the
#       same two curves (0.229 and 0.064).
#   (j) Not a defect, recorded so the difference is not mistaken for one: Figure
#       7b's legend has 20 entries against Figure 7a's 21, because Heat Recovery
#       Electricity does not appear among the applicable-only models.

