    Figure 11. Distribution of percentage annual site energy savings across ComStock models under the Fan SP Reset measure, broken out by ASHRAE climate zone. Each zone is one horizontal box-and-whisker distribution with its model count n printed on the row and outliers beyond 1.5 times the interquartile range shown as points. The n values across the climate-zone rows sum to 18,400, the same total as the fuel-type rows of Figure 13, which is a strong mutual cross-check on both reads. Medians are positive in every zone, with the colder zones showing lower savings than the mild cooling-dominated zones, the pattern the text cites when explaining Figure 10's ordering of utility bill savings. Because the measure trades a fan electricity saving against a heating fuel penalty, zones with long heating seasons retain less of the fan saving in site energy terms. As with Figure 10, the footnote below the figure is the fuel-type boilerplate describing n as the number of models applicable for energy savings for the fuel type category.
