  description: |-
    Figure 15. Distribution of average annual VAV airflow ratio among the buildings to which the Fan SP Reset measure was applicable. Airflow ratio is on the horizontal axis and the vertical axis is a normalized share of the applicable sample; the plotted bins sum to about 100%. The distribution is concentrated at low airflow ratios, and the cumulative share reaches roughly 92% by an airflow ratio of about 0.43, consistent with Section 5.6's statement that the vast majority, 90%, of applicable buildings have an average VAV airflow ratio of 0.4 or less. This is the central mechanism claim of the report: because Figure 6 shows a fan at airflow ratio 0.4 drawing only about 30% of baseline power under the reset curve, and because almost all applicable buildings average at or below that ratio, the aggregate 65% fan energy savings among applicable buildings follows. Section 5.6 also flags that the extent to which these low airflow ratios are representative of real buildings is an area for further investigation.
