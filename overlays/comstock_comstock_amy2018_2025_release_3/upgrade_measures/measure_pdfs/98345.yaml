  description: |-
    Figure 18. Scatter plot of average fan airflow ratio against HDD 50 restricted to applicable buildings in more mild climates, defined as fewer than 2,000 HDD 50 and fewer than 2,000 cooling degree days base 65 degrees Fahrenheit; Section 5.6 describes this subset as about 24% of the applicable sample. HDD 50 is on the horizontal axis and average fan airflow ratio on the vertical. The dense body of points tops out at an airflow ratio of roughly 0.45 to 0.55 above about 1,800 HDD 50, with only a few isolated outliers reaching about 0.74, so the upper envelope of airflow ratio falls as HDD 50 rises within this subset. Section 5.6 reads this as a limited trend of lower and more tightly clustered fan airflow ratios among buildings above about 1,200 HDD 50, possibly reflecting buildings with higher internal load densities operating closer to their balance point temperature and therefore needing less space-conditioning-driven airflow. The trend is described as limited and the figure should not be read as establishing a strong climate dependence.
