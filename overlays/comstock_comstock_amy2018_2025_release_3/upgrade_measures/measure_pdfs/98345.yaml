  alt: |-
    Two-panel horizontal bar chart of measure applicability by HVAC system type, one panel in percent of stock floor area and one in square feet, each bar split by whether the SP reset applies.
  description: |-
    Figure 3. Measure applicability by HVAC system type. Fifteen system-type rows share one axis; two side-by-side panels plot the same data as Percent Stock Floor Area, left, and Stock Floor Area in square feet, right. Each bar is split by the legend SP Reset Applicable, orange True and blue False. Rows top to bottom: PSZ-AC with gas coil 26%, all blue, 16,943,563,786 sq ft; PSZ-AC with electric coil 13%, all blue, 8,379,597,380; PVAV with gas boiler reheat 6% applicable plus 4% not; PVAV with PFP boxes 5% plus 4%; VAV chiller with gas boiler reheat 4% plus 3%; PVAV with gas heat and electric reheat 3% plus about 2%; Residential AC/furnace 4%, blue, 2,316,359,394; PTAC with electric coil 3%, blue, 2,210,471,522; PTHP 3%, blue, 2,113,937,224; VAV air-cooled chiller with hot water reheat, unlabeled, about 1.7% plus 1.4%; PSZ-HP 3%, blue, 1,755,218,322; VAV chiller with PFP boxes about 1.7% plus 0.7%; VAV district CHW with district HHW reheat about 1.2% plus 0.7%; PSZ-AC with gas boiler 2%, blue, 1,067,848,906; Other System Types at 1% or less each 7%, almost all not applicable. The orange segments sum to about 22% to 23%, matching Section 3.1's 23% of weighted floor area, or 14.6 billion square feet.
