  alt: |-
    Three-panel stacked bar chart of annual utility bill impacts for the baseline and Fan SP Reset scenarios under the maximum, mean and minimum available electricity rates.
  description: |-
    Figure 8. Annual utility bill impacts for the ComStock baseline and the Fan SP Reset scenario, shown in three side-by-side panels for the maximum, mean and minimum available rate structures. Each panel holds a pair of stacked bars, baseline and measure, with total annual utility cost on the vertical axis in billions of 2022 USD, disaggregated by fuel. All three panels are annotated with a 2% savings label, matching Section 5.3's statement that the measure produces about 2% utility bill savings across all three rate scenarios. In the mean-rate panel the total falls from about 130 to about 127 billion USD, a reduction near 3 billion, consistent with Table 6's 3,015 million USD total absolute savings and its 2.3% all-buildings figure. Electricity dominates every bar, which is why Table 6's 3,175 million USD of electricity savings drives the total despite natural gas, fuel oil and propane penalties of -137.2, -21.47 and -13.43 million USD. Panel-to-panel differences in bar height reflect the spread of available electricity rates, not any difference in modeled energy use.
