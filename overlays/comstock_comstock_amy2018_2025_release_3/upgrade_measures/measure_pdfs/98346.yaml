  description: |-
    Figure 11. Distributions of percentage annual utility bill savings by climate zone, in the same violin-with-boxplot style as Figure 10. The horizontal axis is Percent Utility Bill Savings by Climate, running from about -100 to 60. Fifteen ASHRAE climate zone rows are plotted with their sample counts: 1A n=782, 2A n=2,092, 2B n=1,373, 3A n=4,398, 3B n=8,501, 3C n=3,404, 4A n=7,061, 4B n=2,094, 4C n=676, 5A n=6,859, 5B n=3,380, 6A n=3,940, 6B n=1,414, 7 n=2,187 and 8 n=189. Every zone's distribution is tightly clustered just above zero with a long negative tail, and no monotonic trend with climate severity is visible, consistent with the body text's finding that bill savings run between 1% and 2% regardless of rate assumption. The zone counts sum to about 48,350, close to but not identical with the 48,360 reported for the Bill Mean row of Figure 10.
