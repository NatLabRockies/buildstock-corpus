  alt: |-
    Violin and box distributions of percent utility bill savings by fuel for unweighted ComStock models, with long negative tails on the fossil fuels.
  description: |-
    Figure 10. Distributions of percentage annual utility bill savings for the ComStock models under the Thermostat Setbacks scenario, drawn as violins with boxplots inside. The title reads Upgrade 25.0: Thermostat_Setbacks (unweighted), and the horizontal axis is Percent Utility Bill Savings by Fuel, running from about -160 to 100. Five rows are plotted, each labeled with its sample count: Propane Bill State Average n=4,700; Fuel Oil Bill State Average n=3,190; Natural Gas Bill State Average n=18,789; Electricity Bill with Mean Rate n=48,306; and Bill Mean n=48,360. The three fossil fuel rows are much the widest, with interquartile ranges running from roughly 3% up into the middle 20s and long negative tails reaching past -100%. The electricity row is very narrow, roughly -1% to 2%, and the aggregate Bill Mean row sits just above zero at roughly 0% to 5%. Section 5.4 notes that about 7.5% of the applicable sample sees a bill penalty and that 73% of that subset is within 2%, driven by electricity demand charges during morning warmup. Note that Section 5.4 describes this figure as showing savings by end use; the axis is by fuel type.
