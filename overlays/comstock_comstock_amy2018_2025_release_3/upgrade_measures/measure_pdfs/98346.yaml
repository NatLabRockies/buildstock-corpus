  alt: |-
    Two stacked bars comparing annual site energy consumption by end use and fuel for applicable models only, baseline versus the Thermostat Setbacks scenario.
  description: |-
    Figure 7(b). The same stacked bar comparison as Figure 7(a), but restricted to the ComStock models to which the Thermostat Setbacks measure applies. The vertical axis is Annual Energy Consumption in TBtu, and the two bars total about 2,079 TBtu for the baseline and about 1,963 for the measure. The absolute reduction is the same roughly 116 TBtu as in panel (a), because only applicable models change, but measured against the smaller applicable base it is about 5.6%, the applicable-only total reported in Table ES-2. The segment structure and legend match panel (a): natural gas heating is still the largest segment, the heating segments shrink most in relative terms, cooling and fan segments shrink slightly, and the non-HVAC segments are unchanged. Table 5's applicable-only column is the source for segment-level percentages, including 19% for gas heating, 18% for electric heating, 4.8% for cooling and 1.8% for fans.
