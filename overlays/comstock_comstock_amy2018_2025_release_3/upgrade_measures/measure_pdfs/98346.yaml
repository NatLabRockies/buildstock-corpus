  alt: |-
    Three stacked bar panels comparing annual utility bills by fuel for the baseline and Thermostat Setbacks scenarios under maximum, mean and minimum electricity rates.
  description: |-
    Figure 9. Annual utility bill impacts, drawn as three side-by-side panels headed With Max Electricity Rate, With Mean Electricity Rate and With Min Electricity Rate. The vertical axis is Annual Utility Bill in billions of 2022 USD, 0 to 160, and each bar is stacked by fuel, with the legend giving Electricity, Natural Gas, Fuel Oil and Propane; electricity dominates and natural gas is second. The maximum-rate panel goes from about 150 to about 148 billion USD, the mean-rate panel from about 130 to about 128, and the minimum-rate panel from about 112 to about 110, and the measure bar in each panel carries a printed savings label of 1% or 2%. Within each panel the electricity block falls by about 1 billion USD and the natural gas block from about 16 to about 15 billion, so the total reduction is about 2 billion USD under all three rate assumptions. That matches Table 6, which reports 2,022 million USD or 1.6% overall, of which 957 million is electricity at 0.9% and 911 million natural gas at 5.6%.
- source_image: 98346_images/image_000012_5975ee2043c5dedd5f0ed038b4e8e0eeb3f298ce69f6947c205d195f6d18f360.png
