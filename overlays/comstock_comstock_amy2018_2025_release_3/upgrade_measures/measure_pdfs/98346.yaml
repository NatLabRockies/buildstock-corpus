  alt: |-
    Two stacked bars comparing annual site energy consumption by end use and fuel for the whole ComStock stock, baseline versus the Thermostat Setbacks scenario.
  description: |-
    Figure 7(a). Stacked bar comparison of annual site energy consumption for the entire building stock modeled in ComStock, with the baseline bar on the left and the Thermostat_Setbacks bar on the right. The vertical axis is Annual Energy Consumption in TBtu, 0 to 5,000, and each bar is divided into about twenty end-use-by-fuel segments identified by a legend of colored and hatched fills. The bar totals read about 4,989 TBtu for the baseline and about 4,873 for the measure, a reduction of about 116 TBtu or 2.3%, which is the whole-stock saving reported in Table ES-2. The largest single segment in both bars is natural gas heating, followed by electric cooling, electric fans and interior equipment electricity. Comparing the two bars, natural gas heating and electric heating shrink markedly, electric cooling and electric fans shrink slightly, and the non-HVAC segments including interior lighting and interior equipment are visually unchanged. Table 5 reports the per-end-use and per-fuel savings numerically and is the source to cite for segment-level values.
