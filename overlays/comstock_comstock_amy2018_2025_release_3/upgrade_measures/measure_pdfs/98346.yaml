  alt: |-
    Two-panel horizontal bar chart of Thermostat Setbacks applicability by building type, in percent of stock floor area and in square feet, each bar split into applicable and not-applicable area.
  description: |-
    Figure 1. Applicability of the Thermostat Setbacks measure by building type. Fifteen building-type rows share one axis; two side-by-side panels plot the same data as % Stock Floor Area, left, and Stock Floor Area in square feet, right. Each bar is split by the legend Setback Applicability, orange True and blue False; applicable means the building currently has constant setpoints. Rows, alphabetical: FullServiceRestaurant, Grocery, Hospital, LargeHotel, LargeOffice, MediumOffice, Outpatient, PrimarySchool, QuickServiceRestaurant, RetailStandalone, RetailStripmall, SecondarySchool, SmallHotel, SmallOffice, Warehouse. Warehouse is much the largest type, about 28% of stock floor area with printed labels of 16% applicable and 12% not. Other printed pairs are LargeOffice 4% and 4%, MediumOffice 3% and 3%, and RetailStandalone 6% and 3%; blue-only labels read 3% for Hospital, 6% for LargeHotel, 7% for PrimarySchool, 5% for RetailStripmall, 8% for SecondarySchool and 4% for SmallOffice, so both school types already have setbacks over most of their area and the two hotel types have essentially none applicable. Right-panel printed values include LargeHotel total 3,629,681,881 sq ft and Warehouse applicable 10,467,682,783. The orange segments sum to about 41% of stock floor area, matching Section 3.1's 41%, or about 26 billion square feet.
- source_image: 98346_images/image_000003_69cc188fd949ca9ce388f016cc615c433750702a399bff75ed84df7a0d67a4bc.png
  source_image_sha256: 1050560048a2b3e62013ca964ade594209d84259828bbf9f071ffcaf0c0396da
