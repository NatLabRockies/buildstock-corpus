# Hand-authored figure descriptions for measure PDF 98346
# "ComStock Measure Documentation: Thermostat Setbacks During Unoccupied
#  Periods"
# Amy Allen, National Laboratory of the Rockies, NLR/TP-5500-98346, March 2026
#
# The PDF yields 25 extracted images. Two are decorative and are deliberately
# left with no overlay entry: image_000000 is the cover photo collage and
# image_000001 is the laboratory wordmark. The remaining 23 images are real
# figures and are all described below, in document order:
#   000002 = Figure 1     000010 = Figure 8      000018 = Figure 16
#   000003 = Figure 2     000011 = Figure 9      000019 = Figure 17
#   000004 = Figure 3     000012 = Figure 10     000020 = Figure 18
#   000005 = Figure 4     000013 = Figure 11     000021 = Figure A-1
#   000006 = Figure 5     000014 = Figure 12     000022 = Figure A-2
#   000007 = Figure 6     000015 = Figure 13     000023 = Figure A-3
#   000008 = Figure 7a    000016 = Figure 14     000024 = Figure A-4
#   000009 = Figure 7b    000017 = Figure 15
# Captions sit ABOVE their image refs in this document, except for Figure 7,
# whose single caption sits between the 7a and 7b images.
# No table survives only as a bitmap here: Tables ES-1 to ES-3 and Tables 1-6
# all extracted as markdown, so every entry below is a vision-description.
#
# QA FLAGS - vision-derived numbers need a human pass before publication.
#
# High confidence (values are printed on the figure itself, or corroborated by
# body text or a table):
#   - Figure 1 (000002): the applicable (orange) segments sum to 39.7% of a
#     measured 97.4% total, i.e. 40.7% of plotted floor area, against Section
#     3.1's 41%. The scale was calibrated on the two printed absolute labels in
#     the right-hand panel (Warehouse applicable 10,467,682,783 sq ft over 73 px
#     and LargeHotel total 3,629,681,881 over 25 px, giving 143.85 million sq ft
#     per pixel, or 4.536 px per percent), after which every printed percent
#     label reproduced within rounding. That scale implies about 65.3 billion
#     sq ft of total stock, 41% of which is 26.8 billion, against the "about 26
#     billion square feet" in Section 3.1.
#   - Figure 7a (000008): bar totals 4,989 -> 4,873 TBtu, a delta of 116 and
#     2.32%, against Table ES-2's 116 TBtu and 2.3%. Every legible segment
#     label also reproduces Table 5: fans 673.6 -> 667.9 = 5.7 against 5.8;
#     cooling 755.4 -> 740.6 = 14.8 exactly; electric heating 244.6 -> 226.7 =
#     17.9 exactly; gas heating 944.4 -> 875.9 = 68.5 against 68.6.
#   - Figure 7b (000009): bar totals 2,079 -> 1,963 TBtu, the same 116 TBtu
#     absolute delta but 5.58% of the applicable base, against Table ES-2's
#     5.6%. Segment checks: fans 314.0 -> 308.2 = 1.85% against 1.8%; cooling
#     305.1 -> 290.4 = 4.85% against 4.8%; electric heating 99.4 -> 81.5 =
#     18.0% against 18%. Independently, back-solving Table ES-2's applicable
#     column gives an applicable baseline of 1,459 + 572 + 18.5 + 25.5 = 2,075
#     TBtu against the 2,079 measured off the bar.
#   - Figure 9 (000011): all nine panel readings reproduce Table 6. Totals
#     150 -> 148, 130 -> 128 and 112 -> 110 billion USD give a 2 billion USD
#     reduction against Table 6's 2,022 million USD and 1.56% against 1.6%;
#     the electricity block falls 111 -> 110 in the mean-rate panel, 0.86%
#     against 0.9%, and natural gas 16 -> 15, 5.7% against 5.6%.
#   - Figures 10, 11, 12, 16 and 17 (000012, 000013, 000014, 000018, 000019):
#     all row labels and n values read at 9x zoom. Figure 12's Electricity
#     Interior Equipment row reads n=33, matching the "(33)" in the Section 5.5
#     elevator-schedule bug note exactly. Figure 16's fuel-level counts are
#     consistent with Figure 12's end-use counts allowing for buildings that
#     use one fuel for both heating and water heating (gas 19,427 + 2,661 vs a
#     fuel-level 20,223; propane 4,820 + 380 vs 4,867; fuel oil 3,305 + 108 vs
#     3,308). Figure 17's fourteen building-type counts sum to 48,400 against
#     Figure 16's Site count of 48,404, a strong mutual cross-check.
#   - Figure 17 (000019) has no LargeHotel row, which is consistent rather than
#     a defect: Figure 1 shows LargeHotel with zero applicable floor area.
#   - Figure 18 (000020): the four bars read about 63%, 21%, 9% and 8% and sum
#     to about 100%, and the 63% night_fanon_vent share corroborates Section
#     5.6's "over 60% of that subset has fans operating continuously at night."
#   - Figures A-1 to A-4 (000021-000024): the column sums are the load-bearing
#     reads and they close against Table ES-2 and against each other. Natural
#     gas totals about 1,421 (A-1, by division) and about 1,440 (A-2, by type)
#     baseline, with measure-case reductions of about 62 and about 68 TBtu
#     against the stated 68.6. Electricity totals about 3,322 (A-4) and about
#     3,315 (A-3) baseline, with reductions of about 44 and about 37 TBtu
#     against the stated 39.4.
#   - Appendix defect-class check is CLEAN. Each of Figures A-1 to A-4 was
#     zoomed on its axis labels and each matches its caption (A-1 gas by census
#     division, A-2 gas by building type, A-3 electricity by building type, A-4
#     electricity by census division). No wrong, duplicated or swapped
#     appendix graphic in this document.
#
# Medium confidence (pixel-derived, no printed labels; treat as approximate):
#   - Figures 7a and 7b (000008, 000009) are DELIBERATELY DESCRIBED
#     QUALITATIVELY. Per project convention for stacked end-use/fuel bar
#     charts, the description gives the bar totals, the direction and rough
#     magnitude of each end use's change, and then points the reader at Table 5
#     for per-segment numbers, rather than enumerating every colored and
#     hatched band. In Figure 7b the gas-heating label is white text on a
#     hatched fill and is not legible at any zoom; the segment checks recorded
#     above were taken as evidence but are not asserted in the descriptions.
#   - Figures 2, 3, 4, 5 and 6 (000003-000007) are schedule plots with no
#     printed data labels. The setpoint values (65/70°F, 60/70°F, 76/81°F) and
#     the optimum start tread heights are firm because they are integers or
#     even fractions on a 5- to 10-degree axis and are pinned by Sections 3.2
#     and 5.1; the clock times of the ramps are read off the axis and are good
#     to about half an hour.
#   - Figure 8 (000010): the log axis is calibrated at 38.6 px per decade with
#     x=1 at pixel 95, so the quartile reads (baseline Q3 about 35 h, whisker
#     about 85 h; measure Q3 about 110 h, whisker about 280 h) carry roughly
#     10% uncertainty. The medians are quoted from Section 5.3 rather than
#     measured, because the baseline median coincides with Q1 near zero.
#   - Figure 13 (000015): calibrated on grey gridlines detected at y = 3.5,
#     26, 91, 135 and 179 px for 16,000 / 14,000 / 8,000 / 4,000 / 0, i.e.
#     91.17 buildings per pixel. The ten bin counts read about 15,225, 6,291,
#     5,288, 3,829, 2,826, 2,462, 1,915, 1,094, 638 and 2,462, summing to about
#     42,030. That sum is not independently stated anywhere in the document;
#     it is consistent with 48,404 applicable models less the roughly 2.2% with
#     negative heating savings and the models with no heating savings at all.
#   - Figures 14 and 15 (000016, 000017): unlabeled boxplots. Figure 14 is
#     calibrated on gridlines at y = 1, 47, 87, 127 and 166 px for 350 down to
#     -50 MBtu, giving 2.5 MBtu per pixel with zero at y=147; Figure 15 is read
#     off its 1,000 kWh gridlines. Quartiles are quoted to two significant
#     figures at most.
#   - Figures A-1 to A-4 (000021-000024): the bars carry no value labels, so
#     every per-division and per-type number is pixel-derived at roughly 2.9
#     TBtu per pixel (gas) and 5.5 TBtu per pixel (electricity), i.e. +/- one
#     pixel. In most groups the baseline-to-measure delta is at or near the
#     one-pixel threshold, so the pairs are reported as approximate.
#
# DEFECTS AND INTERNAL INCONSISTENCIES observed while describing these figures:
#   (a) Figure 5 (000006) caption vs axis. The caption reads "for one week in
#       June" and Sections 3.3 and 5.1 also describe a week, but the plotted
#       horizontal axis spans only 06-Jun 01:00 to about 07-Jun 03:00 - one
#       day and one setback cycle. Figure 4, the heating counterpart, does show
#       a full week, so this looks like the wrong crop rather than a wrong
#       caption.
#   (b) Figure 8 (000010) is missing its cooling panel. The caption promises
#       "heating or cooling setpoints unmet" and Section 5.3 closes with "The
#       results in cooling are similar," but the extracted image contains only
#       a panel titled Heating Unmet Hours. The extracted image indices are
#       contiguous, so it cannot be determined from the corpus alone whether
#       the cooling panel is absent from the source PDF or was lost in
#       extraction.
#   (c) Section 5.4 says "Figure 10 shows distributions of utility bill savings
#       by end use." Figure 10's axis is Percent Utility Bill Savings by Fuel
#       and its five rows are fuels, not end uses.
#   (d) Section 3.2 says a 15°F heating setback "would be capped by the lower
#       limit of 60°F." The lower limit stated in Table ES-1 and in Section 3.2
#       itself is 55°F; 60°F is the setpoint that the selected 10°F setback
#       happens to produce, as Figure 6 confirms.
#   (e) Table 3 lists the same output variable name twice:
#       com_report_has_at_least_one_htg_setback appears as both the heating and
#       the cooling setback flag. The second row should presumably be a clg
#       variant.
#   (f) Fernandez et al.'s site energy savings are given as 7.5% in Section 1
#       and 7.7% in Section 5.2.
#   (g) Figure 14 (000016) caption vs axis: the caption says "the full sample
#       with non-negative savings" where the x-axis tick reads "Positive
#       heating savings."
#   (h) Sample-count drift across figures. The energy-savings figures use
#       48,404 models (Figure 16 Site) and 48,400 (Figure 17, summed), while
#       the bill figures use 48,360 (Figure 10 Bill Mean) and 48,350 (Figure 11
#       climate zones, summed). The energy-versus-bill difference is expected
#       because not every model has rate data, but the 10-model gap between
#       Figures 10 and 11, which are both bill figures, is not explained.
#   (i) Table 1's ASHRAE 90.1 heating cell is truncated to "At least 10°F in",
#       an extraction or authoring truncation.
#   (j) Not a defect but worth a look: in Figure A-1 the Pacific division shows
#       roughly a 20% natural gas reduction (about 179 -> 144 TBtu), which is
#       larger than the 12% applicable-only gas saving in Table ES-2 and far
#       larger than the 1% to 3% shown for every other division; Pacific also
#       leads the electricity reductions in Figure A-4. It accounts for over
#       half of the measured whole-stock gas saving on its own.
