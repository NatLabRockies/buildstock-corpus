# Hand-authored figure descriptions for assets/files/ComStock Measure Doc_PV with Roof Insulation.pdf
#
# NREL ComStock measure documentation for pkg_0012 (Photovoltaics With 40% Rooftop Coverage With
# Roof Insulation), served by the ComStock site without an OSTI number as a pre-publication
# draft (site PRs #205, #206). docling extracts each figure as a bare ![Image](...) ref: the
# caption survives above it, but the chart itself is invisible to retrieval. Each entry is
# image-anchored (figures: schema, overlays/README.md): the ref is rewritten with a hand-written
# alt and a description paragraph is injected below for retrieval.
#
# Scope: 6 figure descriptions, 3 table replacements and 1 text repair. image_000000 is the
# ComStock wordmark and is deliberately not described; like the other site PDFs this one has no
# cover grid, so image_000001 is Figure 1 (a real chart), not decorative.
#
# Tables, checked cell for cell against 1.5x page renders and the PDF text layer on 2026-10-16:
#   * Tables 4, 6, 7, 8 and 9 extracted correctly and are left alone. Table 4's "Title and
#     Azimuth" is as printed (source typo, not corrected). Table 7's merged "40% PV Rooftop
#     Coverage" cell wraps across two extracted rows; left as is.
#   * Table 1 (page break iv/v): three rows emitted with shifted text, two rows lost to loose
#     lines; replaced. The loose lines below it are left in place, and the "## Applicability"
#     heading docling made of one of them is demoted by the text repair.
#   * Table 2: grid emitted under the Table 3 caption; replaced via replaces.under_caption,
#     because its values equal Table 8's and the fingerprint alone matches both.
#   * Table 5: zone 1 / R-21 column dropped; replaced from the text layer.
#
# Authoring notes:
#   * method is vision-description: these interpret a chart rather than copy legible cells.
#     Headline numbers were read off the figures and should get a human QA pass.
#   * Depth follows the 2026-08-21 standard (FIGURE_DESCRIPTIONS_ROLLOUT.md section 2.1).
#   * Every entry pins the on-disk PNG sha256; a repointed bitmap drops the injection.

