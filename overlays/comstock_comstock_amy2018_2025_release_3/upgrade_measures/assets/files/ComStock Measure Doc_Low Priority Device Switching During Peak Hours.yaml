# Hand-authored figure descriptions for assets/files/ComStock Measure Doc_Low Priority Device Switching During Peak Hours.pdf
#
# NREL ComStock measure documentation for dr_0007 (Low Priority Device Switching During Peak Hours), served by the ComStock site without an OSTI number. docling extracts each figure as a bare ![Image](...) ref: the caption
# survives above or below it, but the chart itself is invisible to retrieval. Each entry
# is image-anchored (figures: schema, overlays/README.md): the ref is rewritten with a
# hand-written alt and a description paragraph is injected below for retrieval.
#
# Scope: figures only (9 entries). image_000000 is the ComStock wordmark and is
# deliberately not described. Unlike the OSTI measure reports, these site PDFs carry no
# cover grid, so image_000001 is Figure 1 (a real diagram), not decorative: describing it
# here keeps the ref visible, since build omits only undescribed 00000[01] refs (W6.1).
#
# Authoring notes:
#   * method is vision-description: these interpret a chart rather than copy legible
#     cells. Headline numbers were read off the figures and should get a human QA pass.
#   * Depth follows the 2026-08-21 standard (FIGURE_DESCRIPTIONS_ROLLOUT.md section 2.1).
#   * Every entry pins the on-disk PNG sha256; a repointed bitmap drops the injection.

